<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Worldforge — God Sandbox</title>
<style>
/* =====================================================================
   WORLDFORGE — single-file pixel god simulator
   Sections: CSS · Markup · JS (utils, worldgen, art, render, sim, AI,
   civilisation, environment, powers, audio, UI, save/load, main loop)
   ===================================================================== */
:root{
  --bg:#0b0e14; --panel:rgba(15,19,27,.84); --panel2:rgba(24,29,40,.94);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#e9edf4; --muted:#8e98ab; --dim:#5d6678;
  --accent:#f4c247; --accent2:#ffe39a; --good:#5fd38a; --bad:#ff6767; --blue:#6aaeff; --purple:#b78cff;
  --r:14px; --shadow:0 12px 34px rgba(0,0,0,.5);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated;cursor:crosshair}
#view.pan{cursor:grab} #view.panning{cursor:grabbing}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ico{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Top bar ---------- */
#topbar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:stretch;pointer-events:none;z-index:20}
#topbar>*{pointer-events:auto}
.tb-block{display:flex;align-items:center;gap:10px;padding:6px 12px;height:44px}
#worldBlock{min-width:0}
#worldName{font-weight:700;font-size:14px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;cursor:text}
#worldName:hover{color:var(--accent2)}
#dateLbl{color:var(--muted);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sun{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f4c247 60%,#c47a14);box-shadow:0 0 8px #f4c24788;transition:all .4s}
.sun.moon{background:radial-gradient(circle at 35% 35%,#fff,#c9d6ff 60%,#7b88b8);box-shadow:0 0 8px #9fb4ff66}
#statsBlock{flex:1;justify-content:center;gap:16px;min-width:0;overflow:hidden}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.stat b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:650}
.stat .ico{width:15px;height:15px;opacity:.8}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{height:30px;min-width:34px;padding:0 8px;border-radius:7px;color:var(--muted);font-weight:650;font-size:12px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.seg button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.seg button.on{background:linear-gradient(180deg,#f7d16b,#e6a92c);color:#2a1d00;box-shadow:0 2px 8px rgba(244,194,71,.35)}
.ib{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s;position:relative}
.ib:hover{background:rgba(255,255,255,.07);color:var(--text)}
.ib.on{color:var(--accent);background:rgba(244,194,71,.12)}
.ib .badge{position:absolute;top:3px;right:3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--bad);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ---------- Toolbar ---------- */
#toolbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(980px,calc(100% - 20px));z-index:20;padding:8px 10px 10px}
#cats{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{padding:6px 12px;border-radius:9px;color:var(--muted);font-weight:650;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
.cat .ico{width:15px;height:15px}
.cat:hover{color:var(--text);background:rgba(255,255,255,.05)}
.cat.on{color:var(--text);background:rgba(255,255,255,.09);box-shadow:inset 0 -2px 0 var(--accent)}
.tb-row{display:flex;gap:10px;align-items:center}
#powers{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:thin;scrollbar-color:#3a4252 transparent}
.pw{flex:0 0 auto;width:48px;height:48px;border-radius:11px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .12s,border-color .15s,background .15s}
.pw:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(255,255,255,.1)}
.pw.on{border-color:var(--accent);background:radial-gradient(circle at 50% 30%,rgba(244,194,71,.28),rgba(244,194,71,.06));box-shadow:0 0 0 1px var(--accent),0 4px 14px rgba(244,194,71,.25)}
.pw img,.pw canvas{width:32px;height:32px;image-rendering:pixelated}
.pw svg{width:26px;height:26px}
#brushCtl{display:flex;flex-direction:column;gap:6px;min-width:150px;padding-left:10px;border-left:1px solid var(--line)}
#brushCtl .row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}
#brushCtl input[type=range]{flex:1;accent-color:var(--accent)}
#brushSizeLbl{width:22px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.chipsel{display:flex;gap:3px}
.chipsel button{padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);color:var(--muted);font-size:11px;font-weight:600}
.chipsel button.on{background:rgba(244,194,71,.18);color:var(--accent2)}
select.mini{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:11px;flex:1}
select.mini option{background:#1a1f2b}

/* ---------- Feed ---------- */
#feed{position:fixed;left:10px;bottom:130px;width:340px;max-width:calc(100% - 20px);display:flex;flex-direction:column;gap:5px;z-index:15;pointer-events:none}
.fe{pointer-events:auto;display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;background:rgba(12,15,22,.78);border:1px solid var(--line);
  font-size:12px;line-height:1.35;animation:feIn .35s cubic-bezier(.2,.9,.3,1.2);transition:opacity .6s,transform .6s;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fe:hover{border-color:var(--line2)}
.fe.out{opacity:0;transform:translateX(-12px)}
.fe .dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:4px}
.fe .yr{color:var(--dim);font-size:10px;margin-left:auto;padding-left:6px;white-space:nowrap}
@keyframes feIn{from{opacity:0;transform:translateX(-16px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- Inspector ---------- */
#inspector{position:fixed;top:64px;right:10px;width:310px;max-height:calc(100% - 290px);overflow:auto;z-index:18;padding:14px;scrollbar-width:thin;scrollbar-color:#3a4252 transparent;
  animation:panIn .25s cubic-bezier(.2,.9,.3,1)}
@keyframes panIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.ins-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.portrait{width:56px;height:56px;border-radius:12px;background:radial-gradient(circle at 50% 35%,#2b3446,#141923);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:0 0 56px;overflow:hidden}
.portrait canvas{image-rendering:pixelated}
.ins-title{min-width:0;flex:1}
.ins-title h3{margin:0;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.ins-title h3:hover{color:var(--accent2)}
.ins-title .sub{color:var(--muted);font-size:12px;margin-top:2px}
.x{position:absolute;top:10px;right:10px}
.sec{margin-top:12px}
.sec h4{margin:0 0 6px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:750}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:2px 8px;border-radius:20px;font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text)}
.chip.g{border-color:rgba(95,211,138,.35);color:#9ff0bd}.chip.b{border-color:rgba(255,103,103,.35);color:#ffb0b0}.chip.y{border-color:rgba(244,194,71,.4);color:var(--accent2)}
.lnk{color:var(--blue);cursor:pointer}.lnk:hover{text-decoration:underline}
.story{font-size:11.5px;line-height:1.5;color:#c7cedb;max-height:160px;overflow:auto;padding-right:4px}
.story div{padding:2px 0;border-bottom:1px dashed var(--line)}
.story em{color:var(--dim);font-style:normal;font-size:10px;margin-right:6px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line2);font-weight:650;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.pri{background:linear-gradient(180deg,#f7d16b,#e2a326);color:#291c00;border-color:transparent;box-shadow:0 4px 14px rgba(244,194,71,.3)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:#ffb4b4;border-color:rgba(255,103,103,.35)}
.btn.sm{padding:4px 9px;font-size:11px}
.flagc{image-rendering:pixelated;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.rel{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.rel .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Minimap ---------- */
#minimapWrap{position:fixed;right:10px;bottom:130px;z-index:16;padding:6px;border-radius:12px}
#minimap{border-radius:7px;image-rendering:pixelated;cursor:pointer;display:block}

/* ---------- Tooltip / hint / toasts ---------- */
#tooltip{position:fixed;z-index:100;pointer-events:none;max-width:250px;padding:8px 10px;border-radius:9px;background:rgba(10,13,19,.96);border:1px solid var(--line2);
  font-size:12px;line-height:1.4;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;transform:translate(-50%,-100%)}
#tooltip b{display:block;margin-bottom:2px;color:var(--accent2)}
#tooltip.show{opacity:1}
#toolHint{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:19;padding:7px 14px;border-radius:20px;font-size:12px;color:var(--accent2);pointer-events:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#toasts{position:fixed;top:110px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:12px;background:rgba(12,15,22,.92);border:1px solid var(--line2);box-shadow:var(--shadow);
  font-weight:650;font-size:14px;animation:toastIn .5s cubic-bezier(.2,.9,.3,1.3);transition:opacity .8s,transform .8s}
.toast small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:70;background:rgba(4,6,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{width:min(820px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:17px;flex:1}
.modal-tabs{display:flex;gap:4px;padding:10px 18px 0}
.modal-body{padding:16px 18px 18px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:8px}
.slot canvas,.slot img{width:64px;height:64px;border-radius:8px;image-rendering:pixelated;background:#0d1d33;flex:0 0 64px}
.slot .meta{flex:1;min-width:0}
.slot .meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .meta span{color:var(--muted);font-size:11px}
.law{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.law .t{flex:1}.law .t b{display:block;font-size:13px}.law .t span{color:var(--muted);font-size:11px}
.tog{width:40px;height:22px;border-radius:11px;background:#3a4252;position:relative;transition:background .2s;flex:0 0 40px}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tog.on{background:var(--good)}.tog.on::after{transform:translateX(18px)}
table.kt{width:100%;border-collapse:collapse;font-size:12px}
table.kt th{text-align:left;color:var(--dim);font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
table.kt td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.kt tr.k{cursor:pointer}table.kt tr.k:hover td{background:rgba(255,255,255,.04)}
.loglist{font-size:12px;line-height:1.5;max-height:340px;overflow:auto}
.loglist div{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);cursor:pointer}
.loglist div:hover{background:rgba(255,255,255,.03)}
.loglist em{color:var(--dim);font-style:normal;min-width:58px;font-size:11px}
.kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid var(--line2);border-bottom-width:2px;font-family:var(--mono);font-size:11px;text-align:center}
.help td{padding:4px 8px;vertical-align:top}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.4px;display:flex;justify-content:space-between}
.field label span{color:var(--text);font-variant-numeric:tabular-nums}
.inp{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
.inrow{display:flex;gap:6px}
.inrow .ib{flex:0 0 38px;height:38px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
input[type=range]{accent-color:var(--accent);width:100%}
.field label.check{justify-content:flex-start;font-size:12px;color:var(--text);letter-spacing:0;font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer;margin:6px 0}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* ---------- Title screen ---------- */
#title{position:fixed;inset:0;z-index:80;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
#titleBg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
#title::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(5,8,14,.25),rgba(5,8,14,.82) 75%);z-index:-1}
.title-inner{width:min(940px,100%);display:flex;flex-direction:column;align-items:center}
.logo{margin:0;font-size:clamp(40px,8vw,78px);font-weight:900;letter-spacing:clamp(4px,1.2vw,12px);line-height:1;
  background:linear-gradient(180deg,#fff6d2 0%,#f4c247 45%,#b8731a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3b2406) drop-shadow(0 10px 24px rgba(0,0,0,.6));text-align:center}
.tagline{color:#c8d0de;margin:12px 0 22px;letter-spacing:3px;text-transform:uppercase;font-size:12px;text-align:center;text-shadow:0 2px 8px #000}
.setup{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px;width:100%}
.prevWrap{display:flex;flex-direction:column;gap:10px}
#preview{width:300px;height:300px;border-radius:12px;image-rendering:pixelated;background:#10233f;border:1px solid var(--line2);box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.prevInfo{color:var(--muted);font-size:11px;text-align:center}
.cta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.cta .btn{flex:1;justify-content:center;padding:11px 14px;font-size:13px}
.ver{margin-top:14px;color:var(--dim);font-size:11px;text-align:center}
#loading{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,14,.86);font-weight:650;letter-spacing:1px}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  #statsBlock .stat.opt{display:none}
  #worldName{max-width:120px}
}
@media (max-width:700px){
  #topbar{top:6px;left:6px;right:6px;gap:5px;flex-wrap:wrap}
  .tb-block{height:40px;padding:4px 8px;gap:6px}
  #statsBlock{order:3;flex-basis:100%;height:30px;justify-content:space-around}
  #dateLbl .dtxt{display:none}
  .seg button{min-width:28px;padding:0 5px;height:28px}
  .ib{width:30px;height:30px}
  #toolbar{bottom:0;left:0;transform:none;width:100%;border-radius:14px 14px 0 0;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
  .pw{width:44px;height:44px}
  #brushCtl{min-width:110px}
  #feed{bottom:150px;width:calc(100% - 20px)}
  #feed .fe:nth-child(n+4){display:none}
  #inspector{top:auto;bottom:146px;left:6px;right:6px;width:auto;max-height:45%}
  #minimapWrap{display:none}
  #minimapWrap.force{display:block;bottom:150px;right:6px}
  .setup{grid-template-columns:1fr;padding:14px}
  #preview{width:100%;height:auto;aspect-ratio:1}
  .grid2{grid-template-columns:1fr}
  #toolHint{top:96px}
}
</style>

function on(){try{return localStorage.getItem(KEY)==="1";}catch(e){return false;}}
function links(){return document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]');}

 if(d){if(document.title!==FAKE){real=document.title;document.title=FAKE;}

/* Simplex noise 2D (Gustavson), seeded */
function makeNoise(rng) {
  const p = new Uint8Array(256); for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }

  for (let i = 0; i < 512; i++) { perm[i] = p[i & 255]; pm[i] = perm[i] % 12; }

  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;

    const t = (i + j) * G2, x0 = xin - (i - t), y0 = yin - (j - t);

    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;

class Heap {
  constructor(cap) { this.id = new Int32Array(cap); this.pr = new Float32Array(cap); this.n = 0; }

function spawnPower(sp, x, y) {
  const i = y * W + x, A = ANIMALS[sp], Rr = RACES[sp];
  if (A && A.aquatic) { if (!isWater(i) || TT[i] === T_ICE) return deny('Fish need water'); }
  else if (!(A && A.flying)) { if (!TWALK[TT[i]] || TT[i] === T_SHALLOW) return deny('Needs solid ground'); }
  const c = spawnCreature(sp, x + .5 + (rnd() - .5) * .4, y + .5 + (rnd() - .5) * .4, Rr ? { age: Rr.adult + rnd() * 14 } : { age: A.life[0] * .35 });
  if (!c) return; if (UI.vis(c.x, c.y)) emit('magic', c.x, c.y - .5, 8, { spd: 1, life: .8, col: Rr ? [255, 236, 150] : A.kind === 'monster' ? [255, 90, 90] : [190, 255, 170] }); Audio2.pop();
  if (sp === 'dragon') { logEvent(`${c.name} descends upon the world!`, 'monster', c.x, c.y); Audio2.boom(c.x, c.y, .5); }
}
function spawnSettlement(x, y, big) {
  if (!canFoundAt(x, y)) { const t = spiralFind(x, y, 8, i => canFoundAt(i % W, (i / W) | 0)); if (t < 0) return deny('Not enough free, flat land here'); x = t % W; y = (t / W) | 0; }
  const race = UI.race === 'auto' ? bestRaceFor(TT[y * W + x]) : UI.race, R0 = RACES[race];
  const founder = spawnCreature(race, x + .5, y + .5, { sex: 0, age: R0.adult + 10 });
  const kd = createKingdom(race, founder, { era: big ? 1 : 0, tech: big ? ERA_TECH[1] + 5 : 0 });
  const city = foundCity(kd.id, x, y, [founder]);
  if (!city) { killCreature(founder, 'vanished'); G.kingdoms.delete(kd.id); return deny('Not enough room'); }
  const rad = big ? 10 : 6; for (let yy = -rad; yy <= rad; yy++) for (let xx = -rad; xx <= rad; xx++) { if (xx * xx + yy * yy > rad * rad) continue; const tx = city.x + xx, ty = city.y + yy; if (!inB(tx, ty)) continue; const i = ty * W + tx; if (OWN[i] < 0 && TT[i] !== T_DEEP) claimTile(city, i); }
  const n = big ? 28 : 8, people = [founder];
  for (let k = 0; k < n; k++) { const c = spawnCreature(race, city.x + .5 + (rnd() - .5) * 4, city.y + 2.5 + rnd() * 2, { sex: k % 2 === 0 ? 1 : 0, age: R0.adult + rnd() * 20 }); addCitizen(city, c); people.push(c); }
  for (let k = 0; k < (big ? 6 : 2); k++) { const c = spawnCreature(race, city.x + .5 + (rnd() - .5) * 4, city.y + 2.5, { age: rnd() * R0.adult * .8 }); addCitizen(city, c); }
  const m = people.filter(c => c.sex === 0), f = people.filter(c => c.sex === 1); for (let k = 0; k < Math.min(m.length, f.length); k++) if (chance(.75)) { m[k].spouse = f[k].id; f[k].spouse = m[k].id; }
  const pre = big ? { house: 9, farm: 3, market: 1, library: 1, barracks: 1, mine: 1, tower: 2 } : { house: 2, farm: 1 };
  if (big) city.level = 2;
  for (const t in pre) for (let k = 0; k < pre[t]; k++) { const s = findBuildSpot(city, t); if (s >= 0) placeBuilding(t, city, s % W, (s / W) | 0, true); }
  city.res = big ? { food: 90, wood: 90, stone: 70, ore: 10, gold: 25 } : { food: 40, wood: 30, stone: 10, ore: 0, gold: 5 };
  updateCity(city, .01); assignJobs(city, kd); assignHomes(city);
  emit('magic', city.x, city.y, 40, { sx: 8, sy: 6, spd: .5, life: 1.5 }); Audio2.chime();
  logEvent(`The gods raised the ${big ? 'city' : 'village'} of ${city.name} for the ${R0.plural.toLowerCase()} of ${kd.name}.`, 'god', city.x, city.y, kd.color);
}
function inspectAt(wx, wy) {
  const tx = wx | 0, ty = wy | 0; if (!inB(tx, ty)) { selectEntity(null); return; }
  const c = unitAt(wx, wy, 1.3); if (c) { selectEntity({ type: 'unit', id: c.id }); Audio2.tick(); return; }
  const bi = BLD[ty * W + tx]; if (bi >= 0) { selectEntity({ type: 'building', id: bi }); Audio2.tick(); return; }
  const city = cityAt(tx, ty); if (city) { selectEntity({ type: 'city', id: city.id }); Audio2.tick(); return; }
  selectEntity({ type: 'tile', id: ty * W + tx }); Audio2.tick();
}

function tileIcon(t, extra) {
  const c = mkCanvas(16, 16), x = c.getContext('2d'), im = x.createImageData(16, 16);
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) { const tex = tileTex(t, (tx + ty * 2) % 4, 0); for (let py = 0; py < 8; py++) for (let px = 0; px < 8; px++) { const o = ((ty * 8 + py) * 16 + tx * 8 + px) * 4, s = (py * 8 + px) * 3; im.data[o] = tex[s]; im.data[o + 1] = tex[s + 1]; im.data[o + 2] = tex[s + 2]; im.data[o + 3] = 255; } }
  x.putImageData(im, 0, 0);
  if (extra === 'tree') { x.drawImage(treeSprite(TR_OAK, 2, 0, false, 0, 0), 2, 1); }
  if (extra === 'up' || extra === 'down') { x.fillStyle = '#10141c'; x.fillStyle = '#fff'; const up = extra === 'up'; x.beginPath(); if (up) { x.moveTo(8, 2); x.lineTo(13, 8); x.lineTo(10, 8); x.lineTo(10, 14); x.lineTo(6, 14); x.lineTo(6, 8); x.lineTo(3, 8); } else { x.moveTo(8, 14); x.lineTo(13, 8); x.lineTo(10, 8); x.lineTo(10, 2); x.lineTo(6, 2); x.lineTo(6, 8); x.lineTo(3, 8); } x.closePath(); x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 2; x.stroke(); x.fill(); }
  const o = mkCanvas(32, 32), ox = o.getContext('2d'); ox.imageSmoothingEnabled = false; ox.beginPath(); ox.roundRect ? ox.roundRect(0, 0, 32, 32, 7) : ox.rect(0, 0, 32, 32); ox.clip(); ox.drawImage(c, 0, 0, 32, 32); return o.toDataURL();
}
function spriteIcon(sp) {
  const fake = { sp, sex: 0, age: RACES[sp] ? RACES[sp].adult + 5 : 3, skin: 0, hair: sp === 'elf' ? 0 : 1, kid: 0, job: null, king: false, army: 0, traits: [] };
  const s = creatureSprite(fake, 0)[0]; const o = mkCanvas(32, 32), x = o.getContext('2d'); x.imageSmoothingEnabled = false; const sc = Math.floor(Math.min(30 / s.width, 30 / s.height)); x.drawImage(s, (32 - s.width * sc) / 2, (32 - s.height * sc) / 2 + (RACES[sp] ? 2 : 0), s.width * sc, s.height * sc); return o.toDataURL();
}

const CATS = [{ id: 'terrain', name: 'Terrain', icon: 'terrain' }, { id: 'life', name: 'Civilisations', icon: 'life' }, { id: 'nature', name: 'Creatures', icon: 'paw' }, { id: 'disaster', name: 'Disasters', icon: 'flame' }, { id: 'divine', name: 'Divine', icon: 'sparkle' }, { id: 'tools', name: 'Tools', icon: 'tools' }];
function buildToolbar() {
  const cats = $('#cats'); cats.innerHTML = CATS.map((c, i) => `<button class="cat" data-cat="${c.id}" data-tip="${c.name}|Hotkey ${i + 1}">${svg(c.icon)}${c.name}</button>`).join('');
  cats.onclick = e => { const b = e.target.closest('.cat'); if (!b) return; Audio2.click(); showCat(b.dataset.cat); };
  for (const p of POWERS) { if (p.sprite) p._img = spriteIcon(p.sprite); else if (p.icon) p._img = p.icon(); }
  $('#powers').onclick = e => { const b = e.target.closest('.pw'); if (!b) return; Audio2.click(); selectPower(POWERS.find(p => p.id === b.dataset.id)); };
  $('#brushSize').oninput = e => { UI.brush = +e.target.value; $('#brushSizeLbl').textContent = UI.brush; };
  $('#shapeSel').onclick = e => { const b = e.target.closest('button'); if (!b) return; UI.shape = b.dataset.s; for (const x of $('#shapeSel').children) x.classList.toggle('on', x === b); Audio2.tick(); };
  $('#raceSel').innerHTML = '<option value="auto">Best for biome</option>' + RACE_KEYS.map(r => `<option value="${r}">${RACES[r].plural}</option>`).join('');
  $('#raceSel').onchange = e => { UI.race = e.target.value; };
  showCat('terrain');
}
function showCat(id) {
  UI.cat = id; for (const b of $('#cats').children) b.classList.toggle('on', b.dataset.cat === id);
  $('#powers').innerHTML = POWERS.filter(p => p.cat === id).map(p => `<button class="pw${UI.power === p ? ' on' : ''}" data-id="${p.id}" data-tip="${esc(p.name)}|${esc(p.desc)}">${p._img ? `<img src="${p._img}" alt="">` : svg(p.svg)}</button>`).join('');
}
function selectPower(p) {

  UI.sel = sel; if (sel && sel.type === 'unit') { const c = G.cmap.get(sel.id); if (c) c.sel = true; }

const bar = (lbl, v, max, col) => `<div class="barlbl"><span>${lbl}</span><span>${Math.round(v)} / ${Math.round(max)}</span></div><div class="bar"><i style="width:${clamp(v / max * 100, 0, 100)}%;background:${col}"></i></div>`;
const ulink = id => { const c = G.cmap.get(id); return c ? `<span class="lnk" data-unit="${id}">${esc(c.name)}</span>` : id ? `<span style="color:var(--dim)">${esc(creatureName(id))}</span>` : '—'; };
const clink = id => { const c = G.cities.get(id); return c ? `<span class="lnk" data-city="${id}">${esc(c.name)}</span>` : '—'; };
const klink = id => { const k = G.kingdoms.get(id); return k ? `<span class="lnk" data-kingdom="${id}" style="color:${rgbs(shade(k.color, 1.25))}">${esc(k.name)}</span>` : '—'; };
const JOBN = { wood: 'Woodcutter', miner: 'Miner', farmer: 'Farmer', builder: 'Builder', hunter: 'Hunter & fisher', soldier: 'Warrior' };

  if (c.state === 'flee') return 'Fleeing!'; if (c.state === 'siege') return 'Besieging'; if (c.army) { const a = G.armies.get(c.army); return a ? (a.state === 'gather' ? 'Mustering for war' : a.state === 'march' ? 'Marching to ' + ((G.cities.get(a.target) || {}).name || 'battle') : 'Besieging ' + ((G.cities.get(a.target) || {}).name || '')) : 'In an army'; }
  return { chop: 'Chopping wood', rock: 'Gathering stone', mine: 'Mining', farm: 'Tending fields', build: 'Constructing', deliver: 'Delivering goods', eat: 'Going to eat', eating: 'Eating', forage: 'Foraging', sleep: 'Heading home', fish: 'Fishing', trade: 'Trading', settle: 'Seeking new lands', wander: 'Wandering', patrol: 'Patrolling', visit: 'Following family', graze: 'Grazing' }[c.task] || (c._moving ? 'Walking' : 'Idle');

function renderInspector(force) {
  const el = $('#inspector'); if (!UI.sel || !G) { el.classList.add('hidden'); return; }
  if (!force && el.contains(document.activeElement) && document.activeElement.isContentEditable) return;
  const s = UI.sel; let html = '', portrait = null;
  if (s.type === 'unit') {
    const c = G.cmap.get(s.id); if (!c) { el.classList.add('hidden'); UI.sel = null; return; }
    const Rr = RACES[c.sp], A = ANIMALS[c.sp]; portrait = c;
    const sub = Rr ? `${Rr.name} · ${c.sex ? 'Female' : 'Male'} · ${Math.floor(c.age)} yrs${c.king ? ' · <b style="color:var(--accent)">Ruler</b>' : ''}` : `${A.kind === 'monster' ? 'Monster' : 'Animal'} · ${Math.floor(c.age)} yrs`;
    html += `<div class="ins-head"><div class="portrait" id="insPortrait"></div><div class="ins-title"><h3 data-edit="unit">${esc(c.name)}</h3><div class="sub">${sub}</div></div></div>`;
    html += bar('Health', c.hp, c.mhp, c.hp / c.mhp > .5 ? '#5fd38a' : '#ff6767');
    if (c.kind !== 'monster') html += bar('Hunger', c.hunger, 100, '#f4c247');
    if (Rr) html += bar('Energy', c.rest, 100, '#6aaeff');
    html += `<div class="sec"><div class="kv">`;
    if (Rr) html += `<span>Kingdom</span><span>${klink(c.kid)}</span><span>City</span><span>${clink(c.cid)}</span><span>Job</span><span>${c.king ? 'Ruler' : JOBN[c.job] ? (c.job === 'soldier' && c.archer ? 'Archer' : JOBN[c.job]) : c.age < Rr.adult ? 'Child' : 'Citizen'}</span>`;
    html += `<span>Doing</span><span>${unitStatus(c)}</span><span>Level</span><span>${c.level}${c.xp ? ` <span style="color:var(--dim)">(${c.xp}/${c.level * 20} xp)</span>` : ''}</span><span>Kills</span><span>${c.kills}</span><span>Attack</span><span>${c.atk.toFixed(1)}${c.rng ? ' (ranged)' : ''}</span><span>Defense</span><span>${c.def.toFixed(1)}</span><span>Speed</span><span>${c.spd.toFixed(2)}</span>`;
    if (Rr) html += `<span>Born</span><span>Year ${Math.max(1, c.born)}</span><span>Lifespan</span><span>~${Math.round(c.maxAge)} yrs</span>`;
    if (c.carry) html += `<span>Carrying</span><span>${c.carry.n} ${c.carry.r}</span>`;

  const y = year(); if (y !== G.lastHistYear) { G.lastHistYear = y; sampleHistory(); }
  let dead = 0; for (const c of cl) if (c.dead) { dead++; if (dead > 20) break; } if (dead > 20 || (dead && chance(.05))) compactCreatures();
}
function sampleHistory() {
  let tot = 0, an = 0; for (const c of G.cl) { if (c.dead) continue; if (c.kind === 'civ') tot++; else an++; }
  const k = {}; for (const kd of G.kingdoms.values()) if (kd.alive) k[kd.id] = kd.pop; G.hist.push({ y: year(), tot, an, k });
  if (G.hist.length > 360) G.hist = G.hist.filter((e, i) => i % 2 === 0 || i > G.hist.length - 120);
}
let lastFrame = performance.now(), simAcc = 0, hudT = 0, mmT = 0, insT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(.1, (now - lastFrame) / 1000); lastFrame = now;
  if (!UI.started || !G) { titleRender(rdt); return; }
  if (UI.speed > 0) {
    UI.lastSpeed = UI.speed; simAcc += rdt * UI.speed; let steps = 0; const t0 = performance.now();
    while (simAcc >= SIM_DT && steps < 12) { simStep(SIM_DT); simAcc -= SIM_DT; steps++; if (performance.now() - t0 > 24) break; }
    if (simAcc > SIM_DT * 3) simAcc = SIM_DT * 3;
  }
  if (G.seasonPending && now - (UI.seasonVisT || 0) > 1400) { G.seasonPending = false; UI.seasonVisT = now; seasonChanged(); }
  updateCamera(rdt);
  const vdt = rdt * (UI.speed > 0 ? Math.min(UI.speed, 2.5) : 0); updateParticles(vdt);
  for (let k = FX.length - 1; k >= 0; k--) { FX[k].t += rdt; if (FX[k].t >= FX[k].dur) FX.splice(k, 1); }
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - rdt * 1.6);
  // held powers
  if (PT.mode === 'tool' && UI.power && UI.power.rate && UI.hoverS) { PT.acc += rdt; while (PT.acc >= UI.power.rate) { PT.acc -= UI.power.rate; applyPowerAt(UI.hoverS[0], UI.hoverS[1], false); } }
  render(rdt);
  mmT -= rdt; if (mmT <= 0) { mmT = .2; drawMinimap(); }
  hudT -= rdt; if (hudT <= 0) { hudT = .3; updateHUD(); }
  insT -= rdt; if (insT <= 0 || UI.refreshSel) { insT = .5; UI.refreshSel = false; if (UI.sel) renderInspector(); }
  Audio2.ambient(rdt);
}

/* ---------- Boot ---------- */
function boot() {
  initRenderer(); buildTopBar(); buildToolbar(); initTooltips(); initInput(); initTitle();
  requestAnimationFrame(frame);
}
boot();
</script>
