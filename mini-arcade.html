<style>
:root{ --bg:#07071a; --panel:#10123a; --line:#2b2f7a; --text:#eef1ff; --dim:#8f95d6; --yellow:#ffd23f; --pink:#ff4fa3; --cyan:#35e0ff; --green:#5dff7a; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% -20%,#26206a,transparent 55%),var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#menu{position:absolute;inset:0;overflow:auto;padding:28px 16px 40px;text-align:center;touch-action:pan-y}
#menu h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.12em;color:var(--yellow);text-shadow:0 0 18px rgba(255,210,63,.55),4px 4px 0 var(--pink)}
#menu .sub{color:var(--dim);margin:8px 0 26px;letter-spacing:.14em;font-size:13px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;max-width:980px;margin:0 auto}
.card{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;box-shadow:5px 5px 0 #000;transition:transform .1s,border-color .1s}
.card:hover,.card:focus-visible{transform:translate(-2px,-2px);border-color:var(--yellow);outline:none}
.card .em{font-size:38px;line-height:1}
.card h3{margin:8px 0 2px;font-size:20px;letter-spacing:.06em;color:var(--cyan)}
.card p{margin:0 0 8px;color:var(--dim);font-size:12.5px;line-height:1.45;min-height:36px}
.card .hi{font-size:12px;color:var(--yellow)}
#menu .foot{margin-top:28px;color:var(--dim);font-size:12.5px;line-height:1.7}
#menu a{color:var(--cyan)}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px}
#bar{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;padding:4px 2px 8px}
#bar button{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
#bar button:hover{border-color:var(--yellow)}
#title{flex:1;text-align:center;color:var(--yellow);letter-spacing:.12em;font-weight:700}
#hi{color:var(--dim);font-size:13px;min-width:90px;text-align:right}
#wrap{position:relative;flex:0 1 auto;min-height:0;display:flex;justify-content:center;width:100%}
canvas{background:#000;border:3px solid var(--line);border-radius:10px;box-shadow:0 0 30px rgba(53,224,255,.18);max-width:100%;image-rendering:auto;touch-action:none}
#touch{display:none;width:100%;max-width:520px;margin-top:10px;justify-content:space-between;align-items:center;padding:0 6px}
#touch .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px}
#touch button{background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;font-size:22px}
#touch button:active{background:rgba(255,210,63,.3);border-color:var(--yellow)}
#touch .act{width:92px;height:92px;border-radius:50%;font-size:18px;font-weight:700;background:rgba(255,79,163,.2);border-color:var(--pink)}
@media (pointer:coarse),(max-width:700px){ #touch{display:flex} }
#hint{color:var(--dim);font-size:12px;margin-top:6px;text-align:center;letter-spacing:.06em}
</style>
<script data-zd-discreet>/* Discrete Mode: follows the switch on the game library page (shared browser storage) */

function links(){return document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]');}
function apply(){if(busy)return;busy=true;try{var d=on();
 if(d){if(document.title!==FAKE){real=document.title;document.title=FAKE;}
  var ls=links(),i;if(!saved.length&&ls.length){for(i=0;i<ls.length;i++){if(!ls[i].hasAttribute("data-zd")){saved.push([ls[i],ls[i].getAttribute("href")]);}}}
  for(i=0;i<ls.length;i++){if(ls[i]!==made){ls[i].setAttribute("href",ICON);ls[i].removeAttribute("type");}}
  if(!ls.length&&!made&&document.head){made=document.createElement("link");made.rel="icon";made.setAttribute("data-zd","1");made.href=ICON;document.head.appendChild(made);}
 }else{if(real!==null&&document.title===FAKE){document.title=real;}real=null;
  for(var j=0;j<saved.length;j++){if(saved[j][1]===null)saved[j][0].removeAttribute("href");else saved[j][0].setAttribute("href",saved[j][1]);}saved=[];
  if(made&&made.parentNode){made.parentNode.removeChild(made);}made=null;}
}catch(e){}busy=false;}
apply();
document.addEventListener("DOMContentLoaded",function(){apply();var t=document.querySelector("title");if(t&&window.MutationObserver){new MutationObserver(apply).observe(t,{childList:true,characterData:true,subtree:true});}});
window.addEventListener("storage",function(e){if(e.key===KEY||e.key===null)apply();});

})();</script>

<body>
<div id="menu">
  <h1>MINI ARCADE</h1>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var cv = $('c'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var rint = function(a,b){ return Math.floor(rnd(a,b+1)); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var TAU = Math.PI*2;
var store = {
  get:function(k,d){ try{ var v = localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- tiny synth ---------- */
var muted = store.get('miniArcade.muted', false), actx = null;
function beep(f, d, type, vol){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'square'; o.frequency.value = f; g.gain.value = vol || 0.04;
    o.connect(g); g.connect(actx.destination);
    g.gain.setTargetAtTime(0.0001, t + d*0.5, d*0.25);
    o.start(t); o.stop(t + d);
  }catch(e){}
}

/* ---------- drawing helpers ---------- */
function text(s, x, y, size, color, align, font){
  ctx.font = (font || 'bold') + ' ' + size + 'px "Courier New",ui-monospace,monospace';
  ctx.fillStyle = color || '#fff'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function hud(score, hi, extra){
  text('SCORE ' + score, 12, 20, 18, '#ffd23f');
  text('BEST ' + Math.max(hi, score), W-12, 20, 18, '#8f95d6', 'right');
  if(extra) text(extra, W/2, 20, 16, '#35e0ff', 'center');
}
function sprite(rows, x, y, px, color){
  ctx.fillStyle = color;
  for(var r=0;r<rows.length;r++) for(var c=0;c<rows[r].length;c++) if(rows[r][c]==='#') ctx.fillRect(x + c*px, y + r*px, px, px);
}
function circle(x, y, r, color){ ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r, color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath(); ctx.fill();
}
/* =====================================================  SNAKE  */
function Snake(){
  var N = 20, C = 24, OY = 60;
  var snake, dir, queue, food, t, step, started;
  var g = { score:0, over:false };
  function place(){
    do { food = { x:rint(0,N-1), y:rint(0,N-1) }; } while(snake.some(function(s){ return s.x===food.x && s.y===food.y; }));
  }
  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir = {x:1,y:0}; queue = []; t = 0; step = 0.13; started = false;
    g.score = 0; g.over = false; place();
  }
  function turn(dx, dy){
    var last = queue.length ? queue[queue.length-1] : dir;
    if((last.x===-dx && last.y===-dy) || (last.x===dx && last.y===dy)) return;
    if(queue.length < 2) queue.push({x:dx,y:dy});
    started = true;
  }
  function tick(){
    if(queue.length) dir = queue.shift();
    var h = { x:snake[0].x+dir.x, y:snake[0].y+dir.y };
    var body = snake.slice(0, -1);
    if(h.x<0 || h.y<0 || h.x>=N || h.y>=N || body.some(function(s){ return s.x===h.x && s.y===h.y; })){ g.over = true; beep(110, .4, 'sawtooth'); return; }
    snake.unshift(h);
    if(h.x===food.x && h.y===food.y){ g.score += 10; step = Math.max(0.06, step - 0.004); place(); beep(740, .08); }
    else snake.pop();
  }
  g.restart = reset;
  g.key = function(code, down, rep){
    if(!down) return;
    if(code==='ArrowUp'||code==='KeyW') turn(0,-1);
    else if(code==='ArrowDown'||code==='KeyS') turn(0,1);
    else if(code==='ArrowLeft'||code==='KeyA') turn(-1,0);
    else if(code==='ArrowRight'||code==='KeyD') turn(1,0);
  };
  g.update = function(dt){
    if(g.over || !started) return;
    t += dt; while(t >= step && !g.over){ t -= step; tick(); }
  };
  g.draw = function(hi){
    ctx.fillStyle = '#04120a'; ctx.fillRect(0,0,W,H);
    hud(g.score, hi);
    ctx.fillStyle = '#0a2416'; ctx.fillRect(0, OY, N*C, N*C);
    ctx.fillStyle = '#0f3a22';
    for(var y=0;y<N;y++) for(var x=0;x<N;x++) if((x+y)%2===0) ctx.fillRect(x*C, OY+y*C, C, C);
    circle(food.x*C+C/2, OY+food.y*C+C/2, C*0.36, '#ff4f5e');
    ctx.fillStyle = '#7dff9a'; ctx.fillRect(food.x*C+C/2-1, OY+food.y*C+3, 2, 5);
    for(var i=snake.length-1;i>=0;i--){
      var s = snake[i], k = 1 - i/Math.max(snake.length, 12)*0.45;
      rrect(s.x*C+1, OY+s.y*C+1, C-2, C-2, 6, 'rgb(' + Math.round(60*k) + ',' + Math.round(230*k) + ',' + Math.round(110*k) + ')');
    }
    var h = snake[0];
    circle(h.x*C+C/2 + dir.x*4 - dir.y*5, OY+h.y*C+C/2 + dir.y*4 - dir.x*5, 3, '#04120a');
    circle(h.x*C+C/2 + dir.x*4 + dir.y*5, OY+h.y*C+C/2 + dir.y*4 + dir.x*5, 3, '#04120a');
    if(!started && !g.over) text('PRESS AN ARROW KEY TO START', W/2, OY+N*C/2, 20, '#fff', 'center');
  };
  g.hint = 'Arrows / WASD to steer · eat the apples, avoid the walls and yourself';
  reset();
  return g;
}
/* =====================================================  PONG  */
function Pong(){
  var PW = 10, PH = 84, M = 22, TOP = 40;
  var two = false, p1, p2, ball, s1, s2, serveT, keys = {};
  var g = { score:0, over:false };
  function serve(dir){
    ball = { x:W/2, y:TOP + (H-TOP)/2, vx:0, vy:0, sp:300 };
    serveT = 0.9; ball.dir = dir || (Math.random()<.5 ? 1 : -1);
  }
  function reset(){ p1 = H/2; p2 = H/2; s1 = 0; s2 = 0; g.score = 0; g.over = false; serve(); }
  function launch(){ var a = rnd(-0.5, 0.5); ball.vx = Math.cos(a)*ball.sp*ball.dir; ball.vy = Math.sin(a)*ball.sp; }
  g.restart = reset;
  g.key = function(code, down){
    keys[code] = down;
    if(down && code==='Digit2'){ two = !two; reset(); }
  };
  g.ptr = function(type, x, y){ if(!two && (type==='move' || type==='down')) p1 = clamp(y, TOP+PH/2, H-PH/2); };
  function paddleHit(px, py, sign){
    if(Math.abs(ball.y - py) < PH/2 + 6 && ((sign>0 && ball.vx>0) || (sign<0 && ball.vx<0))){
      var off = clamp((ball.y - py)/(PH/2), -1, 1);
      ball.sp = Math.min(640, ball.sp*1.06);
      var a = off*1.0;
      ball.vx = -sign*Math.cos(a)*ball.sp; ball.vy = Math.sin(a)*ball.sp; beep(sign>0?330:440, .06); return true;
    }
    return false;
  }
  g.update = function(dt){
    if(g.over) return;
    var sp = 360;
    if(keys.KeyW || (!two && keys.ArrowUp)) p1 -= sp*dt;
    if(keys.KeyS || (!two && keys.ArrowDown)) p1 += sp*dt;
    p1 = clamp(p1, TOP+PH/2, H-PH/2);
    if(two){ if(keys.ArrowUp) p2 -= sp*dt; if(keys.ArrowDown) p2 += sp*dt; }
    else { var tgt = ball.vx>0 ? ball.y : (TOP+H)/2; var d = tgt - p2; p2 += clamp(d, -250*dt, 250*dt) * (ball.vx>0 ? 1 : .5); }
    p2 = clamp(p2, TOP+PH/2, H-PH/2);
    if(serveT > 0){ serveT -= dt; if(serveT <= 0) launch(); return; }
    ball.x += ball.vx*dt; ball.y += ball.vy*dt;
    if(ball.y < TOP+6){ ball.y = TOP+6; ball.vy = Math.abs(ball.vy); beep(520,.04); }
    if(ball.y > H-6){ ball.y = H-6; ball.vy = -Math.abs(ball.vy); beep(520,.04); }
    if(ball.x < M+PW+6 && ball.x > M-6) paddleHit(M, p1, -1) && (ball.x = M+PW+7);
    if(ball.x > W-M-PW-6 && ball.x < W-M+6) paddleHit(W-M, p2, 1) && (ball.x = W-M-PW-7);
    if(ball.x < -10){ s2++; beep(160,.3,'sawtooth'); serve(1); }
    else if(ball.x > W+10){ s1++; g.score = s1*10; beep(880,.15); serve(-1); }
    if(s1 >= 7 || s2 >= 7) g.over = true;
  };
  g.draw = function(hi){
    ctx.fillStyle = '#05050f'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#23266a';
    for(var y=TOP; y<H; y+=24) ctx.fillRect(W/2-2, y, 4, 12);
    text(String(s1), W/2-60, 24, 30, '#35e0ff', 'center'); text(String(s2), W/2+60, 24, 30, '#ff4fa3', 'center');
    text(two ? '2 PLAYERS' : 'VS CPU', 10, 14, 12, '#8f95d6'); text('1P/2P: press 2', W-10, 14, 12, '#8f95d6', 'right');
    rrect(M, p1-PH/2, PW, PH, 4, '#35e0ff'); rrect(W-M-PW, p2-PH/2, PW, PH, 4, '#ff4fa3');
    circle(ball.x, ball.y, 7, serveT>0 && Math.floor(serveT*8)%2 ? '#555' : '#fff');
    if(g.over) text(s1 > s2 ? (two ? 'PLAYER 1 WINS' : 'YOU WIN!') : (two ? 'PLAYER 2 WINS' : 'CPU WINS'), W/2, H/2-40, 26, '#ffd23f', 'center');
  };
  g.hint = 'W / S (or drag) to move · arrow keys for player 2 · press 2 for two players · first to 7';
  reset();
  return g;
}
/* =====================================================  PAC-MAN  */
function Pacman(){
  var MAZE = [
    "###################",
    "#........#........#",
    "#o##.###.#.###.##o#",
    "#.................#",
    "#.##.#.#####.#.##.#",
    "#....#...#...#....#",
    "####.### # ###.####",
    "   #.#   G   #.#   ",
    "####.# ##-## #.####",
    "    .  #GGG#  .    ",
    "####.# ##### #.####",
    "   #.#       #.#   ",
    "####.# ##### #.####",
    "#........#........#",
    "#.##.###.#.###.##.#",
    "#o.#.....P.....#.o#",
    "##.#.#.#####.#.#.##",
    "#....#...#...#....#",
    "#.######.#.######.#",
    "#.................#",
    "###################"
  ];
  var R = MAZE.length, CN = MAZE[0].length, T = 23, OX = Math.floor((W - CN*T)/2), OY = 44;
  var DIRS = [{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];
  var COLORS = ['#ff3b3b','#ffb8de','#35e0ff','#ffb347'];
  var grid, pellets, lives, level, pac, ghosts, frightT, readyT, desired, chain, modeT, scatter, deadT;
  var g = { score:0, over:false };

  function load(){
    grid = []; pellets = 0;
    for(var y=0;y<R;y++){ grid.push(MAZE[y].split('')); for(var x=0;x<CN;x++){ var c = grid[y][x]; if(c==='.'||c==='o') pellets++; if(c==='P'||c==='G') grid[y][x] = ' '; } }
  }
  function wrapX(x){ return (x + CN) % CN; }
  function cell(x, y){ if(y<0||y>=R) return '#'; return grid[y][wrapX(x)]; }
  function mk(tx, ty, speed){ return { tx:tx, ty:ty, dx:0, dy:0, p:0, speed:speed }; }
  function placeActors(){
    pac = mk(9, 15, 5); pac.dx = -1; desired = {x:-1,y:0};
    var sp = 4.4 + level*0.15;
    ghosts = [0,1,2,3].map(function(i){
      var gh = mk(i===0 ? 9 : 8 + (i-1), i===0 ? 7 : 9, sp);
      gh.id = i; gh.mode = 'normal'; gh.out = (i===0); gh.release = [0, 2.5, 6, 10][i]; gh.dx = i===0 ? -1 : 0; gh.base = sp;
      return gh;
    });
    frightT = 0; chain = 0; readyT = 1.8; modeT = 0; scatter = true;
  }
  function reset(){ level = 1; lives = 3; g.score = 0; g.over = false; load(); placeActors(); }
  function walkable(e, x, y, ghost){
    var c = cell(x, y);
    if(c === '#') return false;
    if(c === '-') return !!ghost;
    return true;
  }
  function pacChoose(e){
    if(walkable(e, e.tx+desired.x, e.ty+desired.y, false)){ e.dx = desired.x; e.dy = desired.y; }
    else if(!walkable(e, e.tx+e.dx, e.ty+e.dy, false)){ e.dx = 0; e.dy = 0; }
    var c = grid[e.ty][e.tx];
    if(c === '.'){ grid[e.ty][e.tx] = ' '; pellets--; g.score += 10; beep(e.alt ? 300 : 360, .03); e.alt = !e.alt; }
    else if(c === 'o'){ grid[e.ty][e.tx] = ' '; pellets--; g.score += 50; frightT = Math.max(3, 7 - level*0.5); chain = 0; ghosts.forEach(function(gh){ if(gh.mode==='normal' && gh.out) { gh.mode = 'fright'; gh.dx = -gh.dx; gh.dy = -gh.dy; } }); beep(180, .2, 'triangle', .06); }
  }
  function target(gh){
    if(gh.mode === 'eyes') return {x:9, y:9};
    if(!gh.out) return {x:9, y:7};
    if(scatter) return [{x:CN-2,y:0},{x:1,y:0},{x:CN-2,y:R-1},{x:1,y:R-1}][gh.id];
    var px = pac.tx, py = pac.ty;

  { id:'breakout', name:'BREAKOUT',       em:'🧱', desc:'Smash every brick with the bouncing ball.', make:Breakout },
  { id:'invaders', name:'SPACE INVADERS', em:'👾', desc:'Hold the line against the descending aliens.', make:Invaders },
  { id:'tetris',   name:'TETRIS',         em:'🧩', desc:'Stack the falling blocks and clear lines.', make:Tetris },
  { id:'flappy',   name:'FLAPPY',         em:'🐦', desc:'Flap through the pipes. Harder than it looks.', make:Flappy },
  { id:'crossy',   name:'CROSSY ROAD',    em:'\ud83d\udc14', desc:'Hop across roads, rivers and rails. How far can you go?', make:Crossy }
];
var cur = null, curDef = null, paused = false, last = 0, hi = 0, running = false;

function buildMenu(){
  var box = $('cards'); box.innerHTML = '';
  GAMES.forEach(function(d){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'card';
    var best = store.get('miniArcade.hi.' + d.id, 0);
    b.innerHTML = '<div class="em">' + d.em + '</div><h3>' + d.name + '</h3><p>' + d.desc + '</p><div class="hi">' + (best ? 'BEST ' + best : 'NO SCORE YET') + '</div>';
    b.addEventListener('click', function(){ start(d.id); });
    box.appendChild(b);
  });
}
function start(id){
  var d = GAMES.filter(function(x){ return x.id === id; })[0]; if(!d) return;
  curDef = d; cur = d.make(); paused = false; hi = store.get('miniArcade.hi.' + id, 0);
  $('menu').hidden = true; $('stage').hidden = false;
  $('title').textContent = d.em + ' ' + d.name; $('hint').textContent = cur.hint || '';
  if(!running){ running = true; last = performance.now(); requestAnimationFrame(loop); }
  fit();
}
function toMenu(){
  saveHi(); cur = null; curDef = null; $('stage').hidden = true; $('menu').hidden = false; buildMenu();
}
function saveHi(){
  if(cur && curDef && cur.score > hi){ hi = cur.score; store.set('miniArcade.hi.' + curDef.id, hi); }
}
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last)/1000); last = now;
  if(!cur) return;
  if(!paused) cur.update(dt);
  ctx.save(); cur.draw(hi); ctx.restore();
  if(cur.over) saveHi();
  $('hi').textContent = 'BEST ' + Math.max(hi, cur.score);
  if(cur.over){
    ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, H/2-62, W, 124);
    text('GAME OVER', W/2, H/2-26, 34, '#ff4f5e', 'center');
    text('SCORE ' + cur.score + (cur.score >= hi && cur.score > 0 ? '  ★ NEW BEST' : ''), W/2, H/2+10, 18, '#ffd23f', 'center');
    text('Enter / tap to play again · Esc = menu', W/2, H/2+40, 14, '#fff', 'center');
  } else if(paused){
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W/2, H/2-10, 36, '#ffd23f', 'center'); text('P to resume · Esc = menu', W/2, H/2+28, 14, '#fff', 'center');
  }
}
/* ---------- input ---------- */
var PREVENT = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1, Space:1 };
addEventListener('keydown', function(e){
  if(!cur){ return; }
  if(PREVENT[e.code]) e.preventDefault();
  if(e.code === 'Escape'){ toMenu(); return; }
  if(e.code === 'KeyM'){ toggleMute(); return; }
  if(e.code === 'KeyP' && !cur.over){ paused = !paused; return; }
  if(cur.over){ if((e.code==='Enter' || e.code==='Space') && !e.repeat){ cur.restart(); } return; }
  if(paused) return;
  cur.key(e.code, true, e.repeat);
});
addEventListener('keyup', function(e){ if(cur && !cur.over) cur.key(e.code, false, false); });
addEventListener('blur', function(){ if(cur && !cur.over && !paused) paused = true; });
function canvasXY(e){ var r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left)*W/r.width, y:(e.clientY - r.top)*H/r.height }; }
cv.addEventListener('pointerdown', function(e){
  if(!cur) return;
  if(cur.over){ cur.restart(); return; }
  if(paused){ paused = false; return; }
  var p = canvasXY(e); if(cur.ptr) cur.ptr('down', p.x, p.y);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove', function(e){ if(cur && !cur.over && !paused && cur.ptr){ var p = canvasXY(e); cur.ptr('move', p.x, p.y); } });
cv.addEventListener('pointerup', function(e){ if(cur && cur.ptr) { var p = canvasXY(e); cur.ptr('up', p.x, p.y); } });
/* on-screen pad */
var holdTimers = {};
Array.prototype.forEach.call(document.querySelectorAll('#touch button'), function(b){
  var code = b.getAttribute('data-k'), rep = code !== 'Space';
  function down(e){
    e.preventDefault(); if(!cur) return;
    if(cur.over){ cur.restart(); return; }
    if(paused){ paused = false; return; }
    cur.key(code, true, false);
    if(rep){ clearInterval(holdTimers[code]); holdTimers[code] = setInterval(function(){ if(cur && !cur.over && !paused) cur.key(code, true, true); }, 110); }
  }
  function up(e){ e.preventDefault(); clearInterval(holdTimers[code]); if(cur && !cur.over) cur.key(code, false, false); }
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});
$('back').addEventListener('click', toMenu);
function toggleMute(){ muted = !muted; store.set('miniArcade.muted', muted); $('mute').innerHTML = muted ? '&#128263;' : '&#128266;'; }
$('mute').addEventListener('click', toggleMute);
$('mute').innerHTML = muted ? '&#128263;' : '&#128266;';
/* scale the canvas to fit the screen */
function fit(){
  var bar = $('bar').offsetHeight + $('hint').offsetHeight + ($('touch').offsetHeight || 0) + 34;
  var maxH = innerHeight - bar, maxW = Math.min(innerWidth - 16, 520);
  var s = Math.min(maxW/W, maxH/H, 1.3); if(s < 0.3) s = 0.3;
  cv.style.width = Math.floor(W*s) + 'px'; cv.style.height = Math.floor(H*s) + 'px';
}
addEventListener('resize', fit);
buildMenu();
window.__arcade = { start:start, toMenu:toMenu, cur:function(){ return cur; }, GAMES:GAMES };
})();
</script>
</body>
