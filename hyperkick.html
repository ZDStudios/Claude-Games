<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>HYPERKICK Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --blue:#2b8cff; --blue2:#69bcff; --orange:#ff8a1f; --orange2:#ffb66b;
  --glass:rgba(16,18,24,.92); --glass2:rgba(22,24,32,.96); --line:rgba(255,255,255,.12);
  --text:#eef3ff; --dim:#97a3c6; --accent:#7cf6ff; --gold:#ffd447; --red:#ff4a6a;
  --fd:'Russo One','Arial Black','Segoe UI',system-ui,sans-serif; --fb:'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04050c;color:var(--text);font-family:var(--fb);font-size:16px;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#fx2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hidden{display:none !important}
button{font-family:var(--fd);cursor:pointer;border:none;color:var(--text);background:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--accent));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:none}
input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:30px;border:2px solid var(--line);border-radius:8px;background:none;cursor:pointer;padding:0}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
/* ---------- boot / error ---------- */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#141a3e 0%,#04050c 70%);transition:opacity .7s}
.logo{font-family:var(--fd);font-weight:400;letter-spacing:.04em;color:#fff;font-style:italic;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.logo em{font-style:italic;color:var(--orange)}
#boot .logo{font-size:clamp(34px,7vw,64px)}
#boot .bar{width:260px;height:4px;background:#ffffff1a;border-radius:4px;margin-top:22px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--blue),var(--orange));animation:bootbar 1.1s ease-in-out infinite}
#bootMsg{margin-top:14px;color:var(--dim);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
@keyframes bootbar{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
#err{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#04050cee}
#err .box{max-width:520px;padding:34px;border-radius:18px;background:var(--glass2);border:1px solid var(--line);text-align:center}
#err h2{font-family:var(--fd);margin-bottom:14px;color:var(--orange)}#err p{color:var(--dim);line-height:1.5;margin-bottom:20px}
/* ---------- generic UI ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{background:radial-gradient(ellipse at center,rgba(6,8,20,.35),rgba(4,5,12,.78))}
.box{background:var(--glass);border:1px solid rgba(255,255,255,.08);border-top:3px solid var(--orange);border-radius:6px;padding:28px 32px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.box h2{font-family:var(--fd);font-weight:400;font-style:italic;letter-spacing:.03em;font-size:30px;margin-bottom:18px}
.box h3{font-family:var(--fd);font-size:13px;letter-spacing:.2em;color:var(--dim);margin:18px 0 10px;text-transform:uppercase}
.btn{position:relative;font-family:var(--fb);font-weight:800;letter-spacing:.08em;font-size:16px;padding:11px 24px;border-radius:4px;background:#2a2d38;border:1px solid rgba(255,255,255,.08);transition:transform .12s,background .15s;text-transform:uppercase}
.btn:hover{transform:translateY(-1px);background:#383c4a}
.btn.primary{background:var(--orange);color:#1a1006;border-color:transparent}
.btn.primary:hover{background:#ffa040}
.btn.warn{background:#c2364a;border-color:transparent}
.btn.sm{padding:8px 14px;font-size:11px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font-size:12px;font-weight:700;letter-spacing:.12em;padding:9px 14px;color:var(--dim);transition:.2s}
.seg button.on{background:var(--orange);color:#1a1006}
.seg button:hover:not(.on){background:rgba(255,255,255,.07);color:#fff}
.field{display:grid;grid-template-columns:170px 1fr 54px;gap:14px;align-items:center;margin:9px 0;font-weight:600;font-size:15px}
.field .v{color:var(--accent);font-family:var(--fd);font-size:12px;text-align:right}
.field.wide{grid-template-columns:170px 1fr}
.toggle{width:46px;height:24px;border-radius:14px;background:#ffffff22;position:relative;cursor:pointer;transition:.2s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--blue)}.toggle.on::after{left:25px}
/* ---------- main menu ---------- */
#menu{justify-content:flex-start;align-items:stretch;background:linear-gradient(90deg,rgba(8,9,12,.75) 0%,rgba(8,9,12,.25) 45%,rgba(8,9,12,0) 65%)}
#menu .left{display:flex;flex-direction:column;justify-content:center;padding:0 0 0 7vw;gap:10px;min-width:420px}
#menu .title{margin-bottom:34px}
#menu .title .logo{font-size:clamp(48px,7vw,104px);line-height:.9}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 14px rgba(43,140,255,.45))}50%{filter:drop-shadow(0 0 28px rgba(255,138,31,.55))}}
#menu .sub{font-family:var(--fb);font-weight:700;letter-spacing:.32em;font-size:13px;color:#c9cfdc;margin-top:12px}
.mbtn{font-family:var(--fb);font-weight:800;font-size:22px;letter-spacing:.08em;text-align:left;padding:10px 24px;width:320px;border-left:4px solid transparent;background:rgba(20,22,28,.7);transition:all .15s ease-out;transform:skewX(-8deg);opacity:0;animation:slidein .4s forwards}
.mbtn:hover{padding-left:34px;border-left-color:var(--orange);background:rgba(40,43,54,.9);color:#fff}
.mbtn.big{font-size:30px;padding:14px 24px;background:var(--orange);color:#1a1006}
.mbtn.big:hover{background:#ffa040;color:#1a1006}
@keyframes slidein{from{opacity:0;transform:skewX(-8deg) translateX(-30px)}to{opacity:1;transform:skewX(-8deg)}}
.profileBar{position:fixed;right:28px;top:22px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-family:var(--fd);font-size:13px;z-index:21}
.xpbar{width:120px;height:6px;border-radius:6px;background:#ffffff1c;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}
.coins{color:var(--gold)}
.menuFoot{position:fixed;left:7vw;bottom:22px;color:var(--dim);font-size:13px;letter-spacing:.1em}
/* ---------- play menu ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
.mode{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:.2s;text-align:left}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode.on{border-color:var(--orange);background:rgba(255,138,31,.14)}
.mode b{display:block;font-family:var(--fd);font-size:16px;letter-spacing:.1em;margin-bottom:4px}
.mode span{color:var(--dim);font-size:14px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.theme{height:64px;border-radius:12px;cursor:pointer;border:2px solid transparent;display:flex;align-items:flex-end;padding:6px 9px;font-family:var(--fd);font-size:11px;letter-spacing:.1em;text-shadow:0 1px 4px #000;transition:.2s}
.theme.on{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
/* ---------- settings ---------- */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.14em;padding:9px 16px;border-radius:9px;color:var(--dim);border:1px solid transparent}
.tab.on{color:#fff;border-color:var(--line);background:rgba(255,255,255,.07)}
.bindgrid{display:grid;grid-template-columns:1fr 130px 130px;gap:6px 10px;align-items:center;font-weight:600}
.bindgrid .hd{font-family:var(--fd);font-size:11px;color:var(--dim);letter-spacing:.15em}
.kbtn{font-family:var(--fb);font-weight:700;font-size:14px;padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid var(--line);min-height:30px}
.kbtn.wait{border-color:var(--accent);color:var(--accent);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.4}}
/* ---------- end screen ---------- */
.result{font-family:var(--fd);font-size:46px;font-weight:900;letter-spacing:.14em;text-align:center;margin-bottom:6px}
.finalScore{text-align:center;font-family:var(--fd);font-size:20px;margin-bottom:18px;color:var(--dim)}
table.stats{width:100%;border-collapse:collapse;font-size:15px}
table.stats th{font-family:var(--fd);font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700;padding:8px 6px;text-align:center}
table.stats td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-weight:600}
table.stats td.n{text-align:left;font-weight:700}
table.stats tr.t0 td.n{color:var(--blue2)}table.stats tr.t1 td.n{color:var(--orange2)}
.mvp{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:5px;background:var(--gold);color:#222;font-family:var(--fd);font-size:10px;font-weight:900}
.rewards{display:flex;gap:20px;justify-content:center;margin-top:18px;font-family:var(--fd);font-size:14px}
.rewards div{padding:10px 18px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#scoreboard{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;font-family:var(--fd);filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
#scoreboard .team{display:flex;align-items:center;gap:12px;padding:4px 16px;min-width:120px}
#scoreboard .team.blue{background:linear-gradient(90deg,transparent,rgba(43,140,255,.85));justify-content:flex-end;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%)}
#scoreboard .team.orange{background:linear-gradient(270deg,transparent,rgba(255,138,31,.85));clip-path:polygon(0 0,86% 0,100% 100%,0 100%)}
#scoreboard .score{font-size:34px;font-weight:900;min-width:30px;text-align:center}
#scoreboard .tname{font-size:11px;letter-spacing:.2em;opacity:.85}
#scoreboard .clock{background:rgba(8,10,24,.88);padding:6px 20px;text-align:center;min-width:120px;display:flex;flex-direction:column;justify-content:center}
#timer{font-size:28px;font-weight:800;letter-spacing:.06em}
#otTag{font-size:10px;letter-spacing:.25em;color:var(--gold)}
#timer.low{color:var(--red);animation:blink 1s infinite}
#minimap{position:absolute;left:16px;bottom:16px;width:150px;height:186px;opacity:.92;border-radius:12px;background:rgba(6,8,20,.55);border:1px solid var(--line)}
#feed{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.feedItem{padding:6px 12px;border-radius:8px;background:rgba(8,10,24,.75);border:1px solid var(--line);font-weight:700;font-size:15px;animation:feedin .3s ease;transition:opacity .5s}
.feedItem .b{color:var(--blue2)}.feedItem .o{color:var(--orange2)}
@keyframes feedin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#callout{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:900;font-size:clamp(48px,9vw,120px);letter-spacing:.1em;white-space:nowrap;opacity:0;text-align:center}
#callout.show{animation:callout var(--dur,2s) cubic-bezier(.2,1.5,.35,1) forwards}
#callout small{display:block;font-size:.22em;letter-spacing:.3em;margin-top:6px;opacity:.9}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
#replayTag{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.4em;padding:8px 26px;border-radius:10px;background:rgba(255,40,80,.82);text-align:center;animation:blink 1.6s infinite}
#replayTag span{display:block;font-size:10px;letter-spacing:.2em;font-weight:600;opacity:.85}
#replayTag.hidden{display:none}
.phud{position:absolute;left:0;width:100%;pointer-events:none}
.boostMeter{position:absolute;right:26px;bottom:22px;width:150px;height:150px}
.boostMeter svg{width:100%;height:100%;transform:rotate(135deg)}
.boostMeter circle{fill:none;stroke-width:11;stroke-linecap:round}
.boostMeter .bg{stroke:rgba(255,255,255,.12);stroke-dasharray:273 400}
.boostMeter .fg{stroke:url(#bgrad);stroke-dasharray:0 400;transition:stroke-dasharray .08s}
.boostMeter .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd)}
.boostMeter .bval{font-size:40px;font-weight:900;line-height:1}
.boostMeter .spd{font-size:11px;letter-spacing:.15em;color:var(--dim);margin-top:4px}
.boostMeter.ss .bval{color:var(--accent);text-shadow:0 0 14px var(--accent)}
.ballArrow{position:absolute;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:26px solid #fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.8));opacity:0;transition:opacity .2s}
.pname{position:absolute;left:18px;top:14px;font-family:var(--fd);font-size:12px;letter-spacing:.2em;opacity:.8}
.bcam{position:absolute;right:30px;bottom:180px;font-family:var(--fd);font-size:10px;letter-spacing:.2em;color:var(--dim)}
#fps{position:absolute;left:12px;top:10px;font-family:var(--fd);font-size:11px;color:#9f9;text-shadow:0 0 4px #000}
#fpHelp{position:absolute;left:180px;bottom:18px;font-size:13px;color:var(--dim);line-height:1.5;background:rgba(6,8,20,.55);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
#splitLine{position:absolute;left:0;right:0;top:50%;height:3px;background:linear-gradient(90deg,var(--blue),#fff,var(--orange));opacity:.8}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#tStick{position:absolute;left:40px;bottom:40px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);pointer-events:auto}
#tKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.3)}
.tbtn{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);pointer-events:auto;font-family:var(--fd);font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.1em}
.tbtn.on{background:rgba(124,246,255,.35)}
/* ---------- garage ---------- */
#garage{justify-content:flex-end;align-items:stretch;pointer-events:none}
#garage .gpanel{pointer-events:auto;width:min(470px,46vw);margin:16px;display:flex;flex-direction:column;background:var(--glass);border:1px solid rgba(255,255,255,.08);border-top:3px solid var(--orange);border-radius:6px;overflow:hidden;animation:pop .35s}
.ghead{padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.ghead h2{font-family:var(--fd);letter-spacing:.14em;font-size:22px}
.gtabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.gtab{font-family:var(--fd);font-size:10.5px;font-weight:700;letter-spacing:.12em;padding:8px 10px;border-radius:8px;color:var(--dim)}
.gtab.on{background:var(--orange);color:#1a1006}
.gbody{flex:1;overflow:auto;padding:14px 18px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.item{position:relative;border-radius:12px;padding:10px 8px 9px;border:1px solid var(--line);background:rgba(255,255,255,.035);cursor:pointer;text-align:center;transition:.18s;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item.on{border-color:var(--orange);background:rgba(255,138,31,.16)}
.item .nm{font-weight:700;font-size:14px}
.item .sw{width:34px;height:22px;border-radius:6px}
.item.lock{opacity:.6}
.item .lk{position:absolute;top:5px;right:7px;font-family:var(--fd);font-size:9px;color:var(--gold)}
.statbars{margin-top:14px;display:grid;grid-template-columns:90px 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--dim);font-weight:700}
.statbars i{display:block;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--accent))}
.gfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{font-family:var(--fd);font-size:11px;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.slot.on{background:var(--orange);color:#1a1006;border-color:transparent}
.gleft{position:fixed;left:24px;top:22px;pointer-events:auto}
.gleft .carname{font-family:var(--fd);font-weight:900;font-size:clamp(26px,3.5vw,44px);letter-spacing:.12em}
.gleft .cartype{color:var(--dim);letter-spacing:.25em;font-family:var(--fd);font-size:12px;margin-top:4px}
.gleft .gbtns{display:flex;gap:8px;margin-top:14px}
.buy{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,212,71,.08);display:flex;justify-content:space-between;align-items:center;font-weight:700}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toastItem{padding:10px 20px;border-radius:12px;background:var(--glass2);border:1px solid var(--accent);font-weight:700;font-size:15px;animation:feedin .3s ease;box-shadow:0 0 24px rgba(124,246,255,.25)}
.kbd{display:inline-block;padding:1px 7px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:13px}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px;margin-top:8px}
@media (max-width:820px){#menu .left{padding-left:5vw;min-width:0}.mbtn{width:260px;font-size:16px}.mbtn.big{font-size:22px}.modes{grid-template-columns:repeat(2,1fr)}.themes{grid-template-columns:repeat(3,1fr)}.field{grid-template-columns:120px 1fr 44px}#garage .gpanel{width:96vw;margin:2vw;max-height:56vh;align-self:flex-end}.boostMeter{width:110px;height:110px}.boostMeter .bval{font-size:28px}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl" tabindex="-1"></canvas>
<canvas id="fx2d"></canvas>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs></svg>

<div id="boot"><div class="logo">HYPER<em>KICK</em></div><div class="bar"><i></i></div><div id="bootMsg">Loading engine…</div></div>
<div id="err" class="hidden"><div class="box"><h2>CAN'T START THE GAME</h2><p id="errMsg"></p><button class="btn primary" onclick="location.reload()">Retry</button></div></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="scoreboard">
    <div class="team blue"><div class="tname">BLUE</div><div id="sBlue" class="score">0</div></div>
    <div class="clock"><div id="timer">5:00</div><div id="otTag" class="hidden">OVERTIME</div></div>
    <div class="team orange"><div id="sOrange" class="score">0</div><div class="tname">ORANGE</div></div>
  </div>
  <div id="phuds"></div>

    box.querySelectorAll('.tab').forEach((b) => (b.onclick = () => { AUDIO.click(); this.settingsTab = b.dataset.tab; this.renderSettings(); }));
    box.querySelectorAll('input[type=range]').forEach((el) => (el.oninput = () => { const k = el.dataset.s; S[k] = +el.value; const v = $('v_' + k); if (v) v.textContent = k === 'fov' ? el.value + '°' : k === 'shake' ? el.value + '%' : ['camDist', 'camHeight', 'camStiff', 'deadzone'].includes(k) ? (+el.value).toFixed(2) : el.value; AUDIO.applyVolumes(); SAVE.save(); }));
    box.querySelectorAll('.toggle').forEach((el) => (el.onclick = () => { AUDIO.click(); const k = el.dataset.t; S[k] = !S[k]; SAVE.save(); if (k === 'showFps') $('fps').classList.toggle('hidden', !S.showFps); this.renderSettings(); }));
    box.querySelectorAll('.seg').forEach((sg) => sg.querySelectorAll('button').forEach((b) => (b.onclick = () => { AUDIO.click(); S[sg.dataset.k] = b.dataset.v; SAVE.save(); if (sg.dataset.k === 'quality') applyQuality(S.quality); this.renderSettings(); })));
    box.querySelectorAll('.kbtn').forEach((b) => (b.onclick = () => {
      AUDIO.click(); b.classList.add('wait'); b.textContent = 'Press…';
      Input.capture = (code) => { const arr = SAVE.data.binds[b.dataset.p][b.dataset.a]; if (code === 'Backspace' || code === 'Delete') arr[+b.dataset.i] = ''; else if (code !== 'Escape') arr[+b.dataset.i] = code; SAVE.save(); this.renderSettings(); };
    }));
    if ($('sResetBinds')) $('sResetBinds').onclick = () => { AUDIO.click(); SAVE.data.binds = JSON.parse(JSON.stringify(DEFAULT_BINDS)); SAVE.save(); this.renderSettings(); };
    if ($('sWipe')) $('sWipe').onclick = () => { if (confirm('Reset level, coins, unlocks and career stats?')) { SAVE.data.xp = 0; SAVE.data.coins = 400; SAVE.data.owned = []; for (const k in SAVE.data.career) SAVE.data.career[k] = 0; SAVE.save(); toast('Progress reset'); } };
    $('sBack').onclick = () => { AUDIO.click(); if (this.settingsFrom === 'pause') this.showPause(true); else this.show('menu'); };
  },
  openProfile() {
    const C = SAVE.data.career, li = levelInfo(SAVE.data.xp);
    const owned = Object.entries(CATALOG).reduce((n, [cat, list]) => n + list.filter((i) => isUnlocked(cat, i)).length, 0), total = Object.values(CATALOG).reduce((n, l) => n + l.length, 0);
    $('profileBox').innerHTML = `<h2>PROFILE &amp; HELP</h2>
      <div class="rewards" style="justify-content:flex-start;flex-wrap:wrap;margin:0 0 6px"><div>LEVEL <b>${li.lvl}</b> · ${li.cur}/${li.need} XP</div><div class="coins">◆ ${SAVE.data.coins}</div><div>UNLOCKED ${owned}/${total}</div></div>
      <h3>CAREER</h3><table class="stats"><tr><th>MATCHES</th><th>WINS</th><th>LOSSES</th><th>GOALS</th><th>ASSISTS</th><th>SAVES</th><th>SHOTS</th><th>DEMOS</th><th>MVP</th></tr>
      <tr><td>${C.matches}</td><td>${C.wins}</td><td>${C.losses}</td><td>${C.goals}</td><td>${C.assists}</td><td>${C.saves}</td><td>${C.shots}</td><td>${C.demos}</td><td>${C.mvps}</td></tr></table>
      <h3>KEYBOARD (DEFAULT)</h3><div class="helpgrid">
      <b>W / S</b><span>Throttle / brake & reverse · air pitch</span><b>A / D</b><span>Steer · air yaw</span><b>Space</b><span>Jump · double jump · flip (with a direction)</span>
      <b>Shift / Left mouse</b><span>Boost</span><b>Ctrl or C</b><span>Handbrake / powerslide · in the air: A/D becomes air roll</span><b>Q / E</b><span>Air roll left / right</span>
      <b>F / Right mouse</b><span>Toggle ball cam / car cam</span><b>R · T · B</b><span>Free play: reset · shoot ball at you · toggle unlimited boost</span><b>Esc / P</b><span>Pause</span></div>
      <h3>TIPS</h3><p style="color:var(--dim);line-height:1.5">Drive up the curved walls — gravity follows your wheels. Hit the ball with your nose while flipping for power shots. At supersonic speed (boost trail appears) you can demolish opponents by ramming them. Big orange pads give 100 boost, small pads 12. Matches earn XP and coins; level up to unlock cosmetics, or buy them early in the garage.</p>
      <div class="row end"><button class="btn primary" id="prBack">Back</button></div>`;
    this.show('profileScr'); $('prBack').onclick = () => { AUDIO.click(); this.show('menu'); };
  },
  showEnd(g, win, mvp, reward) {
    const local = g.locals[0], split = g.split && g.cfg.split === 'versus';
    const title = split ? `${TEAM_NAME[win]} WINS` : local && local.team === win ? 'VICTORY' : 'DEFEAT', col = split ? TEAM_HEX[win] : local && local.team === win ? '#7cf6ff' : '#ff4a6a';
    const rows = [...g.cars].sort((a, b) => a.team - b.team || b.stats.score - a.stats.score).map((c) => `<tr class="t${c.team}"><td class="n">${esc(c.name)}${c === mvp ? '<span class="mvp">MVP</span>' : ''}</td><td>${c.stats.score}</td><td>${c.stats.goals}</td><td>${c.stats.assists}</td><td>${c.stats.saves}</td><td>${c.stats.shots}</td><td>${c.stats.demos}</td><td>${Math.round(c.stats.boost)}</td></tr>`).join('');
    $('endBox').innerHTML = `<div class="result" style="color:${col};text-shadow:0 0 30px ${col}">${title}</div><div class="finalScore"><span style="color:var(--blue2)">${g.score[0]}</span> &nbsp;—&nbsp; <span style="color:var(--orange2)">${g.score[1]}</span>${g.overtime ? ' · OT' : ''}</div>
      <table class="stats"><tr><th style="text-align:left">PLAYER</th><th>SCORE</th><th>GOALS</th><th>ASSISTS</th><th>SAVES</th><th>SHOTS</th><th>DEMOS</th><th>BOOST</th></tr>${rows}</table>
      ${reward ? `<div class="rewards"><div>+${reward.xp} XP</div><div class="coins">+◆ ${reward.coins}</div>${reward.levelUp ? `<div style="border-color:var(--gold);color:var(--gold)">LEVEL ${reward.levelUp}!</div>` : ''}</div>${reward.unlocked.length ? `<p style="text-align:center;color:var(--gold);margin-top:10px">Unlocked: ${reward.unlocked.map(esc).join(', ')}</p>` : ''}` : ''}
      <div class="row end"><button class="btn" id="eMenu">Main menu</button><button class="btn primary" id="eAgain">Rematch</button></div>`;
    this.show('endScr');
    $('eMenu').onclick = () => { AUDIO.click(); this.toMenu(); };
    $('eAgain').onclick = () => { AUDIO.click(); this.startGame(g.cfg); };
    if (reward && reward.levelUp) toast('LEVEL UP! You reached level ' + reward.levelUp);
  },
};

/* ==========================================================================
   SPEED LINES — 2D overlay at supersonic speed
   ========================================================================== */
const SpeedLines = {
  cv: $('fx2d'), ctx: null, lines: [], on: false,
  resize() { this.cv.width = innerWidth; this.cv.height = innerHeight; this.ctx = this.cv.getContext('2d'); },
  draw(game, dt) {
    const ctx = this.ctx; if (!ctx) return;
    const views = [];
    if (SAVE.s.speedLines && APP.inGame && !game.paused && game.state !== 'replay') game.locals.forEach((c, i) => { if (c && !c.demolished) { const k = clamp((c.vel.length() - 18) / 5, 0, 1) * (c.boosting ? 1 : 0.6); if (k > 0.02) views.push({ k, i }); } });
    if (!views.length) { if (this.on) { ctx.clearRect(0, 0, this.cv.width, this.cv.height); this.on = false; } return; }
    this.on = true; const W = this.cv.width, H = this.cv.height; ctx.clearRect(0, 0, W, H);
    // persistent streaks that flow outwards and fade in/out smoothly (no per-frame random strobing)
    if (this.lines.length < 40) for (let j = this.lines.length; j < 40; j++) this.lines.push({ a: Math.random() * Math.PI * 2, r: Math.random(), s: 0.6 + Math.random() * 0.8 });
    for (const v of views) {
      const vh = game.split ? H / 2 : H, oy = game.split ? (v.i === 0 ? 0 : H / 2) : 0, cx = W / 2, cy = oy + vh * 0.45, R = Math.max(W, vh) * 0.5;
      ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      for (const l of this.lines) {
        l.r += dt * l.s * 0.9; if (l.r > 1) { l.r = 0; l.a = Math.random() * Math.PI * 2; }
        const r0 = (0.35 + l.r * 0.6) * R, r1 = r0 + (30 + 70 * l.s) * v.k, fade = Math.sin(l.r * Math.PI);
        ctx.strokeStyle = `rgba(255,255,255,${(0.05 + 0.1 * v.k) * fade})`;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(l.a) * r0, cy + Math.sin(l.a) * r0 * 0.7); ctx.lineTo(cx + Math.cos(l.a) * r1, cy + Math.sin(l.a) * r1 * 0.7); ctx.stroke();
      }
    }
  },
};

/* ==========================================================================
   BOOT — renderer, post-processing, quality, resize, visibility, main loop
   ========================================================================== */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: false, powerPreference: 'high-performance', stencil: false });
} catch (e) { window.__HKfail('WebGL could not start on this device (' + (e && e.message ? e.message : e) + '). Make sure hardware acceleration is enabled in your browser settings.'); throw e; }
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth > 1 ? innerWidth : 1280, innerHeight > 1 ? innerHeight : 720);
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); window.__HKfail('The graphics context was lost (GPU reset or driver issue). Reload the page to continue.'); });
const VW = () => (innerWidth > 1 ? innerWidth : 1280), VH = () => (innerHeight > 1 ? innerHeight : 720);
function makeComposer(q) {
  if (APP.composer) APP.composer.dispose && APP.composer.dispose();
  const pr = renderer.getPixelRatio(), w = VW(), h = VH();
  const rt = new THREE.WebGLRenderTarget(w * pr, h * pr, { type: THREE.HalfFloatType, samples: q === 'high' || q === 'ultra' ? 4 : 0 });
  const composer = new EffectComposer(renderer, rt); composer.setPixelRatio(pr); composer.setSize(w, h);
  const rp = new RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());
  const bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.32, 0.35, 1.0); bloom.resolution.set(q === 'medium' ? w / 2 : w, q === 'medium' ? h / 2 : h);
  // Sanitise the HDR buffer before bloom: NaN/Inf pixels (from razor-sharp specular on some GPUs) would otherwise be
  // smeared by the bloom blur into flickering black squares, and single super-bright pixels into flashes.
  const clampPass = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uMax: { value: 6.0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uMax; varying vec2 vUv;
      void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 v = c.rgb;
        bool bad = any(isnan(v)) || any(isinf(v)) || v.r != v.r || v.g != v.g || v.b != v.b;
        v = bad ? vec3(0.0) : clamp(v, 0.0, uMax);
        float l = max(v.r, max(v.g, v.b)); if (l > 3.0) v *= (3.0 + (l - 3.0) / (1.0 + (l - 3.0))) / l;   // soft knee
        gl_FragColor = vec4(v, 1.0); }` });
  composer.addPass(rp); composer.addPass(clampPass); composer.addPass(bloom); composer.addPass(new OutputPass());
  APP.composer = composer; APP.renderPass = rp; APP.bloomPass = bloom;
  if (APP.game) { APP.game.composer = composer; APP.game.renderPass = rp; APP.game.bloomPass = bloom; }
}
function applyQuality(q) {
  const dpr = window.devicePixelRatio || 1;
  const pr = { low: Math.min(dpr, 1) * 0.75, medium: Math.min(dpr, 1), high: Math.min(dpr, 1.5), ultra: Math.min(dpr, 2) }[q] || 1;
  renderer.setPixelRatio(pr); renderer.setSize(VW(), VH());
  APP.bloom = q !== 'low'; makeComposer(q);
  const g = APP.game; if (!g) return;
  const sun = g.stadium.sun; sun.castShadow = q !== 'low'; const ms = { low: 512, medium: 1024, high: 2048, ultra: 4096 }[q];
  if (sun.shadow.mapSize.x !== ms) { sun.shadow.mapSize.set(ms, ms); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  g.fx.setQuality(q); g.stadium.buildCrowd(q); g.stadium.colorCrowd(g.stadium.theme || THEMES.night); g.stadium.crowd.material.uniforms.uLight.value = (g.stadium.theme || THEMES.night).crowdLight;
}
function onResize() {
  if (innerWidth < 2 || innerHeight < 2) return;   // minimised / hidden: keep the last valid size
  renderer.setSize(innerWidth, innerHeight); if (APP.composer) APP.composer.setSize(innerWidth, innerHeight);
  if (APP.bloomPass) { const q = SAVE.s.quality; APP.bloomPass.resolution.set(q === 'medium' ? innerWidth / 2 : innerWidth, q === 'medium' ? innerHeight / 2 : innerHeight); }
  SpeedLines.resize();
}
addEventListener('resize', onResize);

const $boot = $('bootMsg'); if ($boot) $boot.textContent = 'Building arena…';
APP.bloom = SAVE.s.quality !== 'low'; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); makeComposer(SAVE.s.quality);
const game = new Game(renderer, APP.composer, APP.renderPass, APP.bloomPass); APP.game = game;
window.HYPERKICK = { APP, CFG, SAVE, THREE, DIFF, ballStep, makeBallState, sdArena };   // handy for tweaking from the dev console
APP.garage = new Garage(renderer);
applyQuality(SAVE.s.quality);
Input.init(renderer.domElement); UI.init(); SpeedLines.resize();
Input.onKey = (code) => {
  const g = APP.game;
  if (code === 'Escape' || code === 'KeyP') {
    if (APP.garage.active) { APP.garage.close(); return; }
    if (APP.inGame) { g.togglePause(); return; }
    if (g.paused && UI.current === 'pauseScr') { g.togglePause(false); return; }
    if (UI.current === 'settingsScr' && UI.settingsFrom === 'pause') { UI.showPause(true); return; }
    if (['playMenu', 'settingsScr', 'profileScr'].includes(UI.current)) UI.show('menu');
    return;
  }
  if (!APP.inGame || g.paused) return;
  if (g.cfg.mode === 'freeplay') {
    if (code === 'KeyT') g.shootAtPlayer();
    if (code === 'KeyB') { g.unlimitedBoost = !g.unlimitedBoost; SAVE.s.unlimitedBoost = g.unlimitedBoost; SAVE.save(); const u = $('ubState'); if (u) u.textContent = g.unlimitedBoost ? 'ON' : 'OFF'; toast('Unlimited boost ' + (g.unlimitedBoost ? 'ON' : 'OFF')); }
  }
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (APP.inGame && !APP.game.paused) APP.game.togglePause(true); if (AUDIO.ctx) AUDIO.ctx.suspend(); }
  else if (AUDIO.ctx) AUDIO.ctx.resume();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { game.stadium.redrawAds(); });

game.startMatch({ mode: 'attract', attract: true, theme: SAVE.s.theme });
UI.show('menu');
window.__HK.ready = true;
const bootEl = $('boot'); bootEl.style.opacity = '0'; setTimeout(() => bootEl.remove(), 800);

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  Input.poll();
  try {
    if (APP.garage.active) { APP.garage.update(dt); APP.garage.render(renderer); game.hud.update(dt); return; }
    renderer.toneMappingExposure = (game.stadium.theme || THEMES.night).exposure;
    game.frame(dt);
    SpeedLines.draw(game, dt);
  } catch (err) {
    console.error(err);
    if (!loop.errShown) { loop.errShown = true; toast('Something went wrong — see the console. Returning to menu.'); try { UI.toMenu(); } catch (e2) {} }
  }
}
requestAnimationFrame(loop);
</script>
