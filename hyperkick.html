<style>
:root{
  --blue:#2b8cff; --blue2:#69bcff; --orange:#ff8a1f; --orange2:#ffb66b;
  --glass:rgba(10,14,32,.74); --glass2:rgba(18,24,50,.9); --line:rgba(255,255,255,.12);
  --text:#eef3ff; --dim:#97a3c6; --accent:#7cf6ff; --gold:#ffd447; --red:#ff4a6a;
  --fd:'Orbitron','Segoe UI',system-ui,sans-serif; --fb:'Rajdhani','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04050c;color:var(--text);font-family:var(--fb);font-size:16px;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#fx2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hidden{display:none !important}
button{font-family:var(--fd);cursor:pointer;border:none;color:var(--text);background:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--accent));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:none}
input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:30px;border:2px solid var(--line);border-radius:8px;background:none;cursor:pointer;padding:0}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
/* ---------- boot / error ---------- */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#141a3e 0%,#04050c 70%);transition:opacity .7s}
.logo{font-family:var(--fd);font-weight:900;letter-spacing:.12em;background:linear-gradient(90deg,var(--blue2),#fff 50%,var(--orange2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(124,246,255,.35))}
#boot .logo{font-size:clamp(34px,7vw,64px)}
#boot .bar{width:260px;height:4px;background:#ffffff1a;border-radius:4px;margin-top:22px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--blue),var(--orange));animation:bootbar 1.1s ease-in-out infinite}
#bootMsg{margin-top:14px;color:var(--dim);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
@keyframes bootbar{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
#err{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#04050cee}
#err .box{max-width:520px;padding:34px;border-radius:18px;background:var(--glass2);border:1px solid var(--line);text-align:center}
#err h2{font-family:var(--fd);margin-bottom:14px;color:var(--orange)}#err p{color:var(--dim);line-height:1.5;margin-bottom:20px}
/* ---------- generic UI ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{background:radial-gradient(ellipse at center,rgba(6,8,20,.35),rgba(4,5,12,.78))}
.box{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:28px 32px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.box h2{font-family:var(--fd);font-weight:800;letter-spacing:.12em;font-size:26px;margin-bottom:18px}
.box h3{font-family:var(--fd);font-size:13px;letter-spacing:.2em;color:var(--dim);margin:18px 0 10px;text-transform:uppercase}
.btn{position:relative;font-family:var(--fd);font-weight:800;letter-spacing:.14em;font-size:14px;padding:12px 22px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--line);transition:transform .15s,background .2s,box-shadow .2s;text-transform:uppercase}
.btn:hover{transform:translateY(-2px);background:linear-gradient(180deg,rgba(124,246,255,.25),rgba(43,140,255,.15));box-shadow:0 0 24px rgba(124,246,255,.25)}
.btn.primary{background:linear-gradient(90deg,var(--blue),#5f6dff);border-color:transparent;box-shadow:0 6px 24px rgba(43,140,255,.4)}
.btn.primary:hover{box-shadow:0 0 30px rgba(43,140,255,.7)}
.btn.warn{background:linear-gradient(90deg,#ff5a6e,#ff8a1f);border-color:transparent}
.btn.sm{padding:8px 14px;font-size:11px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font-size:12px;font-weight:700;letter-spacing:.12em;padding:9px 14px;color:var(--dim);transition:.2s}
.seg button.on{background:linear-gradient(90deg,var(--blue),#5f6dff);color:#fff}
.seg button:hover:not(.on){background:rgba(255,255,255,.07);color:#fff}
.field{display:grid;grid-template-columns:170px 1fr 54px;gap:14px;align-items:center;margin:9px 0;font-weight:600;font-size:15px}
.field .v{color:var(--accent);font-family:var(--fd);font-size:12px;text-align:right}
.field.wide{grid-template-columns:170px 1fr}
.toggle{width:46px;height:24px;border-radius:14px;background:#ffffff22;position:relative;cursor:pointer;transition:.2s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--blue)}.toggle.on::after{left:25px}
/* ---------- main menu ---------- */
#menu{justify-content:flex-start;align-items:stretch;background:linear-gradient(90deg,rgba(4,5,12,.85) 0%,rgba(4,5,12,.35) 45%,rgba(4,5,12,0) 70%)}
#menu .left{display:flex;flex-direction:column;justify-content:center;padding:0 0 0 7vw;gap:10px;min-width:420px}
#menu .title{margin-bottom:34px}
#menu .title .logo{font-size:clamp(44px,6.4vw,92px);line-height:.95;animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 14px rgba(43,140,255,.45))}50%{filter:drop-shadow(0 0 28px rgba(255,138,31,.55))}}
#menu .sub{font-family:var(--fd);letter-spacing:.5em;font-size:12px;color:var(--dim);margin-top:10px}
.mbtn{font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:.18em;text-align:left;padding:13px 26px;width:330px;border-left:4px solid transparent;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,0));transition:all .22s cubic-bezier(.2,.9,.3,1.2);clip-path:polygon(0 0,100% 0,94% 100%,0 100%);opacity:0;animation:slidein .5s forwards}
.mbtn:hover{padding-left:40px;border-left-color:var(--accent);background:linear-gradient(90deg,rgba(124,246,255,.25),rgba(43,140,255,0));color:#fff}
.mbtn.big{font-size:28px;padding:18px 26px;background:linear-gradient(90deg,rgba(43,140,255,.55),rgba(95,109,255,.1))}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.profileBar{position:fixed;right:28px;top:22px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-family:var(--fd);font-size:13px;z-index:21}
.xpbar{width:120px;height:6px;border-radius:6px;background:#ffffff1c;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}
.coins{color:var(--gold)}
.menuFoot{position:fixed;left:7vw;bottom:22px;color:var(--dim);font-size:13px;letter-spacing:.1em}
/* ---------- play menu ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
.mode{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:.2s;text-align:left}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode.on{border-color:var(--accent);background:linear-gradient(160deg,rgba(43,140,255,.35),rgba(124,246,255,.08));box-shadow:0 0 22px rgba(124,246,255,.2)}
.mode b{display:block;font-family:var(--fd);font-size:16px;letter-spacing:.1em;margin-bottom:4px}
.mode span{color:var(--dim);font-size:14px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.theme{height:64px;border-radius:12px;cursor:pointer;border:2px solid transparent;display:flex;align-items:flex-end;padding:6px 9px;font-family:var(--fd);font-size:11px;letter-spacing:.1em;text-shadow:0 1px 4px #000;transition:.2s}
.theme.on{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
/* ---------- settings ---------- */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.14em;padding:9px 16px;border-radius:9px;color:var(--dim);border:1px solid transparent}
.tab.on{color:#fff;border-color:var(--line);background:rgba(255,255,255,.07)}
.bindgrid{display:grid;grid-template-columns:1fr 130px 130px;gap:6px 10px;align-items:center;font-weight:600}
.bindgrid .hd{font-family:var(--fd);font-size:11px;color:var(--dim);letter-spacing:.15em}
.kbtn{font-family:var(--fb);font-weight:700;font-size:14px;padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid var(--line);min-height:30px}
.kbtn.wait{border-color:var(--accent);color:var(--accent);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.4}}
/* ---------- end screen ---------- */
.result{font-family:var(--fd);font-size:46px;font-weight:900;letter-spacing:.14em;text-align:center;margin-bottom:6px}
.finalScore{text-align:center;font-family:var(--fd);font-size:20px;margin-bottom:18px;color:var(--dim)}
table.stats{width:100%;border-collapse:collapse;font-size:15px}
table.stats th{font-family:var(--fd);font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700;padding:8px 6px;text-align:center}
table.stats td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-weight:600}
table.stats td.n{text-align:left;font-weight:700}
table.stats tr.t0 td.n{color:var(--blue2)}table.stats tr.t1 td.n{color:var(--orange2)}
.mvp{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:5px;background:var(--gold);color:#222;font-family:var(--fd);font-size:10px;font-weight:900}
.rewards{display:flex;gap:20px;justify-content:center;margin-top:18px;font-family:var(--fd);font-size:14px}
.rewards div{padding:10px 18px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#scoreboard{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;font-family:var(--fd);filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
#scoreboard .team{display:flex;align-items:center;gap:12px;padding:4px 16px;min-width:120px}
#scoreboard .team.blue{background:linear-gradient(90deg,transparent,rgba(43,140,255,.85));justify-content:flex-end;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%)}
#scoreboard .team.orange{background:linear-gradient(270deg,transparent,rgba(255,138,31,.85));clip-path:polygon(0 0,86% 0,100% 100%,0 100%)}
#scoreboard .score{font-size:34px;font-weight:900;min-width:30px;text-align:center}
#scoreboard .tname{font-size:11px;letter-spacing:.2em;opacity:.85}
#scoreboard .clock{background:rgba(8,10,24,.88);padding:6px 20px;text-align:center;min-width:120px;display:flex;flex-direction:column;justify-content:center}
#timer{font-size:28px;font-weight:800;letter-spacing:.06em}
#otTag{font-size:10px;letter-spacing:.25em;color:var(--gold)}
#timer.low{color:var(--red);animation:blink 1s infinite}
#minimap{position:absolute;left:16px;bottom:16px;width:150px;height:186px;opacity:.92;border-radius:12px;background:rgba(6,8,20,.55);border:1px solid var(--line)}
#feed{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.feedItem{padding:6px 12px;border-radius:8px;background:rgba(8,10,24,.75);border:1px solid var(--line);font-weight:700;font-size:15px;animation:feedin .3s ease;transition:opacity .5s}
.feedItem .b{color:var(--blue2)}.feedItem .o{color:var(--orange2)}
@keyframes feedin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#callout{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:900;font-size:clamp(48px,9vw,120px);letter-spacing:.1em;white-space:nowrap;opacity:0;text-align:center}
#callout.show{animation:callout var(--dur,2s) cubic-bezier(.2,1.5,.35,1) forwards}
#callout small{display:block;font-size:.22em;letter-spacing:.3em;margin-top:6px;opacity:.9}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
#replayTag{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.4em;padding:8px 26px;border-radius:10px;background:rgba(255,40,80,.82);text-align:center;animation:blink 1.6s infinite}
#replayTag span{display:block;font-size:10px;letter-spacing:.2em;font-weight:600;opacity:.85}
#replayTag.hidden{display:none}
.phud{position:absolute;left:0;width:100%;pointer-events:none}
.boostMeter{position:absolute;right:26px;bottom:22px;width:150px;height:150px}
.boostMeter svg{width:100%;height:100%;transform:rotate(135deg)}
.boostMeter circle{fill:none;stroke-width:11;stroke-linecap:round}
.boostMeter .bg{stroke:rgba(255,255,255,.12);stroke-dasharray:273 400}
.boostMeter .fg{stroke:url(#bgrad);stroke-dasharray:0 400;transition:stroke-dasharray .08s}
.boostMeter .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd)}
.boostMeter .bval{font-size:40px;font-weight:900;line-height:1}
.boostMeter .spd{font-size:11px;letter-spacing:.15em;color:var(--dim);margin-top:4px}
.boostMeter.ss .bval{color:var(--accent);text-shadow:0 0 14px var(--accent)}
.ballArrow{position:absolute;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:26px solid #fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.8));opacity:0;transition:opacity .2s}
.pname{position:absolute;left:18px;top:14px;font-family:var(--fd);font-size:12px;letter-spacing:.2em;opacity:.8}
.bcam{position:absolute;right:30px;bottom:180px;font-family:var(--fd);font-size:10px;letter-spacing:.2em;color:var(--dim)}
#fps{position:absolute;left:12px;top:10px;font-family:var(--fd);font-size:11px;color:#9f9;text-shadow:0 0 4px #000}
#fpHelp{position:absolute;left:180px;bottom:18px;font-size:13px;color:var(--dim);line-height:1.5;background:rgba(6,8,20,.55);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
#splitLine{position:absolute;left:0;right:0;top:50%;height:3px;background:linear-gradient(90deg,var(--blue),#fff,var(--orange));opacity:.8}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#tStick{position:absolute;left:40px;bottom:40px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);pointer-events:auto}
#tKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.3)}
.tbtn{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);pointer-events:auto;font-family:var(--fd);font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.1em}
.tbtn.on{background:rgba(124,246,255,.35)}
/* ---------- garage ---------- */
#garage{justify-content:flex-end;align-items:stretch;pointer-events:none}
#garage .gpanel{pointer-events:auto;width:min(470px,46vw);margin:16px;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:pop .35s}
.ghead{padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.ghead h2{font-family:var(--fd);letter-spacing:.14em;font-size:22px}
.gtabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.gtab{font-family:var(--fd);font-size:10.5px;font-weight:700;letter-spacing:.12em;padding:8px 10px;border-radius:8px;color:var(--dim)}
.gtab.on{background:linear-gradient(90deg,var(--blue),#5f6dff);color:#fff}
.gbody{flex:1;overflow:auto;padding:14px 18px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.item{position:relative;border-radius:12px;padding:10px 8px 9px;border:1px solid var(--line);background:rgba(255,255,255,.035);cursor:pointer;text-align:center;transition:.18s;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item.on{border-color:var(--accent);background:linear-gradient(160deg,rgba(43,140,255,.4),rgba(124,246,255,.08))}
.item .nm{font-weight:700;font-size:14px}
.item .sw{width:34px;height:22px;border-radius:6px}
.item.lock{opacity:.6}
.item .lk{position:absolute;top:5px;right:7px;font-family:var(--fd);font-size:9px;color:var(--gold)}
.statbars{margin-top:14px;display:grid;grid-template-columns:90px 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--dim);font-weight:700}
.statbars i{display:block;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--accent))}
.gfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{font-family:var(--fd);font-size:11px;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.slot.on{background:var(--blue);border-color:transparent}
.gleft{position:fixed;left:24px;top:22px;pointer-events:auto}
.gleft .carname{font-family:var(--fd);font-weight:900;font-size:clamp(26px,3.5vw,44px);letter-spacing:.12em}
.gleft .cartype{color:var(--dim);letter-spacing:.25em;font-family:var(--fd);font-size:12px;margin-top:4px}
.gleft .gbtns{display:flex;gap:8px;margin-top:14px}
.buy{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,212,71,.08);display:flex;justify-content:space-between;align-items:center;font-weight:700}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toastItem{padding:10px 20px;border-radius:12px;background:var(--glass2);border:1px solid var(--accent);font-weight:700;font-size:15px;animation:feedin .3s ease;box-shadow:0 0 24px rgba(124,246,255,.25)}
.kbd{display:inline-block;padding:1px 7px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:13px}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px;margin-top:8px}
@media (max-width:820px){#menu .left{padding-left:5vw;min-width:0}.mbtn{width:260px;font-size:16px}.mbtn.big{font-size:22px}.modes{grid-template-columns:repeat(2,1fr)}.themes{grid-template-columns:repeat(3,1fr)}.field{grid-template-columns:120px 1fr 44px}#garage .gpanel{width:96vw;margin:2vw;max-height:56vh;align-self:flex-end}.boostMeter{width:110px;height:110px}.boostMeter .bval{font-size:28px}}
</style>
</head>

/* Boot watchdog + WebGL capability check (classic script so it runs even if the CDN fails) */
window.__HK = { ready: false };
(function () {
  function fail(msg) {
    var e = document.getElementById('err'); document.getElementById('errMsg').textContent = msg;
    e.classList.remove('hidden'); var b = document.getElementById('boot'); if (b) b.style.display = 'none';
  }
  window.__HKfail = fail;
  try {
    var c = document.createElement('canvas'); var gl = c.getContext('webgl2');
    if (!gl) fail('Your browser or graphics driver does not support WebGL 2, which HYPERKICK needs. Try an up-to-date Chrome, Edge or Firefox and make sure hardware acceleration is switched on.');
  } catch (e) { fail('WebGL could not be initialised: ' + e.message); }
  setTimeout(function () { if (!window.__HK.ready) fail('The 3D engine (three.js) could not start. Try an up-to-date Chrome, Edge or Firefox.'); }, 30000);
  window.addEventListener('error', function (ev) { if (!window.__HK.ready && ev && ev.message) fail('Startup error: ' + ev.message); });
})();
</script>
