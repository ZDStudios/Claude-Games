      }
    }
  }

  updateBoxes(dt) {
    if (!this.boxesOn) return;
    for (const b of this.track.boxes) {
      b.spin += dt * 1.6;
      if (!b.active) { b.t -= dt; if (b.t <= 0) b.active = 1; continue; }
      for (const k of this.karts) {
        if (Math.abs(k.x - b.x) < 2.3 && Math.abs(k.z - b.z) < 2.3 && Math.abs(k.y + 0.6 - b.y) < 2.6) {
          b.active = 0; b.t = 1.3;
          this.burst(b.x, b.y, b.z, [1, 0.9, 0.5], 14);
          if (!k.item && k.rollT <= 0 && !k.finished) {
            k.rollT = 1.1; k.rollItem = rollItem(k.place, this.karts.length, this);
            if (k.isPlayer) Sound.play('box');
          } else if (k.isPlayer) Sound.play('box', 0.4);
          break;
        }
      }
    }
  }

  updateRoulette(dt) {
    for (const k of this.karts) {
      if (k.rollT <= 0) continue;
      k.rollT -= dt;
      if (k.isPlayer) { this.rollTick -= dt; if (this.rollTick <= 0) { this.rollTick = 0.075; Sound.play('tick'); } }
      if (k.rollT <= 0) {
        k.rollT = 0; k.item = k.rollItem; k.itemCount = k.item === 'tri' ? 3 : 1;
        if (k.isPlayer) Sound.play('itemGet');
        else k.aiState.itemT = 0.6 + Math.random() * 2.4 * (1.2 - DIFFS[this.difficulty].items);
      }
    }
  }

  emit(k, dt) {
    const fx = k.fx, fz = k.fz, rx = -fz, rz = fx, sp = Math.abs(k.speed), q = FXQ;
    if (k.drifting) {
      const col = DRIFT_RGB[k.driftLevel], chance = (k.driftLevel ? 0.95 : 0.35) * q;
      for (const sd of [-1, 1]) if (Math.random() < chance) {
        FX.spawn(k.x - fx * 1.0 + rx * sd * 0.95, k.y + 0.2, k.z - fz * 1.0 + rz * sd * 0.95,
          -fx * 3 + rx * sd * 2 + (Math.random() - 0.5) * 3, 2 + Math.random() * 3, -fz * 3 + rz * sd * 2 + (Math.random() - 0.5) * 3,
          0.22, k.driftLevel ? 0.5 : 0.28, col, 1, true, 14);
      }
    }
    if (k.boostT > 0) {
      const col = k.boostPow >= 1.05 ? [1, 0.55, 0.15] : [0.45, 0.72, 1];
      for (const sd of [-1, 1]) if (Math.random() < 0.95 * q) {
        FX.spawn(k.x - fx * 1.65 + rx * sd * 0.32, k.y + 0.9, k.z - fz * 1.65 + rz * sd * 0.32,
          -fx * 7 + (Math.random() - 0.5) * 2, 0.5 + Math.random(), -fz * 7 + (Math.random() - 0.5) * 2, 0.16, 0.95, col, 1, true, 0, 2, -3);
      }
    }
    if (k.offroad && sp > 6 && Math.random() < 0.75 * q) {
      const d = this.track.theme.dust, sd = Math.random() < 0.5 ? -1 : 1;
      FX.spawn(k.x - fx * 1.1 + rx * sd * 0.9, k.y + 0.3, k.z - fz * 1.1 + rz * sd * 0.9, -fx * 2 + (Math.random() - 0.5) * 2, 1 + Math.random() * 1.5, -fz * 2 + (Math.random() - 0.5) * 2,
        0.6, 0.6, d, 0.45, false, -0.3, 1.5, 1.4);
    }
    if (k.spinT > 0 && Math.random() < 0.5 * q) FX.spawn(k.x, k.y + 0.6, k.z, (Math.random() - 0.5) * 2, 1.5, (Math.random() - 0.5) * 2, 0.8, 1.1, [0.75, 0.75, 0.8], 0.45, false, -0.3, 1, 2);
    if (k.spinT <= 0 && k.spinVis !== 0) { k.spinVis = dampAngle(k.spinVis, 0, 10, dt); if (Math.abs(wrapA(k.spinVis)) < 0.01) k.spinVis = 0; }
  }

  /* ---------------- camera ---------------- */
  updateCamera(dt) {
    const c = this.cam, set = Store.settings;
    if (this.attract) {
      c.modeT -= dt;
      if (c.modeT <= 0) { c.modeT = 6 + Math.random() * 3; c.mode = (c.mode + 1) % 3; c.follow = this.order[Math.min(this.order.length - 1, (Math.random() * 4) | 0)]; }
    }
    const k = c.follow, sp = Math.hypot(k.vx, k.vz);
    let targetH = k.h;
    if (k.spinT > 0) targetH = sp > 4 ? Math.atan2(k.vx, k.vz) : c.h;
    else if (k.drifting) targetH = k.h + k.driftDir * 0.2;
    c.h = dampAngle(c.h, targetH, k.drifting ? 4 : 6, dt);
    const sh = Math.sin(c.h), ch = Math.cos(c.h);
    let px, py, pz, tx = k.x + sh * 4, ty = k.y + 1.3, tz = k.z + ch * 4;
    const dist = 6.6 + clamp(sp / 40, 0, 1) * 1.3;
    if (this.attract) {
      if (c.mode === 0) { px = k.x - sh * 11; pz = k.z - ch * 11; py = k.y + 4.2; }
      else if (c.mode === 1) { px = k.x + ch * 8 - sh * 3; pz = k.z - sh * 8 - ch * 3; py = k.y + 1.6; tx = k.x; tz = k.z; }
      else { px = k.x - sh * 20; pz = k.z - ch * 20; py = k.y + 14; }
    } else if (this.phase === 'intro') {
      const t = clamp(this.phaseT / INTRO_T, 0, 1), e = t * t * (3 - 2 * t), a = k.h + 2.4 - e * 2.4;
      const ax = k.x + Math.sin(a) * lerp(46, dist, e), az = k.z + Math.cos(a) * lerp(46, dist, e);
      px = ax; pz = az; py = k.y + lerp(26, 2.7, e);
      tx = lerp(k.x, tx, e); tz = lerp(k.z, tz, e);
    } else if (this.playerDoneT >= 0) {
      const a = this.time * 0.45; px = k.x + Math.sin(a) * 9; pz = k.z + Math.cos(a) * 9; py = k.y + 3.4; tx = k.x; ty = k.y + 1; tz = k.z;
    } else { px = k.x - sh * dist; pz = k.z - ch * dist; py = k.y + 2.7; }
    c.x = px; c.z = pz; c.y = damp(c.y, py, this.phase === 'intro' ? 30 : 8, dt);
    if (this.phase === 'intro' || this.attract) c.y = py;
    c.shake = Math.max(0, c.shake - dt * 1.8);
    const amp = c.shake * c.shake * 0.55 * (set.shake ? 1 : 0);
    const sx = (Math.random() - 0.5) * amp, sy = (Math.random() - 0.5) * amp, sz = (Math.random() - 0.5) * amp;
    const fovT = 62 + clamp(sp / 40, 0, 1.3) * 9 + (k.boostT > 0 ? 7 : 0);
    c.fov = damp(c.fov, fovT, 4, dt);
    Renderer.setCamera(c.x + sx, c.y + sy, c.z + sz, tx, ty, tz, c.fov);
  }

  /* ---------------- rendering ---------------- */
  render() {
    const R = Renderer, M = R.M, m = R.model, gl = R.gl, tr = this.track;
    R.begin(tr.theme, this.time);
    R.draw(TrackCache.meshes.far, null, { fog: 0.4 });
    R.draw(TrackCache.meshes.main, null, { noise: 1 });
    for (const s of tr.spinners) { M4.model(m, s.x, s.y, s.z, s.yaw, 0, this.time * s.speed, 1); R.draw(M.blades, m); }
    if (this.boxesOn) for (const b of tr.boxes) if (b.active) {
      M4.model(m, b.x, b.y + Math.sin(this.time * 2 + b.spin) * 0.15, b.z, -b.spin * 1.7, 0.4, 0.2, 1);
      R.draw(M.gem, m, { tint: [1, 0.85, 0.3], tintAmt: 0.5 + 0.5 * Math.sin(this.time * 6) * 0.5 });
    }
    for (const k of this.karts) {
      M4.model(m, k.x, k.y, k.z, k.h + k.spinVis, k.pitch, k.roll, 1);
      const o = this._p; o.alpha = 1; o.tint = null; o.tintAmt = 0;
      if (k.flash > 0) { o.tint = [1, 1, 1]; o.tintAmt = k.flash * 1.5; }
      else if (k.boostT > 0) { o.tint = [1, 0.75, 0.3]; o.tintAmt = 0.12 + 0.08 * Math.sin(this.time * 40); }
      R.draw(R.kartMesh(k.ci, k.paintKey), m, o);
    }
    for (const p of this.projectiles) {
      if (p.type === 'seeker') { M4.model(m, p.x, p.y, p.z, p.h, 0, this.time * 8, 1); R.draw(M.seeker, m); }
      else { M4.model(m, p.x, p.y, p.z, this.time * 3, this.time * 2, 0, 1.2); R.draw(M.star, m); }
    }
    for (const z of this.hazards) { M4.model(m, z.x, z.y, z.z, z.wob * 0.2, 0, 0, 1 + Math.sin(z.wob) * 0.06); R.draw(M.goo, m); }
    // --- translucent pass
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-2, -8);
    R.blend(true);
    for (const k of this.karts) {
      const s = clamp(1 - (k.y - k.loc.y) * 0.25, 0.4, 1);
      M4.model(m, k.x, k.loc.y + 0.04, k.z, k.h, 0, 0, s); R.draw(M.shadow, m, { alpha: 0.32 * s, fog: 1 });
    }
    gl.disable(gl.POLYGON_OFFSET_FILL);
    if (this.ghost && this.ghost.data && this.phase !== 'intro') {
      const g = this.ghostPos;
      if (!g.done || this.raceTime < 1) { M4.model(m, g.x, g.y, g.z, g.h, 0, 0, 1); R.draw(R.kartMesh(this.ghost.ci, 'base'), m, { alpha: 0.38, tint: [0.5, 0.9, 1], tintAmt: 0.55 }); }
    }
    if (this.boxesOn) for (const b of tr.boxes) if (b.active) {
      M4.model(m, b.x, b.y + Math.sin(this.time * 2 + b.spin) * 0.15, b.z, b.spin, b.spin * 0.6, 0, 1);
      R.draw(M.box, m, { alpha: 0.62 });
    }
    for (const k of this.karts) if (k.shieldT > 0) {
      const flick = k.shieldT < 2 ? (Math.sin(this.time * 30) > 0 ? 0.3 : 0.12) : 0.3;
      M4.model(m, k.x, k.y + 0.9, k.z, this.time * 2, 0, 0, 1);
      R.blend(true, true); R.draw(M.shield, m, { alpha: flick });
    }
    R.blend(false);
    R.drawParticles(FX);
  }

  /* final classification; unfinished karts get an estimated time from their pace */
  results() {
    const Ln = this.track.len, full = TOTAL_LAPS * Ln;
    const rows = this.karts.map(k => {
      let t = k.finishTime;
      if (!k.finished) { const pace = Math.max(12, (k.progress + Ln) / Math.max(1, this.raceTime)); t = this.raceTime + Math.max(0, full - k.progress) / pace; }
      return { k, time: t, finished: k.finished };
    });
    rows.sort((a, b) => a.time - b.time);
    return rows;
  }
}

/* =========================================================================
   16. HUD — 2D canvas overlay: position, laps, timer, item slot, minimap,
   speedometer, mini-turbo meter, countdown and banners.
   ========================================================================= */
function drawItemIcon(c, key, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s / 100, s / 100); c.lineJoin = 'round';
  const zip = (ox, oy, k) => {
    c.save(); c.translate(ox, oy); c.scale(k, k);
    const g = c.createLinearGradient(0, -38, 0, 38); g.addColorStop(0, '#7ff0ff'); g.addColorStop(1, '#2a6bff');
    c.fillStyle = '#ffffff'; c.fillRect(-10, -47, 20, 10);
    c.beginPath(); c.roundRect ? c.roundRect(-24, -38, 48, 78, 10) : c.rect(-24, -38, 48, 78);
    c.fillStyle = g; c.fill(); c.lineWidth = 5; c.strokeStyle = '#ffffff'; c.stroke();
    c.beginPath(); c.moveTo(8, -28); c.lineTo(-12, 6); c.lineTo(0, 6); c.lineTo(-6, 32); c.lineTo(15, -4); c.lineTo(3, -4); c.lineTo(11, -28); c.closePath();
    c.fillStyle = '#ffe14a'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#7a4a00'; c.stroke();
    c.restore();
  };
  switch (key) {
    case 'zip': zip(0, 4, 1); break;
    case 'tri': zip(-26, 12, 0.62); zip(26, 12, 0.62); zip(0, -10, 0.62); break;
    case 'seeker': {
      const g = c.createRadialGradient(-10, -12, 4, 0, 0, 38); g.addColorStop(0, '#ff9a9a'); g.addColorStop(1, '#c4101e');
      c.beginPath(); c.arc(0, 0, 36, 0, TAU); c.fillStyle = g; c.fill(); c.lineWidth = 4; c.strokeStyle = '#fff'; c.stroke();
      c.beginPath(); c.ellipse(0, 6, 37, 9, 0, 0, TAU); c.fillStyle = '#ffffff'; c.fill();
      c.beginPath(); c.arc(0, -8, 11, 0, TAU); c.fillStyle = '#ffe14a'; c.fill(); c.beginPath(); c.arc(0, -8, 5, 0, TAU); c.fillStyle = '#300'; c.fill();
      break;
    }
    case 'goo': {
      c.beginPath(); c.moveTo(-40, 26);
      c.bezierCurveTo(-46, -10, -20, -38, 0, -36); c.bezierCurveTo(24, -38, 46, -8, 40, 26); c.bezierCurveTo(20, 34, -20, 34, -40, 26);
      const g = c.createLinearGradient(0, -36, 0, 30); g.addColorStop(0, '#b6ff6a'); g.addColorStop(1, '#2f9a1a');
      c.fillStyle = g; c.fill(); c.lineWidth = 4; c.strokeStyle = '#123d08'; c.stroke();
      c.fillStyle = '#1e5a10'; for (const [a, b, r] of [[-14, 0, 6], [12, -10, 5], [16, 12, 7]]) { c.beginPath(); c.arc(a, b, r, 0, TAU); c.fill(); }
      c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-16, -18, 9, 5, -0.5, 0, TAU); c.fill();
      break;
    }
    case 'bubble': {
      const g = c.createRadialGradient(0, 0, 10, 0, 0, 40); g.addColorStop(0, 'rgba(127,232,255,0.15)'); g.addColorStop(1, 'rgba(127,232,255,0.8)');
      c.beginPath(); c.arc(0, 0, 38, 0, TAU); c.fillStyle = g; c.fill(); c.lineWidth = 5; c.strokeStyle = '#d8faff'; c.stroke();
      c.beginPath(); c.arc(-4, -4, 26, Math.PI * 1.05, Math.PI * 1.5); c.lineWidth = 6; c.strokeStyle = '#ffffff'; c.stroke();
      break;
    }
    case 'starfall': {
      for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(10, 10); c.lineTo(-44 + i * 6, 38 - i * 16); c.lineWidth = 10 - i * 2; c.strokeStyle = ['#c86bff', '#ff8a2e', '#ffd24a'][i]; c.lineCap = 'round'; c.stroke(); }
      c.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i & 1 ? 15 : 34; c.lineTo(12 + Math.cos(a) * r, -6 + Math.sin(a) * r); }
      c.closePath(); const g = c.createRadialGradient(12, -6, 4, 12, -6, 34); g.addColorStop(0, '#fff6c0'); g.addColorStop(1, '#ffb020');
      c.fillStyle = g; c.fill(); c.lineWidth = 4; c.strokeStyle = '#6a2a90'; c.stroke();
      break;
    }
  }
  c.restore();
}

const HUD = {
  cv: null, c: null, w: 1, h: 1, dpr: 1, map: null, mapKey: '', mp: null, pt: { x: 0, y: 0 },
  init(cv) { this.cv = cv; this.c = cv.getContext('2d'); this.resize(); },
  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1); this.w = innerWidth; this.h = innerHeight;
    this.cv.width = Math.round(this.w * this.dpr); this.cv.height = Math.round(this.h * this.dpr); this.mapKey = '';
  },
  clear() { this.c.setTransform(1, 0, 0, 1, 0, 0); this.c.clearRect(0, 0, this.cv.width, this.cv.height); },
  text(str, x, y, size, color, align = 'left', base = 'alphabetic', italic = true) {
    const c = this.c;
    c.font = (italic ? 'italic ' : '') + '900 ' + size + 'px "Arial Black","Trebuchet MS",Arial,sans-serif';
    c.textAlign = align; c.textBaseline = base; c.lineJoin = 'round';
    c.lineWidth = Math.max(3, size * 0.16); c.strokeStyle = 'rgba(16,8,36,0.92)'; c.strokeText(str, x, y);
    c.fillStyle = color; c.fillText(str, x, y);
  },
  panel(x, y, w, h, r = 12) {
    const c = this.c; c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
    c.fillStyle = 'rgba(14,10,36,0.62)'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,0.22)'; c.stroke();
  },

  buildMap(track, size) {
    const key = track.id + ':' + size + ':' + this.dpr;
    if (key === this.mapKey) return;
    this.mapKey = key;
    const cv = this.map || (this.map = document.createElement('canvas')), d = this.dpr;
    cv.width = Math.round(size * d); cv.height = Math.round(size * d);
    const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, size, size);
    const b = track.bounds, sc = size * 0.84 / Math.max(b.x1 - b.x0, b.z1 - b.z0);
    this.mp = { sc, cx: b.cx, cz: b.cz, half: size / 2 };
    const P = i => [(track.X[i] - b.cx) * sc + size / 2, (track.Z[i] - b.cz) * sc + size / 2];
    c.beginPath(); for (let i = 0; i <= track.n; i += 2) { const p = P(i % track.n); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
    c.closePath(); c.lineJoin = 'round';
    c.lineWidth = 11; c.strokeStyle = 'rgba(10,6,30,0.85)'; c.stroke();
    c.lineWidth = 6; c.strokeStyle = 'rgba(235,235,250,0.92)'; c.stroke();
    const s0 = P(0), t = [track.TX[0], track.TZ[0]];
    c.beginPath(); c.moveTo(s0[0] - t[1] * 7, s0[1] + t[0] * 7); c.lineTo(s0[0] + t[1] * 7, s0[1] - t[0] * 7);
    c.lineWidth = 3; c.strokeStyle = '#ff3d7f'; c.stroke();
  },
  mapPt(x, z, ox, oy) { const m = this.mp; this.pt.x = ox + (x - m.cx) * m.sc + m.half; this.pt.y = oy + (z - m.cz) * m.sc + m.half; return this.pt; },

  draw(race) {
    const c = this.c, W = this.w, H = this.h, P = race.player;
    this.clear(); c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (!P || race.attract) return;
    const s = clamp(Math.min(W, H) / 720, 0.62, 1.25), touch = Game.touchVisible, pad = 14;
    const tt = race.mode === 'tt';

    // --- name tags over nearby rivals
    c.font = 'italic 800 ' + Math.round(12 * s) + 'px "Trebuchet MS",Arial,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
    for (const k of race.karts) {
      if (k === P) continue;
      const d = camDist(k.x, k.z); if (d > 70 || d < 3) continue;
      const p = Renderer.project(k.x, k.y + 3.1, k.z, this.pt); if (!p) continue;
      const a = clamp((70 - d) / 30, 0, 1);
      c.globalAlpha = a; c.lineWidth = 3; c.strokeStyle = 'rgba(10,6,30,.85)';
      const label = k.place + '  ' + k.name; c.strokeText(label, p.x, p.y); c.fillStyle = '#fff'; c.fillText(label, p.x, p.y);
      c.globalAlpha = 1;
    }

    // --- item slot (top-left)
    const isz = Math.round(86 * s), ix = pad, iy = pad;
    this.panel(ix, iy, isz, isz, 16);
    if (P.rollT > 0) drawItemIcon(c, ITEM_KEYS[Math.floor(race.time * 14) % ITEM_KEYS.length], ix + isz / 2, iy + isz / 2, isz * 0.72);
    else if (P.item) {
      drawItemIcon(c, P.item, ix + isz / 2, iy + isz / 2, isz * 0.78);
      if (P.item === 'tri') this.text('x' + P.itemCount, ix + isz - 8, iy + isz - 8, Math.round(18 * s), '#ffcc33', 'right');
    }
    // --- lap counter
    const lap = clamp(P.lap, 1, TOTAL_LAPS);
    this.text('LAP', ix + isz + 12, iy + 22 * s, Math.round(15 * s), '#3de0ff');
    this.text(lap + '/' + TOTAL_LAPS, ix + isz + 12, iy + 62 * s, Math.round(38 * s), '#ffffff');

    // --- timer & splits (top-right)
    const t = race.phase === 'racing' ? (P.finished ? P.finishTime : race.raceTime) : 0;
    this.text(fmtTime(t).replace('--:--.---', '0:00.000'), W - pad, iy + 34 * s, Math.round(30 * s), '#ffffff', 'right');
    let ly = iy + 56 * s;
    c.font = '700 ' + Math.round(13 * s) + 'px "Trebuchet MS",Arial,sans-serif'; c.textAlign = 'right';
    for (let i = 0; i < P.lapTimes.length; i++) {
      const best = P.lapTimes[i] === P.bestLap && P.lapTimes.length > 1;
      c.fillStyle = best ? '#6dff8b' : 'rgba(255,255,255,.85)'; c.fillText('L' + (i + 1) + '  ' + fmtTime(P.lapTimes[i]), W - pad, ly); ly += 16 * s;
    }
    if (tt) {
      const rec = Store.data.best[race.track.id];
      if (rec && rec.total) { c.fillStyle = '#ffcc33'; c.fillText('BEST  ' + fmtTime(rec.total), W - pad, ly); ly += 16 * s; }
    }

    // --- minimap (right)
    const ms = Math.round(clamp(Math.min(W, H) * 0.27, 110, 200));
    const mx = W - ms - pad, my = Math.max(ly + 4, iy + 70 * s);
    this.buildMap(race.track, ms);
    c.globalAlpha = 0.95; c.drawImage(this.map, mx, my, ms, ms); c.globalAlpha = 1;
    for (const p of race.projectiles) {
      const q = this.mapPt(p.x, p.z, mx, my); c.beginPath(); c.arc(q.x, q.y, p.type === 'starfall' ? 5 : 3, 0, TAU);
      c.fillStyle = p.type === 'starfall' ? '#c86bff' : '#ff3a3a'; c.fill();
    }
    if (race.ghost && race.ghost.data && !race.ghostPos.done && race.phase === 'racing') {
      const q = this.mapPt(race.ghostPos.x, race.ghostPos.z, mx, my); c.beginPath(); c.arc(q.x, q.y, 4, 0, TAU); c.fillStyle = 'rgba(127,232,255,.8)'; c.fill();
    }
    for (let i = race.order.length - 1; i >= 0; i--) {
      const k = race.order[i], q = this.mapPt(k.x, k.z, mx, my), me = k === P;
      c.beginPath(); c.arc(q.x, q.y, me ? 6 : 4, 0, TAU);
      c.fillStyle = 'rgb(' + (k.color[0] * 255 | 0) + ',' + (k.color[1] * 255 | 0) + ',' + (k.color[2] * 255 | 0) + ')'; c.fill();
      c.lineWidth = me ? 3 : 1.5; c.strokeStyle = me ? '#ffffff' : 'rgba(10,6,30,.9)'; c.stroke();
    }

    // --- position: bottom-right on desktop; under the item slot on touch layouts (buttons own the bottom corners)
    if (!tt) {
      const pl = P.place, col = pl === 1 ? '#ffd24a' : pl === 2 ? '#dfe7f2' : pl === 3 ? '#f0a060' : '#ffffff';
      const big = Math.round((touch ? 64 : 92) * s), suf = ordinal(pl).replace(String(pl), '');
      const px = touch ? ix + big * (pl >= 10 ? 1.25 : 0.7) : W - pad - 46 * s, py = touch ? iy + isz + big * 0.98 : H - pad - 6 * s;
      this.text(String(pl), px, py, big, col, 'right');
      this.text(suf, px + 2, py - big * 0.48, Math.round((touch ? 22 : 30) * s), col, 'left');
    }

    // --- speed: arc gauge on desktop, compact digital readout on touch layouts
    const spd = Math.hypot(P.vx, P.vz), units = Store.settings.units ? 'MPH' : 'KM/H', shown = Math.round(spd * (Store.settings.units ? 2.237 : 3.6));
    let mxx, myy, mw;
    if (touch) {
      this.text(shown + ' ' + units, ix + isz + 12, iy + 84 * s, Math.round(14 * s), P.boostT > 0 ? '#ffb020' : '#ffffff');
      mw = isz * 1.6; mxx = ix; myy = iy + isz + (tt ? 10 : 74) * s;
    } else {
      const r = 54 * s, sx = pad + r + 4, sy = H - pad - r * 0.55;
      const frac = clamp(spd / 52, 0, 1), a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
      c.lineCap = 'round';
      c.beginPath(); c.arc(sx, sy, r, a0, a1); c.lineWidth = 10 * s; c.strokeStyle = 'rgba(14,10,36,.7)'; c.stroke();
      const g = c.createLinearGradient(sx - r, 0, sx + r, 0); g.addColorStop(0, '#3de0ff'); g.addColorStop(0.6, '#ffcc33'); g.addColorStop(1, '#ff3d7f');
      c.beginPath(); c.arc(sx, sy, r, a0, a0 + (a1 - a0) * frac); c.lineWidth = 7 * s; c.strokeStyle = P.boostT > 0 ? '#ffb020' : g; c.stroke();
      this.text(String(shown), sx, sy + 6 * s, Math.round(28 * s), '#ffffff', 'center');
      this.text(units, sx, sy + 24 * s, Math.round(11 * s), '#3de0ff', 'center');
      mw = r * 2; mxx = sx - r; myy = sy - r - 22 * s;
    }
    // --- mini-turbo charge meter (only while drifting)
    if (P.drifting) {
      const mh = 8 * s;
      for (let i = 0; i < 3; i++) {
        const lo = i ? DRIFT_LEVELS[i - 1] : 0, hi = DRIFT_LEVELS[i], f = clamp((P.driftCharge - lo) / (hi - lo), 0, 1), w = mw / 3 - 3;
        c.fillStyle = 'rgba(14,10,36,.7)'; c.fillRect(mxx + i * (w + 4), myy, w, mh);
        const col = DRIFT_RGB[i + 1]; c.fillStyle = 'rgb(' + (col[0] * 255 | 0) + ',' + (col[1] * 255 | 0) + ',' + (col[2] * 255 | 0) + ')';
        c.fillRect(mxx + i * (w + 4), myy, w * f, mh);
      }
    }

    // --- centre messages
    const cx = W / 2;
    if (race.phase === 'intro') {
      this.text(race.track.name.toUpperCase(), cx, H * 0.2, Math.round(40 * s), '#ffffff', 'center');
      this.text(race.mode === 'gp' ? Game.gpLabel() : race.mode === 'tt' ? 'TIME TRIAL' : DIFFS[race.difficulty].name.toUpperCase() + ' RACE', cx, H * 0.2 + 34 * s, Math.round(18 * s), '#3de0ff', 'center');
      if (!touch) this.text('Hold GAS just as "2" fades for a rocket start', cx, H * 0.88, Math.round(14 * s), '#ffcc33', 'center', 'alphabetic', false);
    }
    if (race.phase === 'countdown') {
      const n = 3 - Math.floor(race.phaseT), f = race.phaseT % 1, k = 1 + (1 - f) * 0.35;
      c.save(); c.translate(cx, H * 0.38); c.scale(k, k); c.globalAlpha = clamp(1.4 - f, 0, 1);
      this.text(String(n), 0, 0, Math.round(120 * s), ['#ff3d7f', '#ffcc33', '#ff8a2e'][3 - n] || '#fff', 'center', 'middle');
      c.restore();
    }
    let by = H * 0.3;
    for (const b of race.banners) {
      const t0 = b.t / b.dur, a = clamp(Math.min(t0 * 8, (1 - t0) * 5), 0, 1), sc = b.big ? 1 + Math.max(0, 0.25 - b.t) * 1.6 : 1;
      c.save(); c.globalAlpha = a; c.translate(cx, by); c.scale(sc, sc);
      this.text(b.text, 0, 0, Math.round((b.big ? 64 : 34) * s), b.color, 'center', 'middle');
      c.restore(); by += (b.big ? 70 : 42) * s;
    }
    if (race.wrongWayT > 1 && Math.floor(race.time * 3) % 2 === 0) this.text('WRONG WAY', cx, H * 0.5, Math.round(54 * s), '#ff3a3a', 'center', 'middle');
  },
};

/* =========================================================================
   17. UI — DOM menus with keyboard / gamepad / mouse / touch navigation
   ========================================================================= */
const B = (act, label, extra = '', cls = '') => `<div class="btn ${cls}" tabindex="0" role="button" data-act="${act}" ${extra}>${label}</div>`;
const A = (adj, label, cls = 'small') => `<div class="btn ${cls}" tabindex="0" role="button" data-adj="${adj}">${label}<span class="v" data-v="${adj}"></span></div>`;

const UI = {
  root: null, screen: null, h: {},
  init() {
    this.root = document.getElementById('ui');
    this.root.addEventListener('click', e => { const el = e.target.closest('.btn'); if (el && this.root.contains(el)) this.activate(el); });
    this.root.addEventListener('mousemove', e => { const el = e.target.closest('.btn'); if (el && document.activeElement !== el) el.focus({ preventScroll: true }); });
    this.root.addEventListener('focusin', e => { const el = e.target.closest('.btn'); if (el) this.select(el); });
  },
  show(name, html, handlers, focusSel) {
    this.screen = name; this.h = handlers || {}; this.shownAt = performance.now(); this.selected = null;
    this.root.innerHTML = html;
    this.root.querySelectorAll('canvas[data-item]').forEach(cv => { const c = cv.getContext('2d'); drawItemIcon(c, cv.dataset.item, cv.width / 2, cv.height / 2, cv.width * 0.9); });
    if (this.h.refresh) this.h.refresh();
    const f = (focusSel && this.root.querySelector(focusSel)) || this.root.querySelector('.btn');
    if (f) { f.focus({ preventScroll: true }); this.select(f); }
  },
  /* highlight + notify; called on focus changes (and directly, since focus events don't fire in unfocused windows) */
  select(el) {
    if (this.selected === el) return;
    this.selected = el;
    this.root.querySelectorAll('.btn.sel').forEach(b => b.classList.remove('sel')); el.classList.add('sel');
    if (this.h.focus) this.h.focus(el);
  },
  hide() { this.screen = null; this.h = {}; this.root.innerHTML = ''; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); },
  btns() { return Array.from(this.root.querySelectorAll('.btn')); },
  move(dir) {
    const list = this.btns(); if (!list.length) return;
    const cur = list.includes(this.selected) ? this.selected : null;
    if (!cur) { list[0].focus({ preventScroll: true }); this.select(list[0]); return; }
    if ((dir === 'left' || dir === 'right') && cur.dataset.adj) { this.adjust(cur, dir === 'left' ? -1 : 1); return; }
    const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let best = null, bs = 1e9;
    for (const el of list) {
      if (el === cur) continue;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      const prim = dir === 'up' ? -dy : dir === 'down' ? dy : dir === 'left' ? -dx : dx;
      const sec = dir === 'up' || dir === 'down' ? Math.abs(dx) : Math.abs(dy);
      if (prim <= 4) continue;
      const sc = prim + sec * 2.5; if (sc < bs) { bs = sc; best = el; }
    }
    if (!best && (dir === 'up' || dir === 'down')) best = dir === 'down' ? list[0] : list[list.length - 1];
    if (best && best !== cur) { best.focus({ preventScroll: true }); this.select(best); best.scrollIntoView({ block: 'nearest' }); Sound.play('move'); }
  },
  activate(el) {
    if (performance.now() - this.shownAt < 300) return;   // ignore presses carried over from gameplay
    if (el.dataset.adj) { this.adjust(el, 1); return; }
    Sound.play('select');
    if (this.h.act) this.h.act(el.dataset.act, el);
  },
  adjust(el, d) { Sound.play('move'); if (this.h.adj) this.h.adj(el.dataset.adj, d, el); if (this.h.refresh) this.h.refresh(); },
  back() { if (this.h.back) { Sound.play('back'); this.h.back(); } },
  onKey(e) {
    if (!this.screen) return;
    const k = e.code;
    if (k === 'ArrowUp' || k === 'KeyW') { e.preventDefault(); this.move('up'); }
    else if (k === 'ArrowDown' || k === 'KeyS') { e.preventDefault(); this.move('down'); }
    else if (k === 'ArrowLeft' || k === 'KeyA') { e.preventDefault(); this.move('left'); }
    else if (k === 'ArrowRight' || k === 'KeyD') { e.preventDefault(); this.move('right'); }
    else if (k === 'Enter' || k === 'NumpadEnter' || k === 'Space') {
      e.preventDefault();
      if (this.selected && this.root.contains(this.selected)) this.activate(this.selected);
    } else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); this.back(); }
  },
  update() {
    if (!this.screen) return;
    const m = Input.menu;
    if (m.up) this.move('up'); if (m.down) this.move('down'); if (m.left) this.move('left'); if (m.right) this.move('right');
    if (m.ok && this.selected && this.root.contains(this.selected)) this.activate(this.selected);
    if (m.back) this.back();
  },
};

/* =========================================================================
   18. GAME — state machine, menus, Grand Prix, records, main loop
   ========================================================================= */
const ALT_NAMES = ['Juno Nova', 'Bruno Basalt', 'Pixie Paprika', 'Cogsworth Mk II', 'Mako Midnight', 'Luna Eclipse'];
const SHOWROOM = { ...THEMES.neon, fogNear: 300, fogFar: 1200, light: [1.05, 1, 1], amb: [0.5, 0.46, 0.62] };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

const Game = {
  state: 'menu', backdrop: 'attract', race: null, lastRace: null, gp: null, flow: { mode: 'single', ci: 0, paint: 'base' },
  preview: { ci: 0, t: 0 }, attractIdx: 0, last: 0, hiddenPause: false, touchVisible: false, resetArm: false, failed: false,

  boot() {
    Store.load();
    const s = Store.settings;
    for (const k in DEFAULT_SETTINGS) if (s[k] === undefined) s[k] = DEFAULT_SETTINGS[k];
    if (!Renderer.init(document.getElementById('gl'))) { this.fatal('SKIDLINE GP needs WebGL, which is not available in this browser.'); return; }
    HUD.init(document.getElementById('hud'));
    Input.init(); UI.init();
    this.applyQuality();
    addEventListener('resize', () => { Renderer.resize(Store.settings.quality); HUD.resize(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { this.hiddenPause = true; if (this.state === 'race') this.pause(); Sound.suspend(); }
      else { this.hiddenPause = false; Sound.resume(); }
    });
    this.flow.ci = clamp(+s.lastChar || 0, 0, CHARACTERS.length - 1);
    this.showTitle();
    this.loop = this.loop.bind(this);
    this.last = performance.now();
    requestAnimationFrame(this.loop);
  },
  fatal(msg) {
    this.failed = true;
    const f = document.getElementById('fatal'); f.textContent = msg; f.classList.remove('hidden');
    Sound.engineStop(); Sound.musicStop();
  },
  applyQuality() {
    const q = Store.settings.quality;
    FX = new Particles([700, 1600, 2600][q] || 1600); FXQ = [0.5, 1, 1][q] || 1;
    Renderer.resize(q); HUD.resize();
  },

  /* ---------------- main loop ---------------- */
  loop(now) {
    if (this.failed) return;
    requestAnimationFrame(this.loop);
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05);
    Input.poll(dt);
    UI.update();
    if (this.state === 'race') {
      if (Input.pausePressed && !this.race.completed) this.pause(); else this.race.update(dt);
    } else if (this.state === 'results' || (this.state === 'menu' && this.backdrop === 'attract' && this.race)) {
      this.race.update(dt);
    }
    this.preview.t += dt;
    if (this.backdrop === 'showroom') this.renderShowroom();
    else if (this.race) this.race.render();
    if ((this.state === 'race' || this.state === 'paused') && this.race) HUD.draw(this.race); else HUD.clear();
    this.updateTouch();
  },
  updateTouch() {
    const s = Store.settings.touch;
    const want = this.state === 'race' && (s === 'on' || (s === 'auto' && (Input.usingTouch || (window.matchMedia && matchMedia('(pointer: coarse)').matches))));
    if (want !== this.touchVisible) { this.touchVisible = want; document.getElementById('touch').classList.toggle('hidden', !want); }
  },
  renderShowroom() {
    const R = Renderer, M = R.M, m = R.model, t = this.preview.t, wide = innerWidth > 720;
    if (wide) R.setCamera(0, 3.1, 11, -3.3, -0.9, 0, 38); else R.setCamera(0, 3.6, 16, 0, 2.6, 0, 38);   // narrow: kart sits in the gap between panels
    R.begin(SHOWROOM, t);
    R.draw(M.platform, R.ident);
    const pk = this.paintKey(this.preview.ci);
    M4.model(m, 0, 0, 0, t * 0.7, 0, 0, 1); R.draw(R.kartMesh(this.preview.ci, pk), m);
    R.blend(true); M4.model(m, 0, 0.02, 0, t * 0.7, 0, 0, 1.1); R.draw(M.shadow, m, { alpha: 0.4 }); R.blend(false);
  },
  paintKey(ci) { const p = this.flow.paint; return p === 'alt' ? String(ci) : p === 'gold' && Store.data.unlocks.gold ? 'gold' : 'base'; },

  /* ---------------- attract mode (title backdrop) ---------------- */
  startAttract() {
    const roster = [];
    for (let i = 0; i < NUM_RACERS; i++) roster.push({ id: i, ci: i % 6, paint: i >= 6 ? String(i % 6) : 'base', name: i >= 6 ? ALT_NAMES[i % 6] : CHARACTERS[i % 6].name });
    shuffle(roster);
    this.race = new Race({ mode: 'attract', trackIndex: this.attractIdx % TRACKS.length, mirror: false, roster, difficulty: 2 });
  },
  nextAttract() { this.attractIdx++; this.startAttract(); },

  /* ---------------- screens ---------------- */
  showTitle() {
    this.state = 'menu'; this.backdrop = 'attract'; this.gp = null;
    Sound.engineStop(); Sound.musicPlay('menu');
    if (!this.race || !this.race.attract) this.startAttract();
    UI.show('title', `<div class="screen">
      <div class="logo"><span class="word">SKIDLINE</span><span class="badge">GP</span></div>
      <div class="tagline">Drift &middot; Boost &middot; Win</div>
      <div class="menu">
        ${B('gp', 'Grand Prix <span class="muted">4 races</span>', '', 'primary')}
        ${B('single', 'Single Race')}
        ${B('tt', 'Time Trial')}
        ${B('howto', 'How to Play')}
        ${B('settings', 'Settings')}
      </div>
      <div class="hint"><kbd>&uarr;</kbd><kbd>&darr;</kbd> select &nbsp; <kbd>Enter</kbd> confirm &nbsp; <kbd>Esc</kbd> back &nbsp;&middot;&nbsp; gamepad &amp; touch supported</div>
    </div>`, {
      act: a => {
        if (a === 'gp' || a === 'single' || a === 'tt') { this.flow.mode = a; this.showChars(); }
        else if (a === 'howto') this.showHowTo(() => this.showTitle());
        else if (a === 'settings') this.showSettings(() => this.showTitle());
      },
    }, this._titleFocus);
  },

  showChars() {
    this.state = 'menu'; this.backdrop = 'showroom'; this.preview.ci = this.flow.ci;
    const cards = CHARACTERS.map((ch, i) => B('pick', `<span class="sw" style="background:${ch.body}"></span><span>${esc(ch.name)}</span>`, `data-i="${i}"`, 'card')).join('');
    const mode = { gp: 'Grand Prix', single: 'Single Race', tt: 'Time Trial' }[this.flow.mode];
    UI.show('chars', `<div class="screen"><div class="cs">
      <div class="panel"><h2>${mode}: Racer</h2><div class="cgrid">${cards}</div>
        <div class="menu" style="max-width:none;margin-top:12px">${A('paint', 'Paint')}${B('back', 'Back', '', 'small')}</div>
      </div>
      <div><div class="spacer"></div><div class="panel" id="cinfo"></div></div>
    </div></div>`, {
      focus: el => { if (el.dataset.i !== undefined) { this.preview.ci = +el.dataset.i; this.charInfo(); } },
      act: (a, el) => {
        if (a === 'pick') {
          this.flow.ci = +el.dataset.i; Store.settings.lastChar = this.flow.ci; Store.save();
          if (this.flow.mode === 'gp') this.showCups(); else this.showTracks();
        } else if (a === 'back') { this._titleFocus = '[data-act="' + this.flow.mode + '"]'; this.showTitle(); }
      },
      back: () => { this._titleFocus = '[data-act="' + this.flow.mode + '"]'; this.showTitle(); },
      adj: (k, d) => {
        const opts = ['base', 'alt'].concat(Store.data.unlocks.gold ? ['gold'] : []);
        let i = opts.indexOf(this.flow.paint); if (i < 0) i = 0;
        this.flow.paint = opts[(i + d + opts.length) % opts.length];
      },
      refresh: () => {
        const v = UI.root.querySelector('[data-v="paint"]');
        if (v) v.textContent = { base: 'Factory', alt: 'Alternate', gold: 'Gold' }[this.flow.paint] || 'Factory';
        this.charInfo();
      },
    }, `[data-i="${this.flow.ci}"]`);
  },
  charInfo() {
    const el = document.getElementById('cinfo'); if (!el) return;
    const ch = CHARACTERS[this.preview.ci], st = ch.stats;
    const bar = (label, v) => `<div class="stat"><span>${label}</span><div class="bar">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= v ? 'on' : ''}"></i>`).join('')}</div></div>`;
    el.innerHTML = `<div class="kname">${esc(ch.name)}</div><div class="kart">Kart: ${esc(ch.kart)}</div><p>${esc(ch.bio)}</p>
      <div class="statbox">${bar('Speed', st.speed)}${bar('Accel', st.accel)}${bar('Handling', st.handling)}${bar('Weight', st.weight)}</div>`;
  },

  showCups() {
    const u = Store.data.unlocks, D = Store.settings.difficulty;
    const cups = CUPS.map((c, i) => {
      const locked = c.unlock && !u[c.unlock], tro = Store.data.trophies[c.id + '-' + D];
      const medal = tro ? ` <span style="color:${['', '#ffd24a', '#dfe7f2', '#f0a060'][tro]}">&#9733; ${ordinal(tro)}</span>` : '';
      return B(locked ? 'locked' : 'cup', `${esc(c.name)}${medal}<span class="muted">${locked ? 'Win any cup to unlock' : c.races.map(r => TRACKS[r[0]].name.split(' ')[0] + (r[1] ? '*' : '')).join(' · ')}</span>`, `data-c="${i}"`, locked ? 'locked' : '');
    }).join('');
    UI.show('cups', `<div class="screen"><div class="panel" style="max-width:640px;margin:0 auto"><h2>Grand Prix</h2>
      <div class="menu" style="max-width:none">${cups}${A('diff', 'Difficulty')}${B('back', 'Back', '', 'small')}</div>
      <p class="muted" style="margin-top:12px">Four races. Points: ${GP_POINTS.join(' / ')}. * = mirrored layout. Win a cup to unlock the Mirror Cup; win on Hard for the gold paint.</p></div></div>`, {
      act: (a, el) => {
        if (a === 'cup') this.startGP(+el.dataset.c);
        else if (a === 'locked') Sound.play('back');
        else if (a === 'back') this.showChars();
      },
      back: () => this.showChars(),
      adj: (k, d) => { Store.settings.difficulty = (Store.settings.difficulty + d + 3) % 3; Store.save(); this.showCups(); },
      refresh: () => { const v = UI.root.querySelector('[data-v="diff"]'); if (v) v.textContent = DIFFS[Store.settings.difficulty].name; },
    }, UI.screen === 'cups' ? '[data-adj="diff"]' : null);
  },

  showTracks() {
    const tt = this.flow.mode === 'tt', u = Store.data.unlocks;
    const list = [];
    TRACKS.forEach((t, i) => { list.push([i, false]); });
    if (u.mirror) TRACKS.forEach((t, i) => list.push([i, true]));
    const btns = list.map(([i, m]) => {
      const id = TRACKS[i].id + (m ? '-m' : ''), rec = Store.data.best[id] || {};
      const right = tt ? (rec.total ? fmtTime(rec.total) : '--') : (rec.lap ? 'Lap ' + fmtTime(rec.lap) : '');
      return B('track', `${esc(TRACKS[i].name)}${m ? ' <span style="color:var(--pink)">Mirror</span>' : ''}<span class="muted">${right}</span>`, `data-t="${i}" data-m="${m ? 1 : 0}"`);
    }).join('');
    UI.show('tracks', `<div class="screen"><div class="panel" style="max-width:820px;margin:0 auto"><h2>${tt ? 'Time Trial' : 'Single Race'}: Track</h2>
      <div class="cols"><div class="menu" style="max-width:none">${btns}${tt ? '' : A('diff', 'Difficulty')}${B('back', 'Back', '', 'small')}</div>
      <div><canvas id="tmap" width="240" height="240" style="width:100%;max-width:240px;display:block;margin:0 auto"></canvas><p id="tinfo" class="muted"></p></div></div>
      ${tt ? '<p class="muted">Three laps, no rivals, three Zip Cells. Beat your best total time to save a new ghost.</p>' : ''}</div></div>`, {
      focus: el => { if (el.dataset.t !== undefined) this.trackPreview(+el.dataset.t, el.dataset.m === '1'); },
      act: (a, el) => {
        if (a === 'track') this.startSingle(+el.dataset.t, el.dataset.m === '1');
        else if (a === 'back') this.showChars();
      },
      back: () => this.showChars(),
      adj: (k, d) => { Store.settings.difficulty = (Store.settings.difficulty + d + 3) % 3; Store.save(); },
      refresh: () => { const v = UI.root.querySelector('[data-v="diff"]'); if (v) v.textContent = DIFFS[Store.settings.difficulty].name; },
    }, this._trackFocus);
  },
  trackPreview(i, mirror) {
    const cv = document.getElementById('tmap'), info = document.getElementById('tinfo'); if (!cv) return;
    const c = cv.getContext('2d'), d = TRACKS[i], P = d.pts.map(p => [(mirror ? -p[0] : p[0]), p[1]]);
    const pts = catmullRom(P.map(p => [p[0], p[1], 0]), 16);
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
    for (const p of pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); z0 = Math.min(z0, p[1]); z1 = Math.max(z1, p[1]); }
    const W = cv.width, sc = W * 0.84 / Math.max(x1 - x0, z1 - z0), th = THEMES[d.theme];
    c.clearRect(0, 0, W, W);
    c.fillStyle = th.ground; c.globalAlpha = 0.35; c.fillRect(0, 0, W, W); c.globalAlpha = 1;
    c.beginPath(); pts.forEach((p, k) => { const x = (p[0] - (x0 + x1) / 2) * sc + W / 2, y = (p[1] - (z0 + z1) / 2) * sc + W / 2; k ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.closePath(); c.lineJoin = 'round'; c.lineWidth = 12; c.strokeStyle = '#120d2b'; c.stroke(); c.lineWidth = 7; c.strokeStyle = th.rumble[0]; c.stroke();
    c.lineWidth = 3; c.strokeStyle = '#ffffff'; c.stroke();
    const rec = Store.data.best[d.id + (mirror ? '-m' : '')] || {};
    info.innerHTML = `<b style="color:#fff">${esc(d.name)}${mirror ? ' (Mirror)' : ''}</b><br>${esc(d.blurb)}<br>Best lap: ${fmtTime(rec.lap)} &middot; Best total: ${fmtTime(rec.total)}`;
  },

  settingsRows: [
    ['master', 'Master Volume'], ['music', 'Music Volume'], ['sfx', 'Effects Volume'], ['difficulty', 'Difficulty'],
    ['quality', 'Graphics Quality'], ['shake', 'Screen Shake'], ['scheme', 'Keyboard Layout'], ['sens', 'Steering Sensitivity'],
    ['autoAccel', 'Auto-Accelerate'], ['touch', 'Touch Controls'], ['units', 'Speed Units'],
  ],
  settingText(k) {
    const s = Store.settings, v = s[k];
    switch (k) {
      case 'master': case 'music': case 'sfx': return v * 10 + '%';
      case 'difficulty': return DIFFS[v].name;
      case 'quality': return ['Low', 'Medium', 'High'][v];
      case 'shake': case 'autoAccel': return v ? 'On' : 'Off';
      case 'scheme': return SCHEMES[v].name;
      case 'sens': return ['Low', 'Medium', 'High'][v];
      case 'touch': return { auto: 'Auto', on: 'On', off: 'Off' }[v];
      case 'units': return v ? 'MPH' : 'KM/H';
    }
    return '';
  },
  showSettings(onBack) {
    const rows = this.settingsRows.map(([k, l]) => A(k, l)).join('');
    this.resetArm = false;
    UI.show('settings', `<div class="screen"><div class="panel" style="max-width:620px;margin:0 auto"><h2>Settings</h2>
      <div class="menu tight" style="max-width:none">${rows}${B('reset', 'Reset Records <span class="muted" id="rst"></span>', '', 'small')}${B('back', 'Back', '', 'small')}</div>
      <p class="muted" style="margin-top:12px">Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> (or click) to change a value. Settings save automatically.</p>
      <p class="muted" id="keys"></p></div></div>`, {
      adj: (k, d) => {
        const s = Store.settings;
        if (k === 'master' || k === 'music' || k === 'sfx') s[k] = clamp(s[k] + d, 0, 10);
        else if (k === 'difficulty' || k === 'quality' || k === 'sens') s[k] = (s[k] + d + 3) % 3;
        else if (k === 'scheme') s[k] = (s[k] + d + SCHEMES.length) % SCHEMES.length;
        else if (k === 'touch') { const o = ['auto', 'on', 'off']; s[k] = o[(o.indexOf(s[k]) + d + 3) % 3]; }
        else s[k] = s[k] ? 0 : 1;
        Store.save(); Sound.applyVolumes();
        if (k === 'quality') { if (this.state === 'menu') this.applyQuality(); else Renderer.resize(s.quality); }
      },
      act: a => {
        if (a === 'back') onBack();
        else if (a === 'reset') {
          if (!this.resetArm) { this.resetArm = true; document.getElementById('rst').textContent = 'press again to confirm'; return; }
          Store.data.best = {};
          for (const t of TRACKS) for (const m of ['', '-m']) { try { localStorage.removeItem(SAVE_KEY + '.ghost.' + t.id + m); } catch (e) { /* ignore */ } }
          Store.save(); document.getElementById('rst').textContent = 'cleared';
        }
      },
      back: onBack,
      refresh: () => {
        UI.root.querySelectorAll('[data-v]').forEach(el => { el.textContent = this.settingText(el.dataset.v); });
        const sc = SCHEMES[Store.settings.scheme], nm = c => c.replace('Key', '').replace('Arrow', '').replace('Left', ' L').replace('Right', ' R');
        const keys = document.getElementById('keys');
        if (keys) keys.innerHTML = `Steer ${sc.left.concat(sc.right).map(c => '<kbd>' + nm(c) + '</kbd>').join(' ')} &middot; Gas ${sc.gas.map(c => '<kbd>' + nm(c) + '</kbd>').join(' ')} &middot; Brake ${sc.brake.map(c => '<kbd>' + nm(c) + '</kbd>').join(' ')} &middot; Drift ${sc.drift.map(c => '<kbd>' + nm(c) + '</kbd>').join(' ')} &middot; Item ${sc.item.map(c => '<kbd>' + nm(c) + '</kbd>').join(' ')} &middot; Pause <kbd>Esc</kbd> <kbd>P</kbd>`;
      },
    });
  },

  showHowTo(onBack) {
    const items = ITEM_KEYS.map(k => `<p><canvas class="ico" width="60" height="60" data-item="${k}"></canvas><b>${ITEMS[k].name}</b> &mdash; ${ITEMS[k].desc}</p>`).join('');
    UI.show('howto', `<div class="screen"><div class="panel"><h2>How to Play</h2><div class="cols">
      <div><h3>Controls</h3>
        <p><b>Keyboard:</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd>/<kbd>A</kbd><kbd>D</kbd> steer, <kbd>&uarr;</kbd>/<kbd>W</kbd> gas, <kbd>&darr;</kbd>/<kbd>S</kbd> brake &amp; reverse, <kbd>Space</kbd> hop / drift, <kbd>Shift</kbd>/<kbd>E</kbd> use item, <kbd>Esc</kbd>/<kbd>P</kbd> pause. A Z/X layout is in Settings.</p>
        <p><b>Gamepad:</b> stick / d-pad steer, <kbd>A</kbd>/<kbd>RT</kbd> gas, <kbd>B</kbd>/<kbd>LT</kbd> brake, <kbd>RB</kbd> drift, <kbd>LB</kbd>/<kbd>Y</kbd> item, <kbd>Start</kbd> pause.</p>
        <p><b>Touch:</b> slide on the left pad to steer; GAS, BRAKE, DRIFT and ITEM buttons on the right.</p>
        <h3>Driving</h3>
        <p><b>Drift:</b> hold drift while steering into a corner. Sparks turn <span style="color:#4fc3ff">blue</span>, then <span style="color:#ff9a2e">orange</span>, then <span style="color:#c86bff">purple</span>. Release for a mini-turbo; longer charge = longer boost. Steering into the drift charges faster.</p>
        <p><b>Rocket start:</b> press gas as the "2" fades out and hold it. Too early floods the engine.</p>
        <p><b>Off-road</b> roughly halves your top speed, unless you're boosting. Barriers bounce you back and cost speed.</p>
        <p><b>Laps:</b> 3 laps; hidden checkpoints have to be crossed in order, so short-cuts and reversing over the line don't count.</p>
      </div>
      <div><h3>Items</h3><p class="muted">Drive through a rainbow box. Racers further back get stronger items.</p>${items}
        <h3>Modes</h3><p><b>Grand Prix:</b> 4 races, points for every place. <b>Single Race:</b> any unlocked track. <b>Time Trial:</b> solo with three Zip Cells; race against your saved ghost.</p></div>
      </div><div class="menu" style="margin-top:14px">${B('back', 'Back', '', 'small')}</div></div></div>`, { act: onBack, back: onBack });
  },

  /* ---------------- race setup ---------------- */
  makeRoster() {
    const f = this.flow, pc = f.ci;
    const roster = [{ id: 0, ci: pc, paint: this.paintKey(pc), name: CHARACTERS[pc].name, isPlayer: true }];
    const others = shuffle([0, 1, 2, 3, 4, 5].filter(i => i !== pc));
    others.forEach(ci => roster.push({ id: roster.length, ci, paint: 'base', name: CHARACTERS[ci].name }));
    shuffle(others.slice()).slice(0, NUM_RACERS - 1 - others.length).forEach(ci => roster.push({ id: roster.length, ci, paint: String(ci), name: ALT_NAMES[ci] }));
    return roster;
  },
  beginRace(opts) {
    this.lastRace = opts;
    UI.hide();
    Sound.engineStop();
    let roster = opts.roster;
    if (opts.mode === 'tt') roster = [roster[0]];
    this.race = new Race({ ...opts, roster });
    this.state = 'race'; this.backdrop = 'race';
    Sound.musicPlay(this.race.track.theme.music); Sound.musicTempo(1);
    Sound.engineStart();
  },
  startSingle(ti, mirror) {
    this._trackFocus = `[data-t="${ti}"][data-m="${mirror ? 1 : 0}"]`;
    const roster = this.makeRoster(), ai = shuffle(roster.slice(1));
    const opts = { mode: this.flow.mode, trackIndex: ti, mirror, roster: ai.concat([roster[0]]), difficulty: Store.settings.difficulty };
    if (this.flow.mode === 'tt') {
      const g = Store.loadGhost(TRACKS[ti].id + (mirror ? '-m' : ''));
      opts.ghost = g && g.data ? { ci: clamp(+g.ci || 0, 0, 5), total: g.total, data: Ghost.decode(g.data) } : null;
      if (opts.ghost && !opts.ghost.data) opts.ghost = null;
      opts.roster = [roster[0]];
    }
    this.beginRace(opts);
  },
  startGP(cupIdx) {
    const roster = this.makeRoster(), points = {};
    roster.forEach(r => { points[r.id] = 0; });
    this.gp = { cup: cupIdx, race: 0, roster, points, gained: {}, difficulty: Store.settings.difficulty };
    this.startGPRace();
  },
  startGPRace() {
    const gp = this.gp, [ti, mirror] = CUPS[gp.cup].races[gp.race];
    let grid;
    if (gp.race === 0) grid = shuffle(gp.roster.slice(1)).concat([gp.roster[0]]);
    else grid = shuffle(gp.roster.slice()).sort((a, b) => gp.points[a.id] - gp.points[b.id]);
    this.beginRace({ mode: 'gp', trackIndex: ti, mirror, roster: grid, difficulty: gp.difficulty });
  },
  gpLabel() { return this.gp ? CUPS[this.gp.cup].name.toUpperCase() + ' · RACE ' + (this.gp.race + 1) + '/4' : ''; },

  /* ---------------- pause ---------------- */
  pause() {
    if (this.state !== 'race') return;
    this.state = 'paused'; Sound.engineStop();
    this.showPause();
  },
  showPause() {
    UI.show('pause', `<div class="screen"><div class="panel" style="max-width:420px;margin:0 auto"><h2>Paused</h2><div class="menu" style="max-width:none">
      ${B('resume', 'Resume', '', 'primary')}${B('restart', 'Restart Race')}${B('settings', 'Settings')}${B('howto', 'How to Play')}${B('quit', 'Quit to Title')}</div></div></div>`, {
      act: a => {
        if (a === 'resume') this.resume();
        else if (a === 'restart') { if (this.gp) this.startGPRace(); else this.beginRace(this.lastRace); }
        else if (a === 'settings') this.showSettings(() => this.showPause());
        else if (a === 'howto') this.showHowTo(() => this.showPause());
        else if (a === 'quit') { this.race = null; this.showTitle(); }
      },
      back: () => this.resume(),
    });
  },
  resume() {
    if (this.state !== 'paused') return;
    UI.hide(); this.state = 'race';
    Input._prev.pause = true;            // swallow the key that closed the menu
    Input._prev.item = true; Input._prev.drift = Input.drift;
    Sound.engineStart();
  },

  /* ---------------- results ---------------- */
  onRaceComplete(race) {
    this.state = 'results';
    Sound.engineStop(); Sound.musicPlay('menu');
    const P = race.player, id = race.track.id, rec = Store.data.best[id] || {};
    let newLap = false, newTotal = false;
    if (P.bestLap && (!rec.lap || P.bestLap < rec.lap)) { rec.lap = P.bestLap; newLap = true; }
    if (race.mode === 'tt' && P.finished && (!rec.total || P.finishTime < rec.total)) {
      rec.total = P.finishTime; newTotal = true;
      Store.saveGhost(id, { ci: P.ci, total: P.finishTime, data: Ghost.encode(race.ghostRec) });
    }
    Store.data.best[id] = rec; Store.save();
    if (newLap || newTotal) Sound.play('record');
    if (race.mode === 'tt') return this.showTT(race, newLap, newTotal);
    const rows = race.results();
    if (race.mode === 'gp') {
      this.gp.gained = {};
      rows.forEach((r, i) => { const id2 = r.k.rosterId; this.gp.points[id2] += GP_POINTS[i]; this.gp.gained[id2] = GP_POINTS[i]; });
    }
    this.showResults(race, rows, newLap);
  },
  rowHTML(k, cells, me) { return `<tr class="${me ? 'me' : ''}">${cells}</tr>`; },
  dot(k) { return `<span class="dot" style="background:rgb(${k.color.map(v => v * 255 | 0).join(',')})"></span>`; },
  showResults(race, rows, newLap) {
    const gp = race.mode === 'gp';
    const body = rows.map((r, i) => `<tr class="${r.k.isPlayer ? 'me' : ''}"><td class="pos">${ordinal(i + 1)}</td><td>${this.dot(r.k)}${esc(r.k.name)}</td>
      <td class="num">${fmtTime(r.time)}${r.finished ? '' : '*'}</td>${gp ? `<td class="num">+${GP_POINTS[i]}</td>` : ''}</tr>`).join('');
    const P = race.player, place = rows.findIndex(r => r.k === P) + 1;
    const btns = gp ? B('standings', 'Standings', '', 'primary') : B('again', 'Race Again', '', 'primary') + B('tracks', 'Change Track') + B('title', 'Title Screen');
    UI.show('results', `<div class="screen"><div class="panel" style="max-width:640px;margin:0 auto">
      <h2>${esc(race.track.name)}: Results</h2>
      <div class="big" style="color:${place <= 3 ? 'var(--gold)' : '#fff'}">You finished ${ordinal(place)}</div>
      <p class="center muted" style="text-align:center">Best lap ${fmtTime(P.bestLap)}${newLap ? ' &middot; <b style="color:var(--green)">NEW TRACK RECORD</b>' : ''}</p>
      <table><thead><tr><th>Pos</th><th>Racer</th><th style="text-align:right">Time</th>${gp ? '<th style="text-align:right">Pts</th>' : ''}</tr></thead><tbody>${body}</tbody></table>
      <p class="muted" style="font-size:12px">* projected from race pace</p>
      <div class="menu" style="margin-top:10px">${btns}</div></div></div>`, {
      act: a => {
        if (a === 'standings') this.showStandings();
        else if (a === 'again') this.beginRace(this.lastRace);
        else if (a === 'tracks') { this.race = null; this.showChars(); this.showTracks(); }
        else if (a === 'title') { this.race = null; this.showTitle(); }
      },
      back: () => { if (!gp) { this.race = null; this.showTitle(); } },
    });
  },
  showStandings() {
    const gp = this.gp, last = gp.race >= 3;
    const rows = gp.roster.slice().sort((a, b) => gp.points[b.id] - gp.points[a.id]);
    const body = rows.map((r, i) => `<tr class="${r.isPlayer ? 'me' : ''}"><td class="pos">${ordinal(i + 1)}</td><td><span class="dot" style="background:${r.paint === 'base' ? CHARACTERS[r.ci].body : r.paint === 'gold' ? GOLD_PAINT[0] : ALT_PAINTS[+r.paint][0]}"></span>${esc(r.name)}</td>
      <td class="num muted">+${gp.gained[r.id] || 0}</td><td class="num"><b>${gp.points[r.id]}</b></td></tr>`).join('');
    const next = last ? '' : CUPS[gp.cup].races[gp.race + 1];
    UI.show('standings', `<div class="screen"><div class="panel" style="max-width:600px;margin:0 auto">
      <h2>${esc(CUPS[gp.cup].name)}: Standings</h2><p class="muted">After race ${gp.race + 1} of 4</p>
      <table><thead><tr><th>Pos</th><th>Racer</th><th style="text-align:right">Race</th><th style="text-align:right">Total</th></tr></thead><tbody>${body}</tbody></table>
      <div class="menu" style="margin-top:12px">${last ? B('final', 'Award Ceremony', '', 'primary') : B('next', 'Next: ' + esc(TRACKS[next[0]].name) + (next[1] ? ' (Mirror)' : ''), '', 'primary')}${B('quit', 'Quit Cup')}</div></div></div>`, {
      act: a => {
        if (a === 'next') { gp.race++; this.startGPRace(); }
        else if (a === 'final') this.showFinal();
        else if (a === 'quit') { this.race = null; this.showTitle(); }
      },
    });
  },
  showFinal() {
    const gp = this.gp, rows = gp.roster.slice().sort((a, b) => gp.points[b.id] - gp.points[a.id]);
    const rank = rows.findIndex(r => r.isPlayer) + 1, cup = CUPS[gp.cup], key = cup.id + '-' + gp.difficulty;
    const u = Store.data.unlocks, notes = [];
    if (rank <= 3) { const prev = Store.data.trophies[key]; if (!prev || rank < prev) Store.data.trophies[key] = rank; }
    if (rank === 1 && !u.mirror) { u.mirror = true; notes.push('Unlocked: Mirror Cup and mirrored tracks!'); }
    if (rank === 1 && gp.difficulty === 2 && !u.gold) { u.gold = true; notes.push('Unlocked: Gold paint for every kart!'); }
    Store.save();
    Sound.play(rank <= 3 ? 'finish' : 'lose');
    const col = ['#ffd24a', '#dfe7f2', '#f0a060'][rank - 1] || '#8a86a8';
    UI.show('final', `<div class="screen"><div class="panel" style="max-width:520px;margin:0 auto;text-align:center">
      <h2>${esc(cup.name)} &middot; ${DIFFS[gp.difficulty].name}</h2>
      <canvas id="trophy" width="180" height="180" style="width:150px;height:150px"></canvas>
      <div class="big" style="color:${col}">${rank <= 3 ? ordinal(rank) + ' place trophy!' : 'Finished ' + ordinal(rank)}</div>
      <p>${esc(rows[0].name)} wins the cup with ${gp.points[rows[0].id]} points.</p>
      ${notes.map(n => `<p style="color:var(--green);font-weight:800">${n}</p>`).join('')}
      <div class="menu" style="margin-top:12px">${B('title', 'Title Screen', '', 'primary')}</div></div></div>`, {
      act: () => { this.race = null; this.showTitle(); }, back: () => { this.race = null; this.showTitle(); },
    });
    this.drawTrophy(document.getElementById('trophy'), col, rank <= 3);
  },
  drawTrophy(cv, col, win) {
    const c = cv.getContext('2d'), W = cv.width; c.clearRect(0, 0, W, W);
    c.save(); c.translate(W / 2, W / 2);
    if (!win) { c.font = '900 64px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText('GG', 0, 0); c.restore(); return; }
    const g = c.createLinearGradient(-50, 0, 50, 0); g.addColorStop(0, '#fff'); g.addColorStop(0.3, col); g.addColorStop(1, '#6a4a10');
    c.fillStyle = g; c.strokeStyle = '#2a1a05'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(-48, -60); c.lineTo(48, -60); c.bezierCurveTo(48, 10, 20, 22, 8, 26); c.lineTo(8, 46); c.lineTo(30, 52); c.lineTo(30, 66);
    c.lineTo(-30, 66); c.lineTo(-30, 52); c.lineTo(-8, 46); c.lineTo(-8, 26); c.bezierCurveTo(-20, 22, -48, 10, -48, -60); c.closePath(); c.fill(); c.stroke();
    for (const sd of [-1, 1]) { c.beginPath(); c.arc(sd * 50, -30, 18, sd > 0 ? -Math.PI / 2 : Math.PI / 2, sd > 0 ? Math.PI / 2 : Math.PI * 1.5, false); c.lineWidth = 9; c.strokeStyle = col; c.stroke(); }
    c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i & 1 ? 8 : 18; c.lineTo(Math.cos(a) * r, -22 + Math.sin(a) * r); }
    c.closePath(); c.fillStyle = '#fff6c0'; c.fill();
    c.restore();
  },
  showTT(race, newLap, newTotal) {
    const P = race.player, rec = Store.data.best[race.track.id] || {};
    const laps = P.lapTimes.map((t, i) => `<tr class="${t === P.bestLap ? 'me' : ''}"><td>Lap ${i + 1}</td><td class="num">${fmtTime(t)}</td></tr>`).join('');
    UI.show('ttres', `<div class="screen"><div class="panel" style="max-width:480px;margin:0 auto">
      <h2>${esc(race.track.name)}: Time Trial</h2>
      <div class="big">${fmtTime(P.finishTime)}</div>
      ${newTotal ? '<p style="text-align:center;color:var(--green);font-weight:800">NEW RECORD! Ghost saved.</p>' : `<p class="muted" style="text-align:center">Record: ${fmtTime(rec.total)}</p>`}
      ${newLap ? '<p style="text-align:center;color:var(--green);font-weight:800">NEW BEST LAP!</p>' : ''}
      <table><tbody>${laps}</tbody></table>
      <div class="menu" style="margin-top:12px">${B('again', 'Retry', '', 'primary')}${B('tracks', 'Change Track')}${B('title', 'Title Screen')}</div></div></div>`, {
      act: a => {
        if (a === 'again') this.startSingle(race.track.index, race.track.mirror);
        else if (a === 'tracks') { this.race = null; this.showChars(); this.showTracks(); }
        else if (a === 'title') { this.race = null; this.showTitle(); }
      },
      back: () => { this.race = null; this.showTitle(); },
    });
  },
};

/* =========================================================================
   19. BOOT + PWA registration (http/https only; silently skipped on file://)
   ========================================================================= */
try {
  if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) {
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = 'manifest.json'; document.head.appendChild(link);
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
} catch (e) { /* PWA support is optional */ }

try { Game.boot(); }
catch (e) { Game.fatal('SKIDLINE GP could not start: ' + (e && e.message ? e.message : e)); }
})();
</script>
