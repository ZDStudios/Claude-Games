<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d2b">
<meta name="description" content="SKIDLINE GP: an original arcade kart racer. Drift, mini-turbo, grab items and win the Grand Prix. Runs fully offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SKIDLINE GP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23201446'/%3E%3Cpath d='M16 44 L32 14 H52 L36 44Z' fill='%23ffcc33'/%3E%3Cpath d='M8 52h48' stroke='%23ff3d7f' stroke-width='6'/%3E%3C/svg%3E">
<style>
/* =========================================================================
   STYLES — menus, HUD overlay helpers, touch controls
   ========================================================================= */
:root{
  --bg:#0b0a1c; --panel:rgba(16,12,40,.86); --panel2:rgba(30,24,70,.9);
  --line:rgba(255,255,255,.12); --text:#f5f3ff; --muted:#aaa3cf;
  --gold:#ffcc33; --pink:#ff3d7f; --cyan:#3de0ff; --green:#6dff8b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
.hidden{display:none!important}

/* ---------- screens ---------- */
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.screen{pointer-events:auto;max-width:980px;width:100%;max-height:100%;overflow-x:hidden;overflow-y:auto;
  animation:pop .22s ease-out;scrollbar-width:thin}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h2{margin:0 0 14px;font-size:clamp(22px,4vw,34px);letter-spacing:.06em;font-style:italic;text-transform:uppercase;
  background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:14px 0 6px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
p{margin:6px 0;line-height:1.45;color:#dcd8f5}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}

/* logo */
.logo{font-weight:900;font-style:italic;letter-spacing:.04em;line-height:.9;text-align:center;margin:0 0 6px;
  font-size:clamp(46px,11vw,112px);font-family:"Arial Black","Trebuchet MS",sans-serif;transform:skewX(-8deg)}
.logo .word{background:linear-gradient(180deg,#fff7c2 0%,var(--gold) 45%,#ff7a2e 70%,var(--pink) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 0 #2a0f45) drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.logo .badge{display:inline-block;font-size:.42em;vertical-align:middle;padding:.05em .3em;margin-left:.15em;border-radius:.2em;
  background:var(--pink);color:#fff;transform:translateY(-.2em);box-shadow:0 6px 0 #2a0f45}
.tagline{text-align:center;color:var(--cyan);letter-spacing:.35em;text-transform:uppercase;font-size:clamp(11px,2vw,14px);margin-bottom:22px;
  text-shadow:0 2px 8px #000}
.menu{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}

/* buttons (divs with role=button so we fully own activation) */
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;outline:none;
  padding:12px 18px;border-radius:12px;font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(40,32,86,.86),rgba(18,13,43,.86));border:2px solid var(--line);
  color:var(--text);transition:transform .08s,background .12s,border-color .12s;font-style:italic}
.btn:hover,.btn:focus,.btn.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,204,51,.28),rgba(255,61,127,.18));transform:translateX(4px)}
.btn.locked{opacity:.45}
.btn .v{color:var(--gold);font-style:normal;min-width:7ch;text-align:right}
.btn .v::before{content:"\25C2  ";color:var(--muted)} .btn .v::after{content:"  \25B8";color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,#ffcc33,#ff8a2e);color:#2a0f2e;border-color:#ffe28a}
.btn.primary:focus,.btn.primary:hover,.btn.primary.sel{background:linear-gradient(180deg,#fff0a8,#ffb03a)}
.btn.small{font-size:14px;padding:9px 14px}
.menu.tight{gap:5px}.menu.tight .btn.small{padding:7px 14px}
.hint{margin-top:16px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em}
kbd{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-family:inherit;font-size:.92em;color:#fff}

/* character select */
.cs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{flex-direction:column;justify-content:center;padding:12px 8px;min-height:92px;text-align:center;font-size:13px}
.card .sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.statbox{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;gap:4px}.bar i{flex:1;height:10px;border-radius:3px;background:rgba(255,255,255,.12)}
.bar i.on{background:linear-gradient(90deg,var(--gold),var(--pink))}
.kname{font-size:22px;font-weight:900;font-style:italic;letter-spacing:.04em}
.kart{color:var(--cyan);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.spacer{height:clamp(120px,32vh,300px)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
tr.me td{background:rgba(255,204,51,.16);color:#fff;font-weight:800}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{font-weight:900;font-style:italic;width:36px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:2px solid rgba(255,255,255,.7)}
.trophy{font-size:72px;text-align:center;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.big{font-size:clamp(26px,6vw,48px);font-weight:900;font-style:italic;text-align:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ico{display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:8px}

/* touch controls */
#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
.tpad{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:min(44vw,260px);height:120px;
  border-radius:60px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);pointer-events:auto;
  display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:34px;color:rgba(255,255,255,.7)}
.tpad .knob{position:absolute;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,204,51,.55);left:50%;pointer-events:none}
.tbtns{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;
  grid-template-columns:72px 92px;grid-template-rows:72px 92px;gap:10px;pointer-events:none}
.tbtn{pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;letter-spacing:.08em;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);color:#fff;text-shadow:0 1px 3px #000}
.tbtn.on{background:rgba(255,204,51,.6)}
.tbtn.big{background:rgba(109,255,139,.25)}
.tbtn[data-t=item]{background:rgba(61,224,255,.22)}
.tbtn[data-t=drift]{background:rgba(255,61,127,.25)}
#t-pause{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:46px;height:46px;font-size:16px}
#fatal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#120d2b;z-index:10;font-size:18px}

@media (max-width:720px){
  .cs{grid-template-columns:1fr}
  .spacer{height:22vh}
  .panel{padding:16px}
  .btn{font-size:15px;padding:11px 14px}
  .stat{grid-template-columns:80px 1fr}
}
@media (max-height:520px){ .logo{font-size:44px} .tagline{margin-bottom:10px} .menu{gap:6px} .btn{padding:8px 14px} }
</style>
</head>
<body>
<canvas id="gl" aria-label="Race view"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="ui" role="application" aria-live="polite"></div>
<div id="touch" class="hidden" aria-hidden="true">
  <div id="t-steer" class="tpad"><span>&#9664;</span><span>&#9654;</span><div class="knob"></div></div>
  <div class="tbtns">
    <div class="tbtn" data-t="item">ITEM</div>
    <div class="tbtn" data-t="drift">DRIFT</div>
    <div class="tbtn" data-t="brake">BRAKE</div>
    <div class="tbtn big" data-t="gas">GAS</div>
  </div>
  <div id="t-pause" class="tbtn" data-t="pause">II</div>
</div>
<div id="fatal" class="hidden"></div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff">SKIDLINE GP needs JavaScript enabled.</div></noscript>
<script>
(() => {
'use strict';

/* =========================================================================
   1. CONFIG — tuning constants, racers, items, difficulty, track + themes
   ========================================================================= */
const TOTAL_LAPS = 3;
const ROAD_HALF = 9;            // half-width of tarmac
const RUMBLE_W = 1.5;           // kerb width
const WALL_OFF = 17;            // lateral offset of the barrier from the centre line
const WALL_H = 1.3;
const WALL_T = 0.8;
const APRON = 30;               // where the embankment meets the ground plane
const GROUND_Y = -0.35;
const KART_R = 1.25;            // collision radius
const SPACING = 2;              // centre-line sample spacing (world units)
const NUM_CP = 8;               // checkpoints per lap (index 0 is the finish line)
const OFFROAD_MUL = 0.5;        // top-speed multiplier on grass/sand
const REV_MAX = 10;
const BRAKE = 42;
const GP_POINTS = [15, 12, 10, 8, 6, 4, 3, 2, 1];
const DRIFT_LEVELS = [1.0, 2.1, 3.3];        // charge needed for blue / orange / purple
const DRIFT_BOOST = [0, 0.6, 1.05, 1.6];     // boost seconds per level
const DRIFT_RGB = [[1, 1, 1], [0.3, 0.75, 1], [1, 0.6, 0.18], [0.8, 0.4, 1]];
const NUM_RACERS = 9;           // player + 8 AI
const PLACE_SUFFIX = ['th', 'st', 'nd', 'rd'];
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : (PLACE_SUFFIX[n % 10] || 'th'));

/* Racers: every name and design here is original to SKIDLINE GP. Stats are 1..5. */
const CHARACTERS = [
  { id: 'juno',  name: 'Juno Spark',    kart: 'Voltline',    look: 'courier', body: '#ffcf2e', trim: '#2a2a3a', skin: '#c98b5e',
    bio: 'Bike courier turned racer. Never late, never flat.', stats: { speed: 3, accel: 3, handling: 3, weight: 3 } },
  { id: 'bruno', name: 'Bruno Boulder', kart: 'Quarry King', look: 'golem',   body: '#8a7f73', trim: '#d9a441', skin: '#9a948c',
    bio: 'A living rockslide with a lead foot. Bumps hurt, for you.', stats: { speed: 5, accel: 1, handling: 2, weight: 5 } },
  { id: 'pixie', name: 'Pixie Pepper',  kart: 'Hot Hopper',  look: 'pepper',  body: '#ff4b3a', trim: '#3fbf4a', skin: '#ff5a3d',
    bio: 'A chili sprite. Tiny, spicy and impossible to pin down.', stats: { speed: 2, accel: 4, handling: 5, weight: 1 } },
  { id: 'cogs',  name: 'Dr. Cogsworth', kart: 'Tick-Tock 9', look: 'robot',   body: '#3fa7ff', trim: '#c08a3e', skin: '#c9a24a',
    bio: 'Clockwork inventor. Zero to top speed in exactly 2.000 seconds.', stats: { speed: 3, accel: 5, handling: 3, weight: 2 } },
  { id: 'mako',  name: 'Mako Reef',     kart: 'Riptide',     look: 'shark',   body: '#2fd6c2', trim: '#ffffff', skin: '#6f8ea8',
    bio: 'Surf-champion shark. Smells blood in the slipstream.', stats: { speed: 4, accel: 2, handling: 3, weight: 4 } },
  { id: 'luna',  name: 'Luna Moth',     kart: 'Dusk Glider', look: 'moth',    body: '#b58cff', trim: '#ffe08a', skin: '#efe6ff',
    bio: 'Nocturnal drifter, drawn to every neon light on the strip.', stats: { speed: 3, accel: 4, handling: 4, weight: 2 } },
];
const ALT_PAINTS = [['#e8e8f0', '#ff3d7f'], ['#3a3a44', '#ff9a2e'], ['#ff8fd0', '#3a2a6a'],
                    ['#6fe36b', '#20304a'], ['#ff7a2e', '#1c1c28'], ['#4a5aff', '#ffffff']];
const GOLD_PAINT = ['#ffd24a', '#8a6410'];

const ITEMS = {
  zip:      { name: 'Zip Cell',       desc: 'Instant burst of speed.' },
  tri:      { name: 'Tri-Zip',        desc: 'Three Zip Cells, one per press.' },
  seeker:   { name: 'Seeker Orb',     desc: 'Follows the track and homes in on the racer ahead.' },
  goo:      { name: 'Goo Mine',       desc: 'Sticky trap dropped behind you.' },
  bubble:   { name: 'Bubble Ward',    desc: 'Absorbs one hit for 10 seconds.' },
  starfall: { name: 'Starfall Comet', desc: 'Streaks to the race leader and slams down with a shockwave.' },
};
const ITEM_KEYS = ['zip', 'tri', 'seeker', 'goo', 'bubble', 'starfall'];
/* Position-based odds: [place fraction (0 = leader, 1 = last), weights in ITEM_KEYS order]. Linearly blended. */
const ITEM_ODDS = [
  [0.0, [10, 0, 18, 45, 27, 0]],
  [0.5, [24, 16, 26, 14, 16, 4]],
  [1.0, [24, 34, 20, 4, 6, 12]],
];

const DIFFS = [
  { name: 'Easy',   speed: 0.85,  line: 0.35, drift: 0.25, items: 0.35, rbUp: 0.10, rbDown: 0.14, avoid: 0.2,  start: 0.1 },
  { name: 'Normal', speed: 0.93,  line: 0.7,  drift: 0.7,  items: 0.65, rbUp: 0.12, rbDown: 0.07, avoid: 0.55, start: 0.35 },
  { name: 'Hard',   speed: 0.995, line: 1.0,  drift: 1.0,  items: 1.0,  rbUp: 0.14, rbDown: 0.03, avoid: 0.9,  start: 0.7 },
];

/* Visual themes. Colours are plain hex; lighting in linear-ish 0..1 floats. */
const THEMES = {
  grass: {
    skyTop: '#2f7fe0', skyHor: '#d4efff', fog: '#cfe6f5', fogNear: 160, fogFar: 680, sunDir: [0.45, 0.72, 0.52],
    sunCol: '#fff4d8', light: [1.0, 0.96, 0.86], amb: [0.5, 0.56, 0.66], clouds: 0.65, stars: 0,
    ground: '#5aa83a', offroad: ['#6cbf45', '#64b53f'], road: ['#5b5f6b', '#575b66'], line: '#f2f2f2',
    rumble: ['#e8433a', '#f4f4f4'], wall: ['#f4f4f4', '#e8433a'], wallTop: '#c9c9c9', apron: '#5aa83a',
    emissiveEdges: 0, dust: [0.55, 0.42, 0.25], music: 'grass', far: 'hills',
  },
  desert: {
    skyTop: '#3a73c9', skyHor: '#ffe0b0', fog: '#f3d6ad', fogNear: 170, fogFar: 720, sunDir: [-0.5, 0.6, 0.62],
    sunCol: '#fff0c8', light: [1.08, 0.95, 0.78], amb: [0.58, 0.5, 0.48], clouds: 0.25, stars: 0,
    ground: '#e0b36e', offroad: ['#e9c17e', '#e2b873'], road: ['#7a6656', '#74614f'], line: '#fff2c9',
    rumble: ['#f0f0f0', '#2d7fe0'], wall: ['#c9824e', '#b77442'], wallTop: '#e6a874', apron: '#e0b36e',
    emissiveEdges: 0, dust: [0.9, 0.74, 0.48], music: 'desert', far: 'mesas',
  },
  neon: {
    skyTop: '#06021a', skyHor: '#4a1466', fog: '#2a0d45', fogNear: 120, fogFar: 560, sunDir: [0.3, 0.8, -0.5],
    sunCol: '#d8d0ff', light: [0.55, 0.5, 0.85], amb: [0.32, 0.28, 0.5], clouds: 0, stars: 1,
    ground: '#1a1630', offroad: ['#26213f', '#221d3a'], road: ['#2a2838', '#262434'], line: '#3de0ff',
    rumble: ['#ff2fa0', '#25e6ff'], wall: ['#1d1a33', '#221e3b'], wallTop: '#ff2fa0', apron: '#1a1630',
    emissiveEdges: 1, dust: [0.6, 0.3, 0.9], music: 'neon', far: 'skyline',
  },
};

/* Track layouts: closed centripetal Catmull-Rom splines through [x, z, height] control points. Validated offline
   for minimum curve radius (> 28) and minimum section separation (> 90) so barriers never fold or intersect. */
const TRACKS = [
  { id: 'clover', name: 'Clover Hills', theme: 'grass', scale: 0.85, seed: 11,
    blurb: 'Rolling green hills, a windmill or two and a cheering grandstand.',
    pts: [[0, 0, 0], [0, 150, 0], [60, 260, 3], [180, 290, 6], [280, 220, 8], [300, 100, 6], [230, 20, 3], [250, -80, 1],
          [330, -150, 3], [320, -260, 5], [200, -300, 3], [80, -270, 1], [0, -150, 0]] },
  { id: 'dunes', name: 'Sunscorch Dunes', theme: 'desert', scale: 0.8, seed: 23,
    blurb: 'Long, fast sweepers between red mesas. Mind the hairpin.',
    pts: [[0, -20, 0], [0, 80, 0], [40, 180, 2], [140, 210, 4], [220, 150, 5], [205, 55, 3], [130, 15, 1], [115, -55, 0],
          [180, -120, 0], [300, -110, 2], [380, -30, 4], [420, 80, 6], [500, 100, 5], [560, 20, 3], [540, -140, 1],
          [440, -240, 0], [260, -260, 0], [100, -230, 0], [0, -120, 0]] },
  { id: 'neon', name: 'Neon Arcadia', theme: 'neon', scale: 0.8, seed: 37,
    blurb: 'Midnight street circuit with a raised skyway section.',
    pts: [[0, -20, 0], [0, 100, 0], [30, 160, 0], [100, 180, 0], [200, 180, 2], [260, 150, 5], [280, 90, 8], [280, 20, 8],
          [310, -30, 7], [380, -50, 5], [440, -20, 3], [470, 40, 1], [520, 70, 0], [590, 40, 0], [600, -60, 0],
          [570, -180, 0], [500, -230, 0], [300, -240, 0], [100, -230, 0], [30, -190, 0], [0, -120, 0]] },
];
/* Grand Prix cups (4 races). The 4th race of each cup is a mirrored layout. */
const CUPS = [
  { id: 'sunburst', name: 'Sunburst Cup', races: [[0, false], [1, false], [2, false], [0, true]] },
  { id: 'mirror',   name: 'Mirror Cup',   races: [[0, true], [1, true], [2, true], [1, false]], unlock: 'mirror' },
];

/* =========================================================================
   2. UTILITIES — math, RNG, colour, 4x4 matrices
   ========================================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const dampAngle = (cur, target, rate, dt) => cur + wrapA(target - cur) * (1 - Math.exp(-rate * dt));
const sign = v => v < 0 ? -1 : 1;
function rng(seed) { // mulberry32
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const shade = (c, k) => [clamp(c[0] * k, 0, 1), clamp(c[1] * k, 0, 1), clamp(c[2] * k, 0, 1)];
const fmtTime = t => {
  if (!isFinite(t) || t <= 0) return '--:--.---';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const M4 = {
  create() { const o = new Float32Array(16); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  ident(o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  persp(o, fovy, aspect, near, far) {

   4. INPUT — keyboard, gamepad and touch merged into one control state
   ========================================================================= */
const SCHEMES = [
  { name: 'Standard', left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], gas: ['ArrowUp', 'KeyW'], brake: ['ArrowDown', 'KeyS'],
    drift: ['Space'], item: ['ShiftLeft', 'ShiftRight', 'KeyE'] },
  { name: 'Classic Z/X', left: ['ArrowLeft'], right: ['ArrowRight'], gas: ['KeyZ', 'ArrowUp'], brake: ['KeyX', 'ArrowDown'],
    drift: ['KeyC', 'Space'], item: ['KeyV', 'ShiftLeft', 'ShiftRight'] },

const Input = {
  keys: Object.create(null),
  touch: { steer: 0, gas: false, brake: false, drift: false, item: false, pause: false },
  pad: null,
  // unified game controls
  steer: 0, gas: 0, brake: 0, drift: false, item: false, pause: false,
  driftPressed: false, driftReleased: false, itemPressed: false, pausePressed: false,
  _prev: { drift: false, item: false, pause: false },
  // menu edges
  menu: { up: false, down: false, left: false, right: false, ok: false, back: false },
  _padPrev: [], _padRepeat: 0, _padDir: '',
  usingTouch: false,

  init() {
    addEventListener('keydown', e => {
      const gameKey = /^(Arrow|Space)/.test(e.code);
      if (gameKey) e.preventDefault();
      if (!e.repeat) this.keys[e.code] = true;
      this.usingTouch = false;
      Sound.unlock();
      if (!e.repeat) UI.onKey(e);
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { for (const k in this.keys) this.keys[k] = false; });
    addEventListener('pointerdown', () => Sound.unlock());
    addEventListener('touchstart', () => { this.usingTouch = true; Sound.unlock(); }, { passive: true });
    this.initTouch();
  },

  initTouch() {
    const pad = document.getElementById('t-steer'), knob = pad.querySelector('.knob');
    let steerId = null;
    const steerFrom = e => {
      const r = pad.getBoundingClientRect();
      const v = clamp(((e.clientX - r.left) / r.width - 0.5) * 2.6, -1, 1);
      this.touch.steer = Math.abs(v) < 0.08 ? 0 : v;
      knob.style.left = (50 + this.touch.steer * 38) + '%';
    };
    pad.addEventListener('pointerdown', e => { e.preventDefault(); steerId = e.pointerId; pad.setPointerCapture(e.pointerId); steerFrom(e); });
    pad.addEventListener('pointermove', e => { if (e.pointerId === steerId) steerFrom(e); });
    const endSteer = e => { if (e.pointerId !== steerId) return; steerId = null; this.touch.steer = 0; knob.style.left = '50%'; };
    pad.addEventListener('pointerup', endSteer);
    pad.addEventListener('pointercancel', endSteer);
    document.querySelectorAll('#touch .tbtn').forEach(b => {
      const k = b.dataset.t, ids = new Set();
      const set = () => { this.touch[k] = ids.size > 0; b.classList.toggle('on', ids.size > 0); };
      b.addEventListener('pointerdown', e => { e.preventDefault(); ids.add(e.pointerId); b.setPointerCapture(e.pointerId); set(); });
      const up = e => { ids.delete(e.pointerId); set(); };
      b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    });
  },

  any(codes) { for (let i = 0; i < codes.length; i++) if (this.keys[codes[i]]) return true; return false; },

  poll(dt) {
    const sc = SCHEMES[Store.settings.scheme] || SCHEMES[0];
    // --- keyboard (steering ramps for smoother digital input)
    const kl = this.any(sc.left), kr = this.any(sc.right);
    const target = (kr ? 1 : 0) - (kl ? 1 : 0);
    const rate = [5, 8, 13][Store.settings.sens] || 8;
    let kSteer = this._kSteer || 0;
    if (target === 0) kSteer = damp(kSteer, 0, rate * 1.6, dt);

    let drift = this.any(sc.drift), item = this.any(sc.item);

    const m = this.menu; m.up = m.down = m.left = m.right = m.ok = m.back = false;
    let pads = [];

    for (const p of pads) if (p && p.connected) { gp = p; break; }
    this.pad = gp;
    if (gp) {
      const b = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
      const bv = i => gp.buttons[i] ? gp.buttons[i].value : 0;
      let ax = gp.axes[0] || 0;
      ax = Math.abs(ax) < 0.15 ? 0 : sign(ax) * Math.pow((Math.abs(ax) - 0.15) / 0.85, 1.4);
      if (b(14)) ax = -1; if (b(15)) ax = 1;
      if (ax) steer = clamp(steer + ax, -1, 1);
      gas = Math.max(gas, b(0) ? 1 : 0, bv(7));
      brake = Math.max(brake, b(1) || b(2) ? 1 : 0, bv(6) > 0.3 ? bv(6) : 0);
      drift = drift || b(5);
      item = item || b(4) || b(3);
      pause = pause || b(9);
      // menu navigation edges with auto-repeat
      const ay = gp.axes[1] || 0, axr = gp.axes[0] || 0;
      const dir = b(12) || ay < -0.6 ? 'up' : b(13) || ay > 0.6 ? 'down' : b(14) || axr < -0.6 ? 'left' : b(15) || axr > 0.6 ? 'right' : '';

      if (b(1) && !pp[1]) m.back = true;

    }

    // --- touch
    const t = this.touch;
    if (t.steer) steer = clamp(steer + t.steer, -1, 1);
    if (t.gas) gas = 1; if (t.brake) brake = 1;
    drift = drift || t.drift; item = item || t.item; pause = pause || t.pause;
    if (Store.settings.autoAccel && !brake) gas = Math.max(gas, 1);

    this.steer = steer; this.gas = gas; this.brake = brake;
    this.driftPressed = drift && !this._prev.drift;
    this.driftReleased = !drift && this._prev.drift;
    this.itemPressed = item && !this._prev.item;
    this.pausePressed = pause && !this._prev.pause;
    this.drift = drift; this.item = item; this.pause = pause;
    this._prev.drift = drift; this._prev.item = item; this._prev.pause = pause;
  },

    for (let i = 0; i < this.n; i += 3) { const dx = this.X[i] - x, dz = this.Z[i] - z, d = dx * dx + dz * dz; if (d < best) best = d; }
    return Math.sqrt(best);

  /* ---------------- geometry ---------------- */
  buildMeshes() {
    const th = this.theme, n = this.n, mb = new MeshBuilder(), E = th.emissiveEdges;
    const C = k => hex(k);
    const roadA = C(th.road[0]), roadB = C(th.road[1]), lineC = C(th.line), rum = th.rumble.map(C), off = th.offroad.map(C);
    const wall = th.wall.map(C), wallTop = C(th.wallTop), apron = C(th.apron);
    const S = (i, o, dy = 0) => [this.X[i] - this.TZ[i] * o, this.Y[i] + dy, this.Z[i] + this.TX[i] * o];
    const Sg = (i, o) => [this.X[i] - this.TZ[i] * o, GROUND_Y, this.Z[i] + this.TX[i] * o];
    const strip = (i, j, o0, o1, col, e = 0, dy = 0) => mb.quadW(S(i, o0, dy), S(i, o1, dy), S(j, o1, dy), S(j, o0, dy), col, e, null);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, rd = (i >> 2) & 1 ? roadB : roadA;

      const dash = ((i / 3) | 0) & 1;
      strip(i, j, -0.3, 0.3, dash ? lineC : rd, dash ? E * 0.9 : 0);
      const rc = rum[(i >> 1) & 1];

      const oc = off[((i / 6) | 0) & 1];
      strip(i, j, ROAD_HALF + RUMBLE_W, WALL_OFF, oc); strip(i, j, -WALL_OFF, -ROAD_HALF - RUMBLE_W, oc);
      const wc = wall[((i / 3) | 0) & 1];
      for (const sd of [-1, 1]) {
        const a = WALL_OFF * sd, b = (WALL_OFF + WALL_T) * sd;
        mb.quadW(S(i, a), S(j, a), S(j, a, WALL_H), S(i, a, WALL_H), wc, 0, S(i, a + sd * 5));          // inner face
        mb.quadW(S(i, a, WALL_H), S(j, a, WALL_H), S(j, b, WALL_H), S(i, b, WALL_H), wallTop, E, null); // top
        mb.quadW(S(i, b), S(j, b), S(j, b, WALL_H), S(i, b, WALL_H), wc, 0, S(i, a));                  // outer face
        mb.quadW(S(i, b), S(j, b), Sg(j, APRON * sd), Sg(i, APRON * sd), apron, 0, null);              // embankment

    }
    // chequered start line
    for (let row = 0; row < 2; row++) for (let c = 0; c < 12; c++) {
      const o0 = -ROAD_HALF + c * (2 * ROAD_HALF / 12), o1 = o0 + 2 * ROAD_HALF / 12, a0 = -1.5 + row * 1.5, a1 = a0 + 1.5;
      const P = (o, a) => [this.X[0] - this.TZ[0] * o + this.TX[0] * a, this.Y[0] + 0.03, this.Z[0] + this.TX[0] * o + this.TZ[0] * a];
      mb.quadW(P(o0, a0), P(o1, a0), P(o1, a1), P(o0, a1), (row + c) & 1 ? [0.08, 0.08, 0.1] : [0.96, 0.96, 0.96], 0, null);

    for (let s = 0; s < NUM_RACERS; s++) {

    // start gate
    {
      mb.setXf(this.frame(0, 0, -0.6));
      const gw = WALL_OFF + 1.6, gold = C('#ffcc33'), pink = C('#ff3d7f');
      for (const sd of [-1, 1]) { mb.box(sd * gw, 4.5, 0, 1.4, 9, 1.4, C('#3a3550')); mb.box(sd * gw, 9.2, 0, 1.8, 0.5, 1.8, gold, E); }
      mb.box(0, 8.4, 0, gw * 2 + 1.4, 2.2, 0.8, C('#201446'), 0);
      for (let c = 0; c < 24; c++) for (let r = 0; r < 2; r++)

      mb.box(0, 9.75, 0, gw * 2 + 1.4, 0.35, 0.9, pink, 0.7 * E + 0.2);

    this.scenery(mb);

  gridSlot(s) {
    const d = this.len - 7 - s * 5.2, lat = (s % 2 ? 4.2 : -4.2);
    const p = this.sample(d, lat); return { x: p.x, y: p.y, z: p.z, h: p.h, dist: d };
  }

  /* place props randomly around the track with a clearance test */
  scatter(r, count, minClear, maxClear, fn) {
    const b = this.bounds, pad = maxClear + 40;
    let placed = 0;
    for (let a = 0; a < count * 6 && placed < count; a++) {
      const x = lerp(b.x0 - pad, b.x1 + pad, r()), z = lerp(b.z0 - pad, b.z1 + pad, r());
      const c = this.clearance(x, z);
      if (c < minClear || c > maxClear) continue;
      fn(x, z, c); placed++;
    }
  }

  scenery(mb) {
    const th = this.def.theme, r = rng(this.def.seed * 977 + (this.mirror ? 5 : 0)), C = hex;
    const G = GROUND_Y;
    if (th === 'grass') {
      const greens = ['#3f9a3a', '#2f8a3c', '#4fae46', '#2a7a34'].map(C), trunk = C('#7a5232');
      this.scatter(r, 170, 35, 210, (x, z) => {
        const s = 0.8 + r() * 0.7;
        mb.setXf(xfAt(x, G, z, r() * TAU, 0, 0, s));
        mb.box(0, 1.5, 0, 0.8, 3, 0.8, trunk);
        const g = greens[(r() * 4) | 0];
        if (r() < 0.55) { mb.cyl(0, 2.6, 0, 3.2, 0, 4.2, 7, g); mb.cyl(0, 4.8, 0, 2.4, 0, 3.6, 7, shade(g, 1.1)); }
        else mb.sphere(0, 4.6, 0, 2.8, 7, 5, g, 0, 0.9);

      });

      this.scatter(r, 40, 33, 200, (x, z) => { mb.setXf(xfAt(x, G + 0.5, z, r() * TAU, r() * 0.4, r() * 0.4, 1 + r() * 2)); mb.box(0, 0, 0, 1.6, 1.2, 1.4, C('#8d9096')); mb.setXf(null); });
      const fl = ['#ff7ab8', '#ffe14a', '#ffffff', '#b28cff'].map(C);
      this.scatter(r, 260, 31, 70, (x, z) => mb.box(x, G + 0.2, z, 0.35, 0.4, 0.35, fl[(r() * 4) | 0], 0.15));
      // windmills (blades are a separate animated mesh)
      let wm = 0;
      this.scatter(r, 3, 60, 160, (x, z) => {
        const yaw = Math.atan2(this.bounds.cx - x, this.bounds.cz - z);
        mb.setXf(xfAt(x, G, z, yaw)); mb.cyl(0, 0, 0, 3.2, 1.8, 16, 8, C('#f2efe6')); mb.box(0, 17, 0, 2.6, 2.6, 3.6, C('#c0463c'));
        mb.setXf(null);
        this.spinners.push({ x: x + Math.sin(yaw) * 2.1, y: G + 17, z: z + Math.cos(yaw) * 2.1, yaw, speed: 0.8 + wm++ * 0.3 });
      });
      // grandstand beside the start straight
      mb.setXf(this.frame(0, WALL_OFF + 4, 0));
      const crowd = ['#ff3d7f', '#ffcc33', '#3de0ff', '#ffffff', '#6dff8b', '#ff8a2e'].map(C);
      for (let s = 0; s < 5; s++) {
        mb.box(4 + s * 2.2, 0.6 + s * 1.2, 0, 2.2, 1.2 + s * 2.4, 46, C('#8a8f9e'));
        for (let k = 0; k < 22; k++) mb.box(4 + s * 2.2, 1.6 + s * 2.4, -21 + k * 2, 0.7, 0.9 + r() * 0.4, 0.7, crowd[(r() * 6) | 0]);
      }
      mb.box(9, 14, 0, 12, 0.5, 48, C('#c0463c')); for (const zz of [-23, 23]) mb.box(14.5, 7, zz, 0.5, 14, 0.5, C('#dddddd'));
      mb.setXf(null);
      // flags on poles along the barrier
      for (let i = 20; i < this.n; i += 45) {
        const sd = (i / 45) & 1 ? 1 : -1;
        mb.setXf(this.frame(i, sd * (WALL_OFF + 2.5)));
        mb.box(0, 3, 0, 0.25, 6, 0.25, C('#eeeeee')); mb.box(0, 5.2, 0.9, 0.08, 1.2, 1.8, C(['#ff3d7f', '#ffcc33', '#3de0ff'][i % 3]), 0.2);
        mb.setXf(null);
      }
    } else if (th === 'desert') {
      const cactus = C('#4f9a46');
      this.scatter(r, 120, 34, 210, (x, z) => {
        const s = 0.8 + r() * 0.6;
        mb.setXf(xfAt(x, G, z, r() * TAU, 0, 0, s));
        const h = 5 + r() * 3; mb.cyl(0, 0, 0, 0.7, 0.6, h, 6, cactus);
        if (r() < 0.8) { mb.box(0.9, h * 0.45, 0, 1.4, 0.7, 0.7, cactus); mb.cyl(1.5, h * 0.45, 0, 0.45, 0.4, 2.2, 6, cactus); }
        if (r() < 0.6) { mb.box(-0.9, h * 0.6, 0, 1.4, 0.6, 0.6, cactus); mb.cyl(-1.5, h * 0.6, 0, 0.4, 0.35, 1.6, 6, cactus); }
        mb.setXf(null);
      });
      const rocks = ['#b8673a', '#a85a30', '#c97b45'].map(C);
      this.scatter(r, 70, 33, 220, (x, z) => { mb.setXf(xfAt(x, G, z, r() * TAU, r() * 0.3, r() * 0.3, 1 + r() * 2.5)); mb.box(0, 0.6, 0, 2, 1.6, 1.7, rocks[(r() * 3) | 0]); mb.setXf(null); });
      this.scatter(r, 26, 50, 240, (x, z) => mb.sphere(x, G - 1, z, 14 + r() * 14, 9, 5, C('#e8c287'), 0, 0.28));
      const bands = ['#b5532c', '#d0743f', '#9c4526'].map(C);
      this.scatter(r, 14, 75, 260, (x, z) => {
        let y = G, rad = 18 + r() * 22; const layers = 2 + ((r() * 2) | 0);
        for (let k = 0; k < layers; k++) { const h = 8 + r() * 12; mb.cyl(x, y, z, rad, rad * 0.88, h, 7, bands[k % 3], 0, C('#e09a5a')); y += h; rad *= 0.88; }
      });
      // oasis with palms
      this.scatter(r, 2, 45, 120, (x, z) => {
        mb.disc(x, G + 0.04, z, 9, 14, C('#2fb5c9'), 0.25);
        for (let k = 0; k < 4; k++) {
          const a = k / 4 * TAU + r(), px = x + Math.cos(a) * 11, pz = z + Math.sin(a) * 11, lean = 0.2 + r() * 0.2;
          mb.setXf(xfAt(px, G, pz, a, lean, 0)); mb.cyl(0, 0, 0, 0.55, 0.4, 9, 6, C('#8a6a44'));
          for (let l = 0; l < 6; l++) { mb.setXf(xfAt(px, G, pz, a, lean, 0)); const m2 = xfAt(0, 9, 0, l / 6 * TAU, 0.5, 0); const m3 = new Float32Array(16); M4.mul(m3, mb.xf, m2); mb.setXf(m3); mb.box(0, 0, 2, 0.9, 0.12, 4, C('#3f9a3a')); }
          mb.setXf(null);
        }
      });
      // pyramids on the horizon-side
      this.scatter(r, 2, 160, 300, (x, z) => { mb.setXf(xfAt(x, G, z, r())); mb.cyl(0, 0, 0, 40, 0, 38, 4, C('#e2b46d')); mb.setXf(null); });
      for (let i = 10; i < this.n; i += 30) {
        const sd = (i / 30) & 1 ? 1 : -1;
        mb.setXf(this.frame(i, sd * (WALL_OFF + 2.2)));
        mb.box(0, 1.6, 0, 0.35, 3.2, 0.35, C('#6b4a2a')); mb.box(0, 3.4, 0, 0.6, 0.5, 0.6, C('#ff9a2e'), 0.9);
        mb.setXf(null);
      }
    } else {
      // NEON: city blocks with window bands, lamps, billboards, ground grid
      const bodies = ['#1d1a33', '#251f45', '#161428', '#2b2140'].map(C);
      const glow = ['#ffd27a', '#3de0ff', '#ff3d9a', '#b28cff', '#6dff8b'].map(C);
      this.scatter(r, 150, 44, 260, (x, z, c) => {
        const w = 12 + r() * 16, d = 12 + r() * 16, fp = Math.hypot(w, d) / 2;
        if (c - fp < 34) return;
        const h = 22 + r() * (c > 120 ? 120 : 70), yaw = r() * TAU, col = bodies[(r() * 4) | 0], g = glow[(r() * 5) | 0];
        mb.setXf(xfAt(x, G, z, yaw));
        mb.box(0, h / 2, 0, w, h, d, col);
        const bandCol = r() < 0.6 ? glow[0] : g, bright = 0.4 + r() * 0.5;
        for (let y = 4; y < h - 2; y += 4.5) {
          if (r() < 0.18) continue;
          const bc = shade(bandCol, 0.55 + r() * 0.5);
          mb.quadW(mb.P(-w / 2 + 1, y, d / 2 + 0.06), mb.P(w / 2 - 1, y, d / 2 + 0.06), mb.P(w / 2 - 1, y + 1.3, d / 2 + 0.06), mb.P(-w / 2 + 1, y + 1.3, d / 2 + 0.06), bc, bright, mb.P(0, y, 0));
          mb.quadW(mb.P(-w / 2 + 1, y, -d / 2 - 0.06), mb.P(w / 2 - 1, y, -d / 2 - 0.06), mb.P(w / 2 - 1, y + 1.3, -d / 2 - 0.06), mb.P(-w / 2 + 1, y + 1.3, -d / 2 - 0.06), bc, bright, mb.P(0, y, 0));
          mb.quadW(mb.P(w / 2 + 0.06, y, -d / 2 + 1), mb.P(w / 2 + 0.06, y, d / 2 - 1), mb.P(w / 2 + 0.06, y + 1.3, d / 2 - 1), mb.P(w / 2 + 0.06, y + 1.3, -d / 2 + 1), bc, bright, mb.P(0, y, 0));
          mb.quadW(mb.P(-w / 2 - 0.06, y, -d / 2 + 1), mb.P(-w / 2 - 0.06, y, d / 2 - 1), mb.P(-w / 2 - 0.06, y + 1.3, d / 2 - 1), mb.P(-w / 2 - 0.06, y + 1.3, -d / 2 + 1), bc, bright, mb.P(0, y, 0));
        }
        mb.box(0, h + 0.3, d / 2, w, 0.6, 0.6, g, 1); mb.box(0, h + 0.3, -d / 2, w, 0.6, 0.6, g, 1);
        mb.box(w / 2, h + 0.3, 0, 0.6, 0.6, d, g, 1); mb.box(-w / 2, h + 0.3, 0, 0.6, 0.6, d, g, 1);
        if (r() < 0.35) mb.box(0, h + 3, 0, w * 0.5, 4, 0.8, glow[(r() * 5) | 0], 1);
        if (r() < 0.3) { mb.box(0, h + 4, 0, 0.3, 8, 0.3, C('#888899')); mb.box(0, h + 8.2, 0, 0.7, 0.7, 0.7, C('#ff2a2a'), 1); }
        mb.setXf(null);
      });
      for (let i = 0; i < this.n; i += 14) {
        for (const sd of [-1, 1]) {
          mb.setXf(this.frame(i + (sd > 0 ? 7 : 0), sd * (WALL_OFF + 2)));
          mb.box(0, 3.5, 0, 0.35, 7, 0.35, C('#3a3550')); mb.box(-sd * 1.4, 7, 0, 3, 0.3, 0.3, C('#3a3550'));
          mb.box(-sd * 2.8, 6.75, 0, 1.0, 0.3, 0.6, C('#fff0c0'), 1);

      }
      for (let i = 40; i < this.n; i += 110) {

        mb.box(0, 5, 0, 0.6, 10, 0.6, C('#2a2540'));
        mb.box(0, 12, 0, 1, 6, 14, C('#120f22'));
        const a = glow[i % 5], bb = glow[(i + 2) % 5];
        mb.box(-sd * 0.55, 13.2, -3, 0.1, 2.6, 6, a, 1); mb.box(-sd * 0.55, 13.2, 3.5, 0.1, 2.6, 5, bb, 1);
        mb.box(-sd * 0.55, 10.4, 0, 0.1, 1.2, 12, glow[(i + 1) % 5], 1);
        mb.setXf(null);
      }

      const b = this.bounds, R = b.r + 700, gcol = C('#ff2fa0');
      for (let k = -R; k <= R; k += 40) {
        mb.quadW([b.cx + k - 0.25, G + 0.06, b.cz - R], [b.cx + k + 0.25, G + 0.06, b.cz - R], [b.cx + k + 0.25, G + 0.06, b.cz + R], [b.cx + k - 0.25, G + 0.06, b.cz + R], gcol, 0.55, null);
        mb.quadW([b.cx - R, G + 0.06, b.cz + k - 0.25], [b.cx + R, G + 0.06, b.cz + k - 0.25], [b.cx + R, G + 0.06, b.cz + k + 0.25], [b.cx - R, G + 0.06, b.cz + k + 0.25], gcol, 0.55, null);
      }
    }
  }

  farRing(mb) {
    const th = this.theme, b = this.bounds, R = b.r + 520, r = rng(this.def.seed + 99), G = GROUND_Y - 1, C = hex;
    if (th.far === 'hills') {
      for (let k = 0; k < 40; k++) {

        const a = r() * TAU, rr = R + 200 + r() * 150, x = b.cx + Math.cos(a) * rr, z = b.cz + Math.sin(a) * rr, h = 120 + r() * 120, w = 90 + r() * 60;
        mb.cyl(x, G, z, w, 0, h, 5, C('#7b8fb3'));
        mb.setXf(xfAt(x, G, z)); mb.cyl(0, h * 0.72, 0, w * 0.28, 0, h * 0.28, 5, C('#f4f8ff'), 0.2); mb.setXf(null);
      }
    } else if (th.far === 'mesas') {
      for (let k = 0; k < 34; k++) {
        const a = k / 34 * TAU + r() * 0.12, rr = R + r() * 200, x = b.cx + Math.cos(a) * rr, z = b.cz + Math.sin(a) * rr;
        const w = 50 + r() * 80, h = 50 + r() * 90;
        mb.cyl(x, G, z, w, w * 0.8, h, 6, shade(C('#b0532e'), 0.85 + r() * 0.3), 0, C('#d27a48'));
      }
    } else {
      for (let k = 0; k < 90; k++) {
        const a = k / 90 * TAU, rr = R + r() * 160, x = b.cx + Math.cos(a) * rr, z = b.cz + Math.sin(a) * rr;
        const w = 30 + r() * 50, h = 60 + r() * 220, g = C(['#ff2fa0', '#25e6ff', '#b28cff', '#ffd27a'][(r() * 4) | 0]);
        mb.setXf(xfAt(x, G, z, -a));
        mb.box(0, h / 2, 0, w, h, w, C('#1a1236'));
        mb.box(0, h, 0, w + 0.5, 1.5, w + 0.5, g, 1);
        for (let y = 10; y < h; y += 14) if (r() < 0.5) mb.box(0, y, 0, w + 0.3, 1.6, w + 0.3, shade(C('#ffd27a'), 0.4 + r() * 0.4), 0.8);
        mb.setXf(null);
      }
    }
  }
}

/* =========================================================================
   8. MODELS — karts, drivers, items (procedural low-poly)
   ========================================================================= */
function buildKart(mb, ch, paint) {
  const body = hex(paint ? paint[0] : ch.body), trim = hex(paint ? paint[1] : ch.trim), skin = hex(ch.skin);
  const dark = hex('#1d1d24'), metal = hex('#9aa0ad'), tyre = hex('#18181d');
  mb.box(0, 0.45, 0, 1.7, 0.28, 2.6, trim);
  mb.box(0, 0.78, 0.15, 1.35, 0.5, 1.9, body);
  mb.box(0, 0.62, 1.25, 1.15, 0.36, 0.6, body);
  mb.box(0, 0.42, 1.58, 1.95, 0.24, 0.24, trim);
  for (const s of [-1, 1]) {
    mb.box(s * 0.86, 0.62, 0.05, 0.36, 0.42, 1.25, shade(body, 0.82));
    mb.box(s * 0.38, 0.64, 1.57, 0.32, 0.16, 0.06, [1, 0.97, 0.8], 1);   // headlights
    mb.wheel(s * 0.98, 0.42, 0.98, 0.42, 0.42, 8, tyre, trim);
    mb.wheel(s * 0.98, 0.5, -0.86, 0.5, 0.52, 8, tyre, trim);
    mb.box(s * 0.62, 1.16, -1.28, 0.1, 0.4, 0.1, dark);

/* =========================================================================
   10. PARTICLES — fixed-size pool, zero allocation per frame
   ========================================================================= */
const PKEYS = ['x', 'y', 'z', 'vx', 'vy', 'vz', 'life', 'maxLife', 'size', 'grow', 'r', 'g', 'b', 'a', 'grav', 'drag', 'add'];
class Particles {
  constructor(max) {
    this.max = max; this.n = 0;
    const f = () => new Float32Array(max);
    this.x = f(); this.y = f(); this.z = f(); this.vx = f(); this.vy = f(); this.vz = f();
    this.life = f(); this.maxLife = f(); this.size = f(); this.grow = f(); this.r = f(); this.g = f(); this.b = f(); this.a = f();
    this.grav = f(); this.drag = f(); this.add = new Uint8Array(max);
    this.gpu = new Float32Array(max * 8); this.nNormal = 0;
  }
  clear() { this.n = 0; }
  spawn(x, y, z, vx, vy, vz, life, size, rgb, a, additive, grav = 0, drag = 1, grow = 0) {
    let i = this.n;
    if (i >= this.max) { i = (Math.random() * this.max) | 0; } else this.n++;
    this.x[i] = x; this.y[i] = y; this.z[i] = z; this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
    this.life[i] = life; this.maxLife[i] = life; this.size[i] = size; this.grow[i] = grow;
    this.r[i] = rgb[0]; this.g[i] = rgb[1]; this.b[i] = rgb[2]; this.a[i] = a; this.add[i] = additive ? 1 : 0;
    this.grav[i] = grav; this.drag[i] = drag;
  }
  update(dt) {
    let i = 0;

      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.copy(this.n - 1, i); this.n--; continue; }
      const dr = Math.exp(-this.drag[i] * dt);
      this.vx[i] *= dr; this.vz[i] *= dr; this.vy[i] = this.vy[i] * dr - this.grav[i] * dt;
      this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt; this.z[i] += this.vz[i] * dt;
      this.size[i] += this.grow[i] * dt;

  }
  copy(s, d) {
    for (let k = 0; k < PKEYS.length; k++) { const a = this[PKEYS[k]]; a[d] = a[s]; }

  fill() {

        const t = this.life[i] / this.maxLife[i];
        g[o++] = this.x[i]; g[o++] = this.y[i]; g[o++] = this.z[i];
        g[o++] = this.r[i]; g[o++] = this.g[i]; g[o++] = this.b[i]; g[o++] = this.a[i] * Math.min(1, t * 2.5);
        g[o++] = this.size[i]; cnt++;
      }
      if (pass === 0) this.nNormal = cnt;
    }
    return cnt;
  }
}

/* =========================================================================
   11. KARTS + PHYSICS — arcade model: velocity vector in world space, heading
   decoupled from velocity, lateral grip (high) vs drift grip (low), mini-turbo.
   ========================================================================= */
let FX = null;               // particle pool, sized by graphics quality
let FXQ = 1;                 // particle spawn multiplier
const camDist = (x, z) => { const c = Renderer.cam; return Math.hypot(c.x - x, c.z - z); };
const vol3d = (x, z) => clamp(1.15 - camDist(x, z) / 90, 0, 1);

class Kart {
  constructor(o, idx) {
    this.idx = idx; this.ci = o.ci; this.ch = CHARACTERS[o.ci]; this.paintKey = o.paint || 'base';
    this.name = o.name || this.ch.name; this.isPlayer = !!o.isPlayer; this.ai = !o.isPlayer; this.rosterId = o.id;
    const s = this.ch.stats;
    this.maxSpeed = 33 + s.speed * 1.45;
    this.accel = 14 + s.accel * 4.3;
    this.turn = 1.5 + s.handling * 0.13;
    this.grip = 6.5 + s.handling * 0.9;
    this.driftGrip = 1.6 + s.handling * 0.22;
    this.mass = 0.8 + s.weight * 0.22;
    this.color = hex(o.paint && o.paint !== 'base' ? (o.paint === 'gold' ? GOLD_PAINT[0] : ALT_PAINTS[+o.paint][0]) : this.ch.body);
    this.ctl = { steer: 0, gas: 0, brake: 0, drift: false, driftPressed: false, item: false };
    this.loc = { seg: 0, t: 0, lat: 0, dist: 0, y: 0, rx: 1, rz: 0, h: 0, slope: 0 };
    this.aiState = { wander: 0, wanderT: 0, wanderTarget: 0, avoid: 0, itemT: 1, driftCool: 0, stuck: 0,
                     personal: 0.985 + Math.random() * 0.03, drifter: false, tmp: {}, prevDrift: false };
    this.lapTimes = [];
    this.reset();
  }
  reset() {
    this.x = 0; this.z = 0; this.y = 0; this.h = 0; this.vx = 0; this.vz = 0; this.speed = 0; this.yawRate = 0;
    this.pitch = 0; this.roll = 0; this.seg = -1;
    this.drifting = false; this.driftDir = 0; this.driftCharge = 0; this.driftLevel = 0; this.hopT = 0; this.hopPending = false;
    this.boostT = 0; this.boostPow = 0; this.spinT = 0; this.spinVis = 0; this.stallT = 0; this.shieldT = 0; this.tumble = 0;
    this.item = null; this.itemCount = 0; this.rollT = 0; this.rollItem = null; this.flash = 0;
    this.offroad = false; this.lap = 0; this.nextCP = 0; this.prevDist = 0; this.progress = 0; this.place = 1;
    this.finished = false; this.finishTime = 0; this.lapStart = 0; this.lapTimes = []; this.bestLap = 0;
    this.revStart = -1; this.speedMul = 1; this.wrongWayT = 0; this.wallCool = 0;
  }
  get fx() { return Math.sin(this.h); }
  get fz() { return Math.cos(this.h); }
}

function boostKart(k, dur, pow) { k.boostT = Math.max(k.boostT, dur); k.boostPow = Math.max(k.boostPow, pow); }

function endDrift(k, reward) {
  if (reward && k.driftLevel > 0) {
    boostKart(k, DRIFT_BOOST[k.driftLevel], 0.75 + k.driftLevel * 0.1);
    if (k.isPlayer) Sound.play('boost', 0.7);
  }
  k.drifting = false; k.driftCharge = 0; k.driftLevel = 0; k.driftDir = 0;
}

/* drift button handling — runs once per frame, before physics */
function driftControl(k, race) {
  const c = k.ctl;
  if (race.phase !== 'racing') { c.driftPressed = false; return; }
  if (c.driftPressed && k.spinT <= 0 && k.hopT <= 0) {
    k.hopT = 0.3; k.hopPending = true;
    if (k.isPlayer) Sound.play('hop', 0.8);
  }
  if (k.hopPending) {
    if (!c.drift) k.hopPending = false;
    else if (Math.abs(c.steer) > 0.25 && k.speed > 12) {
      k.drifting = true; k.driftDir = sign(c.steer); k.driftCharge = 0; k.driftLevel = 0; k.hopPending = false;
    } else if (k.hopT <= 0) k.hopPending = false;
  }
  if (k.drifting && (!c.drift || k.speed < 9 || k.spinT > 0)) endDrift(k, !c.drift && k.spinT <= 0);
  c.driftPressed = false;

function kartPhysics(k, dt, race) {
  const tr = race.track, c = k.ctl, racing = race.phase === 'racing';
  let steer = c.steer, gas = c.gas, brake = c.brake;
  if (!racing || k.spinT > 0 || k.stallT > 0) { gas = 0; brake = 0; if (!racing || k.spinT > 0) steer = 0; }
  let fx = Math.sin(k.h), fz = Math.cos(k.h);
  let vf = k.vx * fx + k.vz * fz;
  const sp = Math.abs(vf);
  // --- yaw (positive steer = right = heading decreases)
  let yaw;
  if (k.drifting) {
    const s = clamp(steer * k.driftDir, -1, 1);
    yaw = k.driftDir * k.turn * (0.58 + 0.3 * s) * clamp(sp / 14, 0.3, 1);   // ~30u radius neutral, ~20u tight, ~60u wide
    k.driftCharge += dt * (0.7 + 0.8 * Math.max(0, s)) * (k.offroad ? 0.5 : 1);
    const lv = k.driftCharge >= DRIFT_LEVELS[2] ? 3 : k.driftCharge >= DRIFT_LEVELS[1] ? 2 : k.driftCharge >= DRIFT_LEVELS[0] ? 1 : 0;
    if (lv > k.driftLevel) { k.driftLevel = lv; if (k.isPlayer) Sound.play('mini', 0.8, lv); }
  } else {
    const low = clamp(sp / 7, 0, 1), high = 1 - 0.22 * clamp(sp / k.maxSpeed, 0, 1.3);

  const rx = -fz, rz = fx;
  vf = k.vx * fx + k.vz * fz;
  let vl = k.vx * rx + k.vz * rz;
  // --- longitudinal
  let top = k.maxSpeed * k.speedMul;
  if (k.offroad && k.boostT <= 0) top *= OFFROAD_MUL;
  if (k.boostT > 0) top *= 1 + 0.3 * k.boostPow;
  if (k.spinT > 0) top *= 0.35;
  if (gas > 0) {
    if (vf < -0.5) vf += BRAKE * dt * gas;
    else if (vf < top) vf = Math.min(top, vf + k.accel * (1 - 0.6 * (vf / top) * (vf / top)) * dt * gas);
  }
  if (brake > 0) {
    if (vf > 0.5) vf -= BRAKE * dt * brake;
    else if (vf > -REV_MAX) vf = Math.max(-REV_MAX, vf - k.accel * 0.5 * dt * brake);
  }
  if (k.boostT > 0 && k.spinT <= 0) vf = Math.min(top, vf + 60 * dt);

  if (gas <= 0 && brake <= 0) { const dec = (k.offroad ? 14 : 5) * dt; vf = Math.abs(vf) <= dec ? 0 : vf - sign(vf) * dec; }

  else vl *= Math.exp(-(k.spinT > 0 ? 2 : k.grip) * dt);

  k.x += k.vx * dt; k.z += k.vz * dt;
  // --- track + barriers
  const L = tr.locate(k.x, k.z, k.seg, k.loc);

  const lim = WALL_OFF - KART_R;

  k.y = L.y + hopY + Math.sin(k.tumble * Math.PI) * 2.2;

/* lap / checkpoint bookkeeping (checkpoint 0 = finish line). Shortcuts cannot skip checkpoints. */
function updateProgress(k, race) {
  const tr = race.track, Ln = tr.len, d = k.loc.dist, prev = k.prevDist;
  if (prev > Ln * 0.75 && d < Ln * 0.25) {
    if (k.nextCP === 0) race.onLine(k);
  } else if (prev < Ln * 0.25 && d > Ln * 0.75) {
    if (k.nextCP === 1) { k.lap--; k.nextCP = 0; }
  } else {
    if (k.nextCP > 0) { const cp = tr.cps[k.nextCP]; if (prev < cp && d >= cp) k.nextCP = (k.nextCP + 1) % NUM_CP; }
    const pi = (k.nextCP - 1 + NUM_CP) % NUM_CP;
    if (pi > 0 && k.lap > 0 && prev >= tr.cps[pi] && d < tr.cps[pi]) k.nextCP = pi;
  }
  k.prevDist = d;
  k.progress = (k.lap - 1) * Ln + d;

/* =========================================================================
   12. ITEMS — roulette, use, projectiles, hazards, shields
   ========================================================================= */
function rollItem(place, n, race) {
  const p = n > 1 ? (place - 1) / (n - 1) : 0.5;
  let a = ITEM_ODDS[0], b = ITEM_ODDS[1];
  if (p > 0.5) { a = ITEM_ODDS[1]; b = ITEM_ODDS[2]; }
  const t = (p - a[0]) / (b[0] - a[0]);
  const w = a[1].map((v, i) => lerp(v, b[1][i], t));
  if (race.projectiles.some(q => q.type === 'starfall')) w[5] = 0;     // only one comet in the air at once
  const total = w.reduce((s, v) => s + v, 0);
  let r = Math.random() * total;
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return ITEM_KEYS[i]; }
  return 'zip';
}

function useItem(k, race) {
  if (!k.item || k.rollT > 0 || race.phase !== 'racing') return;
  const it = k.item, fx = k.fx, fz = k.fz, v = k.isPlayer ? 1 : vol3d(k.x, k.z);
  switch (it) {
    case 'zip': case 'tri':
      boostKart(k, 1.25, 1.2); Sound.play('boost', v);
      for (let i = 0; i < 16 * FXQ; i++) FX.spawn(k.x - fx * 1.5, k.y + 0.8, k.z - fz * 1.5, -fx * 10 + (Math.random() - 0.5) * 6, Math.random() * 3, -fz * 10 + (Math.random() - 0.5) * 6, 0.35, 0.9, [1, 0.6, 0.15], 1, true);
      break;
    case 'seeker': {
      const target = race.karts.find(o => o.place === k.place - 1 && !o.finished) || null;
      race.projectiles.push({ type: 'seeker', owner: k, target, x: k.x + fx * 2.5, y: k.y + 0.9, z: k.z + fz * 2.5, h: k.h,
        dist: k.loc.dist + 2.5, lat: k.loc.lat, age: 0, life: 7, speed: Math.max(62, Math.abs(k.speed) + 24), homing: false, seg: k.seg, loc: {} });
      Sound.play('fire', v);
      break;
    }
    case 'goo': {
      const x = k.x - fx * 2.8, z = k.z - fz * 2.8, l = race.track.locate(x, z, k.seg, {});
      race.hazards.push({ x, z, y: l.y + 0.25, dist: l.dist, lat: l.lat, owner: k, arm: 0.45, life: 80, wob: Math.random() * TAU });
      if (race.hazards.length > 24) race.hazards.shift();
      Sound.play('drop', v);
      break;
    }
    case 'bubble':
      k.shieldT = 10; Sound.play('shield', v);
      break;
    case 'starfall': {
      race.projectiles.push({ type: 'starfall', owner: k, target: null, x: k.x, y: k.y + 3, z: k.z, dist: k.loc.dist, lat: k.loc.lat,
        age: 0, phase: 'fly', t: 0, speed: 92, seg: k.seg });
      Sound.play('fire', v); Sound.play('warn', 0.6);
      race.banner('STARFALL INCOMING!', '#c86bff', 1.6);
      break;
    }

}

/* returns true if the kart actually got hit (shield absorbs) */
function hitKart(k, kind, race) {
  if (k.shieldT > 0) {
    k.shieldT = 0;
    for (let i = 0; i < 24 * FXQ; i++) { const a = Math.random() * TAU, e = Math.random() * 2 - 1; FX.spawn(k.x, k.y + 1, k.z, Math.cos(a) * 9, e * 6, Math.sin(a) * 9, 0.4, 0.6, [0.5, 0.95, 1], 1, true); }
    Sound.play('pop', k.isPlayer ? 1 : vol3d(k.x, k.z));
    return false;
  }
  k.spinT = kind === 'starfall' ? 2.1 : kind === 'goo' ? 1.05 : 1.35;
  if (kind === 'starfall') k.tumble = 1;
  k.vx *= 0.25; k.vz *= 0.25; k.boostT = 0; k.boostPow = 0; k.flash = 0.4;
  if (k.drifting) endDrift(k, false);
  k.hopPending = false;
  for (let i = 0; i < 22 * FXQ; i++) {
    const a = Math.random() * TAU;
    FX.spawn(k.x, k.y + 1.2, k.z, Math.cos(a) * 7, 3 + Math.random() * 6, Math.sin(a) * 7, 0.6, 0.55, Math.random() < 0.5 ? [1, 0.95, 0.4] : [1, 1, 1], 1, true, 14);
  }
  Sound.play('hit', k.isPlayer ? 1 : vol3d(k.x, k.z));
  if (kind === 'goo') Sound.play('goo', k.isPlayer ? 0.8 : vol3d(k.x, k.z) * 0.8);
  if (k.isPlayer) race.shake(0.7);
  return true;
}

function trackDelta(a, b, Ln) { let d = (a - b) % Ln; if (d > Ln / 2) d -= Ln; if (d < -Ln / 2) d += Ln; return d; }

function updateProjectiles(race, dt) {
  const tr = race.track, P = race.projectiles, tmp = race._tmp;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.age += dt;
    let dead = false;
    if (p.type === 'seeker') {
      if (p.target && p.target.finished) p.target = null;
      const t = p.target;
      if (t && !p.homing) { const ah = trackDelta(t.loc.dist, p.dist, tr.len); if (ah < 16 && ah > -6) p.homing = true; }
      if (!p.homing) {
        p.dist += p.speed * dt;
        if (t) p.lat = damp(p.lat, t.loc.lat, 2.5, dt);
        const s = tr.sample(p.dist, p.lat, tmp);
        p.x = s.x; p.z = s.z; p.y = s.y + 0.9; p.h = s.h;
      } else {
        p.h = dampAngle(p.h, Math.atan2(t.x - p.x, t.z - p.z), 10, dt);
        p.x += Math.sin(p.h) * p.speed * dt; p.z += Math.cos(p.h) * p.speed * dt;
        const l = tr.locate(p.x, p.z, p.seg, p.loc); p.seg = l.seg; p.y = l.y + 0.9; p.dist = l.dist;
        if (Math.abs(l.lat) > WALL_OFF) dead = true;
      }
      if (Math.random() < 0.9 * FXQ) FX.spawn(p.x, p.y, p.z, (Math.random() - 0.5) * 2, Math.random() * 2, (Math.random() - 0.5) * 2, 0.3, 0.6, [1, 0.25, 0.2], 0.9, true);
      for (const k of race.karts) {
        if ((k === p.owner && p.age < 0.6) || dead) continue;
        if (Math.hypot(k.x - p.x, k.z - p.z) < 2.0 && Math.abs(k.y + 0.8 - p.y) < 2.2) { hitKart(k, 'seeker', race); dead = true; }
      }
      for (let h = race.hazards.length - 1; h >= 0 && !dead; h--) {
        const z = race.hazards[h];
        if (Math.hypot(z.x - p.x, z.z - p.z) < 1.8) { race.hazards.splice(h, 1); dead = true; Sound.play('pop', vol3d(p.x, p.z)); }
      }
      if (p.age > p.life) dead = true;
      if (dead) race.burst(p.x, p.y, p.z, [1, 0.35, 0.2], 18);
    } else if (p.type === 'starfall') {
      if (p.phase === 'fly') {
        let leader = null;
        for (const k of race.karts) if (!k.finished && k !== p.owner && (!leader || k.progress > leader.progress)) leader = k;
        if (!leader && !p.owner.finished) leader = p.owner;
        p.target = leader;
        if (!leader) dead = true;
        else {
          let ah = trackDelta(leader.loc.dist, p.dist, tr.len);
          if (ah < -10) ah += tr.len;   // leader is far ahead: keep flying forward

}

/* =========================================================================
   13. AI — racing-line waypoint follower with drifting, avoidance, item
   tactics and difficulty-scaled rubber-banding.
   ========================================================================= */
function aiControl(k, race, dt) {
  const tr = race.track, D = DIFFS[race.difficulty], a = k.aiState, c = k.ctl;
  const spd = Math.max(Math.hypot(k.vx, k.vz), 8);
  a.wanderT -= dt;
  if (a.wanderT <= 0) { a.wanderT = 2 + Math.random() * 3; a.wanderTarget = (Math.random() * 2 - 1) * 4.5 * (1.15 - D.line); }
  a.wander = damp(a.wander, a.wanderTarget, 0.8, dt);
  const look = 7 + spd * 0.42;
  const s = tr.sample(k.loc.dist + look, 0, a.tmp);
  let off = tr.line[s.i] * D.line + a.wander;
  // avoid hazards and karts directly ahead
  let avoid = 0;
  for (const z of race.hazards) {
    const ah = trackDelta(z.dist, k.loc.dist, tr.len);
    if (ah > 2 && ah < 32 && Math.abs(z.lat - off) < 3) avoid += (z.lat > off ? -4.5 : 4.5) * D.avoid;
  }
  for (const o of race.karts) {
    if (o === k) continue;
    const ah = trackDelta(o.loc.dist, k.loc.dist, tr.len);
    if (ah > 1 && ah < 9 && Math.abs(o.loc.lat - (k.loc.lat + off) * 0.5) < 2.4 && o.speed < k.speed) avoid += (o.loc.lat > k.loc.lat ? -2.5 : 2.5);
  }
  a.avoid = damp(a.avoid, clamp(avoid, -6, 6), 5, dt);
  off = clamp(off + a.avoid, -ROAD_HALF + 1.4, ROAD_HALF - 1.4);
  const tx = s.x - s.tz * off, tz = s.z + s.tx * off;
  const err = wrapA(Math.atan2(tx - k.x, tz - k.z) - k.h);
  let steer = clamp(-err * 2.4, -1, 1), gas = 1, brake = 0;
  if (Math.abs(err) > 1.3 && spd > 20) { gas = 0.2; brake = 0.5; }
  // upcoming curvature
  let ca = 0; for (let q = 5; q <= 25; q += 4) ca += tr.curv[(k.seg + q) % tr.n]; ca /= 6;
  if (!k.drifting && Math.abs(ca) > 0.024 && spd > 29) gas = 0.35;      // lift for hairpins
  a.driftCool -= dt;
  let drift = a.prevDrift, pressed = false;
  if (!k.drifting && !k.hopPending) drift = false;
  if (a.drifter && !k.drifting && !k.hopPending && a.driftCool <= 0 && Math.abs(ca) > 0.0135 && spd > 22 && k.spinT <= 0) {
    drift = true; pressed = true; steer = ca > 0 ? -1 : 1;
  }
  if (k.hopPending) steer = ca > 0 ? -1 : 1;
  if (k.drifting) {
    const keep = Math.abs(ca) > 0.006 && sign(ca) === -k.driftDir && Math.abs(k.loc.lat) < ROAD_HALF + 0.5;
    if (!keep) { drift = false; a.driftCool = 0.8; }
  }
  a.prevDrift = drift;
  // items
  if (k.item && k.rollT <= 0) {
    a.itemT -= dt;
    if (a.itemT <= 0) {
      const smart = Math.random() < D.items;
      let use = false;
      switch (k.item) {
        case 'zip': case 'tri': use = !smart || (Math.abs(ca) < 0.008 && !k.offroad) || k.offroad; break;
        case 'seeker': {
          const t = race.karts.find(o => o.place === k.place - 1);
          use = !!t && (!smart || trackDelta(t.loc.dist, k.loc.dist, tr.len) < 110);
          if (!t) use = true;
          break;
        }
        case 'goo': use = !smart || race.karts.some(o => o !== k && trackDelta(k.loc.dist, o.loc.dist, tr.len) > 0 && trackDelta(k.loc.dist, o.loc.dist, tr.len) < 30); break;
        case 'bubble': use = !smart || race.projectiles.some(p => p.target === k) || Math.random() < 0.15; break;
        case 'starfall': use = true; break;
      }
      if (use) { useItem(k, race); a.itemT = k.item === 'tri' ? 0.7 : 0; }
      else a.itemT = 0.5;
    }

  if (race.phase === 'racing' && Math.abs(k.speed) < 2 && k.spinT <= 0) a.stuck += dt; else a.stuck = 0;
  if (a.stuck > 2.5) { race.respawn(k); a.stuck = 0; }

  const gap = race.refProgress - k.progress;
  const rb = 1 + clamp(gap / 160, -1, 1) * (gap > 0 ? D.rbUp : D.rbDown);
  k.speedMul = (k.isPlayer ? 1 : D.speed * a.personal) * rb;
  c.steer = steer; c.gas = gas; c.brake = brake; c.driftPressed = pressed; c.drift = drift;

/* =========================================================================
   14. GHOST — compact Int16 recording of x, y, z, heading at 30 Hz
   ========================================================================= */
const GHOST_HZ = 30;
const Ghost = {
  encode(arr) {
    const i16 = Int16Array.from(arr), u8 = new Uint8Array(i16.buffer);
    let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  },
  decode(b64) {
    try {
      const s = atob(b64), u8 = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
      return new Int16Array(u8.buffer, 0, u8.length >> 1);
    } catch (e) { return null; }
  },
  pack(x, y, z, h, out) { out.push(Math.round(x * 10), Math.round(y * 100), Math.round(z * 10), Math.round(wrapA(h) * 10000)); },
  /* sample frame at time t into o (interpolated) */
  sample(data, t, o) {
    const frames = data.length / 4, f = t * GHOST_HZ;
    if (f >= frames - 1) { o.done = true; const i = (frames - 1) * 4; o.x = data[i] / 10; o.y = data[i + 1] / 100; o.z = data[i + 2] / 10; o.h = data[i + 3] / 10000; return o; }
    const i0 = Math.max(0, Math.floor(f)), u = f - i0, a = i0 * 4, b = a + 4;
    o.done = false;
    o.x = lerp(data[a], data[b], u) / 10; o.y = lerp(data[a + 1], data[b + 1], u) / 100; o.z = lerp(data[a + 2], data[b + 2], u) / 10;
    o.h = data[a + 3] / 10000 + wrapA(data[b + 3] / 10000 - data[a + 3] / 10000) * u;
    return o;
  },
};

/* =========================================================================
   15. RACE — owns karts, items, phases (intro → countdown → racing), camera
   ========================================================================= */
const TrackCache = {
  key: null, track: null, meshes: null,
  get(idx, mirror) {
    const key = idx + (mirror ? 'm' : '');
    if (this.key === key) return this.track;
    this.dispose();
    const t = new Track(idx, mirror), m = t.buildMeshes();
    this.meshes = { main: Renderer.mesh(m.main), far: Renderer.mesh(m.far) };
    this.track = t; this.key = key;
    return t;
  },
  dispose() {
    if (this.meshes) { Renderer.free(this.meshes.main); Renderer.free(this.meshes.far); }
    this.meshes = null; this.track = null; this.key = null;
  },
};

const INTRO_T = 2.6;

class Race {
  /* o: { mode: 'gp'|'single'|'tt'|'attract', trackIndex, mirror, roster:[{ci,paint,name,isPlayer,id}], difficulty, ghost } */
  constructor(o) {
    this.mode = o.mode; this.attract = o.mode === 'attract'; this.difficulty = o.difficulty;
    this.track = TrackCache.get(o.trackIndex, o.mirror);
    for (const b of this.track.boxes) { b.active = 1; b.t = 0; }
    this.karts = o.roster.map((r, i) => new Kart(r, i));
    this.order = this.karts.slice();
    this.player = this.karts.find(k => k.isPlayer) || null;
    const D = DIFFS[this.difficulty];
    this.karts.forEach((k, s) => { this.placeOnGrid(k, s); k.aiState.drifter = Math.random() < D.drift; });
    this.projectiles = []; this.hazards = []; this._tmp = {}; this._p = {};
    this.phase = this.attract ? 'racing' : 'intro'; this.phaseT = 0; this.raceTime = 0; this.time = 0;
    this.refProgress = 0; this.lastCount = -1; this.banners = []; this.finishOrder = [];
    this.boxesOn = o.mode !== 'tt';
    this.ghost = o.ghost || null; this.ghostRec = []; this.ghostRecT = 0; this.ghostPos = { x: 0, y: 0, z: 0, h: 0, done: false };
    this.playerDoneT = -1; this.wrongWayT = 0; this.completed = false; this.rollTick = 0;
    if (o.mode === 'tt' && this.player) { this.player.item = 'tri'; this.player.itemCount = 3; }
    this.cmp = (a, b) => (a.finished !== b.finished) ? (a.finished ? -1 : 1) : a.finished ? a.finishTime - b.finishTime : b.progress - a.progress;
    const f = this.player || this.karts[0];
    this.cam = { x: f.x, y: f.y + 30, z: f.z, h: f.h, fov: 64, shake: 0, follow: f, mode: 0, modeT: 0 };
    FX.clear();
    this.updatePositions();
  }

  placeOnGrid(k, slot) {
    const g = this.track.gridSlot(slot);
    k.x = g.x; k.z = g.z; k.y = g.y; k.h = g.h; k.vx = k.vz = 0; k.seg = -1;
    const l = this.track.locate(k.x, k.z, -1, k.loc); k.seg = l.seg;

  }

  shake(a) { this.cam.shake = Math.min(1.2, Math.max(this.cam.shake, a)); }

  burst(x, y, z, rgb, n, additive = true) {
    for (let i = 0; i < n * FXQ; i++) {
      const a = Math.random() * TAU, s = 3 + Math.random() * 8;
      FX.spawn(x, y, z, Math.cos(a) * s, Math.random() * 7, Math.sin(a) * s, 0.5, 0.6, rgb, 1, additive, 12);
    }
  }
  explode(x, y, z) {
    for (let i = 0; i < 70 * FXQ; i++) {
      const a = Math.random() * TAU, e = Math.random(), s = 6 + Math.random() * 18;
      FX.spawn(x, y, z, Math.cos(a) * s * (1 - e * 0.5), e * 14, Math.sin(a) * s * (1 - e * 0.5), 0.6 + Math.random() * 0.5, 1.6, Math.random() < 0.5 ? [0.8, 0.35, 1] : [1, 0.62, 0.2], 1, true, 6, 2, 2);
    }
    for (let i = 0; i < 24 * FXQ; i++) {
      const a = Math.random() * TAU;
      FX.spawn(x + Math.cos(a) * 2, y, z + Math.sin(a) * 2, Math.cos(a) * 9, 1 + Math.random() * 2, Math.sin(a) * 9, 1.2, 2.2, [0.4, 0.38, 0.45], 0.55, false, -0.5, 1.5, 3);
    }
    Sound.play('explode', Math.max(0.25, vol3d(x, z)));
    if (this.player && Math.hypot(this.player.x - x, this.player.z - z) < 40) this.shake(1);
  }

  respawn(k) {
    const s = this.track.sample(k.loc.dist, 0, this._tmp);
    k.x = s.x; k.z = s.z; k.y = s.y; k.h = s.h; k.vx = k.vz = 0; k.spinT = 0; k.drifting = false;
    for (let i = 0; i < 12 * FXQ; i++) FX.spawn(k.x, k.y + 1, k.z, (Math.random() - 0.5) * 6, Math.random() * 4, (Math.random() - 0.5) * 6, 0.6, 1.4, [1, 1, 1], 0.6, false, 0, 1, 2);
  }

  onWallHit(k, vn, side) {
    const px = k.x + k.loc.rx * side * KART_R, pz = k.z + k.loc.rz * side * KART_R;
    for (let i = 0; i < Math.min(14, vn) * FXQ; i++) FX.spawn(px, k.y + 0.5, pz, (Math.random() - 0.5) * 8, Math.random() * 6, (Math.random() - 0.5) * 8, 0.3, 0.35, [1, 0.85, 0.4], 1, true, 15);
    if (k.isPlayer) { Sound.play('wall', clamp(vn / 18, 0.3, 1)); this.shake(Math.min(0.45, vn / 40)); }
  }

  onLine(k) {
    if (k.lap >= 1) {
      const lt = this.raceTime - k.lapStart;
      k.lapTimes.push(lt); if (!k.bestLap || lt < k.bestLap) k.bestLap = lt;
      k.lapStart = this.raceTime;
    }
    k.lap++; k.nextCP = 1;
    if (k.lap > TOTAL_LAPS && !k.finished) { this.finishKart(k); return; }
    if (k.isPlayer && k.lap >= 2) {
      if (k.lap === TOTAL_LAPS) { this.banner('FINAL LAP!', '#ff3d7f', 2.2, true); Sound.play('final'); Sound.musicTempo(1.08); }
      else { this.banner('LAP ' + k.lap + ' / ' + TOTAL_LAPS, '#3de0ff', 1.4); Sound.play('lap'); }
    }
  }

  finishKart(k) {

      this.banner(this.mode === 'tt' ? 'FINISH!' : 'FINISH! ' + ordinal(place), place <= 3 ? '#ffcc33' : '#3de0ff', 4, true);
      Sound.play(place <= 3 ? 'finish' : 'lose');
      Sound.musicTempo(1);
      for (let i = 0; i < 140 * FXQ; i++) {
        const a = Math.random() * TAU, r = Math.random() * 6;
        FX.spawn(k.x + Math.cos(a) * r, k.y + 6 + Math.random() * 4, k.z + Math.sin(a) * r, (Math.random() - 0.5) * 6, Math.random() * 4, (Math.random() - 0.5) * 6,
          2 + Math.random(), 0.35, hex(['#ff3d7f', '#ffcc33', '#3de0ff', '#6dff8b', '#ffffff'][(Math.random() * 5) | 0]), 1, false, 4, 1.4);
      }
    }
  }

  startRace() {
    this.phase = 'racing'; this.phaseT = 0; this.raceTime = 0;
    Sound.play('go');
    this.banner('GO!', '#6dff8b', 0.9, true);
    const D = DIFFS[this.difficulty];
    for (const k of this.karts) {
      k.lapStart = 0;
      if (k.isPlayer) {
        if (k.revStart >= 1.75 && k.revStart <= 2.5 && k.ctl.gas > 0) { boostKart(k, 1.4, 1.1); Sound.play('boost'); this.banner('ROCKET START!', '#ffcc33', 1.4); }
        else if (k.revStart >= 0 && k.revStart < 1.3 && k.ctl.gas > 0) { k.stallT = 1.0; Sound.play('burn'); this.banner('Engine flooded!', '#ff8a2e', 1.2); }
      } else if (Math.random() < D.start) boostKart(k, 1.2, 1.05);
      else if (Math.random() < 0.06) k.stallT = 0.6;
    }
  }

  playerControl(k) {
    const c = k.ctl;
    c.steer = Input.steer; c.gas = Input.gas; c.brake = Input.brake; c.drift = Input.drift;
    c.driftPressed = Input.driftPressed;

  }

  updatePositions() {

      this.updateRoulette(dt);
    }
    for (const k of this.karts) this.emit(k, dt);
    FX.update(dt);
    // ghost record / playback

    for (const b of this.banners) b.t += dt;
    while (this.banners.length && this.banners[0].t > this.banners[0].dur) this.banners.shift();

    if (!this.attract && this.playerDoneT >= 0) {

        P.drifting || (Math.abs(P.yawRate) > 1.6 && Math.abs(P.speed) > 20 && !P.offroad), P.driftLevel, P.offroad && Math.abs(P.speed) > 5);
    }

  }

  collideKarts() {
    const K = this.karts, D2 = (KART_R * 2) * (KART_R * 2);
    for (let i = 0; i < K.length; i++) for (let j = i + 1; j < K.length; j++) {
