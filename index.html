<style>
  :root{
    --bg-1:#FF6B35;
    --bg-2:#FFB627;
    --ink:#1A1430;
    --panel:#FFFDF7;
    --panel-edge:#1A1430;
    --accent-pink:#FF3D81;
    --accent-teal:#00C2A8;
    --accent-blue:#3B82F6;
    --accent-purple:#8B5CF6;
    --shadow-hard: 6px 6px 0 var(--panel-edge);
    --shadow-hard-sm: 3px 3px 0 var(--panel-edge);
    --font-display: 'Lilita One', 'Arial Black', sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.2), transparent 45%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient floating shapes */
  .shape{
    position:fixed;
    border:4px solid var(--ink);
    opacity:0.12;
    pointer-events:none;
    z-index:0;
  }
  .shape.circle{border-radius:50%;}
  .s1{width:140px;height:140px;top:8%;left:4%;background:var(--accent-teal); animation: floatY 7s ease-in-out infinite;}
  .s2{width:90px;height:90px;top:65%;left:88%;background:var(--accent-pink); border-radius:50%; animation: floatY 9s ease-in-out infinite reverse;}
  .s3{width:60px;height:60px;top:78%;left:8%;background:var(--accent-blue); transform:rotate(20deg); animation: floatY 6s ease-in-out infinite;}
  .s4{width:100px;height:100px;top:5%;left:80%;background:var(--accent-purple); border-radius:50%; animation: floatY 8s ease-in-out infinite reverse;}
  @keyframes floatY{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-22px) rotate(8deg);} }
  @media (prefers-reduced-motion: reduce){ .shape{animation:none !important;} }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding: 56px 24px 80px;
  }

  /* HERO */
  header.hero{
    text-align:center;
    margin-bottom:54px;
  }

  .badge{
    display:inline-block;
    background:var(--panel);
    border:3px solid var(--ink);
    box-shadow: var(--shadow-hard-sm);
    border-radius:999px;
    padding:6px 18px;
    font-weight:900;
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:22px;
    transform:rotate(-2deg);
  }

  h1.title{
    font-family:var(--font-display);
    font-size:clamp(2.6rem, 7vw, 5.2rem);
    line-height:0.95;
    color:var(--panel);
    -webkit-text-stroke: 3px var(--ink);
    text-stroke: 3px var(--ink);
    text-shadow: 6px 6px 0 var(--ink);
    letter-spacing:0.01em;
    margin-bottom:14px;
  }

  .subtitle{
    font-weight:800;
    font-size:1.05rem;
    color: var(--ink);
    background: var(--panel);
    display:inline-block;
    border:3px solid var(--ink);
    box-shadow: var(--shadow-hard-sm);
    padding:10px 20px;
    border-radius:14px;
    max-width:560px;
  }

  .stat-row{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-top:28px;
  }
  .stat-pill{
    background:var(--ink);
    color:var(--panel);
    font-weight:800;
    font-size:0.85rem;
    padding:9px 16px;
    border-radius:999px;
    border:3px solid var(--ink);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .stat-pill strong{ font-family:var(--font-display); font-size:1rem; color:var(--accent-teal); }

  /* FILTER BAR */
  #filterBar{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    justify-content:center; margin:0 0 26px;
  }
  #search{
    font-family:inherit; font-weight:800; font-size:0.92rem; color:var(--ink);
    background:var(--panel); border:3px solid var(--ink); border-radius:999px;
    box-shadow:var(--shadow-hard-sm); padding:9px 18px; min-width:220px; outline:none;
  }
  #search::placeholder{ color:#9d95b5; }
  #search:focus{ box-shadow:5px 5px 0 var(--ink); }
  #chips{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .chip{
    font-weight:900; font-size:0.72rem; letter-spacing:0.05em; text-transform:uppercase;
    padding:7px 13px; border-radius:999px; border:2.5px solid var(--ink);
    background:var(--panel); cursor:pointer; user-select:none;
  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--panel); }

  /* GRID */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 28px;
  }

  .card{
    background:var(--panel);
    border:4px solid var(--ink);
    border-radius:22px;
    box-shadow: var(--shadow-hard);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    position:relative;
  }
  .card:hover{
    transform: translate(-4px,-4px);
    box-shadow: 10px 10px 0 var(--panel-edge);
  }
  .card:focus-within{
    outline: 3px solid var(--accent-blue);
    outline-offset: 2px;
  }

  .card-art{
    height:170px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:4px solid var(--ink);
    overflow:hidden;
  }
  .card-art .emoji{
    font-size:4.4rem;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.18));
    transform: rotate(-4deg);
  }
  .card-art::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.5) 2px, transparent 2px);
    background-size: 18px 18px;
    opacity:0.5;
  }

  .card-body{
    padding:20px 20px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }

  .card-top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }

  .card h3{
    font-family:var(--font-display);
    font-size:1.32rem;
    line-height:1.1;
    letter-spacing:0.01em;
  }

  .genre-tag{
    flex-shrink:0;
    font-size:0.68rem;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:5px 10px;
    border-radius:999px;
    border:2.5px solid var(--ink);
    white-space:nowrap;
  }

  .card p.desc{
    font-size:0.92rem;
    font-weight:700;
    line-height:1.45;
    color:#4a4360;
    flex:1;
  }

  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:6px;
  }

  .meta-bits{
    display:flex;
    gap:6px;
    font-size:0.72rem;
    font-weight:800;
    color:#6b6480;
  }

  .play-btn{
    font-family:var(--font-display);
    font-size:0.92rem;
    letter-spacing:0.03em;
    background:var(--ink);
    color:var(--panel);
    border:3px solid var(--ink);
    border-radius:12px;
    padding:9px 18px;
    text-decoration:none;
    box-shadow: 3px 3px 0 var(--accent-teal);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .play-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow: 5px 5px 0 var(--accent-teal);
  }
  .play-btn:active{
    transform: translate(0,0);
    box-shadow: 1px 1px 0 var(--accent-teal);
  }

  /* status states */
  #status{
    text-align:center;
    padding:60px 20px;
    font-weight:800;
    color:var(--ink);
  }
  .spinner{
    width:46px;height:46px;
    border:5px solid var(--panel);
    border-top:5px solid var(--ink);
    border-radius:50%;
    margin:0 auto 18px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none; border-top-color:var(--panel);} }

  .error-box{
    max-width:520px;
    margin:0 auto;
    background:var(--panel);
    border:4px solid var(--ink);
    box-shadow:var(--shadow-hard);
    border-radius:18px;
    padding:28px;
  }
  .error-box a{ color:var(--accent-blue); font-weight:900; }

  .empty-card{
    grid-column: 1 / -1;
    text-align:center;
    padding:50px 20px;
    background:var(--panel);
    border:4px dashed var(--ink);
    border-radius:18px;
    font-weight:800;
  }

  footer{
    text-align:center;
    margin-top:64px;
    font-weight:800;
    font-size:0.85rem;
    color:var(--ink);
    opacity:0.75;
  }
  footer a{ color:var(--ink); }

  @media (max-width: 520px){
    .wrap{ padding: 38px 16px 60px; }
    h1.title{ -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); }
  }
</style>
</head>
<body>

<div class="shape s1"></div>
<div class="shape s2 circle"></div>
<div class="shape s3"></div>
<div class="shape s4 circle"></div>

<div class="wrap">

  <header class="hero">
    <span class="badge">★ No installs · No accounts · Just play ★</span>
    <h1 class="title">ZD STUDIOS<br>GAME LIBRARY</h1>
    <p class="subtitle">A growing arcade of browser games — built scrappy, played instantly.</p>
    <div class="stat-row" id="statRow" hidden>
      <div class="stat-pill">🎮 <strong id="gameCount">0</strong> games live</div>
      <div class="stat-pill">⚡ 100% browser-based</div>
    </div>
  </header>

      emoji: "\ud83d\udfe2", genre: "Idle / Farming",
      tagBg: "#22C55E", artBg: "linear-gradient(135deg,#BBF7D0,#22C55E)"
    },
    "tiny-fishing.html": {
      title: "Tiny Fishing", tagline: "One More Cast",
      desc: "Cast your line, reel in fish, upgrade your rod, and see how deep you can go. Chill but surprisingly addictive.",
      emoji: "\ud83c\udfa3", genre: "Idle / Casual",
      tagBg: "#0EA5E9", artBg: "linear-gradient(135deg,#BAE6FD,#0EA5E9)"
    },
    "skyrim.html": {
      title: "Skyrim: Ravenrock", tagline: "An Elder Scrolls-Inspired Chronicle",
      desc: "A procedural open-world action RPG \u2014 walk out of a walled hold town under the crags, fight, loot, and carve your own path across Ravenrock.",
      emoji: "\u2694\ufe0f", genre: "3D / Open-World RPG",
      tagBg: "#7C3AED", artBg: "linear-gradient(135deg,#C4B5FD,#7C3AED)"
    }
  };

  // Order the grid deliberately instead of alphabetically: the headliners first.
  const FEATURED = ["chameleon.html","everything.html","skyrim.html","cs2.html","bricks-of-the-dark-knight.html",
                    "neon-rush.html","matchday.html","aquanaut.html",
                    "haul-hard.html","reefkeeper.html","azure-rush.html",
                    "spaceship-fly.html","stickman-hook.html","terraria.html","minecraft.html"];

  const FALLBACK_PALETTE = [
    { tagBg:"#3B82F6", artBg:"linear-gradient(135deg,#93C5FD,#3B82F6)" },
    { tagBg:"#8B5CF6", artBg:"linear-gradient(135deg,#C4B5FD,#8B5CF6)" },
    { tagBg:"#FF3D81", artBg:"linear-gradient(135deg,#FFA8C9,#FF3D81)" },
    { tagBg:"#00C2A8", artBg:"linear-gradient(135deg,#5EE7DF,#00C2A8)" }
  ];

  function titleCaseFromFilename(name){
    const base = name.replace(/\.html?$/i, "");
    return base
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function buildFallbackInfo(filename, index){
    const palette = FALLBACK_PALETTE[index % FALLBACK_PALETTE.length];
    return {
      title: titleCaseFromFilename(filename),
      tagline: "Untitled Build",
      desc: "A freshly added game — jump in and see what it's about.",
      emoji: "🎮",
      genre: "Browser Game",
      tagBg: palette.tagBg,
      artBg: palette.artBg
    };
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  let ALL_GAMES = [];
  let activeGenre = "All";
  let query = "";

  function cardHtml(game){
    return `
      <article class="card">
        <div class="card-art" style="background:${game.artBg}">
          <span class="emoji" aria-hidden="true">${game.emoji}</span>
        </div>
        <div class="card-body">
          <div class="card-top-row">
            <h3>${escapeHtml(game.title)}</h3>
            <span class="genre-tag" style="background:${game.tagBg}; color:#FFFDF7;">${escapeHtml(game.genre)}</span>
          </div>
          <p class="desc">${escapeHtml(game.desc)}</p>
          <div class="card-foot">
            <span class="meta-bits">${escapeHtml(game.tagline)}</span>
            <a class="play-btn" href="${game.url}">\u25b6 PLAY</a>
          </div>
        </div>
      </article>`;
  }

  function applyFilters(){
    const grid = document.getElementById("grid");
    const q = query.trim().toLowerCase();
    const shown = ALL_GAMES.filter(g => {
      if (activeGenre !== "All" && g.genre !== activeGenre) return false;
      if (!q) return true;
      return (g.title + " " + g.genre + " " + g.tagline + " " + g.desc).toLowerCase().includes(q);
    });
    grid.innerHTML = shown.length
      ? shown.map(cardHtml).join("")
      : `<div class="empty-card">Nothing matches that \u2014 try a different search. \ud83d\udd0d</div>`;
  }

  function buildChips(){
    const genres = ["All", ...new Set(ALL_GAMES.map(g => g.genre))].slice(0, 9);
    const box = document.getElementById("chips");
    box.innerHTML = genres.map(g =>
      `<button class="chip" type="button" aria-pressed="${g === activeGenre}">${escapeHtml(g)}</button>`).join("");
    [...box.children].forEach((el, i) => el.onclick = () => {
      activeGenre = genres[i];
      [...box.children].forEach((e2, j) => e2.setAttribute("aria-pressed", String(j === i)));
      applyFilters();
    });
  }

  function renderGrid(games){
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const statRow = document.getElementById("statRow");

    status.hidden = true;
    grid.hidden = false;

    if(games.length === 0){
      grid.innerHTML = `<div class="empty-card">No games found yet \u2014 check back soon! \ud83d\udee0\ufe0f</div>`;
      return;
    }

    ALL_GAMES = games;
    document.getElementById("gameCount").textContent = games.length;
    statRow.hidden = false;
    document.getElementById("filterBar").hidden = false;
    document.getElementById("search").addEventListener("input", e => {
      query = e.target.value; applyFilters();
    });
    buildChips();
    applyFilters();
  }

  function toGame(filename, index){
    const info = GAME_INFO[filename.toLowerCase()] || buildFallbackInfo(filename, index);
    return { ...info, file: filename.toLowerCase(), url: filename };
  }

  // Featured titles lead, everything else follows alphabetically.
  function orderGames(files){
    const rank = f => { const i = FEATURED.indexOf(f.toLowerCase()); return i === -1 ? FEATURED.length : i; };
    return files.slice().sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  }

  async function loadGames(){
    // The repo listing keeps the page honest when new games land, but the page
    // must still work when the API is rate-limited or offline \u2014 so the known
    // library is the fallback rather than an error screen.
    let names = null;
    try{
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`, {
        headers: { "Accept": "application/vnd.github+json" }
      });
      if(res.ok){
        const files = await res.json();
        if (Array.isArray(files)){
          names = files
            .filter(f => f.type === "file")
            .filter(f => /\.html?$/i.test(f.name))
            .filter(f => !SELF_FILES.has(f.name.toLowerCase()))
            .map(f => f.name);
        }
      }
    }catch(err){
      console.warn("Repo listing unavailable, using the built-in library.", err);
    }
    if (!names || !names.length) names = Object.keys(GAME_INFO);
    renderGrid(orderGames(names).map(toGame));
  }

  loadGames();
})();
</script>
