<!DOCTYPE html>
<!--
  DEEPDELVE: ECHOES BELOW  —  single-file endless mining game (Solo works offline; Online uses the ZD multiplayer SDK)
  CONTROLS
    Move / dig ........ Arrow keys or WASD (walk into a tile to dig it, down to dig down)
    Hold position ..... Hold UP while digging sideways (prevents falling into pits)
    Jump / climb ...... UP (climb ladders with UP/DOWN)
    Mouse ............. Click-and-hold: move & dig toward the cursor
    Touch ............. Drag: the miner digs toward your finger (optional joystick in Settings)
    L ................. Place a carried ladder (also in Dig Tools)
    Kick .............. Walk into a loose coloured stone; 3+ same colour = cluster chain explosion
    E ................. Interact (shops, elevator, Old Maeve, chests) — or tap the prompt
    B / C ............. Toggle construction (hammer) / crowbar mode
    Space / F ......... Place selected structure (or click/tap a tile in build mode)
    G ................. Light dynamite      Q ... Water bottle (suck up / pour)
    I / K ............. Inventory / Skills  Esc . Close panel
  LOBBY / ONLINE
    Solo .............. Your normal single-player save (unchanged)
    Online ............ Quick Match / Create Private (5-char code) / Join by Code; up to 8 miners share one world
    Enter ............. (online) type a chat message, Enter to send, Esc to cancel — E still interacts
    Leave ............. (online) top-right player list → back to the lobby. Online progress uses its own save slot
-->

#combo{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-size:34px;color:#ffd65a;text-shadow:3px 3px 0 #7a2a10,-1px -1px 0 #000;opacity:0;pointer-events:none}

@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}20%{transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

/* ---- lobby & online ---- */
#lobby{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:8px;background:radial-gradient(circle at 50% 30%,#4a3220,#1a110b 70%)}

#chatIn:focus{border-color:#d39a2a;outline:none}

#lobby{background:#0c0805;overflow:hidden;opacity:1;transition:opacity .45s ease,display .45s allow-discrete}

@starting-style{#lobby{opacity:0}}

#lobby::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(8,5,3,.25) 0%,rgba(8,5,3,.55) 60%,rgba(4,2,1,.85) 100%)}
.panel.lob{position:relative;z-index:1;width:min(420px,100%);max-height:calc(100vh - 16px);overflow:auto;padding:22px 22px 16px;gap:10px;
  background:linear-gradient(180deg,rgba(44,29,18,.86),rgba(28,18,11,.9));

  text-shadow:3px 3px 0 #7a2a10,0 0 18px rgba(255,190,70,.55);animation:tFloat 3.2s ease-in-out infinite}

.lob h1 .tpick{display:inline-block;animation:tSwing 1.6s ease-in-out infinite;transform-origin:70% 70%}
@keyframes tFloat{0%,100%{transform:translateY(0);text-shadow:3px 3px 0 #7a2a10,0 0 14px rgba(255,190,70,.45)}50%{transform:translateY(-5px);text-shadow:3px 3px 0 #7a2a10,0 0 26px rgba(255,200,90,.75)}}
@keyframes tSwing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
.lob .sub{color:#e8c38a;opacity:.85;font-size:13px;margin-bottom:8px}
.lob input{border-radius:6px;background:rgba(20,12,7,.75)}
.lob input:focus{outline:none;border-color:#ffd65a;box-shadow:0 0 10px rgba(255,214,90,.4)}
.lob .btn.big{font-size:18px;padding:13px 16px;border-radius:10px;letter-spacing:2px;position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .15s,filter .15s;box-shadow:0 4px 0 #120b06,0 0 0 rgba(0,0,0,0)}
.lob .btn.big::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);transition:transform .5s}
.lob .btn.big:not(:disabled):hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.15);box-shadow:0 6px 0 #120b06,0 0 18px rgba(143,208,106,.45)}
.lob .btn.big:not(:disabled):hover::after{transform:translateX(120%)}
.lob .btn.big:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #120b06}
#lobOnline{background:#1f4a6a;border-color:#6ab8ff}
#lobOnline:not(:disabled):hover{box-shadow:0 6px 0 #120b06,0 0 18px rgba(106,184,255,.5)}
#lobColors{gap:8px;padding:4px 0}
.lob .sw{border-radius:50%;transition:transform .15s,box-shadow .2s;animation:swPulse 2.4s ease-in-out infinite}
.lob .sw:nth-child(2n){animation-delay:-.6s}.lob .sw:nth-child(3n){animation-delay:-1.2s}.lob .sw:nth-child(5n){animation-delay:-1.8s}
.lob .sw:hover{transform:scale(1.18) rotate(8deg)}
.lob .sw.on{transform:scale(1.2);animation:swOn 1.2s ease-in-out infinite}
@keyframes swPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes swOn{0%,100%{box-shadow:0 0 0 2px #ffe08a,0 0 6px #ffe08a}50%{box-shadow:0 0 0 2px #ffe08a,0 0 16px #ffe08a}}
body:has(#lobby.hidden) #cv,body:has(#lobby.hidden) #ui{animation:gameIn .6s ease}
@keyframes gameIn{from{opacity:0}}
@media (max-width:420px){
  .panel.lob{padding:16px 12px 12px;border-radius:10px}
  .lob .btn.big{font-size:16px;padding:11px 12px}
  .lob .sw{width:24px;height:24px}
  .lob .lrow{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){.lob h1,.lob h1 .tpick,.lob .sw,.panel.lob{animation:none!important}}

// ---------------- digging ----------------
function doDig(tx, ty, kind, ix, dt) {
  if (tx <= 0 || tx >= W - 1) return;
  var id = w.get(tx, ty), key = tx + ',' + ty;
  if (isBuilt(id)) {
    if (mode === 'crowbar') removeBuilt(tx, ty);
    else if (id === T.TRANSFORMER && kind === 'h' && w.transformerAt(tx, ty).out !== null) {
      w.kick(tx, ty, ix, st('kick', 1)); SFX.kick(); toast('Transformer pattern cleared.');
    }
    return;
  }

    if (kickCd <= 0) {
      kickCd = 0.35; var r = 'blocked';
      try { r = w.kick(tx, ty, ix > 0 ? 1 : -1, st('kick', 1)); } catch (e) {}
      if (ONLINE && (r === 'pushed' || r === 'exploded')) G.net.sendKick(tx, ty, ix > 0 ? 1 : -1);
      if (r === 'pushed') { SFX.kick(); ev('kick', 1); P.swing = 1; burst(tx, ty, '#a08060', 4, 2); }
      else if (r === 'exploded') { SFX.kick(); ev('kick', 1); shake = Math.max(shake, 5); }
      else { dig.blocked = key; }
    }
    return;
  }
  P.digging = true;
  if (dig.key !== key) {
    dig.key = key; dig.x = tx; dig.y = ty; dig.t = 0;
    dig.crit = Math.random() < clamp(st('crit', 0), 0, 0.9);
    var h = Infinity; try { h = WD.hardness(id, ty, S.rebirths | 0); } catch (e) {}
    var pp = Math.max(0.01, st('pickPower', 1));
    if (id === T.HARD) {
      var req = Infinity; try { req = WD.hardReq(ty, S.rebirths | 0); } catch (e) {}
      if (pp < req) { h = Infinity; toastOnce('hard', '🪨 Giant grey rock! Needs pick power ' + F(req) + ' (yours: ' + F(pp) + ') — or use a Rock Transformer.', 'bad', 4); SFX.err(); }
    }
    if (!isFinite(h)) { dig.need = Infinity; if (id === T.BEDROCK) toastOnce('bed', '⛔ Bedrock — impossible to dig.', 'bad', 5); }
    else {
      var sp = pp * Math.max(0.05, st('digSpeed', 1)) * boostMul() * (has('drill') ? 1.6 : 1);
      dig.need = Math.max(0.04, h / sp) * (dig.crit ? 0.15 : 1);
    }
  }
  if (!isFinite(dig.need)) return;
  dig.t += dt; P.swing += dt * 14;
  if (digSndT <= 0) { digSndT = 0.13; SFX.dig(); part(tx + 0.5 - (kind === 'h' ? ix * 0.45 : 0), ty + (kind === 'd' ? 0.05 : kind === 'u' ? 0.95 : 0.5), (Math.random() - 0.5) * 3, -2, 0.4, tileColor(id, w.getMeta(tx, ty)), 3); }
  if (dig.t >= dig.need) breakAt(tx, ty);
}
function breakAt(tx, ty) {
  var id = w.get(tx, ty), meta = w.getMeta(tx, ty), col = tileColor(id, meta);
  var evs = []; try { evs = w.breakTile(tx, ty, luck()) || []; } catch (e) {}
  if (ONLINE) G.net.sendDig(tx, ty);
  if (dig.crit) floatTxt(tx + 0.5, ty, 'CRIT!', '#ff8a6a');
  dig.key = ''; burst(tx, ty, col, 10, 4); SFX.brk();
  var orb = id === T.LADDER_ORB;
  if (orb) { S.inventory.ladders += 50; toast('🔮 Ladder Orb! +50 ladders', 'm'); SFX.up(); }

}

// ---------------- events ----------------
function nearP(x, y, r) { return Math.abs(P.x + PW / 2 - (x + 0.5)) < r && Math.abs(P.y + PH / 2 - (y + 0.5)) < r; }
function handleEvents(evs, skipOrb) {
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i]; if (!e) continue;
    switch (e.type) {
      case 'loot': spawnLoot(e, skipOrb); break;
      case 'crush': if (P.dead <= 0 && Math.abs(P.x + PW / 2 - (e.x + 0.5)) < 0.95 && Math.abs(P.y + PH / 2 - (e.y + 0.5)) < 1.1) die('Crushed by a falling rock!'); break;
      case 'nearMiss': ev('nearMiss', 1); floatTxt(P.x + 0.35, P.y - 0.3, 'Close call!', '#ff8a6a'); S.stats.nearMisses = num(S.stats.nearMisses, 0); break;
      case 'warn': warns.set(e.x + ',' + e.y, 0.7); if (nearP(e.x, e.y, 8)) { SFX.warn(); shake = Math.max(shake, 1.5); } break;
      case 'land': if (nearP(e.x, e.y, 10)) { SFX.land(); if (!S.settings.low) burst(e.x, e.y + 0.4, 'rgba(200,180,150,.7)', 4, 2); } break;
      case 'explode':
        var r = clamp(num(e.r, 1), 1, 12);
        burst(e.x, e.y, e.color && typeof e.color === 'string' ? e.color : (STONECOL[e.color] || '#ffb84a'), 14 + r * 4, 5 + r);
        if (nearP(e.x, e.y, 14)) { SFX.boom(); shake = Math.max(shake, Math.min(14, 4 + r * 2)); }
        if (e.damaging && Math.hypot(P.x + PW / 2 - e.x - 0.5, P.y + PH / 2 - e.y - 0.5) < r + 0.4) hurt(45, 'Blown up!');
        break;
      case 'cluster':
        var sz = num(e.size, 3), cb = Math.max(1, num(e.combo, 1));
        handleResults(E.onEvent(S, {type:'cluster', value:1, combo:cb})); tut(1);
        if (cb > num(S.stats.maxCombo, 0)) S.stats.maxCombo = cb;
        if (cb >= 2) { combo('COMBO x' + cb + '!'); var bonus = Math.floor(sz * cb * cb * (1 + num(S.maxDepth, 0) * 0.05)); S.coins = E.safe ? E.safe(num(S.coins, 0) + bonus) : num(S.coins, 0) + bonus; floatTxt(e.x + 0.5, e.y, '+' + F(bonus) + '🪙 chain bonus', '#ffd65a'); }
        else floatTxt(e.x + 0.5, e.y, 'BOOM x' + sz, '#ffd65a');
        break;
      case 'discover': var t0 = num(S.tokens, 0); try { handleResults(E.onEvent(S, {type: 'discover', tileId: e.tileId, meta: e.meta})); } catch (er) {} if (num(S.tokens, 0) > t0) toast('🔎 New discovery! +' + F(num(S.tokens, 0) - t0) + '⭐', 'm'); break;
      case 'water': if (nearP(e.x, e.y, 10)) SFX.splash(); break;
    }
  }
}
function spawnLoot(e, skipOrb) {
  var list = [];
  if (typeof e.id === 'string') list.push({id: e.id, qty: num(e.qty, 1) || 1});
  else { try { list = E.lootForTile(e.id, num(e.meta, 0), e.y, S.rebirths | 0, Math.random, luck()) || []; } catch (er) {} }
  list.forEach(function (l) {
    if (!l || !l.id || !(l.qty > 0)) return;
    if (item(l.id).kind === 'orb') { if (!skipOrb) { S.inventory.ladders += 50 * l.qty; toast('🔮 Ladder Orb! +' + 50 * l.qty + ' ladders', 'm'); } return; }
    addPickup(e.x + 0.5, e.y + 0.5, l.id, l.qty);
  });
}
function addPickup(x, y, id, qty) {
  for (var i = 0; i < pickups.length; i++) { var p = pickups[i]; if (p.id === id && Math.abs(p.x - x) < 1.2 && Math.abs(p.y - y) < 1.2) { p.qty += qty; return; } }
  if (pickups.length >= 150) { var o = pickups.shift(); tryAdd(o.id, o.qty, o.depth); }
  pickups.push({x: x, y: y, depth: Math.floor(y), vx: (Math.random() - 0.5) * 3, vy: -3 - Math.random() * 2, id: id, qty: qty, retry: 0, t: 0});
}
function updatePickups(dt) {
  var mag = clamp(st('magnet', 1.5), 0.8, 14), pcx = P.x + PW / 2, pcy = P.y + PH / 2;
  for (var i = pickups.length - 1; i >= 0; i--) {
    var p = pickups[i]; p.t += dt; p.retry -= dt;
    var dx = pcx - p.x, dy = pcy - p.y, d = Math.hypot(dx, dy);
    if (d < mag && p.retry <= 0 && p.t > 0.25) { var s = (5 + (mag - d) * 4) * dt / (d || 1); p.x += dx * Math.min(1, s); p.y += dy * Math.min(1, s); p.vx = p.vy = 0; }
    else {
      p.vy = Math.min(12, p.vy + 20 * dt); p.vx *= 0.95;
      var nx = p.x + p.vx * dt; if (!solidAt(Math.floor(nx), Math.floor(p.y))) p.x = nx; else p.vx = 0;
      var ny = p.y + p.vy * dt; if (solidAt(Math.floor(p.x), Math.floor(ny + 0.2))) { p.vy = 0; p.y = Math.floor(ny + 0.2) - 0.2; } else p.y = ny;
      if (solidAt(Math.floor(p.x), Math.floor(p.y))) p.y -= dt * 3;
    }
    if (d < 0.65 && p.retry <= 0) {
      var a = tryAdd(p.id, p.qty, p.depth);
      if (a > 0) { var it = item(p.id); floatTxt(p.x, p.y - 0.3, '+' + (a > 1 ? a + ' ' : '') + it.name, RCOL[clamp(num(it.rarity, 0), 0, 5)]); SFX.pick(); ev('collect', a, p.id); }
      p.qty -= a;
      if (p.qty <= 0) pickups.splice(i, 1);
      else { p.retry = 1.2; toastOnce('full', '🎒 Bag full! Sell at camp or store in a chest.', 'bad', 4); }
    }
  }
}

function removeBuilt(x, y) {

// ---------------- interaction ----------------
function computePrompt() {
  if (P.dead > 0) return null;
  var cx = Math.floor(P.x + PW / 2), cy = Math.floor(P.y + PH / 2);
  var id = w.get(cx, cy);
  if (id === T.CHEST) return {k:'chest', n:'Chest', arg:cx + ',' + cy};
  if (id === T.BASECAMP) return {k:'elevator', n:'Base Camp', arg:cx + ',' + cy};
  for (var dx of [0, P.face, -P.face]) {
    var ty = dx ? cy : cy + 1, machine = w.transformerAt(cx + dx, ty);
    if (machine) return {k:'machine', n:'Rock Transformer', arg:[cx + dx, ty]};
  }
  if (cy <= -1 && cy >= -3) {
    for (var i = 0; i < BLD.length; i++) if (Math.abs(P.x + PW / 2 - (BLD[i].x + 0.5)) < 1.6) return {k: BLD[i].k, n: BLD[i].n};

}

    var a = P.dead > 0 ? 'dead' : P.digging ? 'dig' : P.climb ? 'climb' : !P.ground ? 'air' : Math.abs(P.vx) > 0.1 ? 'walk' : 'idle';
    var depth = Math.max(0, Math.floor(P.y + PH / 2));
    N.sendState({x: P.x * TS, y: P.y * TS, vx: P.vx * TS, vy: P.vy * TS, face: P.face, anim: a, name: ONLINE.name, color: ONLINE.color, depth: depth});
    if ((recT -= 0.1) <= 0) { recT = 2; N.setRecord(depth); }
  }, 100);
  setInterval(renderRoster, 500); renderRoster();
}
function renderRoster() {
  var N = G.net, list = N.roster().sort(function (a, b) { return b.depth - a.depth; });
  $('netCount').textContent = N.count + '/8';
  $('roster').innerHTML = list.map(function (p) {
    return '<div><i style="background:' + esc(p.color) + '"></i>' + (p.host ? '👑' : '') + esc(p.name) + (p.me ? ' (you)' : '') + '<span>' + F(p.depth) + 'm</span></div>';
  }).join('') + '<div class="rec">🏁 Room record: ' + F(N.record()) + 'm</div>';
}
var remT = 0;
function drawRemotes(ox, oy) {
  var now = performance.now(), dt = remT ? Math.min(0.1, (now - remT) / 1000) : 0; remT = now;
  var ps = G.net.peers(), seen = {};
  Object.keys(ps).forEach(function (id) {
    var d = ps[id], r = remotes[id], pr = G.net.predict(id) || d, tx = num(pr.x, d.x), ty = num(pr.y, d.y);
    seen[id] = 1;
    if (!r || Math.hypot(tx - r.x, ty - r.y) > TS * 12) r = remotes[id] = {x: tx, y: ty};
    var k = Math.min(1, dt * 12); r.x += (tx - r.x) * k; r.y += (ty - r.y) * k;
    if (d.anim === 'dead') return;
    var sx = r.x + ox, sy = r.y + oy;
    if (sx < -60 || sy < -60 || sx > vw + 60 || sy > vh + 60) return;
    drawMiner(sx, sy, d.face < 0 ? -1 : 1, d.anim, /^#[0-9a-f]{6}$/i.test(d.color) ? d.color : '#3d6fc0');
    label(String(d.name || 'Miner').slice(0, 16), Math.round(sx + PW * TS / 2), Math.round(sy - 10), d.color);
  });
  Object.keys(remotes).forEach(function (id) { if (!seen[id]) delete remotes[id]; });
}
function drawMiner(sx, sy, face, anim, shirt) {
  var pw = PW * TS, ph = PH * TS, walk = anim === 'walk' || anim === 'climb', st_ = walk ? Math.sin(time * 14) * 2 : 0, dg = anim === 'dig';
  ctx.save(); ctx.translate(Math.round(sx + pw / 2), Math.round(sy + ph)); if (face < 0) ctx.scale(-1, 1);
  var r = function (x, y, w_, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w_, h); };
  r(-7, -5 + (st_ > 0 ? -1 : 0), 6, 5, '#3a2414'); r(1, -5 + (st_ < 0 ? -1 : 0), 6, 5, '#3a2414');
  r(-6, -11, 5, 6, '#2f2f3f'); r(1, -11, 5, 6, '#2f2f3f');
  r(-7, -20, 14, 10, shirt); r(-7, -13, 14, 2, '#5a3a1a');
  r(-5, -27, 11, 8, '#f0c090'); r(3, -25, 2, 2, '#222'); r(-5, -21, 11, 2, '#c08a5a');
  r(-7, -30, 14, 4, '#f2c230'); r(-8, -27, 16, 2, '#c89a18'); r(4, -30, 4, 3, '#fffbd0');
  ctx.save(); ctx.translate(5, -15); ctx.rotate(dg ? (-1.4 + Math.abs(Math.sin(time * 14)) * 1.9) : 0.5);
  r(0, -1, 13, 3, '#8a5a2a'); r(11, -6, 3, 13, '#b8c0cc'); ctx.restore(); r(3, -17, 4, 4, '#f0c090');
  ctx.restore();
}

// ---------------- attract host (lobby background) ----------------
// A throwaway seed-1337 world run through the real step() + renderScene(); the bot (src/attract.js) only supplies input.
// Never touches saves (save() is a no-op while ATTRACT is set). At most one rAF loop: attract stops before boot() starts frame().
var ATTRACT_SEED = 1337;
function attractReset() {
  S = E.newState(ATTRACT_SEED); ensureState();
  S.settings.mute = true; S.settings.low = false; S.inventory.ladders = 1e6;
  S.player = {x: SPAWN.x + 0.15, y: SPAWN.y + 0.05}; S.tombstones = []; S.pickups = []; S.fuses = [];
  makeWorld(null); restoreExpedition();
  for (var i = 0; i < PMAX; i++) parts[i].a = 0;
  floats.length = 0; shake = 0; botInput = null;
  if (ATTRACT) { ATTRACT.breaks = 0; ATTRACT.runs++; if (ATTRACT.brain && ATTRACT.brain.reset) ATTRACT.brain.reset(BOT); }
}
var BOT = {
  T: T, PW: PW, PH: PH, W: W, TS: TS, SPAWN: SPAWN, BLD: BLD, P: P,
  get S() { return S; }, get w() { return w; },
  stat: st, solid: solidAt, climbable: climbable, isLoose: isLoose,
  dead: function () { return P.dead > 0; },
  breaks: function () { return ATTRACT ? ATTRACT.breaks : 0; },
  canDig: function (x, y) {
    if (x <= 0 || x >= W - 1) return false;
    var id = w.get(x, y), h = Infinity; if (id === T.AIR) return true;
    try { h = WD.hardness(id, y, S.rebirths | 0); } catch (e) {}
    if (!isFinite(h)) return false;
    if (id === T.HARD) { var req = Infinity; try { req = WD.hardReq(y, S.rebirths | 0); } catch (e) {} if (st('pickPower', 1) < req) return false; }
    return true;
  },
  ladder: function () { var n = S.inventory.ladders; useLadder(); return S.inventory.ladders < n; },
  bagUsed: function () { try { return num(E.bagUsed(S), 0); } catch (e) { return 0; } },
  bagCap: function () { return st('bagCap', 28); },
  sell: function () { var c0 = num(S.coins, 0); doSell(); return num(S.coins, 0) - c0; },
  reset: function () { attractReset(); }
};
function attractStep(dt) {
  var A = ATTRACT;
  if (A.brain) botInput = A.brain.think(dt, BOT) || null;
  if (ATTRACT !== A) return;
  step(dt);
  if (W * TS > vw) cam.x = clamp(cam.x, vw / 2, W * TS - vw / 2);
  cam.y = Math.max(cam.y, -6 * TS);
}
function attractFrame(t) {
  var A = ATTRACT; if (!A) return; A.raf = 0;
  if (document.hidden) A.last = 0;
  else {
    var dt = A.last ? Math.min(0.1, (t - A.last) / 1000) : 1 / 60; A.last = t; A.acc += dt;
    var n = 0; while (A.acc >= 1 / 60 && n < 5 && ATTRACT === A) { guard(attractStep, 1 / 60); A.acc -= 1 / 60; n++; }
    if (n >= 5) A.acc = 0;
    if (ATTRACT === A) guard(renderScene, {hud: false});
  }
  if (ATTRACT === A) A.raf = requestAnimationFrame(attractFrame);
}
function attractStart(canvas, brain) {
  if (boot.done || !canvas || !canvas.getContext) return false;
  attractStop();
  var c2 = canvas.getContext('2d'); if (!c2) return false;
  ATTRACT = {raf: 0, last: 0, acc: 0, breaks: 0, runs: 0, brain: brain || null, onResize: null};
  cv = canvas; ctx = c2;
  try { attractReset(); resize(); } catch (e) { attractStop(); return false; }
  ATTRACT.onResize = function () { if (ATTRACT) resize(); };
  window.addEventListener('resize', ATTRACT.onResize);
  ATTRACT.raf = requestAnimationFrame(attractFrame);
  return true;
}
function attractStop() {
  var A = ATTRACT; if (!A) return;
  ATTRACT = null; botInput = null;
  if (A.raf) cancelAnimationFrame(A.raf);
  A.raf = 0;
  if (A.onResize) window.removeEventListener('resize', A.onResize);
  try { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); } catch (e) {}
  for (var i = 0; i < PMAX; i++) parts[i].a = 0;
  floats.length = 0; pickups = []; fuses = []; warns.clear(); shake = 0; dig.key = ''; mode = null;
  S = null; w = null; cv = ctx = null; tcache.clear(); rowCache.clear();
}

G.Game = {get S() { return S; }, get w() { return w; }, P: P, renderScene: function (o) { renderScene(o); },
  attract: {start: attractStart, stop: attractStop, running: function () { return !!(ATTRACT && ATTRACT.raf); }, api: BOT}};
if (E && WD) showLobby(); else document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:40%;width:100%;text-align:center">Failed to load game modules.</p>');
})();
</script>
