<style>

@media(max-width:700px){body.sb #bPlay{bottom:auto;top:128px;right:8px}#sbp{width:auto;left:8px;right:8px;top:auto;bottom:104px;height:auto;max-height:130px;flex-direction:row;flex-wrap:wrap;overflow:auto}#sbp .sbh{display:none}}

.grid{display:grid;gap:10px}.courses{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.lvls{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}

.lv{display:flex;flex-direction:column;align-items:center;padding:12px 4px;gap:2px}.lv b{font-size:22px}.lv small{color:var(--yellow);letter-spacing:.1em}

.win h2{font-size:30px;color:var(--green)}

.tr.empty{opacity:.35}#tray.lock{opacity:.5;pointer-events:none}

#bPlay.stop{background:linear-gradient(180deg,var(--red),#d9718b);color:#3a0f1d;border-color:#b24560;box-shadow:0 4px 0 #8f3550}
.world{margin:0 0 16px;padding:10px 12px;border-radius:16px;background:rgba(49,50,68,.45);border-left:5px solid var(--c)}.wh{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--c)}.wh span{color:var(--yellow)}
.lv small i{font-style:normal;color:var(--s2)}.lvls{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}.panel.wide{max-height:92vh;overflow:auto}
#scr:has(.title){background:rgba(10,16,40,.28)}
.sbl{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--sub);text-transform:uppercase}.sbl span{color:var(--yellow);float:right}
#sbp .sbg{display:flex;flex-wrap:wrap;gap:4px}
#hud{top:0}#tb{display:flex;gap:6px}
@media(max-width:600px){#tb button{width:36px;height:36px;font-size:15px}#tb{gap:4px;max-width:210px;flex-wrap:wrap}#info{padding:6px 10px;min-width:0}#lvn{font-size:11px}#lvs{font-size:11px}.tr{width:62px;padding:4px 2px}.tr img{width:38px;height:38px}#bPlay{bottom:92px;right:8px;padding:10px 16px;font-size:16px}#tray{bottom:6px}}
</style>
<script data-zd-discreet>/* Discrete Mode: follows the switch on the game library page (shared browser storage) */

function on(){try{return localStorage.getItem(KEY)==="1";}catch(e){return false;}}
function links(){return document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]');}
function apply(){if(busy)return;busy=true;try{var d=on();
 if(d){if(document.title!==FAKE){real=document.title;document.title=FAKE;}
  var ls=links(),i;if(!saved.length&&ls.length){for(i=0;i<ls.length;i++){if(!ls[i].hasAttribute("data-zd")){saved.push([ls[i],ls[i].getAttribute("href")]);}}}
  for(i=0;i<ls.length;i++){if(ls[i]!==made){ls[i].setAttribute("href",ICON);ls[i].removeAttribute("type");}}
  if(!ls.length&&!made&&document.head){made=document.createElement("link");made.rel="icon";made.setAttribute("data-zd","1");made.href=ICON;document.head.appendChild(made);}
 }else{if(real!==null&&document.title===FAKE){document.title=real;}real=null;
  for(var j=0;j<saved.length;j++){if(saved[j][1]===null)saved[j][0].removeAttribute("href");else saved[j][0].setAttribute("href",saved[j][1]);}saved=[];
  if(made&&made.parentNode){made.parentNode.removeChild(made);}made=null;}
}catch(e){}busy=false;}
apply();
document.addEventListener("DOMContentLoaded",function(){apply();var t=document.querySelector("title");if(t&&window.MutationObserver){new MutationObserver(apply).observe(t,{childList:true,characterData:true,subtree:true});}});
window.addEventListener("storage",function(e){if(e.key===KEY||e.key===null)apply();});

<script>
'use strict';
/* ===== PUTTLER CORE: deterministic physics engine ===== */
const R=10,G=1400,DT=1/240,VMAX=1250,TAU=Math.PI*2,WATER=840,BASE=1250;
// materials: e = bounciness, mu = friction
const MATS=[{e:.42,mu:.2},{e:.06,mu:.95},{e:.5,mu:.012},{e:.93,mu:.4},{e:.3,mu:1.3},{e:.5,mu:.15},{e:.2,mu:.2},{e:.36,mu:.22}];
const MAT_NAMES=['Grass','Sand','Ice','Rubber','Belt','Wood','Spring','Stone'];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hash4(a,b,c,d){let h=2166136261>>>0;for(const v of[a,b,c,d]){h^=(v|0)+0x9e3779b9;h=Math.imul(h,16777619)>>>0;h^=h>>>13}return h>>>0}
function area(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1]}return a/2}

// piece catalogue (shared by game, editor and generator)
const PIECES={
 ramp:{label:'Plank',hl:60,th:6,sel:66},
 block:{label:'Block',h:20,sel:34},
 wedge:{label:'Wedge',h:30,sel:40},
 bump:{label:'Bumper',r:26,sel:30},
 spring:{label:'Spring',hl:36,th:5,k:1050,sel:44},
 boost:{label:'Booster',hl:40,hw:16,sel:44},
 belt:{label:'Belt',hl:70,th:6,belt:250,sel:76},
 fan:{label:'Fan',len:230,hw:48,f:2500,sel:34},
 pa:{label:'Portal A',r:22,sel:26},
 pb:{label:'Portal B',r:22,sel:26}
};
const CELL=40;
function shapeVerts(p){const D=PIECES[p.t],a=rad(p.a||0),c=Math.cos(a),s=Math.sin(a);let v;
 if(p.t==='block')v=[[-D.h,-D.h],[D.h,-D.h],[D.h,D.h],[-D.h,D.h]];else v=[[-D.h,-D.h],[D.h,D.h],[-D.h,D.h]];
 return v.map(q=>[p.x+q[0]*c-q[1]*s,p.y+q[0]*s+q[1]*c])}
// footprint sample points of a piece (used for placement validity)
function footprint(p){const D=PIECES[p.t],a=rad(p.a||0),c=Math.cos(a),s=Math.sin(a),o=[[p.x,p.y]];
 const L=(hl,hw)=>{for(let u=-hl;u<=hl;u+=hl/3)for(const v of[-hw,0,hw])o.push([p.x+u*c-v*s,p.y+u*s+v*c])};
 switch(p.t){case'ramp':case'spring':case'belt':L(D.hl,D.th);break;case'boost':L(D.hl,D.hw);break;case'bump':case'pa':case'pb':for(let k=0;k<8;k++)o.push([p.x+Math.cos(k*.785)*D.r,p.y+Math.sin(k*.785)*D.r]);break;
  case'fan':L(14,34);break;default:for(const q of shapeVerts(p))o.push(q)}
 return o}


function gridSegs(lv){
 const gw=lv.gw,gh=lv.gh,so=lv.solid,out=[],S=(x,y)=>x>=0&&y>=0&&x<gw&&y<gh&&so[y*gw+x]===1;
 for(let y=0;y<=gh;y++){let st=0,x0=0;for(let x=0;x<=gw;x++){const t=x<gw?(S(x,y)&&!S(x,y-1)?1:(!S(x,y)&&S(x,y-1)?2:0)):0;
  if(t!==st){if(st)out.push([x0*CELL,y*CELL,x*CELL,y*CELL]);st=t;x0=x}}}
 for(let x=0;x<=gw;x++){let st=0,y0=0;for(let y=0;y<=gh;y++){const t=y<gh?(S(x,y)&&!S(x-1,y)?1:(!S(x,y)&&S(x-1,y)?2:0)):0;
  if(t!==st){if(st)out.push([x*CELL,y0*CELL,x*CELL,y*CELL]);st=t;y0=y}}}
 return out}
function compile(lv,pcs){
 const w={segs:[],mvs:[],circ:[],fans:[],boost:[],ports:[],hz:[],hole:lv.hole||null,water:lv.H+24,gs:lv.gs||1,x0:-160,x1:lv.W+160,top:-900,pa:null,pb:null};
 const add=(x1,y1,x2,y2,m,th,o)=>{const s={x1,y1,x2,y2,bx1:x1,by1:y1,bx2:x2,by2:y2,mnx:Math.min(x1,x2),mxx:Math.max(x1,x2),mny:Math.min(y1,y2),mxy:Math.max(y1,y2),th:th||0,e:m.e,mu:m.mu,k:0,belt:0,ok:0,mv:null};if(o)Object.assign(s,o);w.segs.push(s);return s};
 for(const g of (lv._g||(lv._g=gridSegs(lv))))add(g[0],g[1],g[2],g[3],MATS[7],0,{});
 for(const p of (pcs||[]))addPiece(w,p,add);
 if(w.pa&&w.pb)w.ports=[w.pa,w.pb];
 return w;
}
function addPiece(w,p,add){
 const a=rad(p.a||0),c=Math.cos(a),s=Math.sin(a),D=PIECES[p.t];
 switch(p.t){
  case'ramp':add(p.x-c*D.hl,p.y-s*D.hl,p.x+c*D.hl,p.y+s*D.hl,MATS[5],D.th,{ok:1});break;
  case'spring':add(p.x-c*D.hl,p.y-s*D.hl,p.x+c*D.hl,p.y+s*D.hl,MATS[6],D.th,{ok:1,k:D.k});break;
  case'belt':add(p.x-c*D.hl,p.y-s*D.hl,p.x+c*D.hl,p.y+s*D.hl,MATS[4],D.th,{ok:1,belt:D.belt});break;
  case'block':case'wedge':{const v=shapeVerts(p);for(let i=0;i<v.length;i++){const q=v[(i+1)%v.length];add(v[i][0],v[i][1],q[0],q[1],MATS[7],0,{ok:1})}break}
  case'bump':w.circ.push({x:p.x,y:p.y,r:D.r});break;
  case'boost':w.boost.push({x:p.x,y:p.y,c,s,hl:D.hl,hw:D.hw});break;
  case'fan':w.fans.push({x:p.x,y:p.y,c,s,len:D.len,hw:D.hw,f:D.f});break;
  case'pa':w.pa={x:p.x,y:p.y,c,s,r:D.r};break;
  case'pb':w.pb={x:p.x,y:p.y,c,s,r:D.r};break;
 }
}
function updMovers(w,t){
 for(const s of w.mvs){const m=s.mv;
  if(m.k===1){const th=m.ph+m.om*t,c=Math.cos(th),sn=Math.sin(th);
   s.x2=m.cx+(s.bx2-m.cx)*c-(s.by2-m.cy)*sn;s.y2=m.cy+(s.bx2-m.cx)*sn+(s.by2-m.cy)*c}
  else{const q=TAU*t/m.per+m.ph,o=m.amp*Math.sin(q);m.vel=m.amp*TAU/m.per*Math.cos(q);
   s.x1=s.bx1+m.ax*o;s.y1=s.by1+m.ay*o;s.x2=s.bx2+m.ax*o;s.y2=s.by2+m.ay*o}}
}
function mkSim(x,y){return{b:{x,y,vx:0,vy:0,cd:0,cb:0},t:0,st:'rest',rest:0,touch:0,ev:null,bad:0}}
function launch(s,a,p){const v=p*VMAX;s.b.vx=Math.cos(rad(a))*v;s.b.vy=-Math.sin(rad(a))*v;s.st='fly';s.t=0;s.rest=0;s.touch=9;s.bad=0}

function colSeg(b,s,sim){
 if(!s.mv){const rr=R+s.th+1;if(b.x<s.mnx-rr||b.x>s.mxx+rr||b.y<s.mny-rr||b.y>s.mxy+rr)return false}
 const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy;
 let t=l2>0?((b.x-s.x1)*dx+(b.y-s.y1)*dy)/l2:0;t=t<0?0:t>1?1:t;
 const cx=s.x1+t*dx,cy=s.y1+t*dy;let nx=b.x-cx,ny=b.y-cy;const rr=R+s.th,d2=nx*nx+ny*ny;
 if(d2>=rr*rr)return false;
 let d=Math.sqrt(d2);
 if(d<1e-7){const l=Math.sqrt(l2)||1;nx=dy/l;ny=-dx/l;d=0}else{nx/=d;ny/=d}
 const pen=rr-d;b.x+=nx*pen;b.y+=ny*pen;
 let svx=0,svy=0;const m=s.mv;
 if(m){if(m.k===1){svx=-m.om*(cy-m.cy);svy=m.om*(cx-m.cx)}else{svx=m.ax*m.vel;svy=m.ay*m.vel}}
 if(s.belt){const l=Math.sqrt(l2)||1;svx+=dx/l*s.belt;svy+=dy/l*s.belt}
 let rvx=b.vx-svx,rvy=b.vy-svy;const vn=rvx*nx+rvy*ny;
 if(vn<0){
  const e=-vn<45?0:s.e;let nv=-vn*e;if(s.k&&nv<s.k)nv=s.k;
  const J=nv-vn;rvx+=nx*J;rvy+=ny*J;
  const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty,mf=s.mu*J,f=vt>mf?-mf:vt<-mf?mf:-vt;
  rvx+=tx*f;rvy+=ty*f;b.vx=rvx+svx;b.vy=rvy+svy;
  if(-vn>80){if(!s.ok)sim.bad++;if(sim.ev)sim.ev.push({x:b.x,y:b.y,v:-vn,k:s.k?'spring':s.e>.8?'rubber':s.belt?'belt':s.ok?'wood':'hit'})}
 }
 return true;
}
function step(w,sim){
 const b=sim.b,dt=DT;
 if(w.mvs.length)updMovers(w,sim.t);
 b.vy+=G*w.gs*dt;
 for(const f of w.fans){const u=(b.x-f.x)*f.c+(b.y-f.y)*f.s,v=-(b.x-f.x)*f.s+(b.y-f.y)*f.c;
  if(u>0&&u<f.len&&v>-f.hw&&v<f.hw){const k=f.f*dt*(1-.35*u/f.len);b.vx+=f.c*k;b.vy+=f.s*k}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 let touch=false;
 for(let pass=0;pass<2;pass++)for(let i=0;i<w.segs.length;i++)if(colSeg(b,w.segs[i],sim))touch=true;
 for(const c of w.circ){const dx=b.x-c.x,dy=b.y-c.y,rr=c.r+R,d2=dx*dx+dy*dy;
  if(d2<rr*rr){const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d;b.x+=nx*(rr-d);b.y+=ny*(rr-d);
   const vn=b.vx*nx+b.vy*ny;if(vn<0){const nv=Math.max(-vn*1.05,420);b.vx+=nx*(nv-vn);b.vy+=ny*(nv-vn);
    if(sim.ev)sim.ev.push({x:b.x,y:b.y,v:-vn,k:'bump',cx:c.x,cy:c.y})}touch=true}}
 if(b.cb>0)b.cb-=dt;else for(const p of w.boost){const dx=b.x-p.x,dy=b.y-p.y,u=dx*p.c+dy*p.s,v=-dx*p.s+dy*p.c;
  if(u>-p.hl&&u<p.hl&&v>-p.hw-R*.5&&v<p.hw+R*.5){const al=b.vx*p.c+b.vy*p.s;if(al<900){b.vx+=p.c*(900-al);b.vy+=p.s*(900-al)}b.cb=.2;
   if(sim.ev)sim.ev.push({x:p.x,y:p.y,v:900,k:'boost'})}}
 if(b.cd>0)b.cd-=dt;else if(w.ports.length===2){for(let i=0;i<2;i++){const p=w.ports[i],dx=b.x-p.x,dy=b.y-p.y;
  if(dx*dx+dy*dy<18*18){const q=w.ports[1-i],sp=Math.max(Math.hypot(b.vx,b.vy)*.97,430);
   b.x=q.x+q.c*20;b.y=q.y+q.s*20;b.vx=q.c*sp;b.vy=q.s*sp;b.cd=.5;if(sim.ev)sim.ev.push({x:b.x,y:b.y,v:sp,k:'portal'});break}}}
 const sp2=b.vx*b.vx+b.vy*b.vy;
 if(sp2>3.8e6){const k=1950/Math.sqrt(sp2);b.vx*=k;b.vy*=k}
 sim.t+=dt;sim.touch=touch?0:sim.touch+1;
 if(b.y>w.water||b.x<w.x0||b.x>w.x1||b.y<w.top){sim.st='hazard';return}
 for(const h of w.hz){const cx=clamp(b.x,h.x,h.x+h.w),cy=clamp(b.y,h.y,h.y+h.h),dx=b.x-cx,dy=b.y-cy;
  if(dx*dx+dy*dy<(R*.8)*(R*.8)){sim.st='hazard';return}}
 if(w.hole){const dx=b.x-w.hole.x,dy=b.y-w.hole.y;if(dx*dx<400&&dy*dy<256&&sp2<490000){sim.st='sunk';return}}
 if(sim.touch<3&&sp2<144){sim.rest+=dt;if(sim.rest>.35){sim.st='rest';b.vx=b.vy=0}}else sim.rest=0;
 if(sim.t>18){sim.st='rest';b.vx=b.vy=0}
}
// run a full shot, returns the finished sim
function runShot(w,x,y,a,p,rec){
 const s=mkSim(x,y);launch(s,a,p);let i=0;
 while(s.st==='fly'){step(w,s);if(rec&&(i++&1)===0)rec.push({x:s.b.x,y:s.b.y,vx:s.b.vx,vy:s.b.vy,bad:s.bad,t:s.t})}
 return s;
}
// short preview until first impact (for the aim guide)
function preview(w,x,y,a,p,maxT){
 const s=mkSim(x,y);launch(s,a,p);const pts=[];let i=0,hit=false;
 s.ev=[];
 while(s.st==='fly'&&s.t<maxT&&!hit){step(w,s);if((i++%6)===0)pts.push([s.b.x,s.b.y]);if(s.ev.length&&s.t>.03)hit=true}
 return pts;
}

/* ===== PUTTLER 2 level generator (offline, solution-first by hill climbing) ===== */
const WORLD_NAMES=['Meadow','Hilltop','Bounce Park','Springy Woods','Turbo Trail','Conveyor Cove','Windy Ridge','Portal Peaks','Mixed Mayhem','Grand Finale'];
const WORLD_PIECES=[['ramp'],['block','wedge'],['bump'],['spring'],['boost'],['belt'],['fan'],['pa'],[],[]];
const PER_WORLD=10;
function allowedTypes(wi){const o=[];for(let k=0;k<=Math.min(wi,9);k++)for(const t of WORLD_PIECES[k]){o.push(t);if(t==='pa')o.push('pb')}
 if(wi>=8)return['ramp','block','wedge','bump','spring','boost','belt','fan','pa','pb'];return o}

function mkLevel(gw,gh){return{gw,gh,W:gw*CELL,H:gh*CELL,solid:new Uint8Array(gw*gh),gs:1,_g:null}}
function cellSolid(lv,cx,cy){return cx>=0&&cy>=0&&cx<lv.gw&&cy<lv.gh&&lv.solid[cy*lv.gw+cx]===1}
function rectFree(lv,x,y,w,h,m){for(let j=y-m;j<y+h+m;j++)for(let i=x-m;i<x+w+m;i++)if(cellSolid(lv,i,j))return false;return true}
function fillRect(lv,x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<lv.gw&&j<lv.gh)lv.solid[j*lv.gw+i]=1}
const snap=(v,s)=>Math.round(v/s)*s;

// ---- simulation helpers
function runLevel(lv,pcs,rec){
 const w=compile(lv,pcs),sp=lv.spawn,s=mkSim(sp.x,sp.y);s.b.vx=sp.vx||0;s.b.vy=sp.vy||0;s.st='fly';s.touch=9;
 const tr=rec?[]:null;let i=0;
 while(s.st==='fly'){step(w,s);if(tr&&(i++&1)===0)tr.push([s.b.x,s.b.y,s.b.vx,s.b.vy])}
 return{st:s.st,t:s.t,tr,bad:s.bad}
}
function scoreRun(lv,r){
 if(r.st==='sunk')return-100;let best=1e9;const h=lv.hole;
 for(const p of r.tr){const d=Math.hypot(p[0]-h.x,p[1]-h.y),sp=Math.hypot(p[2],p[3]);const v=d+(sp>650?(sp-650)*.06:0);if(v<best)best=v}
 return best}

// ---- placement validity
function pieceValid(lv,p,others,kk){
 const D=PIECES[p.t];
 for(const q of footprint(p)){
  if(q[0]<14||q[0]>lv.W-14||q[1]<14||q[1]>lv.H-14)return false;
  const e=10;for(const[dx,dy]of[[0,0],[e,0],[-e,0],[0,e],[0,-e]])if(cellSolid(lv,Math.floor((q[0]+dx)/CELL),Math.floor((q[1]+dy)/CELL)))return false}
 const sp=lv.spawn;if(Math.hypot(p.x-sp.x,p.y-sp.y)<D.sel+22)return false;
 if(Math.hypot(p.x-lv.hole.x,p.y-lv.hole.y)<D.sel+26)return false;
 for(const o of others){const d=Math.hypot(p.x-o.x,p.y-o.y);if(d<(D.sel+PIECES[o.t].sel)*(kk||.85))return false}
 return true}

// ---- candidate generation around a trajectory point
const ANG=(rnd,lo,hi,st)=>lo+Math.floor(rnd()*((hi-lo)/st+1))*st;
function mkCand(lv,rnd,t,tr){
 const i=Math.floor(rnd()*tr.length),P=tr[i],sp=Math.hypot(P[2],P[3])||1,vx=P[2]/sp,vy=P[3]/sp,h=lv.hole;
 const toH=deg(Math.atan2(h.y-P[1],h.x-P[0]));
 const J=(v,m)=>snap(v+(rnd()*2-1)*m,5);
 switch(t){
  case'ramp':return[{t,x:J(P[0],12),y:J(P[1]+6,12),a:ANG(rnd,-75,75,5)}];
  case'spring':return[{t,x:J(P[0],12),y:J(P[1]+6,12),a:ANG(rnd,-60,60,5)}];
  case'belt':return[{t,x:J(P[0],10),y:J(P[1]+16,10),a:ANG(rnd,-40,40,5)}];
  case'block':{const d=30+rnd()*24;return[{t,x:J(P[0]+vx*d,10),y:J(P[1]+vy*d,10),a:ANG(rnd,0,85,5)}]}
  case'wedge':{const d=30+rnd()*30;return[{t,x:J(P[0]+vx*d,10),y:J(P[1]+vy*d,10),a:ANG(rnd,0,355,15)}]}
  case'bump':{const d=34+rnd()*18,o=(rnd()*2-1)*24;return[{t,x:J(P[0]+vx*d-vy*o,5),y:J(P[1]+vy*d+vx*o,5),a:0}]}
  case'boost':return[{t,x:J(P[0],8),y:J(P[1],8),a:snap(toH+(rnd()*2-1)*45,5)}];
  case'fan':{const a=snap(toH+(rnd()*2-1)*50,5),d=30+rnd()*90;return[{t,x:J(P[0]-Math.cos(rad(a))*d,5),y:J(P[1]-Math.sin(rad(a))*d,5),a}]}
  case'pa':{const B={t:'pb',x:J(40+rnd()*(lv.W-80),5),y:J(40+rnd()*(lv.H-120),5),a:ANG(rnd,0,345,15)};
   return[{t:'pa',x:J(P[0],4),y:J(P[1],4),a:0},B]}
 }
 return[]}

function pickType(rnd,types,must,num){
 const W={ramp:3,block:1.2,wedge:1.2,bump:1.5,spring:1.5,boost:1.6,belt:1.2,fan:1.3,pa:1.1};
 const pool=types.filter(t=>t!=='pb');let tot=0;const ws=pool.map(t=>{let w=W[t]||1;if(must&&must.includes(t))w*=3.5;tot+=w;return w});
 let r=rnd()*tot;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}return pool[0]}

function jitterSet(rnd,pcs,tol,atol){return pcs.map(p=>({t:p.t,x:p.x+(rnd()*2-1)*tol,y:p.y+(rnd()*2-1)*tol,a:(p.a||0)+(rnd()*2-1)*atol}))}
function robust(lv,pcs,rnd,tol,atol,n,need){let ok=0;for(let k=0;k<n;k++){const r=runLevel(lv,jitterSet(rnd,pcs,tol,atol));if(r.st==='sunk')ok++}return ok>=need}

function reduce(lv,pcs){ // drop redundant pieces
 let cur=pcs.slice();
 for(let i=cur.length-1;i>=0;i--){const t=cur.slice();t.splice(i,1);
  // portals must be removed together
  if(cur[i].t==='pa'||cur[i].t==='pb')continue;
  if(runLevel(lv,t).st==='sunk')cur=t}
 return cur}

// hill-climb search on a fixed terrain
function solve(lv,rnd,o){
 const types=o.types,must=o.must;let pcs=[],cur=runLevel(lv,pcs,true);cur.score=scoreRun(lv,cur);
 const maxP=o.maxPieces;
 for(let it=0;it<maxP+2;it++){
  let best=null;
  for(let k=0;k<o.K;k++){
   const t=pickType(rnd,types,must,pcs.length);
   const cand=mkCand(lv,rnd,t,cur.tr);if(!cand.length)continue;
   let ok=true;const acc=pcs.slice();for(const c of cand){if(!pieceValid(lv,c,acc)){ok=false;break}acc.push(c)}
   if(!ok)continue;
   const r=runLevel(lv,acc,true);r.score=scoreRun(lv,r);
   if(r.st==='sunk'){
    const red=reduce(lv,acc);
    if(robust(lv,red,rnd,o.tol,o.atol,8,7))return red;
    continue}
   if(!best||r.score<best.score)best={pcs:acc,r}
  }
  if(!best)return null;
  // refine existing pieces
  pcs=best.pcs;cur=best.r;
  for(let k=0;k<o.R;k++){
   const j=Math.floor(rnd()*pcs.length),q=pcs[j];
   const n={t:q.t,x:snap(q.x+(rnd()*2-1)*25,5),y:snap(q.y+(rnd()*2-1)*25,5),a:q.a};
   if(rnd()<.6&&q.t!=='bump'&&q.t!=='pa'&&q.t!=='pb'&&q.t!=='block')n.a=snap((q.a||0)+(rnd()*2-1)*25,5);
   const others=pcs.filter((_,i)=>i!==j);if(!pieceValid(lv,n,others))continue;
   const np=pcs.slice();np[j]=n;const r=runLevel(lv,np,true);r.score=scoreRun(lv,r);
   if(r.st==='sunk'){const red=reduce(lv,np);if(robust(lv,red,rnd,o.tol,o.atol,8,7))return red;continue}
   if(r.score<cur.score){pcs=np;cur=r}
  }
  if(pcs.length>=maxP)break;
 }
 return null}

// ---- terrain
function genTerrain(rnd,E,wi,idx){
 const gw=24,gh=14,lv=mkLevel(gw,gh);
 const left=rnd()<.5,hw=3+Math.floor(rnd()*3),sr=1+Math.floor(rnd()*3);
 const dx=Math.round(lerp(4,12,E)+rnd()*3-1);               // horizontal distance spawn -> hole (cells)
 const lo=left?2:2+dx,hi=left?gw-3-dx:gw-3;
 const sc=lo+Math.floor(rnd()*Math.max(1,hi-lo+1));
 const vx=(wi>=1&&rnd()<.55)?(left?1:-1)*[110,190,270][Math.floor(rnd()*3)]:0;
 lv.spawn={x:sc*CELL+20,y:sr*CELL+20,vx,vy:0};
 const hr=clamp(sr+4+Math.floor(rnd()*(4+E*3)),6,12);
 const hcC=left?sc+dx:sc-dx;let hc0=clamp(Math.round(hcC-hw/2),1,gw-1-hw);
 fillRect(lv,hc0,hr,hw,1);
 lv.hole={x:(hc0+hw/2)*CELL,y:hr*CELL-R};
 // optional thicker base under the hole platform for visuals
 if(rnd()<.5)fillRect(lv,hc0+1,hr+1,hw-2,1);
 if(rnd()<E*1.1){fillRect(lv,hc0-1,hr-2,1,2);fillRect(lv,hc0+hw,hr-2,1,2);   // pocket walls
  if(rnd()<.75){const k=1+Math.floor(rnd()*Math.max(1,hw-2));if(rnd()<.5)fillRect(lv,hc0-1,hr-3,1+k,1);else fillRect(lv,hc0+hw-k,hr-3,1+k,1)}}   // roof ledge
 const exS={x:sc-2,y:sr-1,w:5,h:5},exH={x:hc0-3,y:hr-5,w:hw+6,h:7};
 const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
 const nObs=Math.round(wi===0?1+E*3:2+E*6+rnd()*2);
 let tries=0,placed=0;
 while(placed<nObs&&tries++<200){
  const k=rnd();let r;
  if(k<.5){const w=2+Math.floor(rnd()*(3+E*3)),x=1+Math.floor(rnd()*(gw-w-2)),y=3+Math.floor(rnd()*8);r={x,y,w,h:1}}
  else if(k<.8){const h=2+Math.floor(rnd()*(2+E*3)),x=4+Math.floor(rnd()*(gw-8)),y=2+Math.floor(rnd()*7);r={x,y,w:1,h}}
  else{ // wall hanging from the ceiling or rising from the bottom, between spawn and hole
   const x=8+Math.floor(rnd()*8),h=2+Math.floor(rnd()*(3+E*3));r=rnd()<.5?{x,y:0,w:1,h}:{x,y:gh-h,w:1,h}}
  if(hit(r,exS)||hit(r,exH))continue;
  if(!rectFree(lv,r.x,r.y,r.w,r.h,1))continue;
  fillRect(lv,r.x,r.y,r.w,r.h);placed++}
 return lv}

// ---- top level
function genLevel(idx,attemptBase,relax){
 const N=PER_WORLD*10,wi=Math.floor(idx/PER_WORLD),li=idx%PER_WORLD,E=Math.min(1,idx/(N-1));
 const types=allowedTypes(wi);
 const must=(li<2&&wi<8)?WORLD_PIECES[wi]:null;
 const need=Math.min(5,1+Math.floor((idx+4)/16));
 const tol=lerp(14,6,E),atol=lerp(11,5,E);
 for(let at=attemptBase||0;at<(attemptBase||0)+300;at++){
  const rnd=rng(hash4(idx,at,4242,9));
  const lv=genTerrain(rnd,E,wi,idx);
  if(runLevel(lv,[]).st==='sunk')continue;
  const maxP=Math.min(need+2,8);
  const sol=solve(lv,rnd,{types,must,K:70,R:40,maxPieces:maxP,tol,atol});
  if(!sol)continue;
  const nP=sol.filter(p=>p.t!=='pb').length;
  if(nP<need-(need>2?1:0)-(relax||0))continue;                       // too easy for this slot
  if(must&&!sol.some(p=>must.includes(p.t)))continue;     // must showcase the new piece
  // inventory = solution pieces + a decoy or two on later levels
  const inv={};for(const p of sol){if(p.t==='pb')continue;inv[p.t]=(inv[p.t]||0)+1}
  if(wi>=1&&rnd()<.5+E*.4){const pool=types.filter(t=>t!=='pb'&&t!=='pa'&&!inv[t]);if(pool.length)inv[pool[Math.floor(rnd()*pool.length)]]=1}
  if(inv.pa)inv.pb=inv.pa;
  lv.inv=inv;lv.sol=sol.map(p=>({t:p.t,x:Math.round(p.x),y:Math.round(p.y),a:Math.round(p.a||0)}));
  lv.par=nP;lv.world=wi;lv.idx=idx;lv.attempt=at;
  return lv}
 return null}

function verifyLevel(lv){return runLevel(lv,lv.sol).st==='sunk'&&runLevel(lv,[]).st!=='sunk'}
// serialise for the table
function packLevel(lv){const rows=[];for(let y=0;y<lv.gh;y++){let s='';for(let x=0;x<lv.gw;x++)s+=lv.solid[y*lv.gw+x]?'#':'.';rows.push(s)}
 return{gw:lv.gw,gh:lv.gh,rows,spawn:lv.spawn,hole:lv.hole,inv:lv.inv,sol:lv.sol,par:lv.par,world:lv.world,idx:lv.idx}}
function unpackLevel(d){const lv=mkLevel(d.gw,d.gh);for(let y=0;y<d.gh;y++)for(let x=0;x<d.gw;x++)lv.solid[y*d.gw+x]=d.rows[y][x]==='#'?1:0;

/* ---------- camera (fit the level into the free area of the screen) ---------- */
const CAM={ox:0,oy:0,z:1,padL:0,padT:60,padB:112};

 const L=lv||S.lv;if(!L)return;
 CAM.padL=(S.mode==='sandbox'&&VW>700)?164:0;CAM.padT=60;CAM.padB=VW<600?104:116;if(S.mode==='sandbox'&&VW<=700)CAM.padB+=150;
 const aw=VW-CAM.padL-16,ah=VH-CAM.padT-CAM.padB;

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);VW=window.innerWidth;VH=window.innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';bgDirty=true;fitCam()}

function hillY(x,L,i){const f=[.004,.0065,.009][i],a=[46,38,30][i],ph=[1.3,.2,2.6][i];return a*Math.sin(x*f+ph)+a*.55*Math.sin(x*f*2.3+ph*1.7)}

 const w=S.lv?S.lv.world:(S.titleWorld||0),key=[VW,VH,DPR,w].join();if(!bgDirty&&bgKey===key&&bgCanvas)return;

 const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,th.skyT);g.addColorStop(1,th.skyB);c.fillStyle=g;c.fillRect(0,0,VW,VH);

/* ---------- levels ---------- */
function levelFromTable(i){const lv=unpackLevel(TABLE[i]);lv.name=WORLD_NAMES[lv.world]+' '+(i%PER_WORLD+1);lv.gs=1;return lv}
function resetState(){S.pcs=[];S.sel=null;S.tool=null;S.phase='edit';S.sim=null;S.w=null;S.hints=0;S.trail=[];S.pv=null;S.revealed=false;S.tries=0;S.drag=null;S.paint=null;PT.length=0;syncUI()}
function loadLevel(i){document.body.classList.remove('sb');S.mode='play';S.demo=null;S.lv=levelFromTable(i);S.idx=i;S.inv=S.lv.inv;resetState();fitCam();hideScreen();showHud();buildTray();bgDirty=true;updInfo();
 tip(i===0?'Pick a shape below, tap the sky to place it, then press PLAY. Guide the ball to the flag! 🚩':(S.lv.idx%PER_WORLD===0?'New world: '+WORLD_NAMES[S.lv.world]+(WORLD_PIECES[S.lv.world].length?' — try the new piece!':''):''),4200)}
function tip(m,ms){clearTimeout(tip.t);if(!m){tipEl.classList.add('hidden');return}tipEl.textContent=m;tipEl.classList.remove('hidden');tip.t=setTimeout(()=>tipEl.classList.add('hidden'),ms||3000)}
function loadSandbox(){tip('');document.body.classList.add('sb');S.mode='sandbox';S.demo=null;let d=null;try{d=JSON.parse(localStorage.getItem('puttler2_sb')||'null')}catch(e){}
 if(d&&d.rows){S.lv=unpackLevel(d);S.lv.gs=d.gs||1;S.lv.world=d.world||0;S.pcs=d.pcs||[]}else{
  const lv=mkLevel(24,14);fillRect(lv,2,5,5,1);fillRect(lv,16,9,5,1);fillRect(lv,10,7,1,3);lv.spawn={x:140,y:100,vx:0,vy:0};lv.hole={x:18.5*CELL,y:9*CELL-R};lv.world=0;lv.inv={};S.lv=lv;S.pcs=[]}
 S.lv.name='Sandbox';S.inv={};for(const t of ALLT)S.inv[t]=Infinity;
 const keep=S.pcs;resetState();S.pcs=keep;S.pcs.forEach(p=>p.id=S.nid++);S.tool='wall';fitCam();hideScreen();showHud();buildTray();buildSbp();bgDirty=true;updInfo()}
function sbSave(){if(!isSB())return;try{const d=packLevel(S.lv);d.gs=S.lv.gs;d.pcs=S.pcs.map(p=>({t:p.t,x:p.x,y:p.y,a:p.a||0}));d.inv=d.inv||{};d.sol=[];d.par=0;localStorage.setItem('puttler2_sb',JSON.stringify(d))}catch(e){}}
function startDemo(){document.body.classList.remove('sb');S.mode='title';S.demo={i:0,t:0};S.lv=levelFromTable(0);S.inv=S.lv.inv;resetState();S.pcs=S.lv.sol.map(p=>({...p,id:S.nid++}));S.demoT=0;fitCam();hideHud();bgDirty=true}
function updInfo(){if(!S.lv)return;$('#lvn').textContent=S.lv.name;
 $('#lvs').innerHTML=isSB()?'unlimited pieces':'pieces <b>'+nPieces()+'</b> · par '+S.lv.par+' · '+'★'.repeat(starsOf(S.idx))+'☆'.repeat(3-starsOf(S.idx))}
function showHud(){hud.classList.remove('hidden');trayEl.classList.remove('hidden');bPlay.classList.remove('hidden');$('#bHint').classList.toggle('hidden',isSB());sbp.classList.toggle('hidden',!isSB())}
function hideHud(){hud.classList.add('hidden');trayEl.classList.add('hidden');bPlay.classList.add('hidden');sbp.classList.add('hidden');selbar.classList.add('hidden');tipEl.classList.add('hidden')}

/* ---------- tray ---------- */
function buildTray(){
 let h='';for(const t of ALLT){if(S.inv[t]===undefined)continue;const n=remaining(t);
  h+=`<button class="tr${S.tool==='p:'+t?' on':''}${n<=0?' empty':''}" data-t="${t}"><img src="${pieceIcon(t)}" draggable="false"><span>${PIECES[t].label}</span><b>${n===Infinity?'∞':n}</b></button>`}
 trayEl.innerHTML=h;updInfo();S.pv=null;sbSave()}
trayEl.addEventListener('pointerdown',e=>{const b=e.target.closest('.tr');if(!b||S.phase!=='edit')return;resumeAudio();
 const t=b.dataset.t;S.trayDrag={t,x0:e.clientX,y0:e.clientY,moved:false,mouse:e.pointerType==='mouse'}});
window.addEventListener('pointermove',e=>{S.mouse.x=e.clientX;S.mouse.y=e.clientY;
 const d=S.trayDrag;if(d&&!d.moved&&d.mouse&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>8)d.moved=true;
 if(S.drag)dragMove(e);if(S.paint)paintAt(e.clientX,e.clientY)});
window.addEventListener('pointerup',e=>{
 const d=S.trayDrag;S.trayDrag=null;
 if(d){if(d.moved){if(e.clientY<VH-110||e.target===cv){if(remaining(d.t)>0)placeNew(d.t,...worldSnap(e.clientX,e.clientY))}}
  else{const k='p:'+d.t;S.tool=S.tool===k?null:k;if(remaining(d.t)<=0){S.tool=null;SFX.err()}else SFX.click();buildTray()}}
 if(S.drag)dragEnd(e);S.paint=null});
function worldSnap(sx,sy){const[x,y]=toW(sx,sy);return[snap(x,5),snap(y,5)]}

/* ---------- placing / editing pieces ---------- */
function canPlace(p,ignore){return pieceValid(S.lv,p,S.pcs.filter(q=>q!==ignore),.6)}
function placeNew(t,x,y){if(S.phase!=='edit'||remaining(t)<=0)return false;
 const p={id:S.nid++,t,x,y,a:DEFA[t]||0};if(!canPlace(p)){SFX.err();toast('Can\'t place there 🚫',700);return false}
 S.pcs.push(p);S.sel=p;SFX.place();burst(x,y,'#ffffff',8,120,60,2.5);if(remaining(t)<=0&&S.tool==='p:'+t)S.tool=null;buildTray();return true}
function removePiece(p){const i=S.pcs.indexOf(p);if(i<0)return;S.pcs.splice(i,1);if(S.sel===p)S.sel=null;if(p.t==='pa'||p.t==='pb'){}buildTray();SFX.click()}
function rotSel(d){const p=S.sel;if(!p||S.phase!=='edit'||p.t==='bump')return;const a=(p.a||0)+d,n={...p,a:((a+540)%360)-180};if(canPlace(n,p)){p.a=n.a;SFX.click();S.pv=null;sbSave()}else SFX.err()}
function hitPiece(p,x,y){const D=PIECES[p.t],a=rad(p.a||0),dx=x-p.x,dy=y-p.y,u=dx*Math.cos(a)+dy*Math.sin(a),v=-dx*Math.sin(a)+dy*Math.cos(a);
 switch(p.t){case'ramp':case'spring':case'belt':return Math.abs(u)<D.hl+8&&Math.abs(v)<18;case'boost':return Math.abs(u)<D.hl&&Math.abs(v)<D.hw+4;
  case'block':case'wedge':return Math.abs(u)<D.h+4&&Math.abs(v)<D.h+4;case'fan':return u>-18&&u<14&&Math.abs(v)<40;default:return dx*dx+dy*dy<(D.r+6)*(D.r+6)}}
function pieceAt(x,y){for(let i=S.pcs.length-1;i>=0;i--)if(hitPiece(S.pcs[i],x,y))return S.pcs[i];return null}
function dragMove(e){const d=S.drag,[wx,wy]=toW(e.clientX,e.clientY);if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<5)return;d.moved=true;
 const p=d.p;p.x=snap(wx-d.ox,5);p.y=snap(wy-d.oy,5);p.bad=!canPlace(p,p);p.outTray=e.clientY>VH-100}
function dragEnd(e){const d=S.drag;S.drag=null;if(!d)return;const p=d.p;
 if(d.moved){if(p.outTray){removePiece(p);return}if(p.bad){p.x=d.x0;p.y=d.y0;SFX.err()}else SFX.place();p.bad=false;S.pv=null;sbSave()}}

cv.addEventListener('pointerdown',e=>{resumeAudio();if(e.button===2)return;if(S.mode==='title'||S.phase!=='edit')return;
 const[wx,wy]=toW(e.clientX,e.clientY),lv=S.lv;S.mouse.x=e.clientX;S.mouse.y=e.clientY;
 if(isSB()&&['wall','erase'].includes(S.tool)){S.paint={v:S.tool==='wall'?1:0};paintAt(e.clientX,e.clientY);return}
 if(isSB()&&S.tool==='spawn'){lv.spawn.x=snap(wx,5);lv.spawn.y=snap(wy,5);sbSave();SFX.place();return}
 if(isSB()&&S.tool==='hole'){lv.hole.x=snap(wx,5);lv.hole.y=snap(wy,5);sbSave();SFX.place();return}
 const hit=pieceAt(wx,wy);
 if(hit){S.sel=hit;S.tool=S.tool&&S.tool.startsWith('p:')?null:S.tool;S.drag={p:hit,sx:e.clientX,sy:e.clientY,ox:wx-hit.x,oy:wy-hit.y,x0:hit.x,y0:hit.y,moved:false};buildTray();return}
 if(S.tool&&S.tool.startsWith('p:')){placeNew(S.tool.slice(2),snap(wx,5),snap(wy,5));return}
 S.sel=null});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(S.tool&&S.tool.startsWith('p:')){S.tool=null;buildTray()}else{const[wx,wy]=toW(e.clientX,e.clientY),h=pieceAt(wx,wy);if(h)removePiece(h)}});
cv.addEventListener('wheel',e=>{if(S.sel&&S.phase==='edit'){e.preventDefault();rotSel(e.deltaY>0?5:-5)}},{passive:false});
function paintAt(sx,sy){const lv=S.lv,[wx,wy]=toW(sx,sy),cx=Math.floor(wx/CELL),cy=Math.floor(wy/CELL);if(cx<0||cy<0||cx>=lv.gw||cy>=lv.gh)return;
 const i=cy*lv.gw+cx;if(lv.solid[i]===S.paint.v)return;
 if(S.paint.v){const sp=lv.spawn,h=lv.hole;if(Math.hypot(sp.x-(cx+.5)*CELL,sp.y-(cy+.5)*CELL)<34||Math.hypot(h.x-(cx+.5)*CELL,h.y-(cy+.5)*CELL)<34)return}
 lv.solid[i]=S.paint.v;lv._g=null;S.pv=null;SFX.click();sbSave()}

/* ---------- running the ball ---------- */
function togglePlay(){if(S.mode==='title')return;if(S.phase==='edit')startRun();else if(S.phase==='run'||S.phase==='sunk'||S.phase==='lost')stopRun()}
function startRun(){if(S.phase!=='edit')return;resumeAudio();const lv=S.lv,sp=lv.spawn;S.w=compile(lv,S.pcs);S.sim=mkSim(sp.x,sp.y);S.sim.b.vx=sp.vx||0;S.sim.b.vy=sp.vy||0;S.sim.st='fly';S.sim.touch=9;S.sim.ev=[];
 S.phase='run';S.trail=[];S.sel=null;S.tool=null;S.tries++;S.pv=null;SFX.click();syncUI()}
function stopRun(){S.phase='edit';S.sim=null;S.w=null;S.trail=[];clearTimeout(S.winTO);scrHide();syncUI()}
function syncUI(){if(S.demo)return;bPlay.textContent=S.phase==='edit'?'▶ PLAY':'■ STOP';bPlay.classList.toggle('stop',S.phase!=='edit');
 trayEl.classList.toggle('lock',S.phase!=='edit');buildTrayCls()}
function buildTrayCls(){$$('.tr',trayEl).forEach(b=>b.classList.toggle('on',S.tool==='p:'+b.dataset.t))}
const evT_={};function sfxEv(e){if(S.demo)return;const k=e.k,n=T;if(evT_[k]&&n-evT_[k]<.05)return;evT_[k]=n;
 if(k==='spring'){SFX.spring();burst(e.x,e.y,'#f9e2af',10,260,120,3)}else if(k==='bump'){SFX.bump();PULSE[(e.cx|0)+','+(e.cy|0)]=T;burst(e.x,e.y,'#f5c2e7',10,240,60,3)}
 else if(k==='boost'){SFX.boost();burst(e.x,e.y,'#f9e2af',12,300,40,3)}else if(k==='portal'){SFX.portal();burst(e.x,e.y,'#89b4fa',14,260,0,3)}
 else{SFX.hit(e.v,k);if(e.v>260)burst(e.x,e.y,'#e8e8f2',4,140,50,2.2)}}
function stepRun(dt){
 const s=S.sim;let acc=(stepRun.acc||0)+dt*S.speed;let n=0;
 while(acc>=DT&&s.st==='fly'&&n<60){step(S.w,s);acc-=DT;n++;if((s.t*60|0)!==stepRun.lt){stepRun.lt=s.t*60|0;S.trail.push([s.b.x,s.b.y]);if(S.trail.length>34)S.trail.shift()}}
 stepRun.acc=acc;
 for(const e of s.ev)sfxEv(e);s.ev.length=0;
 if(s.st!=='fly')endRun(s.st)}
function endRun(st){
 if(st==='sunk'){S.phase='sunk';S.sinkT=T;if(!S.demo)SFX.sink();const h=S.lv.hole;confetti(h.x,h.y);if(!S.demo&&!isSB())S.winTO=setTimeout(onWin,950);else if(isSB()){toast('Hole in! 🎉',1200);S.winTO=setTimeout(()=>{if(S.phase==='sunk')stopRun()},1300)}}
 else{S.phase='lost';S.endT=T;if(!S.demo){if(st==='hazard'){SFX.splash();toast('Fell off the map 💦 — adjust and retry',1500)}else{SFX.err();toast('Ball stopped 🛑 — adjust and retry',1500)}}
  S.winTO=setTimeout(()=>{if(S.phase==='lost')stopRun()},S.demo?600:1300)}}
function onWin(){if(S.phase!=='sunk')return;const n=nPieces(),par=S.lv.par,st=S.revealed?1:n<=par?3:n<=par+1?2:1,old=starsOf(S.idx);
 if(st>old){SAVE.stars[S.idx]=st;persist()}updInfo();
 const nxt=S.idx+1<NLV;
 scrShow(`<div class="panel win"><h2>Level complete! 🎉</h2><div class="stars">${[0,1,2].map(i=>`<span class="star${i<st?' on':''}" style="--d:${i*.18}s">★</span>`).join('')}</div>
  <div class="dim">${S.lv.name} · pieces used <b style="color:var(--yellow)">${n}</b> / par ${par}${S.revealed?' · (hint used)':''}</div>
  <div class="row">${nxt?'<button class="big" data-a="next">Next ▶</button>':'<button class="big" data-a="levels">All levels 🏆</button>'}<button data-a="retry">↺ Retry</button><button data-a="levels">☰ Levels</button></div></div>`,true);
 for(let i=0;i<st;i++)SFX.star(i)}

/* ---------- hint / solution ---------- */
function hint(){if(S.phase!=='edit'||isSB())return;const sol=S.lv.sol;if(S.hints>=sol.length){toast('That\'s the whole solution — drag to adjust 😉',1800);return}S.hints++;S.revealed=true;SFX.click();toast(`Hint ${S.hints}/${sol.length} 💡 (stars capped to 1)`,1800)}
function placeSolution(){stopRun();S.pcs=S.lv.sol.map(p=>({...p,id:S.nid++}));S.revealed=true;S.hints=0;buildTray()}

/* ---------- screens ---------- */
function scrShow(h,win){scr.innerHTML=h;scr.classList.add('on');scr.classList.toggle('win',!!win)}
function scrHide(){scr.classList.remove('on');scr.innerHTML=''}
const hideScreen=scrHide;
function titleScreen(){startDemo();scrShow(`<div class="title"><h1>PUT<span>TLER</span></h1><p>place the shapes · guide the ball · sink the hole</p>
 <div class="menu"><button class="big" data-a="cont">▶ ${Object.keys(SAVE.stars).length?'Continue':'Play'}</button><button data-a="levels">🗺 Levels</button><button data-a="sandbox">🧪 Sandbox</button><button data-a="opts">⚙ Options</button><button data-a="help">❓ How to play</button></div></div>`)}
function levelScreen(){
 let h=`<div class="panel wide"><div class="hd"><h2>Choose a level</h2><button data-a="title">⌂ Home</button></div>`;
 for(let w=0;w<NWORLD;w++){const th=themeOf(w);h+=`<div class="world" style="--c:${hsl(th.h,.7,.7)}"><div class="wh"><b>${w+1}. ${WORLD_NAMES[w]}</b><span>★ ${worldStars(w)}/${PER_WORLD*3}</span></div><div class="grid lvls">`;
  for(let k=0;k<PER_WORLD;k++){const i=w*PER_WORLD+k;if(i>=NLV)break;const lk=!unlocked(i),s=starsOf(i);
   h+=`<button class="lv${lk?' lock':''}" ${lk?'disabled':''} data-a="lv" data-i="${i}"><b>${lk?'🔒':k+1}</b><small>${lk?'':'★'.repeat(s)+'<i>'+'★'.repeat(3-s)+'</i>'}</small></button>`}
  h+='</div></div>'}
 scrShow(h+'</div>');S.mode==='title'||0}
function optsScreen(back){const o=SAVE.o,tg=(k,l)=>`<button class="tog${o[k]?' on':''}" data-a="tog" data-k="${k}"><span>${l}</span><i></i></button>`;
 scrShow(`<div class="panel"><h2>Options</h2><div class="menu">${tg('snd','Sound effects')}${tg('mus','Music')}${tg('path','Show ball path preview')}${tg('unlock','Unlock all levels')}
 <button class="danger" data-a="reset">Reset progress</button><button data-a="${back||'title'}">⬅ Back</button></div></div>`)}
function helpScreen(back){scrShow(`<div class="panel wide help"><div class="hd"><h2>How to play</h2><button data-a="${back||'title'}">✕</button></div><div class="cols"><div>
 <h3>Goal</h3><p>The ball drops from its start point when you press <b>PLAY</b>. Place the shapes from your tray so the ball ends up in the hole under the 🚩 flag. Every level is solvable with the pieces you get.</p>
 <h3>Placing</h3><p><b>Tap</b> a shape in the tray, then tap the sky to place it — or <b>drag</b> it out. Drag a placed piece to move it, drag it onto the tray to put it back. <b>Rotate</b> with the ↺ ↻ buttons, mouse wheel, or <b>Q / E</b>. <b>Del</b> removes it.</p>
 <h3>Stars</h3><p>Use no more pieces than <b>par</b> for ★★★. Using hints caps the level at ★.</p></div><div>
 <h3>Pieces</h3><p><b>Plank</b> slides &amp; bounces · <b>Block / Wedge</b> solid stone · <b>Bumper</b> pings the ball · <b>Spring</b> launches it · <b>Booster</b> kicks it forward · <b>Belt</b> carries it · <b>Fan</b> blows it · <b>Portals</b> teleport it (place both!).</p>
 <h3>Keys</h3><p><b>Space</b> play/stop · <b>Q E</b> rotate (Shift = 15°) · <b>Del</b> delete · <b>H</b> hint · <b>C</b> clear · <b>F</b> fast-forward · <b>Esc</b> menu</p>
 <h3>Sandbox</h3><p>Paint walls, move the ball and hole, use unlimited pieces, tweak gravity &amp; launch speed, and export your level as text.</p></div></div></div>`)}
function menuScreen(){scrShow(`<div class="panel"><h2>${S.lv.name}</h2><div class="menu"><button class="big" data-a="resume">▶ Resume</button>${isSB()?'':'<button data-a="retry">↺ Restart level</button>'}<button data-a="${isSB()?'sbback':'levels'}">${isSB()?'⌂ Home':'🗺 Levels'}</button><button data-a="opts2">⚙ Options</button><button data-a="help2">❓ How to play</button></div></div>`)}
scr.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){if(e.target===scr&&S.mode!=='title'&&!scr.classList.contains('win')&&!$('.panel.wide',scr))scrHide();return}resumeAudio();SFX.click();
 const a=b.dataset.a;
 switch(a){
  case'cont':{let i=0;while(i<NLV-1&&starsOf(i)>0)i++;loadLevel(i);break}
  case'levels':if(S.mode!=='title'){stopRun();S.mode='title';startDemoQuiet()}hideHud();levelScreen();break;
  case'lv':loadLevel(+b.dataset.i);break;
  case'title':titleScreen();break;
  case'next':loadLevel(S.idx+1);break;
  case'retry':scrHide();stopRun();S.pcs=[];S.hints=0;S.revealed=false;S.tries=0;S.sel=null;buildTray();break;
  case'sandbox':loadSandbox();break;
  case'sbback':sbSave();titleScreen();break;
  case'opts':optsScreen('title');break;case'opts2':optsScreen('menu');break;
  case'help':helpScreen('title');break;case'help2':helpScreen('menu');break;

  case'resume':scrHide();break;
  case'tog':{const k=b.dataset.k;SAVE.o[k]=SAVE.o[k]?0:1;persist();optsScreen(S.mode==='title'?'title':'menu');break}
  case'reset':if(confirm('Erase all stars and progress?')){SAVE.stars={};persist();optsScreen('title')}break;
 }});
function startDemoQuiet(){S.demo={i:0,t:0};S.lv=levelFromTable(0);S.inv=S.lv.inv;resetState();S.pcs=S.lv.sol.map(p=>({...p,id:S.nid++}));fitCam();bgDirty=true}

$('#bHint').onclick=hint;
$('#bPath').onclick=()=>{SAVE.o.path=SAVE.o.path?0:1;persist();S.pv=null;toast('Path preview '+(SAVE.o.path?'on 👁':'off'),900);$('#bPath').classList.toggle('on',!!SAVE.o.path)};

bPlay.onclick=togglePlay;
selbar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!S.sel)return;const k=b.dataset.s;if(k==='l')rotSel(-15);else if(k==='r')rotSel(15);else if(k==='d')removePiece(S.sel)});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')&&k!=='escape')return;
 if(k==='escape'){if(scr.classList.contains('on')&&S.mode!=='title'&&!scr.classList.contains('win'))scrHide();else if(S.tool){S.tool=null;buildTrayCls()}else if(S.mode!=='title')menuScreen();return}
 if(S.mode==='title'||scr.classList.contains('on'))return;
 if(k===' '||k==='enter'){e.preventDefault();togglePlay()}
 else if(k==='q')rotSel(e.shiftKey?-15:-5);else if(k==='e')rotSel(e.shiftKey?15:5);
 else if((k==='delete'||k==='backspace')&&S.sel&&S.phase==='edit'){e.preventDefault();removePiece(S.sel)}
 else if(k==='h')hint();else if(k==='c')$('#bClear').click();else if(k==='f')$('#bFast').click();
 else if(k>='1'&&k<='9'){const ts=ALLT.filter(t=>S.inv[t]!==undefined),t=ts[+k-1];if(t&&remaining(t)>0){S.tool='p:'+t;buildTray()}}});

/* ---------- sandbox panel ---------- */
function buildSbp(){const lv=S.lv;
 let h=`<div class="sbh">Terrain</div><div class="sbg"><button class="sbt${S.tool==='wall'?' on':''}" data-k="wall" title="Paint walls">🧱</button><button class="sbt${S.tool==='erase'?' on':''}" data-k="erase" title="Erase walls">🧽</button><button class="sbt${S.tool==='spawn'?' on':''}" data-k="spawn" title="Move ball start">⚪</button><button class="sbt${S.tool==='hole'?' on':''}" data-k="hole" title="Move hole">🚩</button></div>
 <div class="sbh">Physics</div><label class="sbl">gravity <span id="gv">${(lv.gs||1).toFixed(2)}</span><input id="sGrav" type="range" min=".2" max="2.5" step=".05" value="${lv.gs||1}"></label>
 <label class="sbl">launch → <span id="lx">${lv.spawn.vx|0}</span><input id="sVx" type="range" min="-600" max="600" step="10" value="${lv.spawn.vx||0}"></label>
 <label class="sbl">launch ↓ <span id="ly">${lv.spawn.vy|0}</span><input id="sVy" type="range" min="-800" max="600" step="10" value="${lv.spawn.vy||0}"></label>
 <div class="sbh">Level</div><div class="sbg"><button class="sbb" data-k="clearp">🗑 Pieces</button><button class="sbb" data-k="clearw">🧹 Walls</button><button class="sbb" data-k="export">📤 Export</button><button class="sbb" data-k="import">📥 Import</button></div>`;
 sbp.innerHTML=h;
 $('#sGrav').oninput=e=>{lv.gs=+e.target.value;$('#gv').textContent=lv.gs.toFixed(2);sbSave()};
 $('#sVx').oninput=e=>{lv.spawn.vx=+e.target.value;$('#lx').textContent=lv.spawn.vx;sbSave()};
 $('#sVy').oninput=e=>{lv.spawn.vy=+e.target.value;$('#ly').textContent=lv.spawn.vy;sbSave()}}
sbp.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,lv=S.lv;SFX.click();
 if(['wall','erase','spawn','hole'].includes(k)){S.tool=k;buildSbp();buildTrayCls()}
 else if(k==='clearp'){S.pcs=[];S.sel=null;buildTray()}
 else if(k==='clearw'){lv.solid.fill(0);lv._g=null;sbSave()}
 else if(k==='export'){const d=packLevel(lv);d.gs=lv.gs;d.pcs=S.pcs.map(p=>({t:p.t,x:p.x,y:p.y,a:p.a||0}));d.inv={};d.sol=[];d.par=0;
  scrShow(`<div class="panel wide"><div class="hd"><h2>Export level</h2><button data-a="resume">✕</button></div><p class="dim">Copy this text and share it. Import it later from the sandbox.</p><textarea readonly id="ta">${JSON.stringify(d)}</textarea></div>`);setTimeout(()=>{const t=$('#ta');t&&t.select()},50)}
 else if(k==='import'){scrShow(`<div class="panel wide"><div class="hd"><h2>Import level</h2><button data-a="resume">✕</button></div><textarea id="ta" placeholder="paste exported level text here"></textarea><div class="row"><button class="big" id="doImp">Import</button></div></div>`);
  $('#doImp').onclick=()=>{try{const d=JSON.parse($('#ta').value);if(!d.rows||!d.spawn||!d.hole)throw 0;localStorage.setItem('puttler2_sb',JSON.stringify(d));loadSandbox();toast('Imported ✔',1200)}catch(x){toast('That text is not a valid level ❌',1800)}}}});

/* ---------- drawing ---------- */
function drawParticles(){for(const p of PT){const a=Math.min(1,p.l/(p.m*.6));ctx.globalAlpha=a;ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s*.6);else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill()}}ctx.globalAlpha=1}
function outlinePiece(p,col,dash){const D=PIECES[p.t];ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle=col;ctx.lineWidth=2.5;if(dash)ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(0,0,D.sel+4,0,TAU);ctx.stroke();ctx.restore()}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);drawBG(T);
 const lv=S.lv;if(!lv)return;
 drawStrip(T);
 ctx.save();ctx.translate(CAM.ox,CAM.oy);ctx.scale(CAM.z,CAM.z);
 drawTerrain(lv);drawHole(lv,T);
 // path preview
 if(SAVE.o.path&&S.phase==='edit'&&S.mode!=='title'){if(!S.pv){const r=runLevel(lv,S.pcs,true);S.pv=r.tr}ctx.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<S.pv.length;i+=4){ctx.beginPath();ctx.arc(S.pv[i][0],S.pv[i][1],2.2,0,TAU);ctx.fill()}}
 // hints
 for(let i=0;i<S.hints;i++){const p=lv.sol[i];drawPiece(ctx,p,T,.5,true);outlinePiece(p,'#f9e2af',true)}
 // pieces
 for(const p of S.pcs){drawPiece(ctx,p,T,p.bad?.5:1,false);if(p.bad)outlinePiece(p,'#f38ba8',false)}
 if(S.sel&&S.phase==='edit'){outlinePiece(S.sel,'#f9e2af',true)}
 // ghost under pointer
 const tool=S.trayDrag&&S.trayDrag.moved?'p:'+S.trayDrag.t:S.tool;
 if(S.phase==='edit'&&tool&&tool.startsWith('p:')&&S.mouse.y<VH-110&&S.mouse.y>56&&!S.drag){const[gx,gy]=worldSnap(S.mouse.x,S.mouse.y),t=tool.slice(2),g={t,x:gx,y:gy,a:DEFA[t]||0};
  const ok=canPlace(g);drawPiece(ctx,g,T,.6,true);if(!ok)outlinePiece(g,'#f38ba8',false)}
 if(isSB()&&S.phase==='edit'&&['wall','erase'].includes(S.tool)&&S.mouse.y>56){const[wx,wy]=toW(S.mouse.x,S.mouse.y),cx=Math.floor(wx/CELL),cy=Math.floor(wy/CELL);
  if(cx>=0&&cy>=0&&cx<lv.gw&&cy<lv.gh){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.strokeRect(cx*CELL+1,cy*CELL+1,CELL-2,CELL-2)}}
 // spawn marker + ball
 if(S.phase==='edit'){drawSpawn(lv,T);drawBall(lv.spawn.x,lv.spawn.y+Math.sin(T*3)*1.5,T)}
 else if(S.sim){
  ctx.fillStyle='#5eead4';for(let i=0;i<S.trail.length;i++){ctx.globalAlpha=i/S.trail.length*.5;ctx.beginPath();ctx.arc(S.trail[i][0],S.trail[i][1],R*(.25+.5*i/S.trail.length),0,TAU);ctx.fill()}ctx.globalAlpha=1;
  const b=S.sim.b;if(S.phase==='sunk'){const k=Math.min(1,(T-S.sinkT)/.35),h=lv.hole;drawBall(lerp(b.x,h.x,k),lerp(b.y,h.y+R,k),T,1-k)}else drawBall(b.x,b.y,T)}
 drawParticles();ctx.restore();
 // selection bar
 const sp=S.sel;if(sp&&S.phase==='edit'&&S.mode!=='title'&&!S.drag){const sx=CAM.ox+sp.x*CAM.z,sy=CAM.oy+(sp.y-PIECES[sp.t].sel-18)*CAM.z;selbar.style.left=clamp(sx,86,VW-86)+'px';selbar.style.top=Math.max(64,sy-40)+'px';selbar.classList.remove('hidden');selbar.firstElementChild.style.visibility=selbar.children[1].style.visibility=sp.t==='bump'?'hidden':'visible'}else selbar.classList.add('hidden');
}
function update(dt){
 T+=dt;updParticles(dt);
 if(S.phase==='run')stepRun(dt);
 if(S.mode==='title'&&S.demo){S.demoT+=dt;if(S.phase==='edit'&&S.demoT>1.2){startRun();S.demoT=0}else if(S.phase==='sunk'&&T-S.sinkT>2.2){stopRun();S.demoT=0;S.demo.i=(S.demo.i+1)%3;S.lv=levelFromTable(S.demo.i);S.inv=S.lv.inv;S.pcs=S.lv.sol.map(p=>({...p,id:S.nid++}));fitCam();bgDirty=true}}
}
function frame(ts){const dt=Math.min(.05,(ts-lastTs)/1000||.016);lastTs=ts;update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('resize',()=>{resize()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC)AC.suspend();else if(AC)AC.resume()});

/* ---------- boot ---------- */
resize();$('#bPath').classList.toggle('on',!!SAVE.o.path);titleScreen();requestAnimationFrame(frame);
window.__P={S,TABLE,loadLevel,loadSandbox,startRun,stopRun,placeSolution,SAVE,get T(){return T},runLevel,compile,levelFromTable};

</script>
