<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Endless Tiny Fishing 🎣</title>
<style>
:root{--acc:#ffd23f;--txt:#eaf6ff;--good:#3ddc84;--bad:#ff5d5d;--pn:rgba(6,22,40,.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06121f;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--txt);touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.pill{background:var(--pn);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(#2b8fd6,#1b62a8);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:7px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #0d3a6a,0 6px 12px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0d3a6a}
.btn.alt{background:linear-gradient(#ffb23f,#e0781a);box-shadow:0 3px 0 #8a4a0a,0 6px 12px rgba(0,0,0,.3)}
#hud{position:fixed;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;max-width:calc(100% - 20px)}
#hud .pill{padding:6px 12px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#hud small{font-size:12px;font-weight:700;opacity:.8}
#vCoins{color:var(--acc)}
#topBtns{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
#toasts{position:fixed;top:62px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9}
.toast{padding:8px 14px;border-radius:14px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;animation:tin .25s ease-out,tout .4s ease-in 2.6s forwards;background:rgba(10,30,52,.9);border:2px solid var(--acc)}
.toast canvas{width:46px;height:30px}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#zoneBanner{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;font-size:clamp(26px,5vw,52px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 24px rgba(0,0,0,.6);opacity:0;z-index:4}
#zoneBanner small{display:block;font-size:.4em;letter-spacing:4px;opacity:.85}
#zoneBanner.show{animation:zb 3.2s ease-out}
@keyframes zb{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;z-index:5;max-width:calc(100% - 12px)}
.mbtn{position:relative;min-width:76px;padding:6px 8px 5px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.07);text-align:center;font-weight:800;font-size:12px;line-height:1.15}
.mbtn .ic{font-size:26px;display:block;line-height:1.1}
.mbtn.on{background:linear-gradient(#34a3ef,#1b66ad);border-color:#fff;box-shadow:0 0 14px rgba(80,180,255,.7)}
.mbtn.lock{opacity:.8;filter:saturate(.5)}
.mbtn.lock.can{filter:none;border-color:var(--acc);animation:pulse 1s infinite}
.mbtn .pr{display:block;color:var(--acc);font-size:11px}
@keyframes pulse{50%{transform:scale(1.06)}}
#hint{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);padding:6px 14px;font-weight:700;font-size:14px;pointer-events:none;text-align:center;max-width:90%;z-index:3}
#autoBtn{position:fixed;bottom:92px;right:12px;z-index:5;display:none}
#shop{position:fixed;top:60px;right:10px;width:340px;max-height:calc(100% - 170px);overflow:auto;padding:10px;z-index:6;display:none}
#shop.open{display:block}
#shop h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#shop .qty{display:flex;gap:4px}
#shop .qty button{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:8px;padding:2px 8px;font-weight:800;font-size:12px}
#shop .qty button.on{background:var(--acc);color:#222}
#shop .sec{margin:8px 0 4px;font-size:12px;letter-spacing:1px;opacity:.7;font-weight:800;text-transform:uppercase}
.up{display:flex;align-items:center;gap:8px;padding:6px;margin-bottom:5px;border-radius:12px;background:rgba(255,255,255,.07)}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .tx{flex:1;min-width:0;font-size:13px;line-height:1.2}
.up .tx b{font-size:14px}
.up .tx .lv{font-size:11px;background:rgba(255,255,255,.15);border-radius:8px;padding:0 6px;margin-left:4px}
.up .tx small{opacity:.8;display:block}
.buy{min-width:84px;border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:6px 6px;font-weight:900;font-size:13px;background:#555;color:#bbb}
.buy.can{background:linear-gradient(#3ddc84,#1fa75a);color:#05301a;border-color:#fff;box-shadow:0 3px 0 #0f6b38}
.buy.max{background:#333;color:#999}
#trapPanel{background:rgba(255,255,255,.07);border-radius:12px;padding:8px;margin-bottom:6px;font-size:13px}
#trapPanel input{width:100%}
#rail{position:fixed;left:10px;top:84px;bottom:130px;width:44px;display:none;flex-direction:column;align-items:center;padding:6px 0;z-index:4;touch-action:none}
#rail button{border:none;background:none;font-size:18px;padding:2px}
#railTrack{position:relative;flex:1;width:10px;margin:4px 0;background:rgba(255,255,255,.2);border-radius:6px;touch-action:none}
#railHandle{position:absolute;left:50%;width:30px;height:16px;margin-left:-15px;margin-top:-8px;border-radius:8px;background:linear-gradient(#ffd23f,#e0a010);border:2px solid #fff;top:0;touch-action:none}
#railLbl{font-size:11px;font-weight:800;text-align:center;line-height:1.1;margin-top:2px}
#modal{position:fixed;inset:0;background:rgba(2,10,20,.8);display:none;z-index:20;align-items:center;justify-content:center}
#modal.open{display:flex}
#modalBox{width:min(980px,96vw);max-height:92vh;overflow:auto;padding:14px 16px;touch-action:pan-y}
#modalBox h2{margin:0 0 4px;font-size:22px}
#modalBox .sub{opacity:.8;font-size:13px;margin-bottom:8px}
.zt{margin:12px 0 6px;font-weight:900;font-size:14px;letter-spacing:1px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.1);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{background:rgba(255,255,255,.08);border-radius:12px;padding:6px;text-align:center;font-size:12px;border:2px solid transparent;font-weight:700}
.card canvas{width:100%;height:56px;display:block;margin-bottom:2px}
.card.unk canvas{filter:brightness(0)}
.card.unk{opacity:.55}
.card small{display:block;opacity:.8;font-weight:600}
.x{position:absolute;right:14px;top:10px;font-size:20px;border:none;background:none}
.cfgRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
@media (max-width:760px){
  #shop{left:8px;right:8px;width:auto;top:auto;bottom:140px;max-height:48%}
  #topBtns .btn{padding:6px 9px;font-size:13px}
  .mbtn{min-width:58px;font-size:10px;padding:4px 4px}
  .mbtn .ic{font-size:22px}
  #hud .pill{font-size:15px;padding:4px 9px}
  .lbl,#vZone,#pCatch{display:none!important}
  #hud{gap:5px}
  #hint{bottom:86px;font-size:12px}
  #rail{top:112px;bottom:150px;width:38px}
}
</style>

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function shade(h,t){return t>=0?mix(h,'#ffffff',t):mix(h,'#000000',-t);}
function rgba(h,a){const c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

function rg(c,x,y,r0,r1,stops){const g=c.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;}

function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):String(Math.floor(n));
  let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++;}
  return (n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+SUF[i];
}

let AC=null,master=null;
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||!save.snd)return;
  const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,fc,vol,delay,type){
  if(!AC||!save.snd)return;
  const t=AC.currentTime+(delay||0);const n=Math.floor(AC.sampleRate*dur);
  const b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc;const g=AC.createGain();g.gain.value=vol||.3;
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}

const SH={};
function eye(c,x,y,r,col){
  c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  c.fillStyle=col||'#111';c.beginPath();c.arc(x+r*.15,y,r*.62,0,TAU);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(x+r*.34,y-r*.3,r*.24,0,TAU);c.fill();
  c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=Math.max(.6,r*.2);c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();
}
function tube(c,pts,w0,w1,col,col2){
  const n=pts.length-1;
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<n;i++){
      const t=i/n,w=lerp(w0,w1,t);
      c.strokeStyle=pass?(col2||rgba('#ffffff',.18)):col;c.lineWidth=pass?w*.35:w;c.lineCap='round';
      c.beginPath();c.moveTo(pts[i][0],pts[i][1]-(pass?w*.18:0));c.lineTo(pts[i+1][0],pts[i+1][1]-(pass?w*.18:0));c.stroke();
    }
  }
}
function pattern(c,L,H,sp,o){
  const pc=o.pc||'#000',p=o.pat;
  c.save();c.fillStyle=pc;c.strokeStyle=pc;
  if(p==='stripes'){c.globalAlpha=.6;for(let i=0;i<5;i++)c.fillRect(L*.24-i*L*.115,-H,L*.04,H*2);}
  else if(p==='bands'){[.2,-.04,-.22].forEach(x=>{c.globalAlpha=.85;c.fillStyle='#111';c.fillRect(L*x-L*.045,-H,L*.09,H*2);c.globalAlpha=1;c.fillStyle=pc;c.fillRect(L*x-L*.032,-H,L*.064,H*2);});}
  else if(p==='spots'){c.globalAlpha=.65;for(let i=0;i<16;i++){const x=-L*.3+hash(i+7)*L*.62,y=(hash(i*3+1)-.5)*H*.8,r=H*(.04+hash(i+20)*.05);c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}}
  else if(p==='dots'){c.globalAlpha=.55;for(let i=0;i<30;i++){const x=-L*.4+hash(i+9)*L*.8,y=(hash(i*5+2)-.5)*H*.7,r=H*.045;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}}
  else if(p==='lateral'){c.globalAlpha=.8;c.fillRect(-L*.3,-H*.05,L*.65,H*.1);}
  else if(p==='scales'){c.globalAlpha=.22;c.lineWidth=Math.max(.6,L*.006);for(let i=-6;i<8;i++)for(let j=-3;j<=3;j++){c.beginPath();c.arc(i*L*.05+(j&1)*L*.025,j*H*.17,L*.03,Math.PI*.1,Math.PI*.9);c.stroke();}}

function rollMut(){
  const l=st('luck'),r=Math.random();
  let a=.001*l;if(r<a)return 4;
  a+=.006*l;if(r<a)return 3;
  a+=.02*l;if(r<a)return 2;
  a+=.06*l;if(r<a)return 1;
  return 0;
}
function pickSpecies(d,bias){
  let z=zoneAt(d);const r=Math.random();
  if(r<.1&&z>0)z--;else if(r>.9&&z<LASTZ&&d>ZONES[z].from+(ZONES[z+1].from-ZONES[z].from)*.5)z++;
  const L=ZONES[z].sp;let tot=0;
  const ws=L.map(s=>{const w=s.w*(bias?(1+s.vm*s.vm*.9):1);tot+=w;return w;});
  let x=Math.random()*tot;for(let i=0;i<L.length;i++){x-=ws[i];if(x<=0)return L[i];}
  return L[0];
}
function addCatch(sp,mut,d){
  const v=fishValue(sp,mut,d);
  save.coins+=v;save.stats.caught++;if(d>save.stats.best)save.stats.best=d;
  let e=save.dex[sp.id];
  if(!e){e=save.dex[sp.id]={n:0,m:0};newSpecies(sp);}
  e.n++;e.m|=1<<mut;
  if(mut>=3)toast('<b style="color:'+MUT[mut].col+'">'+MUT[mut].n+'</b>&nbsp;'+sp.name+'! +'+fmt(v),sp);
  return v;
}
/* ---------- fish world ---------- */
function makeFish(y,offscreen,spo,xo,dirO,vxo){
  const d=y/PPM,sp=spo||pickSpecies(d),mut=rollMut(),dir=dirO||(Math.random()<.5?1:-1);
  const deep=sp.zone===LASTZ?1+Math.min(1.2,Math.max(0,(d-4600)/6000)):1;
  const s=(mut===3?1.6:1)*rr(.9,1.12)*deep*(W<600?.8:1),L=sp.size*s;
  const f={sp,mut,dir,s,L,y,t:Math.random()*10,ph:Math.random()*TAU,
    hw:L*(sp.vert?.3:.4),hh:Math.max(10,L*(sp.vert?.5:(HHR[sp.shape]||.2)))};
  f.vx=vxo||dir*sp.spd*rr(.7,1.3)*(sp.vert?.4:1);
  f.x=xo!==undefined?xo:(offscreen?(dir>0?-L*.7:W+L*.7):rr(0,W));
  return f;
}
function spawnAt(y,offscreen){
  const f=makeFish(y,offscreen);fish.push(f);
  if(f.sp.o.school){const n=ri(3,6);for(let i=0;i<n;i++){const g=makeFish(y+rr(-40,40),offscreen,f.sp,f.x-f.dir*(i+1)*f.L*rr(.8,1.4),f.dir,f.vx*rr(.92,1.08));fish.push(g);}}
}
function ensureFish(){
  const hk=curMode==='hook'&&hook.st!=='idle';
  const look=curMode==='hook'&&hook.st==='down'?clamp(st('line')*PPM-hook.y,H*.9,H*5):H*.9;
  const y0=Math.max(30,camPx-H*.45),y1=Math.max(y0+H,camPx+H*1.45+(curMode==='hook'?look:0));
  let n=0;
  for(let i=fish.length-1;i>=0;i--){const f=fish[i];
    if(f.y<y0-H*1.2||f.y>y1+H*1.2||f.x<-f.L*1.6||f.x>W+f.L*1.6){fish.splice(i,1);continue;}
    if(f.y>=y0&&f.y<=y1)n++;
  }
  const target=Math.ceil((y1-y0)/H*DENS());
  let guard=0;const lim=hk?60:6;
  while(n<target&&guard<lim){
    const y=rr(y0,y1),vis=!initFill&&y>camPx-80&&y<camPx+H+80;
    spawnAt(y,vis);n++;guard++;
  }
}
function updateFish(dt){
  for(const f of fish){
    f.t+=dt;f.x+=f.vx*dt;
    if(f.sp.vert){f.y+=Math.sin(f.t*2+f.ph)*(f.sp.shape==='jelly'?-22:-8)*dt+(f.sp.shape==='jelly'?5:0)*dt;}
    else f.y+=Math.cos(f.t*1.3+f.ph)*5*dt;
    if(f.mut>=1&&Math.random()<dt*2.5&&f.y-camPx>0&&f.y-camPx<H)addSpark(f.x+rr(-f.L*.3,f.L*.3),f.y+rr(-f.hh,f.hh),MUT[f.mut].col,1,40);
  }
}
const WIG={fish:.09,tall:.06,long:.07,round:.05,eel:.035,shark:.05,whale:.03,squid:.04,turtle:.015,angler:.05};
function drawFish(f){
  const sy=f.y-camPx,sp=f.sp,o=sp.o,L=f.L;
  if(sy<-L||sy>H+L||f.x<-L||f.x>W+L)return;
  const spr=getSprite(sp,f.mut);
  ctx.save();ctx.translate(f.x,sy);
  const gcol=f.mut?MUT[f.mut].col:o.glow;
  if(gcol||o.glow){
    const pul=.75+.25*Math.sin(T*3+f.ph),gr=L*(f.mut?.75:.6);
    ctx.save();ctx.globalCompositeOperation='lighter';
    let c0;
    if(f.mut===4){const hh=(T*120+f.ph*50)%360;c0=['hsla('+hh+',100%,65%,'+.5*pul+')','hsla('+hh+',100%,65%,0)'];}
    else{c0=[rgba(gcol,(f.mut?.42:.3)*pul),rgba(gcol,0)];}
    ctx.fillStyle=rg(ctx,0,0,0,gr,[[0,c0[0]],[1,c0[1]]]);ctx.fillRect(-gr,-gr,gr*2,gr*2);ctx.restore();
  }
  if(sp.vert){
    ctx.rotate(Math.sin(T*.8+f.ph)*.1);
    const p=1+Math.sin(T*3+f.ph)*.05;ctx.scale(f.s*(2-p),f.s*p);
    if(sp.shape==='star')ctx.rotate(T*.4+f.ph);
  }else{
    ctx.scale((f.vx<0?-1:1)*f.s,f.s);
    if(sp.shape==='ray'){const k=1+Math.sin(T*3+f.ph)*.1;ctx.scale(1,k);}
    else{const w=WIG[sp.shape]||0;if(w)ctx.transform(1,w*Math.sin(T*(5+Math.abs(f.vx)*.04)+f.ph),0,1,0,0);}
  }
  ctx.drawImage(spr,-sp.sw/2,-sp.sh/2,sp.sw,sp.sh);
  ctx.restore();
}
/* ---------- hook & line ---------- */
function hookIdleY(){return tipWY()+42*BS;}
function startCast(){
  if(hook.st!=='idle')return;
  hook.st='down';hook.caught=[];hook.splashed=false;hook.delivered=false;hook.y=hookIdleY();save.stats.casts++;SFX.throw();
}
function capNow(){return Math.round(st('cap'));}
function hookCollide(ya,yb){
  const lo=Math.min(ya,yb),hi=Math.max(ya,yb),R=hookR(),cap=capNow();
  for(let i=fish.length-1;i>=0&&hook.caught.length<cap;i--){
    const f=fish[i];
    if(Math.abs(f.x-hook.x)<f.hw*.85+R&&f.y+f.hh*.9+R>lo&&f.y-f.hh*.9-R<hi){
      hook.caught.push({sp:f.sp,mut:f.mut,s:f.s,d:f.y/PPM,rot:rr(-.5,.5),ox:rr(-20,20),oy:rr(0,28)});
      fish.splice(i,1);
      addSpark(f.x,f.y,MUT[f.mut].col,6,130);addBubble(f.x,f.y,2);SFX.pop(Math.min(12,hook.caught.length));
      if(hook.y/PPM>save.stats.best)save.stats.best=hook.y/PPM;
    }
  }
}
function autoTarget(sp){
  const down=hook.st==='down',ahead=clamp(sp*.55,H*.3,H*1.3);
  let best=null,bs=1e9;
  for(const f of fish){
    const dy=down?f.y-hook.y:hook.y-f.y;
    if(dy<-H*.05||dy>ahead||f.x<-10||f.x>W+10)continue;
    const dx=Math.abs(f.x-hook.x),score=dx+dy*.35-f.sp.vm*4;
    if(score<bs){bs=score;best=f;}
  }
  return best?best.x:hook.x;
}
function deliverHook(){
  hook.delivered=true;let tot=0;const dx=boat.deckX,dy=deckWY();
  hook.caught.forEach((c,i)=>{const v=addCatch(c.sp,c.mut,c.d);tot+=v;if(i<16)addFly(c.sp,c.mut,hook.x+c.ox*.6,hook.y+c.oy*.7,dx,dy,.5+i*.035,Math.min(.5,60/c.sp.size),1);});
  if(hook.caught.length){addText(dx,dy-30,'+'+fmt(tot),'#ffd23f',26);SFX.sell();addSpark(dx,dy,'#ffd23f',10,160);}
  hook.caught=[];
}
function hookUpSpeed(){return clamp(hookSpeedPx()*.8,140,H*.8);}
function updateHook(dt){
  const h=hook,maxY=st('line')*PPM,idleY=hookIdleY(),cap=capNow();
  const autoOn=save.auto&&lv('auto')>0;
  if(h.st==='idle'){
    h.x=lerp(h.x||boat.tipX,boat.tipX,Math.min(1,dt*10));h.y=idleY;
    if(autoOn){h.autoWait-=dt;if(h.autoWait<=0)startCast();}
    return;
  }
  const y0=h.y,vUp=hookUpSpeed();
  const tgt=autoOn?(h.st==='up'?autoTarget(vUp):h.x):ptr.x;
  h.x+=(clamp(tgt,16,W-16)-h.x)*Math.min(1,dt*(autoOn?6:12));
  if(h.st==='down'){
    /* plunge: shoots straight to max depth in ~1.4s, easing out near the bottom */
    const rem=maxY-h.y,v=Math.max(hookSpeedPx()*1.5,maxY/1.4)*clamp(rem/(H*.5),.22,1);
    h.y+=v*dt;
    if(h.y>0&&!h.splashed){h.splashed=true;addSplash(h.x,0,16);addRing(h.x,0,40,'#fff',.5,3);SFX.splash();}
    if(h.y>=maxY-.5){h.y=maxY;h.st='up';h.v=vUp;if(h.y/PPM>save.stats.best)save.stats.best=h.y/PPM;addRing(h.x,h.y,50,'#9fe8ff',.4,3);}
  }else if(h.st==='up'){
    /* slow, catchable climb */
    h.v=vUp;h.y-=h.v*dt;
    hookCollide(h.y,y0);
    if(h.caught.length>=cap){h.st='reel';}
  }
  if(h.st==='reel'){
    /* full: reel in faster and faster until the boat (still readable, not a blur) */
    const vcap=Math.max(H*2.6,h.y*.5);
    h.v=Math.min((h.v||vUp)+(H*3.2+h.y*.8)*dt,vcap);
    h.y-=h.v*dt;
  }
  if(h.st==='up'||h.st==='reel'){
    if(h.y<=0&&!h.delivered){deliverHook();addSplash(h.x,0,10);}
    if(h.y<=idleY){h.y=idleY;h.st='idle';h.autoWait=.5;h.x=lerp(h.x,boat.tipX,.5);}
  }
  if(h.y>0&&Math.random()<dt*14)addBubble(h.x,h.y,1);
}
function drawHookLayer(){
  if(curMode!=='hook')return;
  const sx=hook.x||boat.tipX,sy=hook.y-camPx,tx=boat.tipX,ty=boat.tipY,R=hookR();

    ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,R,0,TAU);ctx.stroke();ctx.restore();
    if(hook.y/PPM>150)drawGlow(sx,sy,200+R*2,'#fff2b0',.22);

  for(let i=0;i<Math.min(n,18);i++){

    ctx.save();ctx.translate(sx+c.ox*.7*sc*.7+Math.sin(T*3+i)*3,sy+(10+c.oy*.8+(i%4)*5)*sc);ctx.rotate(-Math.PI/2+c.rot+Math.sin(T*5+i)*.1);ctx.scale(k,k);
    const spr=getSprite(sp,c.mut);ctx.drawImage(spr,-sp.sw/2,-sp.sh/2,sp.sw,sp.sh);ctx.restore();

  ctx.save();ctx.translate(sx,sy);ctx.scale(sc,sc);
  ctx.strokeStyle='#e6edf2';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,5);ctx.arc(-7,5,7,0,Math.PI);ctx.lineTo(-14,-1);ctx.lineTo(-11,1);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-16,2.6,0,TAU);ctx.stroke();
  ctx.fillStyle='#ff6a6a';ctx.beginPath();ctx.ellipse(-6,10,4,2.2,.4,0,TAU);ctx.fill();
  ctx.restore();

/* ---------- cast net ---------- */
function throwNet(x,sy){
  const wy=camPx+sy;
  if(netCD>0)return;
  if(wy<10){tip('Click on the water! 🌊');return;}
  if(wy/PPM>st('netReach')){tip('Too deep! Upgrade Net Reach ⬇️');SFX.no();return;}
  netCD=st('netCD');save.stats.casts++;
  nets.push({st:'fly',t:0,dur:.5,x0:boat.deckX,y0:deckWY(),x1:x,y1:wy,x:boat.deckX,y:deckWY(),r:Math.min(st('netR'),Math.min(W,H)*.42)*(W<600?.8:1),did:0});
  SFX.throw();
}
function captureNet(n){
  const cap=Math.round(st('netCap')),c=[];
  let big=0;
  for(let i=0;i<fish.length;i++){const f=fish[i],d=Math.hypot(f.x-n.x,f.y-n.y);if(d<=n.r+f.hw*.15){if(f.L>n.r*2.6){big++;continue;}c.push([d,i]);}}
  c.sort((a,b)=>a[0]-b[0]);
  const take=c.slice(0,cap).map(a=>a[1]).sort((a,b)=>b-a);
  let tot=0;
  take.forEach((idx,k)=>{const f=fish[idx];const v=addCatch(f.sp,f.mut,f.y/PPM);tot+=v;
    if(k<14)addFly(f.sp,f.mut,f.x,f.y,boat.deckX,deckWY(),.7+k*.03,f.s*Math.min(1,50/f.sp.size),1);
    addSpark(f.x,f.y,MUT[f.mut].col,4,100);fish.splice(idx,1);});
  if(take.length){addText(n.x,n.y-10,'+'+fmt(tot),'#ffd23f',24);SFX.sell();}
  if(big&&take.length<cap)addText(n.x,n.y+24,'Too big! 💨','#ff9a9a',16);
  if(!take.length&&!big)addText(n.x,n.y,'Empty…','#cfd8e0',16);
}
function updateNets(dt){
  netCD=Math.max(0,netCD-dt);
  for(let i=nets.length-1;i>=0;i--){
    const n=nets[i];n.t+=dt;
    if(n.st==='fly'){
      const t=clamp(n.t/n.dur,0,1);n.x=lerp(n.x0,n.x1,t);n.y=lerp(n.y0,n.y1,t)-Math.sin(t*Math.PI)*90*(1-t*.3);
      if(t>=1){n.st='open';n.t=0;n.x=n.x1;n.y=n.y1;addSplash(n.x,Math.min(0,n.y),12);addRing(n.x,n.y,n.r*.9,'#ffffff',.5,3);addBubble(n.x,n.y,8);SFX.splash();}
    }else if(n.st==='open'){
      if(!n.did&&n.t>=.4){n.did=1;captureNet(n);}
      if(n.t>=1){n.st='haul';n.t=0;}
    }else{
      const t=clamp(n.t/.7,0,1);n.x=lerp(n.x1,boat.deckX,t*t);n.y=lerp(n.y1,deckWY(),t*t);
      if(t>=1)nets.splice(i,1);
    }
  }
}
function drawNets(){
  nets.forEach(n=>{
    const sx=n.x,sy=n.y-camPx;
    ctx.strokeStyle='rgba(240,225,180,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(boat.deckX,boat.deckY);ctx.lineTo(sx,sy);ctx.stroke();

/* ---------- spear fishing ---------- */
const DIVY=.42;
const diverW=()=>({x:W*.5,y:camPx+H*DIVY});

  if(spCD>0)return;
  const dv=diverW(),a=Math.atan2(ptr.y+camPx-dv.y,ptr.x-dv.x);
  spears.push({x:dv.x+Math.cos(a)*24,y:dv.y+Math.sin(a)*24,a,dist:0,range:Math.min(st('spRange'),Math.max(W,H)*1.1),pierce:Math.round(st('spPierce')),st:'fly',tot:0,n:0});

}
function updateSpears(dt){
  spCD=Math.max(0,spCD-dt);
  const dv=diverW();
  for(let i=spears.length-1;i>=0;i--){
    const s=spears[i];
    if(s.st==='fly'){
      const total=1600*dt,steps=Math.max(1,Math.ceil(total/14)),stp=total/steps;
      for(let k=0;k<steps&&s.st==='fly';k++){
        s.x+=Math.cos(s.a)*stp;s.y+=Math.sin(s.a)*stp;s.dist+=stp;
        for(let j=fish.length-1;j>=0;j--){const f=fish[j];
          if(Math.abs(f.x-s.x)<f.hw+6&&Math.abs(f.y-s.y)<f.hh+6){
            const v=addCatch(f.sp,f.mut,f.y/PPM);s.tot+=v;s.n++;
            addFly(f.sp,f.mut,f.x,f.y,dv.x,dv.y,.5,f.s*Math.min(1,50/f.sp.size),f.vx<0?-1:1);addSpark(f.x,f.y,'#ffd23f',6,140);addText(f.x,f.y-f.hh,'+'+fmt(v),MUT[f.mut].col==='#fff'?'#ffd23f':MUT[f.mut].col,18);SFX.coin();
            fish.splice(j,1);s.pierce--;if(s.pierce<=0){s.st='ret';break;}
          }}
        if(s.dist>=s.range&&s.st==='fly')s.st='ret';

      if(Math.random()<dt*20)addBubble(s.x,s.y,1);

    }
  }
}

function drawSpears(){

function rodClick(x,sy){

function startFight(){

  rod.diff=diff;rod.ph='fight';rod.t=0;rod.pos=0;rod.vel=0;rod.fpos=.5;rod.ft=0;rod.ftarget=.5;rod.prog=.3;

function updateRod(dt){

      const f=r.fish,v=addCatch(f.sp,f.mut,f.d),rew=Math.round(v*st('rTrophy'));save.coins+=rew-v;

function trapCount(){return save.owned.trap?Math.round(st('tCount')):0;}

  const t=traps[i];if(!t||!t.ready)return 0;
  const d=trapDepth(),cap=Math.round(st('tCap'));let tot=0;const p=trapPos(i);
  for(let k=0;k<cap;k++){const sp=pickSpecies(d),mut=rollMut();tot+=addCatch(sp,mut,d);if(k<8&&!silent)addFly(sp,mut,p.x,p.y,boat.deckX,deckWY(),.7+k*.05,Math.min(.7,50/sp.size),1);}

/* ---------- dynamite ---------- */
const tntCost=d=>Math.round(8*Math.pow(1.85,zoneAt(d)));
function throwTnt(x,sy){
  if(tntCD>0)return;
  const wy=camPx+sy;
  if(wy<20){tip('Throw it into the water! 🌊');return;}
  if(wy/PPM>st('tntReach')){tip('Too deep! Upgrade Throw Depth ⬇️');SFX.no();return;}
  const cost=tntCost(wy/PPM);
  if(save.coins<cost){tip('Need 💰 '+fmt(cost)+' for dynamite here');SFX.no();return;}
  save.coins-=cost;tntCD=st('tntCD');save.stats.casts++;
  tnts.push({st:'fly',t:0,dur:.6,x0:boat.deckX,y0:deckWY(),x1:x,y1:wy,x:boat.deckX,y:deckWY(),r:Math.min(st('tR'),Math.min(W,H)*.5)*(W<600?.8:1),cost});
  addText(x,sy+camPx-30,'-'+fmt(cost),'#ff9a9a',16);SFX.throw();
}
function explode(n){
  const cap=Math.round(st('tntCap')),c=[];
  for(let i=0;i<fish.length;i++){const f=fish[i],d=Math.hypot(f.x-n.x,f.y-n.y);if(d<=n.r+f.hw*.3)c.push([d,i]);}
  c.sort((a,b)=>a[0]-b[0]);
  const take=c.slice(0,cap).map(a=>a[1]).sort((a,b)=>b-a);
  let tot=0;
  take.forEach((idx,k)=>{const f=fish[idx];tot+=addCatch(f.sp,f.mut,f.y/PPM);if(k<16)addFly(f.sp,f.mut,f.x,f.y,boat.deckX,deckWY(),.9+k*.03,f.s*Math.min(1,50/f.sp.size),-1);fish.splice(idx,1);});
  addRing(n.x,n.y,n.r,'#ffd080',.55,8);addRing(n.x,n.y,n.r*.6,'#ffffff',.4,5);addSpark(n.x,n.y,'#ffaa40',30,420);addBubble(n.x,n.y,18);
  shake=Math.max(shake,14);flash=.55;SFX.boom();
  if(take.length){addText(n.x,n.y-10,'💥 +'+fmt(tot),'#ffd23f',28);setTimeout(()=>SFX.sell(),350);}else addText(n.x,n.y,'Missed! 💨','#cfd8e0',18);
  if(n.y<30)addSplash(n.x,0,30);
}
function updateTnts(dt){

  return [ptr.x,ptr.y];
}
function update(dt){
  T+=dt;
  updateBoat();
  if(curMode==='hook')updateHook(dt);
  updateNets(dt);updateSpears(dt);updateTnts(dt);
  if(curMode==='rod')updateRod(dt);
  updateTraps(dt);
  if(curMode!=='hook'){
    const vs=Math.max(500,viewMax()*.5);
    if(keys.ArrowDown||keys.s||keys.S)view+=vs*dt;
    if(keys.ArrowUp||keys.w||keys.W)view-=vs*dt;
  }
  ensureFish();updateFish(dt);
  updateCamera(dt);
  updateFx(dt);
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*1.6);
}
function render(dt){
  ctx.save();
  if(shake>.2)ctx.translate(rr(-shake,shake)*.5,rr(-shake,shake)*.5);
  drawBackground();drawSky();drawRays();drawWalls();drawProps();drawSnow(dt);
  fish.forEach(drawFish);
  drawTraps();drawNets();drawTnts();
  if(curMode==='spear')drawDiver();
  drawSpears();drawRodWorld();
  drawBoat();drawHookLayer();drawSurfaceFront();
  drawFx();
  const lp=lightPos();drawDarkness(lp[0],lp[1]);
  drawTexts();drawModeOverlay();drawFightUI();
  if(flash>0){ctx.fillStyle='rgba(255,240,200,'+flash+')';ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
/* ================= UI ================= */
let shopOpen=false,buyQty=1,lastZone=0,lastTip='',lastTipT=0;
function thumb(sp,w,h){
  const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
  const x=c.getContext('2d'),k=Math.min(c.width/sp.sw,c.height/sp.sh)*.92;
  x.drawImage(sp.canvas,(c.width-sp.sw*k)/2,(c.height-sp.sh*k)/2,sp.sw*k,sp.sh*k);return c;
}
function toast(html,sp,cls){
  const box=$('toasts');
  while(box.children.length>=4)box.removeChild(box.firstChild);
  const d=document.createElement('div');d.className='toast';
  if(sp)d.appendChild(thumb(sp,46,30));
  const s=document.createElement('span');s.innerHTML=html;d.appendChild(s);
  box.appendChild(d);setTimeout(()=>d.remove(),3200);
}
function tip(txt){
  const n=performance.now();if(txt===lastTip&&n-lastTipT<1200)return;lastTip=txt;lastTipT=n;
  const box=$('toasts');while(box.children.length>=3)box.removeChild(box.firstChild);
  const d=document.createElement('div');d.className='toast';d.style.borderColor='rgba(255,255,255,.3)';d.style.fontSize='14px';d.textContent=txt;box.appendChild(d);setTimeout(()=>d.remove(),3200);
}
function newSpecies(sp){
  const r=RARITY[sp.rar];
  toast('NEW! <b style="color:'+r.c+'">'+sp.name+'</b> <small style="opacity:.8">'+r.n+'</small>',sp);
  SFX.newfish();updateDexCount();
}
function discovered(){return Object.keys(save.dex).length;}
function updateDexCount(){$('vDex').textContent=discovered()+'/'+SPECIES.length;}
function showBanner(z){
  const b=$('zoneBanner');b.innerHTML=ZONES[z].name.toUpperCase()+'<small>'+(ZONES[z].from?fmtm(ZONES[z].from)+' and below':'the surface')+'</small>';
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
}
function checkZone(){
  const d=curMode==='hook'?Math.max(0,hook.y/PPM):Math.max(0,(camPx+H*.5)/PPM),z=zoneAt(d);
  if(z!==lastZone&&Math.abs(d-ZONES[Math.max(z,lastZone)].from)>4){lastZone=z;showBanner(z);}
}
function updateHud(){
  $('vCoins').textContent=fmt(save.coins);
  const d=curMode==='hook'?Math.max(0,hook.y/PPM):Math.max(0,(camPx+H*.5)/PPM);
  $('vDepth').textContent=fmtm(d);$('vZone').textContent=ZONES[zoneAt(d)].name;
  $('vCatch').textContent=fmt(save.stats.caught);
  const nr=traps.filter(t=>t.ready).length;
  $('pTraps').style.display=traps.length?'flex':'none';$('vTraps').textContent=nr+'/'+traps.length;
  const rail=$('rail'),vm=viewMax();
  rail.style.display=(curMode!=='hook'&&vm>0)?'flex':'none';
  if(vm>0){$('railHandle').style.top=(view/vm*100)+'%';$('railLbl').textContent=fmtm(d).replace(' ','');}
}
/* method bar */
function renderBar(){
  $('bar').innerHTML=MODES.map((m,i)=>{
    const own=save.owned[m.id],can=!own&&save.coins>=m.cost;
    return '<button class="mbtn'+(curMode===m.id?' on':'')+(own?'':' lock')+(can?' can':'')+'" data-id="'+m.id+'"><span class="ic">'+m.ic+'</span>'+m.name+(own?'':'<span class="pr">🔒 '+fmt(m.cost)+'</span>')+'</button>';
  }).join('');
}
function onModeChange(){
  renderBar();
  const m=MODES.find(x=>x.id===curMode);
  $('hint').textContent=m.hint;
  $('autoBtn').style.display=(curMode==='hook'&&lv('auto')>0)?'block':'none';
  $('autoBtn').textContent='🤖 Auto: '+(save.auto?'ON':'OFF');
  renderShop();updateHud();
}
/* shop */
function calc(u,qty){
  const l=lv(u.id);let n=0,cost=0;const q=qty==='max'?1e6:qty;
  while(n<q&&(!u.max||l+n<u.max)&&n<2000){const c=upCost(u,l+n);if(cost+c<=save.coins){cost+=c;n++;}else break;}
  const maxed=u.max&&l>=u.max;
  return {n,cost:n?cost:upCost(u,l),maxed};
}
function upRow(u){
  const l=lv(u.id),a=u.f(u.fn(l)),b=u.f(u.fn(l+1)),c=calc(u,buyQty);
  return '<div class="up"><div class="ic">'+u.ic+'</div><div class="tx"><b>'+u.name+'</b><span class="lv">Lv '+l+'</span><small>'+u.d+'</small><small>'+(c.maxed?a:a+' → '+b)+'</small></div><button class="buy" id="bt_'+u.id+'" data-id="'+u.id+'"></button></div>';
}
function renderShop(){
  const sh=$('shop');
  const grp=curMode==='trap'?'trap':curMode;
  const names={hook:'Hook & Line',net:'Cast Net',spear:'Spearfishing',rod:'Rod & Reel',trap:'Crab Traps',tnt:'Dynamite'};
  let h='<h3><span>🛒 Upgrades</span><span class="qty">'+[1,10,'max'].map(q=>'<button data-q="'+q+'" class="'+(buyQty===q?'on':'')+'">'+(q==='max'?'Max':'×'+q)+'</button>').join('')+'</span></h3>';
  if(curMode==='trap'){
    h+='<div id="trapPanel"><b>🪤 Trap depth: <span id="tdv">'+fmtm(trapDepth())+'</span></b><input type="range" id="tdr" min="5" max="'+Math.max(6,Math.floor(st('tReach')))+'" value="'+Math.round(trapDepth())+'"><button class="btn alt" id="collectAll" style="width:100%;margin-top:6px">Collect all ready 🪤</button><small style="opacity:.8;display:block;margin-top:4px">Deeper traps catch rarer, pricier fish. Traps work in every mode!</small></div>';
  }
  h+='<div class="sec">'+names[grp]+'</div>'+UPG.filter(u=>u.grp===grp).map(upRow).join('');
  h+='<div class="sec">All fishing</div>'+UPG.filter(u=>u.grp==='all').map(upRow).join('');
  sh.innerHTML=h;refreshShop();
}
function refreshShop(){
  UPG.forEach(u=>{
    const b=$('bt_'+u.id);if(!b)return;
    const c=calc(u,buyQty);
    if(c.maxed){b.className='buy max';b.textContent='MAX';return;}
    b.className='buy'+(c.n>0?' can':'');
    b.textContent=(c.n>1?'×'+c.n+' ':'')+'💰 '+fmt(c.cost);
  });
}
function buyUpgrade(id){
  const u=UBY[id],c=calc(u,buyQty);
  if(c.maxed||c.n<1){SFX.no();return;}
  save.coins-=c.cost;save.up[id]=lv(id)+c.n;SFX.buy();doSave();
  if(id==='auto'){onModeChange();}
  renderShop();updateHud();
}
$('shop').addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){const v=q.dataset.q;buyQty=v==='max'?'max':+v;renderShop();return;}
  const b=e.target.closest('.buy');if(b){buyUpgrade(b.dataset.id);return;}
  if(e.target.id==='collectAll')collectAllTraps();
});
$('shop').addEventListener('input',e=>{if(e.target.id==='tdr'){save.trapDepth=+e.target.value;$('tdv').textContent=fmtm(trapDepth());}});
$('bShop').onclick=()=>{shopOpen=!shopOpen;$('shop').classList.toggle('open',shopOpen);if(shopOpen)renderShop();};
$('bar').addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(b){audioInit();setMode(b.dataset.id);}});
$('autoBtn').onclick=()=>{save.auto=save.auto?0:1;$('autoBtn').textContent='🤖 Auto: '+(save.auto?'ON':'OFF');};
/* modals */
function openModal(html){const m=$('modal');$('modalBox').innerHTML='<button class="x" id="mx">✕</button>'+html;m.classList.add('open');$('mx').onclick=closeModal;}
function closeModal(){$('modal').classList.remove('open');}
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal();});
$('bDex').onclick=()=>{
  let h='<h2>📖 Fishdex <small style="font-size:14px;opacity:.8">'+discovered()+' / '+SPECIES.length+' species</small></h2><div class="sub">Catch every creature in the ocean. Mutations: ✨ Shiny ×2 • 🟡 Golden ×5 • 🟠 Giant ×4 • 🌈 Rainbow ×25</div>';
  ZONES.forEach(z=>{
    h+='<div class="zt">'+z.name+' · '+fmtm(z.from)+'+</div><div class="grid">';
    z.sp.forEach(sp=>{
      const e=save.dex[sp.id],r=RARITY[sp.rar];
      h+='<div class="card'+(e?'':' unk')+'" style="border-color:'+(e?r.c:'transparent')+'"><canvas data-sp="'+sp.id+'"></canvas>'+(e?'<span style="color:'+r.c+'">'+sp.name+'</span><small>'+r.n+' · ×'+e.n+'</small><small>'+[1,2,3,4].filter(m=>e.m&(1<<m)).map(m=>['','✨','🟡','🟠','🌈'][m]).join(' ')+'</small>':'???<small>'+r.n+'</small>')+'</div>';
    });
    h+='</div>';
  });
  openModal(h);
  $('modalBox').querySelectorAll('canvas[data-sp]').forEach(c=>{
    const sp=SPECIES[+c.dataset.sp];c.width=224;c.height=112;
    const x=c.getContext('2d'),k=Math.min(c.width/sp.sw,c.height/sp.sh)*.9;
    x.drawImage(sp.canvas,(c.width-sp.sw*k)/2,(c.height-sp.sh*k)/2,sp.sw*k,sp.sh*k);
  });
};
$('bCfg').onclick=()=>{
  const s=save.stats;
  openModal('<h2>⚙️ Settings & stats</h2><div class="cfgRow"><span>🔊 Sound</span><button class="btn" id="cSnd">'+(save.snd?'ON':'OFF')+'</button></div>'+
  '<div class="sub">🐟 Fish caught: <b>'+fmt(s.caught)+'</b><br>🌊 Deepest catch: <b>'+fmtm(s.best)+'</b><br>🎣 Casts / throws: <b>'+fmt(s.casts)+'</b><br>📖 Species found: <b>'+discovered()+'/'+SPECIES.length+'</b></div>'+
  '<div class="sub"><b>Controls</b><br>Mouse / touch: aim &amp; click • <b>Space</b>: action • <b>1–6</b>: switch method • <b>Wheel</b> or <b>W/S</b>: look deeper (net, spear, rod, traps, dynamite) • <b>M</b>: mute</div>'+
  '<div class="cfgRow"><span>🗑️ Reset all progress</span><button class="btn" id="cRst" style="background:linear-gradient(#e05a5a,#a82a2a)">Reset</button></div>');
  $('cSnd').onclick=()=>{save.snd=save.snd?0:1;$('cSnd').textContent=save.snd?'ON':'OFF';doSave();};
  $('cRst').onclick=()=>{if(confirm('Really delete your whole save?')){try{localStorage.removeItem(KEY);}catch(e){}save=defSave();doSave();location.reload();}};
};
/* depth rail */
(function(){
  const track=$('railTrack');let drag=false;
  function setFrom(e){const r=track.getBoundingClientRect();const f=clamp((e.clientY-r.top)/r.height,0,1);view=f*viewMax();}
  track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);setFrom(e);e.stopPropagation();});
  track.addEventListener('pointermove',e=>{if(drag)setFrom(e);});
  track.addEventListener('pointerup',()=>drag=false);
  $('railUp').onclick=()=>{view-=Math.max(150,viewMax()*.12);};
  $('railDn').onclick=()=>{view+=Math.max(150,viewMax()*.12);};
})();
/* input */
function onAction(x,y){
  audioInit();
  switch(curMode){
    case 'hook':if(hook.st==='idle')startCast();else if(hook.st==='down'){hook.st='up';hook.v=hookUpSpeed();}else if(hook.st==='up')hook.st='reel';break;
    case 'net':throwNet(x,y);break;
    case 'spear':throwSpear();break;
    case 'rod':rodClick(x,y);break;
    case 'trap':trapClick(x,y);break;
    case 'tnt':throwTnt(x,y);break;
  }
}
cv.addEventListener('pointerdown',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.down=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}onAction(ptr.x,ptr.y);});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;});
window.addEventListener('pointerup',()=>{ptr.down=false;});
cv.addEventListener('wheel',e=>{if(curMode!=='hook'){view+=e.deltaY*1.6;}e.preventDefault();},{passive:false});
window.addEventListener('keydown',e=>{
  if($('modal').classList.contains('open')){if(e.key==='Escape')closeModal();return;}
  keys[e.key]=true;
  if(e.key===' '&&!e.repeat){e.preventDefault();onAction(ptr.x,ptr.y);}
  if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  const n=parseInt(e.key);if(n>=1&&n<=MODES.length&&!e.repeat)setMode(MODES[n-1].id);
  if(e.key==='m'||e.key==='M'){save.snd=save.snd?0:1;tip('Sound '+(save.snd?'on 🔊':'off 🔇'));}
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;});
window.addEventListener('resize',()=>{resize();});
window.addEventListener('beforeunload',doSave);
document.addEventListener('contextmenu',e=>e.preventDefault());
/* ================= MAIN LOOP ================= */
let last=performance.now(),uiT=0,saveT=0,barT=0;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);render(dt);
  uiT+=dt;saveT+=dt;barT+=dt;
  if(uiT>.1){uiT=0;updateHud();checkZone();}
  if(barT>.5){barT=0;renderBar();if(shopOpen)refreshShop();}
  if(saveT>5){saveT=0;doSave();}
  requestAnimationFrame(frame);
}
function init(){
  resize();
  ptr.x=W/2;ptr.y=H*.5;
  curMode=save.owned[save.mode]?save.mode:'hook';
  camPx=idleCam;updateBoat();hook.x=boat.tipX;hook.y=hookIdleY();
  initFill=true;for(let i=0;i<30;i++)ensureFish();initFill=false;
  syncTraps();updateDexCount();onModeChange();
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
}
init();
window.__game={save:()=>save,fish,hook,set:(k,v)=>{save[k]=v;},setMode,onAction,ptr,get camPx(){return camPx;},get view(){return view;},set view(v){view=v;},traps:()=>traps,SPECIES,ZONES};
</script>
