      L.rect(s * HL, -P.BOX_HW, s * P.BOX_X, P.BOX_HW, w);     // penalty area
      L.rect(s * HL, -P.SIX_HW, s * P.SIX_X, P.SIX_HW, w);     // goal area
      L.disc(s * P.SPOT_X, 0, 0.2);                            // penalty spot
      /* the "D": the part of the 9.15 m arc that lies outside the box */
      const r = 8.2, cx = s * P.SPOT_X;
      const dx = Math.abs(s * P.BOX_X - cx);
      if (dx < r) {
        const a = Math.acos(clamp(dx / r, -1, 1));
        const base = s > 0 ? Math.PI : 0;
        L.arc(cx, 0, r, base - a, base + a, w, 24);
      }
      for (const t of [-1, 1]) L.arc(s * HL, t * HW, P.ARC_R, 0, TAU, w, 16);  // corner arcs
    }
    const mat = new THREE.MeshBasicMaterial({ color: 0xf2f4fb, transparent: true, opacity: 0.87 });
    const mesh = new THREE.Mesh(L.build(), mat);
    mesh.renderOrder = 1;
    this.group.add(mesh);
    this.lineMat = mat;

    /* corner flags */
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 1.5, 6),
        new THREE.MeshLambertMaterial({ color: 0xdddddd })
      );
      pole.position.set(sx * P.HALF_L, 0.75, sz * P.HALF_W);
      const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(0.44, 0.3),
        new THREE.MeshLambertMaterial({ color: 0xf9e2af, side: THREE.DoubleSide })
      );
      flag.position.set(sx * (P.HALF_L + 0.22), 1.32, sz * P.HALF_W);
      flag.rotation.y = Math.PI / 2;
      this.group.add(pole, flag);
    }
  }

  /* ------------------------------------------------------------- goals --- */
  _goals() {
    const white = new THREE.MeshStandardMaterial({ color: 0xf4f6ff, roughness: 0.42, metalness: 0.12 });
    const netMatSide = new THREE.MeshLambertMaterial({
      map: netTexture(P.GOAL_D * 2.2, P.GOAL_H * 1.5), transparent: true,
      alphaTest: 0.34, side: THREE.DoubleSide, opacity: 0.92, depthWrite: false,
    });
    const netMatBack = new THREE.MeshLambertMaterial({
      map: netTexture(P.GOAL_HW * 2.4, P.GOAL_H * 1.5), transparent: true,
      alphaTest: 0.34, side: THREE.DoubleSide, opacity: 0.92, depthWrite: false,
    });
    const netMatTop = new THREE.MeshLambertMaterial({
      map: netTexture(P.GOAL_HW * 2.4, P.GOAL_D * 2.2), transparent: true,
      alphaTest: 0.34, side: THREE.DoubleSide, opacity: 0.9, depthWrite: false,
    });
    this.goals = [];

    for (const s of [-1, 1]) {
      const g = new THREE.Group();
      const x = s * P.HALF_L;
      for (const z of [-P.GOAL_HW, P.GOAL_HW]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(P.POST_R, P.POST_R, P.GOAL_H, 12), white);
        post.position.set(x, P.GOAL_H / 2, z);
        post.castShadow = true;
        g.add(post);
      }
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(P.POST_R, P.POST_R, P.GOAL_HW * 2 + P.POST_R * 2, 12), white);
      bar.rotation.x = Math.PI / 2;
      bar.position.set(x, P.GOAL_H, 0);
      bar.castShadow = true;
      g.add(bar);

      /* back stanchions */
      for (const z of [-P.GOAL_HW, P.GOAL_HW]) {
        const st = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, P.GOAL_H * 0.72, 8), white);
        st.position.set(x + s * P.GOAL_D * 0.92, P.GOAL_H * 0.36, z);
        g.add(st);
      }

      const back = new THREE.Mesh(new THREE.PlaneGeometry(P.GOAL_HW * 2, P.GOAL_H * 0.78), netMatBack);
      back.position.set(x + s * P.GOAL_D, P.GOAL_H * 0.39, 0);
      back.rotation.y = Math.PI / 2;
      g.add(back);

      for (const z of [-P.GOAL_HW, P.GOAL_HW]) {
        const side = new THREE.Mesh(new THREE.PlaneGeometry(P.GOAL_D, P.GOAL_H), netMatSide);
        side.position.set(x + s * P.GOAL_D / 2, P.GOAL_H / 2, z);
        g.add(side);
      }
      const top = new THREE.Mesh(new THREE.PlaneGeometry(P.GOAL_D, P.GOAL_HW * 2), netMatTop);
      top.rotation.x = -Math.PI / 2;
      top.position.set(x + s * P.GOAL_D / 2, P.GOAL_H - 0.01, 0);
      g.add(top);

      this.group.add(g);
      this.goals.push(g);
    }
  }

  /* ------------------------------------------------------- ad boards ----- */
  _surrounds(homeKit, awayKit) {
    const adMat = new THREE.MeshLambertMaterial({ map: adTexture(this.rng) });
    const bx = P.HALF_L + P.RUNOFF * 0.62, bz = P.HALF_W + P.RUNOFF * 0.55;
    const mkBoard = (w, x, z, ry) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.95, 0.14), adMat);
      m.position.set(x, 0.48, z); m.rotation.y = ry;
      m.receiveShadow = true;
      this.group.add(m);
    };
    mkBoard(bx * 2, 0, -bz, 0);
    mkBoard(bx * 2, 0, bz, Math.PI);
    mkBoard(bz * 2, -bx, 0, Math.PI / 2);
    mkBoard(bz * 2, bx, 0, -Math.PI / 2);

    /* technical areas: two benches with a shelter */
    for (const s of [-1, 1]) {
      const shell = new THREE.Mesh(
        new THREE.BoxGeometry(9, 2.1, 2.6),
        new THREE.MeshLambertMaterial({ color: 0x1b1b28 })
      );
      shell.position.set(s * 11, 1.05, -bz - 2.2);
      this.group.add(shell);
      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(8.2, 0.2, 0.7),
        new THREE.MeshLambertMaterial({ color: s < 0 ? new THREE.Color(homeKit.p) : new THREE.Color(awayKit.p) })
      );
      seat.position.set(s * 11, 0.62, -bz - 1.6);
      this.group.add(seat);
    }
  }

  /* ------------------------------------------------------------ stands --- */
  _stands(homeKit, awayKit) {
    const style = SETTINGS.standStyle;
    const depth = style === 'compact' ? 16 : style === 'classic' ? 24 : 28;
    const height = style === 'compact' ? 12 : style === 'classic' ? 16 : 21;
    const gap = 2.4;
    const crowdTex = crowdTexture(homeKit.p, homeKit.s);
    const crowdTexA = crowdTexture(awayKit.p, awayKit.s);
    const concrete = new THREE.MeshLambertMaterial({ color: 0x232334 });
    const roofMat = new THREE.MeshLambertMaterial({ color: 0x14141f, side: THREE.DoubleSide });

    const sides = [
      { len: (P.HALF_L + P.RUNOFF) * 2, x: 0, z: -(P.HALF_W + P.RUNOFF + gap), ry: 0, tex: crowdTex },
      { len: (P.HALF_L + P.RUNOFF) * 2, x: 0, z: (P.HALF_W + P.RUNOFF + gap), ry: Math.PI, tex: crowdTex },
      { len: (P.HALF_W + P.RUNOFF) * 2, x: -(P.HALF_L + P.RUNOFF + gap), z: 0, ry: Math.PI / 2, tex: crowdTexA },
      { len: (P.HALF_W + P.RUNOFF) * 2, x: (P.HALF_L + P.RUNOFF + gap), z: 0, ry: -Math.PI / 2, tex: crowdTexA },
    ];

    for (const s of sides) {
      const g = new THREE.Group();
      g.position.set(s.x, 0, s.z);
      g.rotation.y = s.ry;
      const len = s.len + depth * 0.9;

      /* raked seating deck — a plane tilted away from the pitch */
      const rake = Math.atan2(height, depth);
      const slopeLen = Math.hypot(depth, height);
      const deck = new THREE.Mesh(
        new THREE.PlaneGeometry(len, slopeLen),
        new THREE.MeshLambertMaterial({ map: s.tex })
      );
      s.tex.repeat.set(len / 3.1, slopeLen / 3.1);
      deck.rotation.x = -Math.PI / 2 + rake;
      deck.position.set(0, height / 2, -depth / 2);
      g.add(deck);
      this.crowdMeshes.push({ mesh: deck, tex: s.tex });

      /* back wall + roof */
      const back = new THREE.Mesh(new THREE.BoxGeometry(len, height + 1.5, 1.2), concrete);
      back.position.set(0, (height + 1.5) / 2, -depth - 0.6);
      g.add(back);

      const roof = new THREE.Mesh(new THREE.PlaneGeometry(len, depth + 3), roofMat);
      roof.rotation.x = Math.PI / 2 - 0.08;
      roof.position.set(0, height + 3.4, -depth / 2 + 1);
      g.add(roof);

      for (let i = -2; i <= 2; i++) {
        const col = new THREE.Mesh(new THREE.BoxGeometry(0.5, height + 3.4, 0.5), concrete);
        col.position.set(i * (len / 5), (height + 3.4) / 2, -depth - 0.2);
        g.add(col);
      }

      /* front wall of the deck */
      const front = new THREE.Mesh(new THREE.BoxGeometry(len, 1.4, 0.5), concrete);
      front.position.set(0, 0.7, 0.1);
      g.add(front);

      this.group.add(g);
    }

    this._crowdInstances(homeKit, depth, height, gap);
  }

  /** A few hundred instanced bodies on the front rows, bobbing with the noise
      level — the texture handles the rest of the bowl. */
  _crowdInstances(kit, depth, height, gap) {
    if (!SETTINGS.crowd || SETTINGS.quality === 'low') { this.crowdInst = null; return; }
    const rows = 5, perRow = 58;
    const geo = new THREE.CapsuleGeometry(0.19, 0.34, 3, 6);
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
    const total = rows * perRow * 4;
    const inst = new THREE.InstancedMesh(geo, mat, total);
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const colors = new Float32Array(geo.attributes.position.count * 3);
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const col = new THREE.Color();
    const palette = [kit.p, kit.s, '#cdd6f4', '#45475a', '#a6adc8', '#1e1e2e'];
    inst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(total * 3), 3);

    const m = new THREE.Matrix4();
    const rake = Math.atan2(height, depth);
    let k = 0;
    this.crowdPhase = new Float32Array(total);
    this.crowdBase = new Float32Array(total * 3);
    const sides = [
      { ax: 1, az: 0, ox: 0, oz: -(P.HALF_W + P.RUNOFF + gap), len: (P.HALF_L + P.RUNOFF) * 2, dir: -1, axis: 'z' },
      { ax: 1, az: 0, ox: 0, oz: (P.HALF_W + P.RUNOFF + gap), len: (P.HALF_L + P.RUNOFF) * 2, dir: 1, axis: 'z' },
      { ax: 0, az: 1, ox: -(P.HALF_L + P.RUNOFF + gap), oz: 0, len: (P.HALF_W + P.RUNOFF) * 2, dir: -1, axis: 'x' },
      { ax: 0, az: 1, ox: (P.HALF_L + P.RUNOFF + gap), oz: 0, len: (P.HALF_W + P.RUNOFF) * 2, dir: 1, axis: 'x' },
    ];
    for (const s of sides) {
      for (let r = 0; r < rows; r++) {
        const back = 1.2 + r * 1.5;
        const y = 1.2 + Math.tan(rake) * back;
        for (let i = 0; i < perRow; i++) {
          const t = (i / (perRow - 1) - 0.5) * s.len;
          let x, z;
          if (s.axis === 'z') { x = t; z = s.oz + s.dir * back; }
          else { x = s.ox + s.dir * back; z = t; }
          this.crowdBase[k * 3] = x; this.crowdBase[k * 3 + 1] = y; this.crowdBase[k * 3 + 2] = z;
          this.crowdPhase[k] = Math.random() * TAU;
          m.makeTranslation(x, y, z);
          inst.setMatrixAt(k, m);
          col.set(palette[(Math.random() * palette.length) | 0]);
          inst.setColorAt(k, col);
          k++;
        }
      }
    }
    inst.count = k;
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    inst.frustumCulled = false;
    this.group.add(inst);
    this.crowdInst = inst;
    this._cm = new THREE.Matrix4();
  }

  /* ------------------------------------------------------- floodlights --- */
  _floodlights() {
    const pylonMat = new THREE.MeshLambertMaterial({ color: 0x1a1a26 });
    const lampOff = new THREE.MeshBasicMaterial({ color: 0x2a2a3a });
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const g = new THREE.Group();
      const px = sx * (P.HALF_L + 30), pz = sz * (P.HALF_W + 30);
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.95, 44, 8), pylonMat);
      mast.position.set(px, 22, pz);
      g.add(mast);
      const head = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 1), lampOff.clone());
      head.position.set(px - sx * 2.4, 45, pz - sz * 2.4);
      head.lookAt(0, 0, 0);
      g.add(head);
      this.floods.push(head);
      this.group.add(g);

      const dl = new THREE.DirectionalLight(0xdce8ff, 0);
      dl.position.set(px * 0.7, 46, pz * 0.7);
      dl.target.position.set(0, 0, 0);
      g.add(dl); g.add(dl.target);
      this.floods.push(dl);
    }
  }

  /* ------------------------------------------------------------ options -- */
  setTime(key) {
    const t = TIME_PRESETS[key] || TIME_PRESETS.day;
    this.skyMat.uniforms.top.value.setHex(t.top);
    this.skyMat.uniforms.hz.value.setHex(t.hz);
    this.skyMat.uniforms.bot.value.setHex(t.bot);
    this.sun.color.setHex(t.sun); this.sun.intensity = t.sunI;
    this.hemi.intensity = t.hemiI;
    this.amb.color.setHex(t.amb);
    this.scene.fog = new THREE.FogExp2(t.fog, t.fogD);
    for (const f of this.floods) {
      if (f.isDirectionalLight) f.intensity = t.flood * 0.85;
      else f.material.color.setHex(t.flood > 0.2 ? 0xfff6dd : 0x2a2a3a);
    }
    this.timeKey = key;
  }

  setWeather(key) {
    if (this.wx) { this.group.remove(this.wx); this.wx.geometry.dispose(); this.wx = null; }
    Audio2.weather(key);
    if (key === 'clear') { this.wxKind = 'clear'; return; }
    const n = key === 'rain' ? (SETTINGS.quality === 'low' ? 1200 : 3600) : 2200;
    const pos = new Float32Array(n * 3);
    this.wxVel = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 150;
      pos[i * 3 + 1] = Math.random() * 40;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 110;
      this.wxVel[i] = key === 'rain' ? 22 + Math.random() * 10 : 1.4 + Math.random() * 1.1;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: key === 'rain' ? 0xbfd4ee : 0xffffff,
      size: key === 'rain' ? 0.10 : 0.16,
      transparent: true, opacity: key === 'rain' ? 0.45 : 0.8,
      depthWrite: false, sizeAttenuation: true,
    });
    this.wx = new THREE.Points(geo, mat);
    this.wx.frustumCulled = false;
    this.group.add(this.wx);
    this.wxKind = key;
    /* wet grass reads darker and shinier */
    if (this.pitchMesh) this.pitchMesh.material.color.setHex(key === 'snow' ? 0xd8e4f0 : 0xbfc7bf);
  }

  update(dt, intensity, focus) {
    this.t += dt;
    if (this.crowdInst) {
      const inst = this.crowdInst, m = this._cm;
      const amp = 0.06 + intensity * 0.34;
      const sp = 2.2 + intensity * 5;
      for (let i = 0; i < inst.count; i++) {
        const y = this.crowdBase[i * 3 + 1] + Math.abs(Math.sin(this.t * sp + this.crowdPhase[i])) * amp;
        m.makeTranslation(this.crowdBase[i * 3], y, this.crowdBase[i * 3 + 2]);
        inst.setMatrixAt(i, m);
      }
      inst.instanceMatrix.needsUpdate = true;
    }
    if (this.wx) {
      const p = this.wx.geometry.attributes.position;
      const arr = p.array;
      const cx = focus ? focus.x : 0, cz = focus ? focus.z : 0;
      const drift = this.wxKind === 'snow' ? Math.sin(this.t * 0.5) * 0.6 : 2.2;
      for (let i = 0; i < this.wxVel.length; i++) {
        arr[i * 3 + 1] -= this.wxVel[i] * dt;
        arr[i * 3] += drift * dt;
        if (arr[i * 3 + 1] < 0) {
          arr[i * 3 + 1] = 34 + Math.random() * 8;
          arr[i * 3] = cx + (Math.random() - 0.5) * 110;
          arr[i * 3 + 2] = cz + (Math.random() - 0.5) * 90;
        }
      }
      p.needsUpdate = true;
    }
    if (this.sky && focus) this.sky.position.set(focus.x, 0, focus.z);
  }
}

/** Dispose and detach every child of a group (used when rebuilding a stadium). */
function clear3(obj) {
  for (let i = obj.children.length - 1; i >= 0; i--) {
    const c = obj.children[i];
    clear3(c);
    obj.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      for (const m of mats) { if (m.map && m.map.dispose) m.map.dispose(); m.dispose(); }
    }
  }
}

//==========================================================================
// 25_ball.js
//==========================================================================
/* The ball is the only object in the game with a real dynamics solver.
   It carries angular velocity, so drag, the Magnus force, oblique bounces and
   deflections off players all fall out of the same integration step rather
   than being special-cased.  Players stay kinematic, which keeps control
   responsive; the ball is what needs to feel physical. */

function ballTexture() {
  const S = 256;
  const c = mkCanvas(S, S);
  const g = c.getContext('2d');
  g.fillStyle = '#f6f7fb'; g.fillRect(0, 0, S, S);
  g.fillStyle = '#20202e';
  const spots = [[0.12, 0.3], [0.35, 0.62], [0.58, 0.24], [0.8, 0.66], [0.05, 0.8], [0.68, 0.9], [0.47, 0.06], [0.92, 0.16]];
  for (const [u, v] of spots) {
    g.beginPath();
    const r = S * 0.075;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i / 5) * TAU;
      const x = u * S + Math.cos(a) * r, y = v * S + Math.sin(a) * r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath(); g.fill();
  }
  g.strokeStyle = 'rgba(30,30,46,.35)'; g.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    g.beginPath(); g.arc(S * 0.5, S * 0.5, S * (0.12 + i * 0.09), 0, TAU); g.stroke();
  }
  return mkTex(c);
}

class Ball {
  constructor(scene) {
    this.pos = V3(0, BALL.R, 0);
    this.vel = V3();
    this.spin = V3();
    this.prev = V3(0, BALL.R, 0);
    this.state = 'free';         // free | held | dead
    this.owner = null;           // player currently dribbling
    this.holder = null;          // keeper holding the ball
    this.lastTouch = null;       // { player, team, t, kind }
    this.prevTouch = null;
    this.inGoal = 0;             // 0 none, ±1 the side that was scored on
    this.groundedT = 0;
    this.onPost = null; this.onBounce = null; this.onNet = null;
    this._q = new THREE.Quaternion();
    this._axis = V3();

    const geo = new THREE.SphereGeometry(BALL.R, 20, 14);
    const mat = new THREE.MeshStandardMaterial({ map: ballTexture(), roughness: 0.55, metalness: 0.02 });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.castShadow = true;
    scene.add(this.mesh);

    this.shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: blobTexture('rgba(0,0,0,.55)'), transparent: true, depthWrite: false })
    );
    this.shadow.rotation.x = -Math.PI / 2;
    this.shadow.renderOrder = 2;
    scene.add(this.shadow);

    /* Short position history — the trail is drawn for powerful strikes. */
    this.trail = new Ring(26);
  }

  reset(x, z, y) {
    this.pos.set(x, y === undefined ? BALL.R : y, z);
    this.prev.copy(this.pos);
    this.vel.set(0, 0, 0);
    this.spin.set(0, 0, 0);
    this.state = 'free'; this.owner = null; this.holder = null; this.inGoal = 0;
    this.trail.clear();
  }

  speed() { return this.vel.length(); }
  isLoose() { return this.state === 'free' && !this.owner; }

  /** Apply a struck-ball velocity plus spin. dir is normalised on XZ. */
  kick(dirX, dirZ, power, lift, spinY, spinSide, player, kind) {
    const l = Math.hypot(dirX, dirZ) || 1;
    const dx = dirX / l, dz = dirZ / l;
    const vh = power * Math.cos(lift);
    this.vel.set(dx * vh, power * Math.sin(lift), dz * vh);
    if (this.vel.length() > BALL.MAX_SPEED) this.vel.setLength(BALL.MAX_SPEED);
    /* Side spin is about the world up axis; backspin/topspin is about the
       axis perpendicular to travel. */
    this.spin.set(-dz * spinY, spinSide, dx * spinY);
    this.state = 'free';
    this.owner = null; this.holder = null;
    this.pos.y = Math.max(this.pos.y, BALL.R + 0.02);
    this.touch(player, kind || 'kick');
    Audio2.kick(clamp01(power / 30), kind);
  }

  touch(player, kind) {
    if (player) {
      this.prevTouch = this.lastTouch;
      this.lastTouch = { player, team: player.team, id: player.id, t: performance.now() / 1000, kind: kind || 'touch' };
    }
  }

  /* ------------------------------------------------------------- solver -- */
  step(dt, players, ctx) {
    if (this.state === 'held') {
      this.trail.clear();
      this._sync();
      return;
    }
    this.prev.copy(this.pos);
    /* Fixed sub-steps: a 40 m/s shot moves 0.67 m per 60 Hz frame, which is
       three ball diameters — far too coarse for post and player contacts. */
    const sub = 1 / 300;
    let left = Math.min(dt, 0.1);
    while (left > 0) {
      const h = Math.min(sub, left);
      left -= h;
      this._integrate(h);
      this._ground(h);
      this._structures(h, ctx);
      if (players) this._players(h, players, ctx);
    }
    this._spinDecay(dt);
    this._sync();
    this.trail.push({ x: this.pos.x, y: this.pos.y, z: this.pos.z });
  }

  _integrate(h) {
    const v = this.vel;
    const sp = v.length();
    const airborne = this.pos.y > BALL.R + 0.015;

    if (sp > 0.01) {
      const k = BALL.DRAG * sp;
      v.x -= v.x * k * h; v.y -= v.y * k * h; v.z -= v.z * k * h;
    }
    if (airborne) {
      v.y -= BALL.G * h;
      const w = this.spin;
      /* a = k (ω × v) */
      const mx = w.y * v.z - w.z * v.y;
      const my = w.z * v.x - w.x * v.z;
      const mz = w.x * v.y - w.y * v.x;
      v.x += mx * BALL.MAGNUS * h;
      v.y += my * BALL.MAGNUS * h;
      v.z += mz * BALL.MAGNUS * h;
    }
    this.pos.x += v.x * h; this.pos.y += v.y * h; this.pos.z += v.z * h;
    if (v.lengthSq() > BALL.MAX_SPEED * BALL.MAX_SPEED) v.setLength(BALL.MAX_SPEED);
  }

  _ground(h) {
    const R = BALL.R;
    if (this.pos.y > R) { this.groundedT = 0; return; }
    this.pos.y = R;
    const v = this.vel, w = this.spin;
    const vn = v.y;

    if (vn < -0.55) {
      /* --- bounce ------------------------------------------------------- */
      const e = BALL.BOUNCE;
      v.y = -vn * e;
      if (this.onBounce) this.onBounce(Math.min(1, -vn / 12));
      this._tangentImpulse(BALL.GRASS_FRIC, (1 + e) * -vn);
    } else {
      /* --- resting, rolling or skidding --------------------------------- */
      v.y = Math.max(0, v.y);
      this.groundedT += h;
      /* Sustained normal load ≈ g·h worth of impulse per step. */
      this._tangentImpulse(BALL.GRASS_FRIC, BALL.G * h);
      const s = Math.hypot(v.x, v.z);
      if (s > 0.02) {
        const drop = Math.min(s, BALL.ROLL_RES * h);
        v.x -= (v.x / s) * drop; v.z -= (v.z / s) * drop;
      } else { v.x = 0; v.z = 0; }
      /* Settle toward a true rolling state so the ball visually rolls. */
      const tw = 1 - Math.exp(-9 * h);
      w.x = lerp(w.x, -v.z / R, tw);
      w.z = lerp(w.z, v.x / R, tw);
      w.y *= 1 - Math.min(1, 3.4 * h);
    }
  }

  /** Friction at the contact point of a sphere: the impulse that would null
      the contact-point velocity is (2/7)·m·|u|, capped by μ·Jn. */
  _tangentImpulse(mu, jn) {
    const R = BALL.R, v = this.vel, w = this.spin;
    const ux = v.x + R * w.z;
    const uz = v.z - R * w.x;
    const u = Math.hypot(ux, uz);
    if (u < 1e-4) return;
    const jNeeded = (2 / 7) * u;
    const j = Math.min(jNeeded, mu * jn);
    const dx = -(ux / u) * j, dz = -(uz / u) * j;
    v.x += dx; v.z += dz;
    /* Δω = (r × J)/I with r = −R·ŷ and I = 0.4·m·R². */
    w.x += (dz) / (0.4 * R);
    w.z += (-dx) / (0.4 * R);
  }

  _spinDecay(dt) {
    const k = Math.exp(-BALL.SPIN_DECAY * dt);
    this.spin.multiplyScalar(k);
    if (this.spin.lengthSq() < 1e-4) this.spin.set(0, 0, 0);
  }

  /* ------------------------------------------- goals, posts, nets -------- */
  _structures(h, ctx) {
    const R = BALL.R;
    const p = this.pos, v = this.vel;

    for (const s of [-1, 1]) {
      const gx = s * P.HALF_L;

      /* posts */
      for (const pz of [-P.GOAL_HW, P.GOAL_HW]) {
        if (p.y > P.GOAL_H + R) continue;
        const dx = p.x - gx, dz = p.z - pz;
        const d = Math.hypot(dx, dz);
        const rr = P.POST_R + R;
        if (d < rr && d > 1e-5) {
          const nx = dx / d, nz = dz / d;
          p.x = gx + nx * rr; p.z = pz + nz * rr;
          const vn = v.x * nx + v.z * nz;
          if (vn < 0) {
            v.x -= (1 + 0.62) * vn * nx;
            v.z -= (1 + 0.62) * vn * nz;
            this.spin.y += (-nz * v.x + nx * v.z) * 1.4;
            if (this.onPost) this.onPost('post', s);
          }
        }
      }
      /* crossbar */
      if (Math.abs(p.z) < P.GOAL_HW) {
        const dx = p.x - gx, dy = p.y - P.GOAL_H;
        const d = Math.hypot(dx, dy);
        const rr = P.POST_R + R;
        if (d < rr && d > 1e-5) {
          const nx = dx / d, ny = dy / d;
          p.x = gx + nx * rr; p.y = P.GOAL_H + ny * rr;
          const vn = v.x * nx + v.y * ny;
          if (vn < 0) {
            v.x -= (1 + 0.6) * vn * nx;
            v.y -= (1 + 0.6) * vn * ny;
            if (this.onPost) this.onPost('bar', s);
          }
        }
      }

      /* goal line crossing — swept so a hard shot cannot tunnel through */
      const line = s * (P.HALF_L + R * 0.92);
      const crossed = s > 0 ? (this.prev.x <= line && p.x > line) : (this.prev.x >= line && p.x < line);
      if (!this.inGoal && crossed) {
        const t = Math.abs(line - this.prev.x) / Math.max(1e-5, Math.abs(p.x - this.prev.x));
        const zc = lerp(this.prev.z, p.z, t);
        const yc = lerp(this.prev.y, p.y, t);
        if (Math.abs(zc) < P.GOAL_HW - R * 0.4 && yc < P.GOAL_H - R * 0.4 && yc > -0.1) {
          this.inGoal = s;
          if (this.onNet) this.onNet(s);
          Audio2.net();
        }
      }

      /* inside the net: catch the ball in the goal volume */
      if (this.inGoal === s) {
        const back = s * (P.HALF_L + P.GOAL_D - R);
        if (s > 0 ? p.x > back : p.x < back) { p.x = back; v.x *= -0.16; }
        if (Math.abs(p.z) > P.GOAL_HW - R) { p.z = Math.sign(p.z) * (P.GOAL_HW - R); v.z *= -0.2; }
        if (p.y > P.GOAL_H - R) { p.y = P.GOAL_H - R; v.y *= -0.2; }
        v.multiplyScalar(1 - Math.min(1, 5.5 * h));
      }
    }
  }

  /* ------------------------------------------------ deflections ---------- */
  _players(h, players, ctx) {
    const R = BALL.R, p = this.pos, v = this.vel;
    for (let i = 0; i < players.length; i++) {
      const pl = players[i];
      if (!pl.active || pl.state === 'down') continue;
      if (pl === this.owner) continue;
      if (pl.noBallT > 0) continue;                 // just gave the ball away
      const bodyR = pl.radius;
      const dx = p.x - pl.pos.x, dz = p.z - pl.pos.z;
      const d = Math.hypot(dx, dz);
      const top = pl.state === 'slide' ? 0.55 : pl.height;
      if (d > bodyR + R || p.y > top + R) continue;

      /* Keepers grab anything they can reach while diving or set. */
      if (pl.role === 'GK' && ctx && ctx.keeperCatch && ctx.keeperCatch(pl, this)) return;

      const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0;
      p.x = pl.pos.x + nx * (bodyR + R);
      p.z = pl.pos.z + nz * (bodyR + R);
      const rvx = v.x - pl.vel.x, rvz = v.z - pl.vel.z;
      const vn = rvx * nx + rvz * nz;
      if (vn < 0) {
        const e = pl.state === 'slide' ? 0.75 : 0.55;
        v.x -= (1 + e) * vn * nx;
        v.z -= (1 + e) * vn * nz;
        /* a struck ball popping off a shin tends to lift */
        const sp = Math.hypot(rvx, rvz);
        if (sp > 6 && p.y < 0.8) v.y = Math.max(v.y, Math.min(5.5, sp * 0.16));
        this.spin.y += (Math.random() - 0.5) * sp * 0.5;
        this.spin.x += (Math.random() - 0.5) * sp * 0.3;
        /* A deflection off anyone else takes the ball off the carrier. */
        if (this.owner && this.owner !== pl) { this.owner.noBallT = 0.24; this.owner = null; }
        this.touch(pl, 'deflect');
        if (ctx && ctx.onDeflect) ctx.onDeflect(pl, sp);
        Audio2.kick(clamp01(sp / 26) * 0.6, 'deflect');
      } else {
        /* Slow contact — ease the ball out from under the player's feet.
           This runs every sub-step, so the impulse has to be scaled by h or
           it turns into a rocket motor. */
        const k = Math.min(1, 9 * h);
        v.x += (nx * 1.3 + pl.vel.x * 0.35 - v.x) * k * 0.5;
        v.z += (nz * 1.3 + pl.vel.z * 0.35 - v.z) * k * 0.5;
      }
    }
  }

  /* --------------------------------------------------------- rendering --- */
  _sync() {
    this.mesh.position.copy(this.pos);
    const w = this.spin;
    const wl = w.length();
    if (wl > 0.001) {
      this._axis.copy(w).multiplyScalar(1 / wl);
      this._q.setFromAxisAngle(this._axis, wl * (1 / 60));
      this.mesh.quaternion.premultiply(this._q);
    }
    const hgt = clamp(this.pos.y - BALL.R, 0, 12);
    const s = clamp(0.42 + hgt * 0.14, 0.42, 1.5);
    this.shadow.position.set(this.pos.x, 0.02, this.pos.z);
    this.shadow.scale.set(s, s, 1);
    this.shadow.material.opacity = clamp(0.55 - hgt * 0.045, 0.08, 0.55);
  }

  /** True while the ball is fully outside the field of play. */
  outOfPlay() {
    if (this.inGoal) return false;
    return Math.abs(this.pos.z) > P.HALF_W + BALL.R * 0.9 ||
      Math.abs(this.pos.x) > P.HALF_L + BALL.R * 0.9;
  }

  /** Where the ball will be `t` seconds from now, ignoring collisions.
      Used by AI for interception and by the keeper for shot-stopping. */
  predict(t, out) {
    const o = out || V3();
    o.copy(this.pos);
    const v = this._pv || (this._pv = V3());
    v.copy(this.vel);
    const h = 1 / 40;
    let left = t;
    while (left > 0) {
      const dt = Math.min(h, left); left -= dt;
      const sp = v.length();
      if (sp > 0.01) { const k = BALL.DRAG * sp * dt; v.x -= v.x * k; v.y -= v.y * k; v.z -= v.z * k; }
      if (o.y > BALL.R + 0.02) v.y -= BALL.G * dt;
      o.x += v.x * dt; o.y += v.y * dt; o.z += v.z * dt;
      if (o.y < BALL.R) { o.y = BALL.R; v.y = Math.abs(v.y) * BALL.BOUNCE; }
    }
    return o;
  }

  /** Earliest time at which a runner at `speed` could reach the ball. */
  interceptTime(x, z, speed, maxT) {
    const probe = this._ip || (this._ip = V3());
    const lim = maxT || 2.6;
    for (let t = 0.06; t < lim; t += 0.09) {
      this.predict(t, probe);
      const need = dist2D(x, z, probe.x, probe.z) / Math.max(1, speed);
      if (need <= t) return t;
    }
    return lim;
  }
}

//==========================================================================
// 30_playerMesh.js
//==========================================================================
/* Stylised player model. Limbs are simple primitives on a hand-built joint
   hierarchy and every pose is generated procedurally — run cycles, strides,
   leans, kick swings, slides and keeper dives are all driven by the same
   blendable pose function, so there are no animation clips to author. */

const SKIN = [0xf0d0b0, 0xe0b48c, 0xc68a63, 0x9c6644, 0x6f4530, 0x4a2f22];
const HAIR = [0x1a1410, 0x3a2418, 0x6b4423, 0xb08040, 0xd8d8d8, 0x2c2c38];

const GEO = {};
function geoCache(key, make) { return GEO[key] || (GEO[key] = make()); }

class PlayerMesh {
  constructor(scene, player, kit, badge, isKeeper) {
    this.p = player;
    const scale = (player.height || 180) / 180;
    this.scale = scale;
    this.root = new THREE.Group();
    this.root.scale.setScalar(scale);
    scene.add(this.root);

    const useKit = isKeeper ? kit.gk || kit : kit;
    const skinC = SKIN[(player.skin || 0) % SKIN.length];
    const mSkin = new THREE.MeshLambertMaterial({ color: skinC });
    const mHair = new THREE.MeshLambertMaterial({ color: HAIR[(player.hairCol || 0) % HAIR.length] });
    const mShorts = new THREE.MeshLambertMaterial({ color: new THREE.Color(useKit.shorts || useKit.s) });
    const mSocks = new THREE.MeshLambertMaterial({ color: new THREE.Color(useKit.socks || useKit.p) });
    const mBoot = new THREE.MeshLambertMaterial({ color: 0x14141f });
    const mSleeve = new THREE.MeshLambertMaterial({ color: new THREE.Color(useKit.p) });
    const mTorso = new THREE.MeshLambertMaterial({ map: kitTexture(useKit, player.num, isKeeper ? null : badge) });
    this.mats = [mSkin, mHair, mShorts, mSocks, mBoot, mSleeve, mTorso];

    const build = player.build === undefined ? 0.5 : player.build;
    const girth = 0.9 + build * 0.28;

    /* ---- hips ---------------------------------------------------------- */
    this.hip = new THREE.Group();
    this.hip.position.y = 0.88;
    this.root.add(this.hip);

    const pelvis = new THREE.Mesh(
      geoCache('pelvis', () => new THREE.BoxGeometry(0.30, 0.20, 0.19)), mShorts);
    pelvis.scale.x = girth;
    this.hip.add(pelvis);

    /* ---- torso --------------------------------------------------------- */
    this.chest = new THREE.Group();
    this.chest.position.y = 0.10;
    this.hip.add(this.chest);

    const torso = new THREE.Mesh(
      geoCache('torso', () => {
        const g = new THREE.CylinderGeometry(0.165, 0.185, 0.56, 14, 1, false);
        g.translate(0, 0.28, 0);
        return g;
      }), mTorso);
    torso.scale.set(girth, 1, girth * 0.86);
    torso.castShadow = true;
    this.chest.add(torso);

    /* ---- head ---------------------------------------------------------- */
    this.neck = new THREE.Group();
    this.neck.position.y = 0.60;
    this.chest.add(this.neck);
    const head = new THREE.Mesh(geoCache('head', () => new THREE.SphereGeometry(0.113, 14, 12)), mSkin);
    head.position.y = 0.10; head.scale.set(0.94, 1.08, 0.98);
    head.castShadow = true;
    this.neck.add(head);
    const hairStyle = (player.hair || 0) % 7;
    if (hairStyle < 5) {
      const hair = new THREE.Mesh(
        geoCache('hair' + hairStyle, () => new THREE.SphereGeometry(0.119, 12, 10,
          0, TAU, 0, hairStyle === 0 ? 1.05 : hairStyle === 1 ? 1.5 : hairStyle === 2 ? 1.9 : 1.25)),
        mHair);
      hair.position.y = 0.107; hair.scale.set(0.98, 1.1, 1.0);
      this.neck.add(hair);
    }

    /* ---- arms ---------------------------------------------------------- */
    const armGeoU = geoCache('armU', () => {
      const g = new THREE.CapsuleGeometry(0.052, 0.20, 3, 7); g.translate(0, -0.13, 0); return g;
    });
    const armGeoL = geoCache('armL', () => {
      const g = new THREE.CapsuleGeometry(0.045, 0.19, 3, 7); g.translate(0, -0.12, 0); return g;
    });
    this.arms = [];
    for (const s of [-1, 1]) {
      const sh = new THREE.Group();
      sh.position.set(s * 0.185 * girth, 0.53, 0);
      this.chest.add(sh);
      const up = new THREE.Mesh(armGeoU, mSleeve);
      up.castShadow = true;
      sh.add(up);
      const elb = new THREE.Group();
      elb.position.y = -0.26;
      sh.add(elb);
      const lo = new THREE.Mesh(armGeoL, isKeeper ? new THREE.MeshLambertMaterial({ color: new THREE.Color(useKit.a) }) : mSkin);
      elb.add(lo);
      const hand = new THREE.Mesh(geoCache('hand', () => new THREE.SphereGeometry(0.052, 8, 6)),
        isKeeper ? new THREE.MeshLambertMaterial({ color: new THREE.Color(useKit.a) }) : mSkin);
      hand.position.y = -0.245;
      elb.add(hand);
      this.arms.push({ sh, elb, side: s });
    }

    /* ---- legs ---------------------------------------------------------- */
    const legGeoU = geoCache('legU', () => {
      const g = new THREE.CapsuleGeometry(0.072, 0.29, 3, 8); g.translate(0, -0.18, 0); return g;
    });
    const legGeoL = geoCache('legL', () => {
      const g = new THREE.CapsuleGeometry(0.060, 0.28, 3, 8); g.translate(0, -0.175, 0); return g;
    });
    this.legs = [];
    for (const s of [-1, 1]) {
      const hipJ = new THREE.Group();
      hipJ.position.set(s * 0.085 * girth, -0.06, 0);
      this.hip.add(hipJ);
      const up = new THREE.Mesh(legGeoU, mShorts);
      up.castShadow = true;
      hipJ.add(up);
      const knee = new THREE.Group();
      knee.position.y = -0.40;
      hipJ.add(knee);
      const lo = new THREE.Mesh(legGeoL, mSocks);
      lo.castShadow = true;
      knee.add(lo);
      const boot = new THREE.Mesh(geoCache('boot', () => {
        const g = new THREE.BoxGeometry(0.095, 0.062, 0.20); g.translate(0, 0, 0.035); return g;
      }), mBoot);
      boot.position.y = -0.375;
      knee.add(boot);
      this.legs.push({ hip: hipJ, knee, boot, side: s });
    }

    /* selection ring + player indicator */
    this.ring = new THREE.Mesh(
      new THREE.RingGeometry(0.42, 0.52, 24),
      new THREE.MeshBasicMaterial({ color: 0x89b4fa, transparent: true, opacity: 0, depthWrite: false })
    );
    this.ring.rotation.x = -Math.PI / 2;
    this.ring.position.y = 0.03;
    this.ring.renderOrder = 3;
    this.root.add(this.ring);

    this.arrow = new THREE.Mesh(
      geoCache('arrow', () => new THREE.ConeGeometry(0.12, 0.24, 4)),
      new THREE.MeshBasicMaterial({ color: 0x89b4fa, transparent: true, opacity: 0 })
    );
    this.arrow.rotation.x = Math.PI;
    this.arrow.position.y = 2.15;
    this.root.add(this.arrow);

    this.phase = 0;
    this.lean = 0;
    this.armSwing = 0;
  }

  setIndicator(on, color) {
    const o = on ? 1 : 0;
    this.ring.material.opacity = damp(this.ring.material.opacity, o * 0.85, 12, 1 / 60);
    this.arrow.material.opacity = this.ring.material.opacity;
    if (color !== undefined) { this.ring.material.color.setHex(color); this.arrow.material.color.setHex(color); }
  }

  dispose(scene) {
    scene.remove(this.root);
    clear3(this.root);
    for (const m of this.mats) { if (m.map) m.map.dispose(); m.dispose(); }
  }

  /* -------------------------------------------------------------- pose --- */
  update(dt, s) {
    const root = this.root;
    root.position.set(s.pos.x, s.pos.y || 0, s.pos.z);
    root.rotation.y = s.yaw;

    const spd = s.speed;
    const stride = clamp(0.55 + spd * 0.10, 0.55, 1.45);
    this.phase += dt * (spd > 0.15 ? (spd / (0.9 * stride)) * 3.0 : 1.6);
    const ph = this.phase;

    /* Blend weights between standing, running and the action poses. */
    const run = clamp01(spd / 3.4);
    const sprintK = clamp01((spd - 5.4) / 3.2);

    const A = s.action;                 // null | {kind, t, dur, side}
    let kick = 0, slide = 0, dive = 0, tackle = 0, celebrate = 0, down = 0;
    if (A) {
      const u = clamp01(A.t / A.dur);
      if (A.kind === 'shoot' || A.kind === 'pass' || A.kind === 'lob') kick = Math.sin(u * Math.PI);
      else if (A.kind === 'slide') slide = u < 0.18 ? u / 0.18 : 1 - clamp01((u - 0.7) / 0.3);
      else if (A.kind === 'dive') dive = Math.min(1, u * 3.2);
      else if (A.kind === 'tackle') tackle = Math.sin(u * Math.PI);
      else if (A.kind === 'celebrate') celebrate = 1;
      else if (A.kind === 'down') down = 1;
    }

    /* ---- base run cycle ------------------------------------------------ */
    const swing = (0.45 + run * 0.62 + sprintK * 0.30);
    const lSwing = Math.sin(ph) * swing;
    const rSwing = Math.sin(ph + Math.PI) * swing;
    const kneeL = Math.max(0, -Math.sin(ph - 0.7)) * (0.55 + run * 0.85);
    const kneeR = Math.max(0, -Math.sin(ph + Math.PI - 0.7)) * (0.55 + run * 0.85);

    const targetLean = clamp(spd * 0.045 + (s.accelF || 0) * 0.05, -0.12, 0.42);
    this.lean = damp(this.lean, targetLean, 9, dt);

    /* ---- assemble ------------------------------------------------------ */
    let hipY = 0.88, hipRotX = 0, hipRotZ = 0, chestRotX = this.lean, chestRotY = 0;
    let legs = [
      { hip: lSwing, knee: kneeL },
      { hip: rSwing, knee: kneeR },
    ];
    let armA = -lSwing * 0.75, armB = -rSwing * 0.75;
    let elbowBend = 0.5 + run * 0.5;

    hipY += Math.abs(Math.sin(ph * 2)) * (0.012 + run * 0.035) - run * 0.02;

    /* kick: plant one foot, swing the other through */
    if (kick > 0) {
      const side = A.side === undefined ? 1 : A.side;   // 0 left, 1 right
      const u = clamp01(A.t / A.dur);
      const sw = Math.sin(u * Math.PI) * (A.kind === 'shoot' ? 1 : 0.7);
      const back = u < 0.42 ? -sw * 1.15 : 0;
      const fwd = u >= 0.42 ? sw * 1.25 : 0;
      legs[side].hip = lerp(legs[side].hip, back + fwd, kick);
      legs[side].knee = lerp(legs[side].knee, u < 0.42 ? 1.15 * sw : 0.12, kick);
      legs[1 - side].hip = lerp(legs[1 - side].hip, -0.15, kick * 0.8);
      legs[1 - side].knee = lerp(legs[1 - side].knee, 0.28, kick * 0.8);
      chestRotX = lerp(chestRotX, A.kind === 'lob' ? -0.22 : 0.16, kick);
      chestRotY = lerp(0, side ? 0.34 : -0.34, kick * 0.6);
      armA = lerp(armA, side ? -1.1 : 0.5, kick);
      armB = lerp(armB, side ? 0.5 : -1.1, kick);
    }

    if (tackle > 0) {
      legs[0].hip = lerp(legs[0].hip, 0.9, tackle); legs[0].knee = lerp(legs[0].knee, 0.5, tackle);
      chestRotX = lerp(chestRotX, 0.42, tackle);
      armA = lerp(armA, -1.2, tackle); armB = lerp(armB, -0.8, tackle);
    }

    if (slide > 0) {
      hipY = lerp(hipY, 0.30, slide);
      hipRotX = lerp(0, -1.15, slide);
      chestRotX = lerp(chestRotX, 0.55, slide);
      legs[0].hip = lerp(legs[0].hip, 1.15, slide); legs[0].knee = lerp(legs[0].knee, 0.15, slide);
      legs[1].hip = lerp(legs[1].hip, 0.15, slide); legs[1].knee = lerp(legs[1].knee, 1.5, slide);
      armA = lerp(armA, -1.5, slide); armB = lerp(armB, -1.5, slide);
    }

    if (dive > 0) {
      const dirSide = A.side ? 1 : -1;
      hipY = lerp(hipY, 0.55 + (A.high ? 0.85 : 0), dive);
      hipRotZ = lerp(0, dirSide * 1.35, dive);
      legs[0].hip = lerp(legs[0].hip, 0.3, dive); legs[1].hip = lerp(legs[1].hip, -0.2, dive);
      legs[0].knee = lerp(legs[0].knee, 0.35, dive); legs[1].knee = lerp(legs[1].knee, 0.2, dive);
      armA = lerp(armA, -2.5, dive); armB = lerp(armB, -2.5, dive);
      elbowBend = lerp(elbowBend, 0.05, dive);
    }

    if (celebrate > 0) {
      const w = Math.sin(this.phase * 3.2);
      armA = lerp(armA, -2.7 + w * 0.3, celebrate);
      armB = lerp(armB, -2.7 - w * 0.3, celebrate);
      hipY += Math.abs(Math.sin(this.phase * 3.2)) * 0.13 * celebrate;
      chestRotX = lerp(chestRotX, -0.15, celebrate);
    }

    if (down > 0) {
      hipY = lerp(hipY, 0.22, down);
      hipRotX = lerp(hipRotX, -1.45, down);
      chestRotX = lerp(chestRotX, 0.2, down);
      legs[0].knee = lerp(legs[0].knee, 1.1, down); legs[1].knee = lerp(legs[1].knee, 0.6, down);
    }

    /* GK ready stance */
    if (s.ready) {
      hipY = lerp(hipY, 0.80, 0.7);
      legs[0].hip = lerp(legs[0].hip, -0.28, 0.7); legs[1].hip = lerp(legs[1].hip, 0.28, 0.7);
      legs[0].knee = lerp(legs[0].knee, 0.55, 0.7); legs[1].knee = lerp(legs[1].knee, 0.55, 0.7);
      armA = lerp(armA, -0.85, 0.75); armB = lerp(armB, -0.85, 0.75);
      elbowBend = lerp(elbowBend, 1.0, 0.7);
    }

    this.hip.position.y = hipY;
    this.hip.rotation.set(hipRotX, 0, hipRotZ);
    this.chest.rotation.set(chestRotX, chestRotY, 0);
    this.neck.rotation.x = -chestRotX * 0.6 + (s.lookDown || 0);

    for (let i = 0; i < 2; i++) {
      this.legs[i].hip.rotation.x = legs[i].hip;
      this.legs[i].knee.rotation.x = -legs[i].knee;
    }
    this.arms[0].sh.rotation.x = armA;
    this.arms[1].sh.rotation.x = armB;
    this.arms[0].sh.rotation.z = 0.18 + (dive ? -1.1 * dive : 0);
    this.arms[1].sh.rotation.z = -0.18 + (dive ? 1.1 * dive : 0);
    this.arms[0].elb.rotation.x = -elbowBend;
    this.arms[1].elb.rotation.x = -elbowBend;
  }
}

//==========================================================================
// 35_playerSim.js
//==========================================================================
/* Kinematic player controller. Movement is capsule-and-velocity rather than
   rigid-body, which is what keeps the game responsive; the ball is the only
   thing simulated dynamically. Dribbling is touch-based: the carrier knocks
   the ball ahead at intervals and the ball rolls freely in between, so close
   control is a real attribute rather than the ball being glued to a foot. */

const CTRL = {
  REACH: 1.05,          // how far a player can reach to take a touch
  TOUCH_MIN: 0.20,      // seconds between dribble touches (best control)
  TOUCH_MAX: 0.42,
  KICK_DELAY: 0.10,     // windup before the foot meets the ball
  STAGGER: 0.55,
  TACKLE_RANGE: 1.9,
  SLIDE_TIME: 0.62,
};

const SKILLS = {
  stepover: { dur: 0.55, cost: 0.06, label: 'Step-over' },
  dragback: { dur: 0.5, cost: 0.05, label: 'Drag-back' },
  knockon: { dur: 0.35, cost: 0.08, label: 'Knock-on' },
  roulette: { dur: 0.72, cost: 0.09, label: 'Roulette' },
  flick: { dur: 0.6, cost: 0.07, label: 'Flick-up' },
  nutmeg: { dur: 0.45, cost: 0.06, label: 'Nutmeg' },
};

class MPlayer {
  constructor(data, team, idx, scene, kit, badge) {
    this.data = data;
    this.id = data.id;
    this.team = team;
    this.idx = idx;
    this.role = data.role;
    this.pos = V3(0, 0, 0);
    this.vel = V3();
    this.dir = team === 0 ? 1 : -1;      // which way this team is attacking
    this.yaw = team === 0 ? Math.PI / 2 : -Math.PI / 2;
    this.speed = 0;
    this.radius = 0.36;
    this.height = 1.86 * ((data.height || 180) / 180);
    this.baseRadius = this.radius;
    this.baseHeight = this.height;
    this.d = derive(data);
    this.active = true;

    this.state = 'idle';
    this.action = null;
    this.pendingKick = null;
    this.stamina = 1;
    this.staggerT = 0;
    this.noBallT = 0;
    this.dribbleT = 0;
    this.controlT = 0;
    this.sprintHeld = false;
    this.wantX = 0; this.wantZ = 0;
    this.accelF = 0;
    this.slideT = 0;
    this.downT = 0;
    this.cardT = 0;
    this.lastShot = 0;
    this.aiTimer = Math.random() * 0.12;
    this.brain = null;              // filled in by the AI module
    this.human = -1;                // index of the local player controlling this one
    this.matchRating = 6.0;
    this.stats = { passes: 0, passOk: 0, shots: 0, onTarget: 0, tackles: 0, goals: 0, assists: 0, distance: 0 };

    this.mesh = new PlayerMesh(scene, data, kit, badge, data.role === 'GK');
    this.mesh.update(0, this._poseState());
  }

  dispose(scene) { this.mesh.dispose(scene); }

  /* ------------------------------------------------------------ helpers -- */
  get fwdX() { return Math.sin(this.yaw); }
  get fwdZ() { return Math.cos(this.yaw); }
  /** Attacking direction — flips at half time. */
  get attackX() { return this.dir; }

  hasBall(ball) { return ball.owner === this; }

  distTo(x, z) { return dist2D(this.pos.x, this.pos.z, x, z); }

  maxSpeed() {
    const fatigue = 0.72 + 0.28 * this.stamina;
    const base = this.sprintHeld ? this.d.sprintSpeed : this.d.topSpeed;
    return base * fatigue * (this.staggerT > 0 ? 0.55 : 1);
  }

  _poseState() {
    return {
      pos: this.pos, yaw: this.yaw, speed: this.speed, action: this.action,
      accelF: this.accelF, ready: this.role === 'GK' && this.speed < 1.2 && !this.action,
      lookDown: 0,
    };
  }

  /* --------------------------------------------------------- locomotion -- */
  /** dirX/dirZ is the desired world-space direction, magnitude 0..1. */
  drive(dirX, dirZ, sprint, dt) {
    this.wantX = dirX; this.wantZ = dirZ;
    this.sprintHeld = !!sprint && this.stamina > 0.06;
    const mag = Math.hypot(dirX, dirZ);
    const locked = this.state === 'slide' || this.state === 'down' || this.state === 'dive';

    let ms = this.maxSpeed();
    if (this.action && (this.action.kind === 'shoot' || this.action.kind === 'pass' || this.action.kind === 'lob')) ms *= 0.55;
    if (this.action && this.action.kind === 'tackle') ms *= 0.4;

    const tx = mag > 0.02 ? (dirX / mag) * ms * Math.min(1, mag) : 0;
    const tz = mag > 0.02 ? (dirZ / mag) * ms * Math.min(1, mag) : 0;

    if (!locked) {
      const acc = (mag > 0.02 ? this.d.accel : this.d.accel * 1.7) * (this.staggerT > 0 ? 0.45 : 1);
      const dvx = tx - this.vel.x, dvz = tz - this.vel.z;
      const dl = Math.hypot(dvx, dvz);
      if (dl > 1e-4) {
        const step = Math.min(dl, acc * dt);
        this.vel.x += (dvx / dl) * step;
        this.vel.z += (dvz / dl) * step;
      }
      this.accelF = clamp((dl > 1e-4 ? (dvx * this.vel.x + dvz * this.vel.z) / (dl * Math.max(0.1, this.speed)) : 0), -1, 1);
    } else {
      /* A slide scrubs off speed on the grass; a dive is ballistic and must
         keep its momentum, or the keeper never reaches the ball. */
      const k = this.state === 'slide' ? 2.6 : this.state === 'dive' ? 0.45 : 7.5;
      this.vel.x -= this.vel.x * Math.min(1, k * dt);
      this.vel.z -= this.vel.z * Math.min(1, k * dt);
    }

    this.speed = Math.hypot(this.vel.x, this.vel.z);
    this.stats.distance += this.speed * dt;

    /* Facing follows travel; a carrier turns more slowly than a free runner. */
    if (this.speed > 0.35 && !locked) {
      const want = Math.atan2(this.vel.x, this.vel.z);
      const rate = this.d.agility * (this.ownsBall ? 0.72 : 1) * dt;
      this.yaw = angApproach(this.yaw, want, rate);
    } else if (mag > 0.02 && !locked && this.speed < 0.35) {
      this.yaw = angApproach(this.yaw, Math.atan2(dirX, dirZ), this.d.agility * 1.4 * dt);
    }

    /* stamina */
    const load = this.speed / Math.max(1, this.d.sprintSpeed);
    const drain = (this.sprintHeld ? 0.055 : 0.021) * load * load;
    const trait = this.data.traits && this.data.traits.includes('engine') ? 0.55 : 1;
    this.stamina = clamp01(this.stamina - drain * trait * dt / Math.max(0.4, this.d.stamina)
      + (this.speed < 1.4 ? 0.028 * dt : 0));
  }

  /* --------------------------------------------------------------- tick -- */
  update(dt, ball, ctx) {
    if (this.staggerT > 0) this.staggerT -= dt;
    if (this.noBallT > 0) this.noBallT -= dt;
    if (this.cardT > 0) this.cardT -= dt;

    if (this.action) {
      this.action.t += dt;
      if (this.pendingKick && this.action.t >= CTRL.KICK_DELAY) {
        const k = this.pendingKick; this.pendingKick = null;
        this._strike(ball, k, ctx);
      }
      if (this.action.t >= this.action.dur) {
        const kind = this.action.kind;
        this.action = null;
        if (kind === 'slide') { this.state = 'idle'; this.noBallT = Math.max(this.noBallT, 0.18); }
        else if (kind === 'dive') {
          this.state = 'idle';
          this.radius = this.baseRadius; this.height = this.baseHeight;
          this.vel.set(0, 0, 0);
        } else if (kind === 'down') this.state = 'idle';
        else if (this.state !== 'down') this.state = 'idle';
      } else {
        this.state = this.action.kind === 'slide' ? 'slide'
          : this.action.kind === 'down' ? 'down'
            : this.action.kind === 'dive' ? 'dive' : this.state;
      }
    }

    /* keep everyone inside a generous boundary so nobody wanders into the stands */
    const bx = P.HALF_L + P.RUNOFF * 0.5, bz = P.HALF_W + P.RUNOFF * 0.5;
    if (Math.abs(this.pos.x) > bx) { this.pos.x = clamp(this.pos.x, -bx, bx); this.vel.x *= -0.2; }
    if (Math.abs(this.pos.z) > bz) { this.pos.z = clamp(this.pos.z, -bz, bz); this.vel.z *= -0.2; }

    this.pos.x += this.vel.x * dt;
    this.pos.z += this.vel.z * dt;

    this.ownsBall = ball.owner === this;
    if (this.ownsBall) this.controlT += dt; else this.controlT = 0;

    this.mesh.update(dt, this._poseState());
  }

  /* ------------------------------------------------------- ball control -- */
  /** Called by the match loop for every player each frame. Returns true if
      this player took the ball this frame. */
  tryTake(ball, dt) {
    if (this.noBallT > 0 || this.state === 'down' || !this.active) return false;
    if (ball.state !== 'free') return false;
    /* A ball under someone's control changes hands through a tackle or a
       deflection, never by another player simply standing near it. */
    if (ball.owner) return false;
    const d = this.distTo(ball.pos.x, ball.pos.z);
    const reach = CTRL.REACH * (this.state === 'slide' ? 1.35 : 1);
    if (d > reach || ball.pos.y > 1.25) return false;

    /* A fast ball needs a good first touch to be brought under control. */
    const bs = ball.speed();
    const control = this.d.firstTouch * (0.6 + 0.4 * this.stamina);
    if (bs > 6 + control * 16) {
      /* Deflect it: the touch gets away, but they've knocked it forward. */
      const kx = ball.vel.x * 0.35 + this.fwdX * 2.2;
      const kz = ball.vel.z * 0.35 + this.fwdZ * 2.2;
      ball.vel.set(kx, ball.vel.y * 0.3, kz);
      ball.touch(this, 'touch');
      this.noBallT = 0.14;
      return false;
    }
    ball.owner = this;
    ball.state = 'free';
    ball.touch(this, 'control');
    this.dribbleT = 0.05;
    if (ctxOnTake) ctxOnTake(this);
    return true;
  }

  /** Touch-based dribbling: knock the ball ahead, then run onto it. */
  dribble(ball, dt) {
    if (ball.owner !== this) return;
    const d = this.distTo(ball.pos.x, ball.pos.z);

    /* Lose it if a touch gets away — the faster you run, the more rope. */
    if (d > 2.4 + this.speed * 0.26) { this.release(ball, 0); return; }

    this.dribbleT -= dt;
    const cadence = lerp(CTRL.TOUCH_MAX, CTRL.TOUCH_MIN, clamp01((this.d.control - 0.66) / 0.42));
    if (this.dribbleT <= 0 && d < CTRL.REACH) {
      /* Knock it only fractionally faster than the player is running, so they
         run onto their own touch instead of chasing it into the next county. */
      const err = (1 - this.d.control * 0.7) * (this.sprintHeld ? 0.30 : 0.13);
      const a = this.yaw + (Math.random() - 0.5) * err;
      const push = Math.max(1.6, this.speed * 0.97 + (this.sprintHeld ? 1.9 : 1.0));
      ball.vel.set(Math.sin(a) * push, 0, Math.cos(a) * push);
      ball.pos.y = BALL.R;
      ball.spin.set(-Math.cos(a) * push / BALL.R, 0, Math.sin(a) * push / BALL.R);
      ball.touch(this, 'dribble');
      this.dribbleT = cadence * (this.speed > 5 ? 1 : 0.86);
      if (Math.random() < 0.4) Audio2.kick(0.08, 'touch');
    }
    /* Gentle shepherding keeps a slow dribble from drifting away sideways. */
    if (this.speed < 2.4 && d < CTRL.REACH) {
      const tx = this.pos.x + this.fwdX * 0.52, tz = this.pos.z + this.fwdZ * 0.52;
      ball.vel.x = damp(ball.vel.x, (tx - ball.pos.x) * 5.5, 8, dt);
      ball.vel.z = damp(ball.vel.z, (tz - ball.pos.z) * 5.5, 8, dt);
    }
  }

  release(ball, cooldown) {
    if (ball.owner === this) ball.owner = null;
    this.noBallT = Math.max(this.noBallT, cooldown === undefined ? 0.22 : cooldown);
  }

  /* ------------------------------------------------------------- strike -- */
  /** Queue a strike; the ball is actually hit CTRL.KICK_DELAY later. */
  queueKick(kind, params) {
    if (this.action && this.action.kind !== 'idle') return false;
    const side = this.data.foot === 'L' ? 0 : 1;
    const dur = kind === 'shoot' ? 0.44 : kind === 'lob' ? 0.42 : 0.34;
    this.action = { kind, t: 0, dur, side };
    this.state = 'kick';
    this.pendingKick = Object.assign({ kind }, params);
    return true;
  }

  _strike(ball, k, ctx) {
    if (ball.owner !== this && this.distTo(ball.pos.x, ball.pos.z) > CTRL.REACH * 1.5) return;
    ball.owner = null;
    this.noBallT = 0.16;

    let dx = k.dx, dz = k.dz;
    const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;

    /* Accuracy error scales with the attribute, the pressure and fatigue. */
    const acc = k.kind === 'shoot' ? this.d.shotAcc : this.d.passAcc;
    const press = k.pressure || 0;
    /* Shots are struck harder and under more duress than passes, so the
       angular error on them is much larger — otherwise every attempt is a
       pinpoint corner and keepers become spectators. */
    const base = k.kind === 'shoot' ? 0.40 : 0.10;
    const spread = (1 - acc) * (base + press * 0.26) * (2 - this.stamina) * (k.spreadMul || 1);
    const a = Math.atan2(dx, dz) + (Math.random() - 0.5) * spread * 2;
    dx = Math.sin(a); dz = Math.cos(a);

    const power = clamp(k.power, 3, k.kind === 'shoot' ? 44 : 34);
    const lift = k.lift || 0;
    const spinY = k.spinY !== undefined ? k.spinY : -5;
    const spinSide = (k.spinSide || 0) * this.d.curve * 12;

    ball.pos.x = this.pos.x + dx * 0.28;
    ball.pos.z = this.pos.z + dz * 0.28;
    ball.pos.y = Math.max(ball.pos.y, BALL.R + (lift > 0.1 ? 0.05 : 0));
    ball.kick(dx, dz, power, lift, spinY, spinSide, this, k.kind);

    if (k.kind === 'shoot') { this.stats.shots++; this.lastShot = performance.now() / 1000; }
    else this.stats.passes++;
    if (ctx && ctx.onKick) ctx.onKick(this, k, ball);
  }

  /* ------------------------------------------------------------ actions -- */
  tackle(ball, ctx) {
    if (this.action || this.staggerT > 0) return;
    this.action = { kind: 'tackle', t: 0, dur: 0.42, side: 1 };
    this.state = 'tackle';
    const victim = ball.owner;
    if (!victim || victim.team === this.team) return;
    const d = this.distTo(victim.pos.x, victim.pos.z);
    if (d > CTRL.TACKLE_RANGE) return;
    /* front-on tackles are much more likely to be clean */
    const toV = Math.atan2(victim.pos.x - this.pos.x, victim.pos.z - this.pos.z);
    const facing = Math.abs(angDelta(this.yaw, toV));
    const cone = clamp01(1 - facing / 1.4);
    const win = clamp01(0.18 + (this.d.tackle - victim.d.control * 0.72) * 0.9 + cone * 0.3
      - (victim.sprintHeld ? 0.12 : 0));
    this.stats.tackles++;
    if (Math.random() < win) {
      victim.release(ball, 0.4);
      victim.staggerT = CTRL.STAGGER * 0.7;
      ball.vel.set(this.fwdX * 4.2 + (Math.random() - 0.5) * 2, 0.6, this.fwdZ * 4.2 + (Math.random() - 0.5) * 2);
      ball.touch(this, 'tackle');
      this.noBallT = 0.1;
      if (ctx && ctx.onTackle) ctx.onTackle(this, victim, true);
      Audio2.kick(0.35, 'tackle');
    } else {
      this.staggerT = CTRL.STAGGER;
      if (ctx && ctx.onTackle) ctx.onTackle(this, victim, false);
    }
  }

  slide(ball, ctx) {
    if (this.action || this.staggerT > 0 || this.stamina < 0.08) return;
    this.action = { kind: 'slide', t: 0, dur: CTRL.SLIDE_TIME, side: 1 };
    this.state = 'slide';
    this.slideT = CTRL.SLIDE_TIME;
    this.stamina = clamp01(this.stamina - 0.09);
    const boost = 5.2 + this.d.strength * 2.6;
    this.vel.set(this.fwdX * boost, 0, this.fwdZ * boost);
    if (ctx && ctx.onSlide) ctx.onSlide(this);
    Audio2.slide();
  }

  goDown(dur) {
    this.action = { kind: 'down', t: 0, dur: dur || 1.4, side: 1 };
    this.state = 'down';
    this.vel.set(0, 0, 0);
  }

  celebrate(dur) {
    this.action = { kind: 'celebrate', t: 0, dur: dur || 3.5, side: 1 };
    this.state = 'celebrate';
  }

  /* Skill moves. `dirX/dirZ` is the stick direction relative to travel. */
  doSkill(kind, ball, ctx) {
    const s = SKILLS[kind];
    if (!s || this.action || this.stamina < s.cost || ball.owner !== this) return false;
    this.stamina -= s.cost;
    this.skill = { kind, t: 0, dur: s.dur };
    const flair = this.d.flair;

    if (kind === 'stepover' || kind === 'roulette') {
      const side = Math.random() < 0.5 ? -1 : 1;
      const a = this.yaw + side * (kind === 'roulette' ? 1.6 : 0.85);
      this.vel.set(Math.sin(a) * this.maxSpeed() * 1.05, 0, Math.cos(a) * this.maxSpeed() * 1.05);
      ball.vel.set(Math.sin(a) * (this.speed + 2.4), 0, Math.cos(a) * (this.speed + 2.4));
      this.yaw = a;
    } else if (kind === 'dragback') {
      const a = this.yaw + Math.PI;
      this.vel.set(Math.sin(a) * 3.2, 0, Math.cos(a) * 3.2);
      ball.vel.set(Math.sin(a) * 3.0, 0, Math.cos(a) * 3.0);
      this.yaw = a;
    } else if (kind === 'knockon') {
      const push = this.speed * 1.15 + 6.5;
      ball.vel.set(this.fwdX * push, 0, this.fwdZ * push);
      this.sprintHeld = true;
      this.release(ball, 0.05);
    } else if (kind === 'flick') {
      ball.vel.set(this.fwdX * 5.5, 5.2, this.fwdZ * 5.5);
      ball.spin.set(-this.fwdZ * 14, 0, this.fwdX * 14);
      this.release(ball, 0.25);
    } else if (kind === 'nutmeg') {
      const push = this.speed + 7.5;
      ball.vel.set(this.fwdX * push, 0, this.fwdZ * push);
      this.release(ball, 0.12);
    }
    ball.touch(this, 'skill');

    /* Beaten defenders lose a beat. */
    if (ctx && ctx.players) {
      for (const o of ctx.players) {
        if (o.team === this.team || o.role === 'GK') continue;
        const d = this.distTo(o.pos.x, o.pos.z);
        if (d < 3.2) {
          const beat = clamp01((0.42 + this.d.control * 0.5) * flair - o.d.aware * 0.28);
          if (Math.random() < beat) o.staggerT = Math.max(o.staggerT, CTRL.STAGGER * (kind === 'roulette' ? 1.3 : 1));
        }
      }
    }
    if (ctx && ctx.onSkill) ctx.onSkill(this, kind);
    Audio2.kick(0.14, 'touch');
    return true;
  }
}

/* Assigned by the match engine so tryTake can notify it without a circular
   reference through the constructor. */
let ctxOnTake = null;

//==========================================================================
// 40_ai.js
//==========================================================================
/* Team AI. Shape comes first: every outfield player has a formation slot that
   slides with the ball, and role behaviours (press, cover, mark, run, support)
   are offsets from that anchor rather than free-roaming steering. The result
   is a team that keeps its shape, squeezes the ball side and breaks its line
   only when there's a reason to. */

const FORMATIONS = {
  '2-3-1': { d: 2, m: 3, a: 1, slots: [
    { r: 'GK', x: -0.94, z: 0 },
    { r: 'CB', x: -0.58, z: -0.34 }, { r: 'CB', x: -0.58, z: 0.34 },
    { r: 'WM', x: -0.06, z: -0.60 }, { r: 'CM', x: -0.12, z: 0 }, { r: 'WM', x: -0.06, z: 0.60 },
    { r: 'ST', x: 0.42, z: 0 },
  ] },
  '3-2-1': { d: 3, m: 2, a: 1, slots: [
    { r: 'GK', x: -0.94, z: 0 },
    { r: 'FB', x: -0.56, z: -0.48 }, { r: 'CB', x: -0.66, z: 0 }, { r: 'FB', x: -0.56, z: 0.48 },
    { r: 'CM', x: -0.10, z: -0.30 }, { r: 'CM', x: -0.10, z: 0.30 },
    { r: 'ST', x: 0.46, z: 0 },
  ] },
  '2-1-3': { d: 2, m: 1, a: 3, slots: [
    { r: 'GK', x: -0.94, z: 0 },
    { r: 'CB', x: -0.60, z: -0.32 }, { r: 'CB', x: -0.60, z: 0.32 },
    { r: 'DM', x: -0.18, z: 0 },
    { r: 'WG', x: 0.34, z: -0.55 }, { r: 'ST', x: 0.50, z: 0 }, { r: 'WG', x: 0.34, z: 0.55 },
  ] },
  '3-1-2': { d: 3, m: 1, a: 2, slots: [
    { r: 'GK', x: -0.94, z: 0 },
    { r: 'FB', x: -0.56, z: -0.46 }, { r: 'CB', x: -0.68, z: 0 }, { r: 'FB', x: -0.56, z: 0.46 },
    { r: 'DM', x: -0.14, z: 0 },
    { r: 'ST', x: 0.42, z: -0.28 }, { r: 'ST', x: 0.42, z: 0.28 },
  ] },
  '1-3-2': { d: 1, m: 3, a: 2, slots: [
    { r: 'GK', x: -0.94, z: 0 },
    { r: 'CB', x: -0.64, z: 0 },
    { r: 'WM', x: -0.12, z: -0.55 }, { r: 'CM', x: -0.18, z: 0 }, { r: 'WM', x: -0.12, z: 0.55 },
    { r: 'ST', x: 0.44, z: -0.26 }, { r: 'ST', x: 0.44, z: 0.26 },
  ] },
};
const FORMATION_KEYS = Object.keys(FORMATIONS);

const DEFAULT_TACTICS = { line: 0.5, press: 0.55, width: 0.5, tempo: 0.5, mentality: 0.5 };

const DIFF = [
  { n: 'Amateur', react: 0.42, err: 0.42, aggr: 0.55, speed: 0.90, aware: 0.55 },
  { n: 'Semi-Pro', react: 0.28, react2: 0, err: 0.28, aggr: 0.72, speed: 0.96, aware: 0.72 },
  { n: 'Professional', react: 0.18, err: 0.16, aggr: 0.88, speed: 1.0, aware: 0.88 },
  { n: 'World Class', react: 0.10, err: 0.08, aggr: 1.0, speed: 1.03, aware: 1.0 },
];

/* ------------------------------------------------------------- steering -- */
/** Drive `p` toward (tx,tz) with arrival damping and teammate separation. */
function seek(p, tx, tz, dt, opts) {
  opts = opts || {};
  let dx = tx - p.pos.x, dz = tz - p.pos.z;
  const d = Math.hypot(dx, dz);
  const slow = opts.slow === undefined ? 2.2 : opts.slow;
  if (d < 0.001) { p.drive(0, 0, false, dt); return d; }
  dx /= d; dz /= d;

  /* separation: nudge away from anyone standing on top of us */
  if (opts.crowd) {
    for (const o of opts.crowd) {
      if (o === p) continue;
      const ox = p.pos.x - o.pos.x, oz = p.pos.z - o.pos.z;
      const od = Math.hypot(ox, oz);
      const want = o.team === p.team ? 2.1 : 1.05;
      if (od < want && od > 0.001) {
        const k = (1 - od / want) * (o.team === p.team ? 0.85 : 0.55);
        dx += (ox / od) * k; dz += (oz / od) * k;
      }
    }
    const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
  }

  const mag = d < slow ? Math.max(opts.min || 0, d / slow) : 1;
  const sprint = opts.sprint !== undefined ? opts.sprint : d > 5.5;
  p.drive(dx * mag, dz * mag, sprint, dt);
  return d;
}

/* ---------------------------------------------------------- evaluation --- */
/** How hard is this player being pressed? 0 = free, 1 = swarmed. */
function pressureOn(p, opponents) {
  let s = 0;
  for (const o of opponents) {
    if (o.state === 'down') continue;
    const d = p.distTo(o.pos.x, o.pos.z);
    if (d < 5.5) s += Math.pow(1 - d / 5.5, 1.6) * (o.role === 'GK' ? 0.35 : 1);
  }
  return clamp01(s * 0.8);
}

/** Smallest distance from any opponent to the straight pass a→b. */
function laneClearance(ax, az, bx, bz, opponents, skip) {
  let m = 99;
  for (const o of opponents) {
    if (o === skip || o.state === 'down') continue;
    const d = distToSeg(o.pos.x, o.pos.z, ax, az, bx, bz);
    /* only count opponents that actually sit between the two points */
    const along = ((o.pos.x - ax) * (bx - ax) + (o.pos.z - az) * (bz - az));
    const len = distSq2D(ax, az, bx, bz);
    if (along < -1 || (len > 0 && along > len + 1)) continue;
    if (d < m) m = d;
  }
  return m;
}

/** Angle subtended by the goal from (x,z) — a decent proxy for shot quality. */
function goalAngle(x, z, dirX) {
  const gx = dirX * P.HALF_L;
  const a1 = Math.atan2(-P.GOAL_HW - z, gx - x);
  const a2 = Math.atan2(P.GOAL_HW - z, gx - x);
  return Math.abs(angDelta(a1, a2));
}

/** The z coordinate of the deepest defender (offside reference). */
function offsideLine(defenders, dirX, ballX) {
  let best = -Infinity, second = -Infinity;
  for (const d of defenders) {
    const v = d.pos.x * dirX;
    if (v > best) { second = best; best = v; } else if (v > second) second = v;
  }
  const line = Math.max(second === -Infinity ? best : second, ballX * dirX);
  return Math.min(line, P.HALF_L);
}

/* ------------------------------------------------------------- brain ----- */
class TeamBrain {
  constructor(team, match) {
    this.team = team;
    this.m = match;
    this.tactics = Object.assign({}, DEFAULT_TACTICS);
    this.formation = '2-3-1';
    this.phase = 'defend';
    this.pressT = 0;
    this.diff = DIFF[clamp(SETTINGS.difficulty, 0, 3)];
    this.isHumanTeam = false;
  }

  get dirX() { return this.m.dir[this.team]; }

  slots() { return (FORMATIONS[this.formation] || FORMATIONS['2-3-1']).slots; }

  /** Formation anchor for player `p` in world coordinates. */
  anchor(p, out) {
    const s = this.slots()[p.slot] || { x: 0, z: 0 };
    const ax = this.dirX;
    const ball = this.m.ball;
    const bx = clamp(ball.pos.x * ax / P.HALF_L, -1, 1);
    const bz = clamp(ball.pos.z / P.HALF_W, -1, 1);
    const t = this.tactics;

    const attacking = this.phase === 'attack';
    const push = attacking ? 0.14 + t.mentality * 0.24 : -0.10 - (1 - t.line) * 0.20;
    const compress = attacking ? 0.80 : 0.66 + t.line * 0.12;

    let x = s.x * compress + bx * (attacking ? 0.34 : 0.44) + push;
    let z = s.z * (0.62 + t.width * 0.5) + bz * (attacking ? 0.24 : 0.40);

    /* Keep the defensive line honest: never drop behind our own six-yard box
       and never push the last line past the halfway line when defending. */
    if (p.role === 'GK') { x = s.x; z = s.z * 0.4 + bz * 0.22; }
    else x = clamp(x, -0.90, 0.94);
    z = clamp(z, -0.97, 0.97);

    out.x = x * P.HALF_L * ax;
    out.z = z * P.HALF_W;
    return out;
  }

  update(dt) {
    const m = this.m;
    const ball = m.ball;
    const mine = m.teams[this.team].players;
    const opp = m.teams[1 - this.team].players;

    this.phase = ball.owner
      ? (ball.owner.team === this.team ? 'attack' : 'defend')
      : (m.lastTouchTeam === this.team ? 'attack' : 'defend');
    if (!ball.owner) this.phase = 'loose';

    /* --- job assignment, refreshed a few times a second ---------------- */
    this.assignT = (this.assignT || 0) - dt;
    if (this.assignT <= 0) { this._assign(mine, opp, ball); this.assignT = 0.16; }

    const tmp = { x: 0, z: 0 };
    for (const p of mine) {
      if (!p.active) continue;
      if (p.human >= 0) continue;               // a human is driving this one
      if (p.role === 'GK') { keeperThink(p, m, dt); continue; }
      if (p.state === 'down' || p.state === 'slide') { p.drive(0, 0, false, dt); continue; }
      this.anchor(p, tmp);
      p.baseX = tmp.x; p.baseZ = tmp.z;
      this._think(p, dt, mine, opp, ball);
    }
  }

  _assign(mine, opp, ball) {
    const outs = mine.filter((p) => p.role !== 'GK' && p.active && p.state !== 'down');
    for (const p of outs) { p.job = 'shape'; p.mark = null; }

    if (this.phase === 'attack') {
      /* Support angles are handled per-player; nothing to assign centrally. */
      return;
    }

    const carrier = ball.owner;
    const tx = carrier ? carrier.pos.x : ball.pos.x;
    const tz = carrier ? carrier.pos.z : ball.pos.z;

    /* Presser: whoever gets there first. Cover: the next nearest. */
    const byBall = outs.slice().sort((a, b) =>
      (a.distTo(tx, tz) - (a.role === 'CB' ? 2.5 : 0)) - (b.distTo(tx, tz) - (b.role === 'CB' ? 2.5 : 0)));
    if (byBall[0]) byBall[0].job = 'press';
    if (byBall[1] && this.tactics.press > 0.3) byBall[1].job = 'cover';

    if (this.phase === 'loose') {
      /* Two chasers, everyone else holds shape. */
      if (byBall[0]) byBall[0].job = 'chase';
      if (byBall[1]) byBall[1].job = 'chase2';
      return;
    }

    /* Mark the most dangerous opponents with whoever is nearest and free. */
    const threats = opp.filter((o) => o.role !== 'GK' && o.active && o !== carrier)
      .map((o) => ({
        o,
        v: (o.pos.x * -this.dirX) * 0.6 - Math.abs(o.pos.z) * 0.12 - o.distTo(tx, tz) * 0.05,
      }))
      .sort((a, b) => b.v - a.v)
      .slice(0, Math.max(0, outs.length - 2));
    const free = outs.filter((p) => p.job === 'shape');
    for (const t of threats) {
      let best = null, bd = 99;
      for (const p of free) {
        if (p.mark) continue;
        const d = p.distTo(t.o.pos.x, t.o.pos.z);
        if (d < bd) { bd = d; best = p; }
      }
      if (best && bd < 22) { best.mark = t.o; best.job = 'mark'; }
    }
  }

  /* ------------------------------------------------------ per-player ----- */
  _think(p, dt, mine, opp, ball) {
    const m = this.m;
    const ax = this.dirX;
    const crowd = m.allPlayers;

    if (ball.owner === p) { this._carrier(p, dt, mine, opp, ball); return; }

    /* --- loose ball ---------------------------------------------------- */
    if (!ball.owner && (p.job === 'chase' || p.job === 'chase2' || p.job === 'press')) {
      const t = ball.interceptTime(p.pos.x, p.pos.z, p.maxSpeed(), 2.2);
      const target = ball.predict(Math.max(0.08, t), this._tv || (this._tv = V3()));
      const gx = p.job === 'chase2' ? lerp(target.x, p.baseX, 0.35) : target.x;
      const gz = p.job === 'chase2' ? lerp(target.z, p.baseZ, 0.35) : target.z;
      seek(p, gx, gz, dt, { crowd, sprint: true, slow: 1.1 });
      return;
    }

    /* --- defending ----------------------------------------------------- */
    if (this.phase === 'defend') {
      const carrier = ball.owner;
      if (p.job === 'press' && carrier) {
        /* Approach goal-side, then close down; commit to a tackle when tight. */
        const gx = -ax * P.HALF_L;
        const toGoalX = gx - carrier.pos.x, toGoalZ = 0 - carrier.pos.z;
        const l = Math.hypot(toGoalX, toGoalZ) || 1;
        const standoff = 0.85 + (1 - this.tactics.press) * 1.1;
        const tx = carrier.pos.x + (toGoalX / l) * standoff;
        const tz = carrier.pos.z + (toGoalZ / l) * standoff;
        const d = seek(p, tx, tz, dt, { crowd, sprint: true, slow: 1.4 });
        const dc = p.distTo(carrier.pos.x, carrier.pos.z);
        if (dc < CTRL.TACKLE_RANGE * 0.85 && !p.action && Math.random() < this.diff.aggr * dt * 5.5) {
          const inOwnBox = p.pos.x * ax < -(P.BOX_X) && Math.abs(p.pos.z) < P.BOX_HW;
          const reckless = !inOwnBox && carrier.speed > 5.4 && Math.random() < 0.22 * this.diff.aggr;
          if (reckless) p.slide(ball, m.ctx); else p.tackle(ball, m.ctx);
        }
        return;
      }
      if (p.job === 'cover' && carrier) {
        const gx = -ax * P.HALF_L * 0.82;
        const tx = lerp(carrier.pos.x, gx, 0.34);
        const tz = lerp(carrier.pos.z, 0, 0.30);
        seek(p, lerp(tx, p.baseX, 0.28), lerp(tz, p.baseZ, 0.28), dt, { crowd, sprint: true });
        return;
      }
      if (p.job === 'mark' && p.mark && p.mark.active) {
        const o = p.mark;
        const gx = -ax * P.HALF_L;
        const dx = gx - o.pos.x, dz = 0 - o.pos.z;
        const l = Math.hypot(dx, dz) || 1;
        const tight = clamp(1.0 + (1 - this.diff.aware) * 1.6, 0.9, 2.6);
        let tx = o.pos.x + (dx / l) * tight + o.vel.x * 0.18;
        let tz = o.pos.z + (dz / l) * tight + o.vel.z * 0.18;
        /* stay compact — don't get dragged miles from the slot */
        tx = lerp(tx, p.baseX, 0.18); tz = lerp(tz, p.baseZ, 0.18);
        seek(p, tx, tz, dt, { crowd, sprint: p.distTo(tx, tz) > 4 });
        return;
      }
      seek(p, p.baseX, p.baseZ, dt, { crowd, slow: 2.6 });
      return;
    }

    /* --- attacking off the ball ---------------------------------------- */
    const carrier = ball.owner;
    let tx = p.baseX, tz = p.baseZ;
    if (carrier && carrier.team === this.team) {
      const line = offsideLine(opp, ax, ball.pos.x);
      const ahead = (carrier.pos.x - p.pos.x) * ax;
      const isForward = p.role === 'ST' || p.role === 'WG' || p.role === 'AM';

      if (isForward && ahead > -3 && carrier.controlT > 0.25) {
        /* Run the channel, but stay a stride behind the last defender. */
        const runX = Math.min(line - 0.6, P.HALF_L - 3) * ax;
        const side = Math.sign(p.baseZ || (Math.random() - 0.5));
        tx = lerp(p.baseX, runX, 0.75);
        tz = p.baseZ + side * 1.6;
        p.making = true;
      } else if (p.role === 'CB' || p.role === 'FB' || p.role === 'DM') {
        /* Offer a safe backward option. */
        tx = lerp(p.baseX, carrier.pos.x - ax * 8, 0.25);
        tz = lerp(p.baseZ, carrier.pos.z, 0.18);
        p.making = false;
      } else {
        /* Midfielders find space either side of the carrier. */
        const off = p.pos.z < carrier.pos.z ? -1 : 1;
        tx = lerp(p.baseX, carrier.pos.x + ax * 3.5, 0.35);
        tz = lerp(p.baseZ, carrier.pos.z + off * 7.5, 0.35);
        p.making = false;
      }
      /* keep out of the carrier's immediate space */
      if (p.distTo(carrier.pos.x, carrier.pos.z) < 4.5) {
        const dx = p.pos.x - carrier.pos.x, dz = p.pos.z - carrier.pos.z;
        const l = Math.hypot(dx, dz) || 1;
        tx = carrier.pos.x + (dx / l) * 5.5; tz = carrier.pos.z + (dz / l) * 5.5;
      }
    }
    tx = clamp(tx, -P.HALF_L + 1.2, P.HALF_L - 1.2);
    tz = clamp(tz, -P.HALF_W + 1, P.HALF_W - 1);
    seek(p, tx, tz, dt, { crowd, sprint: p.making && p.distTo(tx, tz) > 4, slow: 2.4 });
  }

  /** How much room the carrier has in front of them, 0 (blocked) … 1 (clear). */
  _spaceAhead(p, opp, ax) {
    let worst = 1;
    for (const o of opp) {
      if (o.state === 'down') continue;
      const dx = (o.pos.x - p.pos.x) * ax, dz = o.pos.z - p.pos.z;
      if (dx < -0.5) continue;                     // behind us
      const d = Math.hypot(dx, dz);
      if (d > 12) continue;
      const off = Math.abs(dz) / Math.max(1.5, dx * 0.7 + 1.5);   // widening cone
      if (off > 1.4) continue;
      worst = Math.min(worst, clamp01(d / 12));
    }
    return worst;
  }

  /* ---------------------------------------------------- ball carrier ----- */
  _carrier(p, dt, mine, opp, ball) {
    const m = this.m;
    const ax = this.dirX;
    const gx = ax * P.HALF_L;
    const press = pressureOn(p, opp);
    const distGoal = p.distTo(gx, 0);
    const ang = goalAngle(p.pos.x, p.pos.z, ax);
    const err = this.diff.err;

    p.decideT = (p.decideT || 0) - dt;
    /* A short settle after receiving stops the AI playing one-touch football
       every single time it gets the ball. */
    const canAct = !p.action && p.controlT > (press > 0.6 ? 0.14 : 0.34);

    /* ---- shoot -------------------------------------------------------- */
    if (canAct) {
      const range = 15 + p.d.shotPow * 0.55 + (p.data.traits.includes('cannon') ? 6 : 0);
      const shotScore = clamp01((1 - distGoal / range)) * clamp01(ang / 0.45)
        * (1 - press * 0.55) * (0.55 + p.d.shotAcc * 0.7);
      if (distGoal < range && shotScore > 0.26 + err * 0.20 && Math.random() < dt * 7) {
        this._shoot(p, ball, press);
        return;
      }
    }

    /* ---- pass or carry ------------------------------------------------ */
    if (canAct && p.decideT <= 0) {
      p.decideT = 0.16 + this.diff.react * 0.5;
      const space = this._spaceAhead(p, opp, ax);
      /* Running at a back line that has left room is usually better than
         recycling it sideways, so carrying gets its own score to beat. */
      const carry = 0.30 + space * 0.62 - press * 0.62
        + clamp01((P.HALF_L * 2 - distGoal) / (P.HALF_L * 2)) * 0.14
        + (p.d.control - 0.66) * 0.5;
      const opt = this._bestPass(p, mine, opp, ball);
      if (opt && opt.score > carry) { this._pass(p, ball, opt, press); return; }
      if (press > 0.88) {
        if (opt) { this._pass(p, ball, opt, press); return; }
        /* nothing on: clear the lines */
        p.queueKick('lob', { dx: ax * 0.8, dz: (Math.random() - 0.5), power: 24, lift: 0.62, spinY: -8, pressure: press });
        return;
      }
    }

    /* ---- carry -------------------------------------------------------- */
    let tx = gx, tz = clamp(p.pos.z * 0.5, -P.GOAL_HW * 2, P.GOAL_HW * 2);
    /* Steer around the nearest opponents rather than straight into them. */
    let rx = 0, rz = 0;
    for (const o of opp) {
      const d = p.distTo(o.pos.x, o.pos.z);
      if (d < 7 && d > 0.01) {
        const w = Math.pow(1 - d / 7, 1.8) * (o.role === 'GK' ? 0.4 : 1);
        rx += (p.pos.x - o.pos.x) / d * w;
        rz += (p.pos.z - o.pos.z) / d * w;
      }
    }
    let dx = (tx - p.pos.x), dz = (tz - p.pos.z);
    const l = Math.hypot(dx, dz) || 1;
    dx = dx / l + rx * 1.25; dz = dz / l + rz * 1.25;
    const l2 = Math.hypot(dx, dz) || 1;
    /* stay in play */
    if (Math.abs(p.pos.z) > P.HALF_W - 3) dz -= Math.sign(p.pos.z) * 0.8;
    p.drive(dx / l2, dz / l2, press < 0.5 && p.stamina > 0.25, dt);

    /* the odd bit of trickery when a defender is right on top of them */
    if (canAct && press > 0.5 && Math.random() < dt * 1.4 * this.diff.aggr) {
      p.doSkill(Math.random() < 0.5 ? 'stepover' : 'knockon', ball, m.ctx);
    }
  }

  _shoot(p, ball, press) {
    const ax = this.dirX;
    const gx = ax * P.HALF_L;
    /* aim toward the corner the keeper is further from */
    const gk = this.m.teams[1 - this.team].keeper;
    let aimZ = 0;
    if (gk) aimZ = (gk.pos.z > 0 ? -1 : 1) * P.GOAL_HW * 0.62;
    else aimZ = (Math.random() - 0.5) * P.GOAL_HW;
    aimZ += (Math.random() - 0.5) * (1 - p.d.shotAcc) * 5;
    const dx = gx - p.pos.x, dz = aimZ - p.pos.z;
    const dist = Math.hypot(dx, dz);
    const finesse = p.data.traits.includes('finesse') && dist > 9;
    const power = clamp(p.d.shotPow * (finesse ? 0.78 : 1) * (0.72 + clamp01(dist / 26) * 0.4), 15, 42);
    p.queueKick('shoot', {
      dx, dz, power,
      lift: clamp(0.055 + dist * 0.0045 + Math.random() * 0.03, 0.02, 0.22),
      spinY: -7 - Math.random() * 6,
      spinSide: (finesse ? -Math.sign(aimZ || 1) : (Math.random() - 0.5)) * (finesse ? 1.1 : 0.5),
      pressure: press,
    });
  }

  _bestPass(p, mine, opp, ball) {
    const ax = this.dirX;
    let best = null;
    for (const t of mine) {
      if (t === p || !t.active || t.state === 'down') continue;
      if (t.role === 'GK' && (p.pos.x * ax) > -P.HALF_L * 0.35) continue;
      const d = p.distTo(t.pos.x, t.pos.z);
      if (d < 2.6 || d > 40) continue;
      /* lead the pass onto the receiver's run */
      const flight = d / (p.d.passPow * 0.85);
      const lx = t.pos.x + t.vel.x * flight * 0.75;
      const lz = t.pos.z + t.vel.z * flight * 0.75;
      const lane = laneClearance(p.pos.x, p.pos.z, lx, lz, opp, null);
      const gain = (lx - p.pos.x) * ax;
      const tPress = pressureOn(t, opp);
      const offside = this._offsideRisk(t, lx, opp, ball);

      /* Forward progress is what a pass is for; a safe square ball has to be
         clearly better than carrying before it wins the argument. */
      let score = 0.10
        + clamp01(lane / 3.4) * 0.40
        + clamp01(gain / 22) * 0.66
        - clamp01(d / 40) * 0.26
        - tPress * 0.45
        - (offside ? 1.4 : 0)
        + (t.making ? 0.20 : 0)
        + (t.pos.x * ax > P.BOX_X ? 0.16 : 0)
        + (gain < -3 ? -0.16 : 0);
      if (lane < 1.1) score -= 0.7;
      score += (Math.random() - 0.5) * this.diff.err * 0.8;
