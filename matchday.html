/* Bootstrap: renderer, the frame loop, and the glue between the menus and a
   live match. */

const Game = {
  mode: 'menu',
  match: null,
  world: null,
  last: 0,
  acc: 0,

  init() {
    const canvas = $('#view');
    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: SETTINGS.quality !== 'low', powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, SETTINGS.quality === 'high' ? 2 : 1.4));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.shadowMap.enabled = SETTINGS.shadows;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer = renderer;
    MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

    this.scene = new THREE.Scene();

    window.addEventListener('resize', () => this.resize());
    Input.attach();
    Input.onKey = (e) => this.onKey(e);
    HUD.attach();
    UI.attach();
    this.resize();
  },

  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h, false);
    if (this.match) this.match.resize(w, h);
  },

  onKey(e) {
    if (e.code === 'Escape') {
      if (this.mode === 'match') { this.match && this.match.paused ? this.resume() : this.pause(); }
      else if (UI.current !== 'main') UI.back();
      return;
    }
    if (this.mode === 'match' && !this.match.paused) {
      if (e.code === 'KeyC') {
        const label = this.match.rigs[0].cycle();
        for (const r of this.match.rigs) r.setMode(SETTINGS.camera);
        toast('Camera: ' + label);
      } else if (e.code === 'KeyM') {
        Audio2.muted = !Audio2.muted;
        toast(Audio2.muted ? 'Muted' : 'Sound on');
      } else if (e.code === 'KeyR' && this.match.state === 'play') {
        if (this.match.replay.start(4.5, { kind: 'orbit', a0: Math.random() * TAU })) {
          HUD.replay(true); FX.letterbox(true);
        }
      }
    }
  },

  /* ---------------------------------------------------------- the loop -- */
  start() {
    const step = (now) => {
      requestAnimationFrame(step);
      const dt = Math.min(0.05, (now - this.last) / 1000 || 0);
      this.last = now;
      if (Input.padPause() && this.mode === 'match') {
        this.match.paused ? this.resume() : this.pause();
      }
      if (this.mode === 'match' && this.match) {
        if (!this.match.paused) this.match.update(dt);
        this.match.render(this.renderer, window.innerWidth, window.innerHeight);
      } else {
        Audio2.update(dt);
      }
    };
    requestAnimationFrame(step);
  },

  /* --------------------------------------------------------- match flow -- */
  startMatch(cfg) {
    Audio2.resume();
    applyWeatherPhysics(SETTINGS.weather);
    this.renderer.shadowMap.enabled = SETTINGS.shadows;
    if (this.match) { this.match.dispose(); this.match = null; }
    while (this.scene.children.length) this.scene.remove(this.scene.children[0]);

    this.mode = 'match';
    UI.show(false); UI.overlay(false);
    this.match = new Match(cfg);
    this.match.build(this.scene, this.renderer, window.innerWidth, window.innerHeight);
    this.match.resize(window.innerWidth, window.innerHeight);
    for (const r of this.match.rigs) r.setMode(SETTINGS.camera);
  },

  pause() {
    if (!this.match) return;
    this.match.paused = true;
    Audio2.stopVoice();
    UI.overlay(true);
    UI.go('pause', {});
  },
  resume() {
    if (!this.match) return;
    this.match.paused = false;
    UI.show(false); UI.overlay(false);
    Audio2.resume();
  },
  abandon() {
    const m = this.match;
    if (!m) { UI.go('main', {}, true); return; }
    this.disposeMatch();
    UI.overlay(false);
    UI.go('main', {}, true);
  },

  disposeMatch() {
    if (!this.match) return;
    this.match.dispose();
    this.match = null;
    this.mode = 'menu';
    while (this.scene.children.length) this.scene.remove(this.scene.children[0]);
    FX.letterbox(false); HUD.replay(false);
  },

  _result(res, side, onDone) {
    this.disposeMatch();
    UI.show(true); UI.overlay(false);
    UI.go('result', { res, side, onDone }, true);
  },

  quickEnd(res) {
    Save.recordMatch(res, 0);
    this._result(res, 0, () => UI.go('main', {}, true));
  },

  careerEnd(res, side) {
    const c = Save.data.career;
    if (c) {
      advanceWeek(c, res);
      c._market = null;
      Save.flush();
    }
    Save.recordMatch(res, side);
    this._result(res, side, () => UI.go('career', {}, true));
  },

  squadEnd(res) {
    const s = Save.data.squad;
    let coins = 0;
    if (s) { coins = squadRecordResult(s, res, 0); Save.flush(); }
    this._result(res, 0, () => { if (coins) toast(`+${coins} coins`, 'good'); UI.go('squad', {}, true); });
  },
};

/* ------------------------------------------------------------------ boot -- */
(function boot() {
  const fill = $('#bootFill'), msg = $('#bootMsg');
  const steps = [
    ['building the renderer', () => Game.init()],
    ['drawing badges and kits', () => { badgeURL({ shape: 0, emblem: 0, ring: 0, c1: '#89b4fa', c2: '#11111b', c3: '#f9e2af', abbr: 'MD' }, 64); }],
    ['reading the save file', () => { Save.load(); saveSettings(); applyWeatherPhysics(SETTINGS.weather); }],
    ['generating the rival leagues', () => {
      const seed = Save.data.worldSeed || ((Date.now() ^ 0x4d44) >>> 0);
      Save.data.worldSeed = seed; Save.flush();
      Game.world = genWorld(seed);
    }],
    ['warming the crowd up', () => { /* audio waits for the first gesture */ }],
  ];

  let i = 0;
  const tick = () => {
    if (i >= steps.length) {
      fill.style.width = '100%';
      msg.textContent = 'ready';
      setTimeout(() => {
        $('#boot').classList.add('done');
        setTimeout(() => $('#boot').remove(), 700);
        UI.go('main', {}, true);
        Game.start();
      }, 260);
      return;
    }
    const [label, fn] = steps[i];
    msg.textContent = label;
    fill.style.width = Math.round((i / steps.length) * 100) + '%';
    setTimeout(() => {
      try { fn(); } catch (err) {
        console.error('boot step failed:', label, err);
        msg.textContent = 'error: ' + err.message;
      }
      i++;
      tick();
    }, 60);
  };
  tick();
})();

/* A small handle for poking at things from the console. */
window.MATCHDAY = { Game, Save, SETTINGS, UI, HUD, Audio2, P, BALL, MATCH };
/* ==SRC-END== */
})();
