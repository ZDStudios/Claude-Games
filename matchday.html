      if (!best || score > best.score) best = { t, lx, lz, d, lane, score, gain };
    }
    return best;
  }

  _offsideRisk(t, lx, opp, ball) {
    const ax = this.dirX;
    if (lx * ax < 0) return false;                       // own half is always fine
    const line = offsideLine(opp, ax, ball.pos.x);
    return lx * ax > line + 0.4;
  }

  _pass(p, ball, opt, press) {
    const t = opt.t;
    const dx = opt.lx - p.pos.x, dz = opt.lz - p.pos.z;
    const d = Math.hypot(dx, dz);
    const through = opt.gain > 9 && opt.lane > 2.2 && t.making;
    const lofted = opt.lane < 1.9 && d > 9;
    const kind = lofted ? 'lob' : 'pass';
    const power = clamp(Math.sqrt(d) * (lofted ? 4.9 : 4.35) + (through ? 2.5 : 0), 7, p.d.passPow * 1.5);
    p.queueKick(kind, {
      dx, dz, power,
      lift: lofted ? clamp(0.42 + d * 0.004, 0.35, 0.72) : 0.02,
      spinY: lofted ? -3 : -7,
      spinSide: (Math.random() - 0.5) * 0.4,
      pressure: press,
      intended: t,
      through,
    });
    p.lastPassTo = t;
  }
}

// 45_keeper.js
//==========================================================================
/* Goalkeeper AI: positioning on the goal-to-ball arc, reactive diving with a
   reaction delay taken from the reflexes attribute, catching versus parrying,
   sweeping behind a high line, and distribution once the ball is held. */

function keeperState(p) {
  if (!p.gk) {
    /* cool  — time until another dive may be launched
       grab  — time during which the ball may not be gathered (just released
               it, or just parried one away) */
    p.gk = { holdT: 0, cool: 0, grab: 0, reactT: 0, diveT: 0, committed: null };
  }
  return p.gk;
}

function keeperThink(p, m, dt) {
  const g = keeperState(p);
  const ball = m.ball;
  const ax = p.attackX;                 // direction this keeper's team attacks
  const gx = -ax * P.HALF_L;            // own goal line
  const inBox = (x, z) => (x * -ax) > (P.BOX_X) && Math.abs(z) < P.BOX_HW;

  g.cool = Math.max(0, g.cool - dt);
  g.grab = Math.max(0, g.grab - dt);
  g.reactT = Math.max(0, g.reactT - dt);
  g.diveT = Math.max(0, g.diveT - dt);

  /* Mid-distribution: don't think, just let the kick come out. Without this
     the keeper re-claims the ball he has only just put down. */
  if (p.pendingKick || (p.action && p.action.kind !== 'dive')) { p.drive(0, 0, false, dt); return; }

  /* ---- holding the ball --------------------------------------------- */
  if (ball.state === 'held' && ball.holder === p) {
    g.holdT -= dt;
    ball.pos.set(p.pos.x + p.fwdX * 0.32, 1.05, p.pos.z + p.fwdZ * 0.32);
    ball.vel.set(0, 0, 0);
    ball.mesh.position.copy(ball.pos);
    /* walk out toward the edge of the area while looking for an option */
    const tx = gx + ax * 6.5, tz = clamp(p.pos.z * 0.6, -8, 8);
    seek(p, tx, tz, dt, { slow: 3, sprint: false });
    if (g.holdT <= 0) keeperDistribute(p, m);
    return;
  }

  /* ---- shot stopping -------------------------------------------------- */
  const toGoal = (ball.vel.x * -ax) > 3;
  const dist = p.distTo(ball.pos.x, ball.pos.z);
  if (toGoal && ball.speed() > 7 && !g.diveT && g.cool <= 0) {
    const cross = keeperCrossing(ball, gx, ax);
    if (cross && cross.t < 1.5) {
      if (!g.committed) {
        g.committed = cross;
        g.reactT = p.d.reflex * (0.5 + 0.5 * Math.random()) * (1.4 - DIFF[clamp(SETTINGS.difficulty, 0, 3)].aware * 0.5);
      }
      if (g.reactT <= 0) {
        const need = Math.abs(cross.z - p.pos.z);
        const high = cross.y > 1.35;
        if (need > 0.55 || high) {
          keeperDive(p, cross, m);
          return;
        }
        /* central: shuffle across and stand it up */
        seek(p, gx + ax * 0.7, cross.z, dt, { slow: 0.6, sprint: true, min: 0.9 });
        return;
      }
    }
  } else if (!toGoal) {
    g.committed = null;
  }

  /* ---- diving in progress -------------------------------------------- */
  if (p.state === 'dive') {
    p.drive(0, 0, false, dt);
    return;
  }

  /* ---- claim loose balls in the area / sweep -------------------------- */
  const sweeper = p.data.traits && p.data.traits.includes('sweeper');
  const sweepRange = sweeper ? 20 : 14;
  const ballOwn = ball.owner;
  const threat = !ballOwn || ballOwn.team !== p.team;
  if (threat && ball.pos.y < 1.6) {
    const bt = ball.interceptTime(p.pos.x, p.pos.z, p.d.topSpeed * 1.05, 1.6);
    const spot = ball.predict(bt, m._kv || (m._kv = V3()));
    const iAmClosest = m.teams[1 - p.team].players.every((o) =>
      o.role === 'GK' || o.distTo(spot.x, spot.z) > p.distTo(spot.x, spot.z) - 0.6);
    const nearGoal = dist2D(spot.x, spot.z, gx, 0) < sweepRange;
    if (nearGoal && iAmClosest && (inBox(spot.x, spot.z) || sweeper)) {
      seek(p, spot.x, spot.z, dt, { slow: 1.0, sprint: true });
      if (g.grab <= 0 && p.noBallT <= 0 && ball.state === 'free'
        && p.distTo(ball.pos.x, ball.pos.z) < 1.3 && inBox(p.pos.x, p.pos.z) && ball.pos.y < 2.0) {
        keeperHold(p, ball, m, true);
      }
      return;
    }
  }

  /* ---- default positioning ------------------------------------------- */
  const bx = ball.pos.x, bz = ball.pos.z;
  let vx = bx - gx, vz = bz - 0;
  const l = Math.hypot(vx, vz) || 1;
  const near = clamp01(1 - l / 30);
  /* Narrowing the angle is worth a couple of metres, not a stroll to the
     edge of the box — an over-committed keeper is a free goal. */
  const off = clamp(0.8 + near * (sweeper ? 5.0 : 3.1), 0.7, sweeper ? 7 : 4.0);
  let tx = gx + (vx / l) * off;
  let tz = clamp((vz / l) * off * 1.5, -(P.GOAL_HW + 2.2), P.GOAL_HW + 2.2);
  /* stay roughly between the ball and the middle of the goal */
  tz = lerp(tz, clamp(bz * 0.42, -(P.GOAL_HW + 1.5), P.GOAL_HW + 1.5), 0.5);
  tx = clamp(tx, Math.min(gx, gx + ax * 0.4), gx + ax * 15);
  seek(p, tx, tz, dt, { slow: 2.4, sprint: p.distTo(tx, tz) > 6 });
}

/** Where and when the ball crosses the goal-line plane, or null. */
function keeperCrossing(ball, gx, ax) {
  const probe = V3();
  let last = null;
  for (let t = 0.04; t < 1.6; t += 0.035) {
    ball.predict(t, probe);
    if ((probe.x - gx) * -ax > 0) {
      /* crossed the plane between the previous sample and this one */
      const z = probe.z, y = probe.y;
      if (Math.abs(z) < P.GOAL_HW + 1.5 && y < P.GOAL_H + 1.0) return { t, z, y, x: gx };
      return null;
    }
    last = t;
  }
  return null;
}

function keeperDive(p, cross, m) {
  const g = keeperState(p);
  const ax = p.attackX;
  const gx = -ax * P.HALF_L;
  const side = cross.z > p.pos.z ? 1 : 0;
  const dur = clamp(cross.t + 0.28, 0.42, 1.0);
  p.action = { kind: 'dive', t: 0, dur, side, high: cross.y > 1.4 };
  p.state = 'dive';
  g.diveT = dur;
  g.cool = dur + 0.25;

  /* Launch toward the ball; reach is limited by the diving attribute so a
     poor keeper genuinely cannot get across goal in time. */
  const need = cross.z - p.pos.z;
  const maxSpan = p.d.reach * (cross.t / 0.55);
  const span = clamp(need, -maxSpan, maxSpan);
  const vz = span / Math.max(0.18, cross.t);
  const vx = ((gx + ax * 0.55) - p.pos.x) / Math.max(0.2, cross.t);
  p.vel.set(clamp(vx, -6, 6), 0, clamp(vz, -11, 11));
  p.radius = 0.95;                       // hands and body sweep a wider volume
  p.height = 2.55;
  p.yaw = Math.atan2(ax, 0);
  if (m.ctx && m.ctx.onDive) m.ctx.onDive(p);
}

/** Called from the ball solver whenever the ball touches a keeper. */
function keeperCatch(p, ball) {
  const g = keeperState(p);
  const ax = p.attackX;
  const inArea = (p.pos.x * -ax) > P.BOX_X && Math.abs(p.pos.z) < P.BOX_HW;
  if (!inArea || g.grab > 0 || ball.state !== 'free') return false;
  if (p.noBallT > 0) return false;

  const sp = ball.speed();
  const diving = p.state === 'dive';
  const hold = clamp01(p.d.handling * (1 - clamp01((sp - 14) / 30)) * (diving ? 0.72 : 1)
    * (ball.pos.y > 1.9 ? 0.7 : 1));
  const M = matchRef;
  if (Math.random() < hold) {
    keeperHold(p, ball, M);
  } else {
    /* Parry: push it away from the middle and away from goal. */
    const side = ball.pos.z >= p.pos.z ? 1 : -1;
    const out = 5 + Math.random() * 6 + sp * 0.14;
    ball.vel.set(ax * out * 0.75, 2.0 + Math.random() * 2.4, side * out * 0.85);
    ball.spin.set(0, side * 6, 0);
    ball.touch(p, 'save');
    p.noBallT = 0.35;
    g.grab = 0.4;
    if (M && M.ctx && M.ctx.onSave) M.ctx.onSave(p, false);
    Audio2.kick(0.3, 'deflect');
  }
  p.radius = 0.42; p.height = 1.9;
  return true;
}

/** `routine` marks a simple gather rather than a genuine save. */
function keeperHold(p, ball, m, routine) {
  const g = keeperState(p);
  ball.state = 'held';
  ball.holder = p;
  ball.owner = null;
  ball.vel.set(0, 0, 0);
  ball.spin.set(0, 0, 0);
  ball.inGoal = 0;
  ball.touch(p, 'catch');
  g.holdT = 1.5 + Math.random() * 1.0;
  p.radius = 0.42; p.height = 1.9;
  p.action = null; p.state = 'idle';
  if (!routine && m && m.ctx && m.ctx.onSave) m.ctx.onSave(p, true);
  if (!routine) Audio2.react('applause', 0.4);
}

function keeperDistribute(p, m) {
  const ball = m.ball;
  const ax = p.attackX;
  const mine = m.teams[p.team].players;
  const opp = m.teams[1 - p.team].players;

  let best = null;
  for (const t of mine) {
    if (t === p || !t.active) continue;
    const d = p.distTo(t.pos.x, t.pos.z);
    if (d < 6 || d > 45) continue;
    const lane = laneClearance(p.pos.x, p.pos.z, t.pos.x, t.pos.z, opp, null);
    const gain = (t.pos.x - p.pos.x) * ax;
    const score = clamp01(lane / 4) * 0.6 + clamp01(gain / 30) * 0.5 - clamp01(d / 45) * 0.2
      - pressureOn(t, opp) * 0.4;
    if (!best || score > best.score) best = { t, score, d, lane };
  }

  ball.state = 'free';
  ball.holder = null;
  keeperState(p).grab = 1.6;
  p.noBallT = 0.9;
  const throwIt = best && best.d < 24 && best.lane > 2.4;
  if (best && (throwIt || best.score > 0.35)) {
    const dx = best.t.pos.x + best.t.vel.x * 0.5 - p.pos.x;
    const dz = best.t.pos.z + best.t.vel.z * 0.5 - p.pos.z;
    const d = Math.hypot(dx, dz);
    p.queueKick(throwIt ? 'pass' : 'lob', {
      dx, dz,
      power: throwIt ? clamp(Math.sqrt(d) * 4.4, 9, 26) : clamp(Math.sqrt(d) * 5.0, 18, 33),
      lift: throwIt ? 0.06 : 0.55,
      spinY: -4, pressure: 0, intended: best.t,
    });
  } else {
    /* Hoof it long down the middle. */
    p.queueKick('lob', {
      dx: ax, dz: (Math.random() - 0.5) * 0.7,
      power: 30 + Math.random() * 5, lift: 0.6, spinY: -6, pressure: 0,
    });
  }
  keeperState(p).holdT = 0;
}

/* Set by the match engine; the ball solver reaches the keeper through it. */
let matchRef = null;

//==========================================================================
// 50_rules.js
//==========================================================================
/* Laws of the game: ball out of play and the restart that follows, offside,
   fouls, cards, the clock, and the penalty shootout. Restarts are a small
   state machine — freeze, walk everyone into position, then hand the ball to
   the taker (a human if it's their team, otherwise the AI). */

const RESTART = {
  PREP: 1.15,          // seconds spent walking into shape
  AUTO: 2.6,           // AI takes the set piece this long after PREP
  HUMAN_AUTO: 14,      // deadlock guard when a human never takes it
  WALL: 7.5,           // wall distance, scaled for the smaller pitch
  RETREAT: 6.0,        // how far opponents must stand off a free kick
};

/* --------------------------------------------------------- out of play --- */
/** Returns the restart owed, or null while the ball is in play. */
function ballOutInfo(m) {
  const b = m.ball;
  if (b.inGoal) return null;
  const R = BALL.R * 0.9;
  const last = b.lastTouch;
  const lastTeam = last ? last.team : m.lastTouchTeam;

  if (Math.abs(b.pos.z) > P.HALF_W + R) {
    return {
      type: 'throw',
      team: lastTeam === 0 ? 1 : 0,
      x: clamp(b.pos.x, -P.HALF_L + 0.6, P.HALF_L - 0.6),
      z: Math.sign(b.pos.z) * P.HALF_W,
    };
  }
  if (Math.abs(b.pos.x) > P.HALF_L + R) {
    const side = Math.sign(b.pos.x);            // which goal line it crossed
    /* Whoever attacks toward that line is not the team defending it. */
    const defendingTeam = m.dir[0] === side ? 1 : 0;
    if (lastTeam === defendingTeam) {
      return { type: 'corner', team: 1 - defendingTeam, x: side * P.HALF_L, z: Math.sign(b.pos.z || 1) * P.HALF_W };
    }
    return { type: 'goalkick', team: defendingTeam, x: side * (P.SIX_X + 0.5), z: clamp(b.pos.z, -P.SIX_HW, P.SIX_HW) * 0.6 };
  }
  return null;
}

/* ------------------------------------------------------------- offside --- */
/** Snapshot who is in an offside position at the moment a pass is struck. */
function markOffside(m, passer) {
  const team = passer.team;
  const ax = m.dir[team];
  const opp = m.teams[1 - team].players.filter((p) => p.active);
  const line = offsideLine(opp, ax, m.ball.pos.x);
  m.offside = { team, ids: new Set(), passer: passer.id, t: m.clock };
  for (const p of m.teams[team].players) {
    if (p === passer || !p.active) continue;
    if (p.pos.x * ax <= 0) continue;                       // own half
    if (p.pos.x * ax <= m.ball.pos.x * ax) continue;       // behind the ball
    if (p.pos.x * ax > line + 0.35) m.offside.ids.add(p.id);
  }
  if (!m.offside.ids.size) m.offside = null;
}

/** Called whenever a player touches the ball; returns true if it's offside. */
function checkOffsideTouch(m, p) {
  if (!m.offside) return false;
  if (p.team !== m.offside.team) { m.offside = null; return false; }
  if (p.id === m.offside.passer) return false;
  if (!m.offside.ids.has(p.id)) { m.offside = null; return false; }
  m.offside = null;
  return true;
}

/* --------------------------------------------------------------- fouls --- */
/** Contact from a slide (or a badly mistimed standing tackle) is a foul when
    the tackler doesn't get the ball first. */
function checkFouls(m, dt) {
  if (m.state !== 'play') return null;
  const players = m.allPlayers;
  for (const t of players) {
    if (t.state !== 'slide' || !t.action) continue;
    if (t.foulChecked) continue;
    for (const v of players) {
      if (v.team === t.team || !v.active || v.state === 'down') continue;
      const d = t.distTo(v.pos.x, v.pos.z);
      if (d > t.radius + v.radius + 0.34) continue;

      /* Did the tackler reach the ball before the man? */
      const ballD = t.distTo(m.ball.pos.x, m.ball.pos.z);
      const gotBall = m.ball.lastTouch && m.ball.lastTouch.id === t.id
        && (m.clock - (m.ball.lastTouch.matchT || 0)) < 0.6;
      const clean = gotBall || ballD < 1.05;
      t.foulChecked = true;
      if (clean && Math.random() < 0.85) return null;

      const speed = t.speed;
      const fromBehind = Math.abs(angDelta(t.yaw, Math.atan2(v.pos.x - t.pos.x, v.pos.z - t.pos.z))) < 0.9
        && (v.vel.x * t.vel.x + v.vel.z * t.vel.z) > 0;
      let sev = 0;                       // 0 free kick, 1 yellow, 2 red
      if (speed > 6.5 || fromBehind) sev = 1;
      if (speed > 8.6 && fromBehind) sev = 2;
      /* denying an obvious goal-scoring chance */
      const ax = v.attackX;
      const lastMan = m.teams[t.team].players.filter((o) =>
        o.role !== 'GK' && o.active && (o.pos.x * -ax) < (t.pos.x * -ax)).length === 0;
      if (lastMan && (v.pos.x * ax) > 6 && sev < 2) sev = Math.max(sev, 1);

      v.goDown(1.1 + Math.random() * 0.5);
      t.staggerT = 0.9;
      return { tackler: t, victim: v, sev, x: v.pos.x, z: v.pos.z };
    }
  }
  for (const t of players) if (t.state !== 'slide') t.foulChecked = false;
  return null;
}

function isPenaltySpot(m, x, z, defendingTeam) {
  const ax = m.dir[defendingTeam];              // that team attacks +ax
  return (x * -ax) > P.BOX_X && Math.abs(z) < P.BOX_HW;
}

/* ------------------------------------------------------------ restarts --- */
function beginRestart(m, spec) {
  const b = m.ball;
  b.reset(spec.x, spec.z, spec.type === 'throw' ? 1.6 : BALL.R);
  b.state = 'dead';
  b.owner = null; b.holder = null;
  m.offside = null;

  const team = spec.team;
  const takers = m.teams[team].players.filter((p) => p.active && p.state !== 'down');
  let taker = null;
  if (spec.type === 'goalkick') taker = m.teams[team].keeper;
  else if (spec.type === 'penalty') {
    taker = takers.filter((p) => p.role !== 'GK')
      .sort((a, b2) => (b2.data.att.sho + (b2.data.traits.includes('setpiece') ? 20 : 0))
        - (a.data.att.sho + (a.data.traits.includes('setpiece') ? 20 : 0)))[0];
  } else if (spec.type === 'kickoff') {
    taker = takers.filter((p) => p.role !== 'GK')
      .sort((a, b2) => Math.abs(a.pos.z) - Math.abs(b2.pos.z))[0];
  } else {
    taker = takers.filter((p) => p.role !== 'GK')
      .sort((a, b2) => a.distTo(spec.x, spec.z) - b2.distTo(spec.x, spec.z))[0];
  }
  if (!taker) taker = takers[0];

  m.setpiece = {
    type: spec.type, team, x: spec.x, z: spec.z, taker,
    t: 0, taken: false, prep: RESTART.PREP,
    auto: RESTART.AUTO + Math.random() * 0.8,
    targets: buildRestartTargets(m, spec, taker),
    label: restartLabel(spec.type),
  };
  m.state = 'setpiece';
  if (taker) { taker.action = null; taker.state = 'idle'; }
  for (const p of m.allPlayers) { p.release(m.ball, 0); p.dribbleT = 0.2; }
  return m.setpiece;
}

function restartLabel(t) {
  return { throw: 'Throw-in', corner: 'Corner', goalkick: 'Goal kick', freekick: 'Free kick',
    penalty: 'Penalty', kickoff: 'Kick-off' }[t] || 'Restart';
}

/** Where every player should stand for this restart. */
function buildRestartTargets(m, spec, taker) {
  const out = new Map();
  const team = spec.team;
  const ax = m.dir[team];
  const tmp = { x: 0, z: 0 };

  for (const side of [0, 1]) {
    const brain = m.teams[side].brain;
    for (const p of m.teams[side].players) {
      if (!p.active) continue;
      if (p.role === 'GK') {
        const gx = -p.attackX * P.HALF_L;
        out.set(p.id, { x: gx + p.attackX * 1.6, z: 0 });
        continue;
      }
      brain.anchor(p, tmp);
      out.set(p.id, { x: tmp.x, z: tmp.z });
    }
  }

  if (spec.type === 'kickoff') {
    /* Everyone in their own half; two players over the ball. */
    for (const side of [0, 1]) {
      const sx = m.dir[side];
      for (const p of m.teams[side].players) {
        if (!p.active || p.role === 'GK') continue;
        const t = out.get(p.id);
        t.x = -Math.abs(t.x) * sx * 0.9 - 2 * sx;
        if (side !== team && dist2D(t.x, t.z, 0, 0) < P.CIRCLE_R + 1) {
          const l = Math.hypot(t.x, t.z) || 1;
          t.x = (t.x / l) * (P.CIRCLE_R + 1.5);
          t.z = (t.z / l) * (P.CIRCLE_R + 1.5);
        }
      }
    }
    if (taker) out.set(taker.id, { x: -ax * 0.7, z: 0.4 });
    const mate = m.teams[team].players.find((p) => p.active && p !== taker && p.role !== 'GK');
    if (mate) out.set(mate.id, { x: -ax * 1.5, z: -1.4 });
  } else if (spec.type === 'penalty') {
    for (const side of [0, 1]) {
      for (const p of m.teams[side].players) {
        if (!p.active || p.role === 'GK') continue;
        const t = out.get(p.id);
        const bx = ax * P.BOX_X;
        t.x = bx - ax * (2 + Math.random() * 4);
        t.z = (Math.random() - 0.5) * P.BOX_HW * 1.5;
      }
    }
    if (taker) out.set(taker.id, { x: spec.x - ax * 1.25, z: spec.z });
    const gk = m.teams[1 - team].keeper;
    if (gk) out.set(gk.id, { x: ax * P.HALF_L - ax * 0.35, z: 0 });
  } else if (spec.type === 'corner') {
    const sz = Math.sign(spec.z) || 1;
    if (taker) out.set(taker.id, { x: spec.x - ax * 1.1, z: spec.z - sz * 1.1 });
    /* attackers crowd the six-yard box, defenders mark them */
    let i = 0;
    for (const p of m.teams[team].players) {
      if (!p.active || p === taker || p.role === 'GK') continue;
      out.set(p.id, { x: ax * (P.SIX_X - 1 - (i % 2) * 3), z: -sz * (1.5 + i * 2.2) });
      i++;
    }
    let j = 0;
    for (const p of m.teams[1 - team].players) {
      if (!p.active || p.role === 'GK') continue;
      out.set(p.id, { x: ax * (P.SIX_X - 0.4 - (j % 2) * 3), z: -sz * (0.8 + j * 2.2) });
      j++;
    }
  } else if (spec.type === 'freekick') {
    if (taker) out.set(taker.id, { x: spec.x - ax * 1.4, z: spec.z });
    /* wall between ball and goal */
    const gx = -ax * P.HALF_L;
    const dx = gx - spec.x, dz = 0 - spec.z;
    const l = Math.hypot(dx, dz) || 1;
    const wx = spec.x + (dx / l) * RESTART.WALL, wz = spec.z + (dz / l) * RESTART.WALL;
    const px = -dz / l, pz = dx / l;
    const dfs = m.teams[1 - team].players.filter((p) => p.active && p.role !== 'GK')
      .sort((a, b2) => a.distTo(wx, wz) - b2.distTo(wx, wz));
    const wallN = dist2D(spec.x, spec.z, gx, 0) < 26 ? 3 : 1;
    for (let i = 0; i < Math.min(wallN, dfs.length); i++) {
      out.set(dfs[i].id, { x: wx + px * (i - (wallN - 1) / 2) * 0.75, z: wz + pz * (i - (wallN - 1) / 2) * 0.75 });
    }
    for (const p of m.teams[1 - team].players) {
      if (!p.active || p.role === 'GK') continue;
      const t = out.get(p.id);
      if (dist2D(t.x, t.z, spec.x, spec.z) < RESTART.RETREAT) {
        const ddx = t.x - spec.x, ddz = t.z - spec.z, dl = Math.hypot(ddx, ddz) || 1;
        t.x = spec.x + (ddx / dl) * RESTART.RETREAT;
        t.z = spec.z + (ddz / dl) * RESTART.RETREAT;
      }
    }
  } else if (spec.type === 'throw') {
    const sz = Math.sign(spec.z) || 1;
    if (taker) out.set(taker.id, { x: spec.x, z: spec.z + sz * 0.9 });
    for (const p of m.allPlayers) {
      if (!p.active || p === taker || p.role === 'GK') continue;
      const t = out.get(p.id);
      if (dist2D(t.x, t.z, spec.x, spec.z) < 4.5) {
        const ddx = t.x - spec.x, ddz = t.z - spec.z, dl = Math.hypot(ddx, ddz) || 1;
        t.x = spec.x + (ddx / dl) * 4.5;
        t.z = spec.z + (ddz / dl) * 4.5;
      }
      t.z = clamp(t.z, -P.HALF_W + 0.8, P.HALF_W - 0.8);
    }
  } else if (spec.type === 'goalkick') {
    for (const p of m.teams[1 - team].players) {
      if (!p.active || p.role === 'GK') continue;
      const t = out.get(p.id);
      t.x = lerp(t.x, 0, 0.35);
      if ((t.x * -ax) > P.BOX_X - 1) t.x = -ax * (P.BOX_X - 2);
    }
    const gk = m.teams[team].keeper;
    if (gk) out.set(gk.id, { x: spec.x - ax * 1.2, z: spec.z });
  }

  for (const [, t] of out) {
    t.x = clamp(t.x, -P.HALF_L + 0.5, P.HALF_L - 0.5);
    t.z = clamp(t.z, -P.HALF_W + 0.5, P.HALF_W - 0.5);
  }
  return out;
}

/** Runs while m.state === 'setpiece'. Returns true once play restarts. */
function updateRestart(m, dt) {
  const sp = m.setpiece;
  if (!sp) return true;
  sp.t += dt;
  const b = m.ball;

  /* Hold the ball on the spot until it's taken. */
  if (!sp.taken) {
    b.pos.set(sp.x, sp.type === 'throw' ? 1.75 : BALL.R, sp.z);
    b.vel.set(0, 0, 0); b.spin.set(0, 0, 0);
    b.state = 'dead'; b.owner = null;
    b.mesh.position.copy(b.pos);
    b.shadow.position.set(b.pos.x, 0.02, b.pos.z);
  }

  for (const p of m.allPlayers) {
    if (!p.active) continue;
    if (p.state === 'down') { p.drive(0, 0, false, dt); continue; }
    if (p.human >= 0 && sp.t > sp.prep && p.team === sp.team) continue;  // human takes over
    const t = sp.targets.get(p.id);
    if (!t) { p.drive(0, 0, false, dt); continue; }
    const d = p.distTo(t.x, t.z);
    if (d < 0.5) {
      p.drive(0, 0, false, dt);
      /* face the ball while waiting */
      p.yaw = angApproach(p.yaw, Math.atan2(sp.x - p.pos.x, sp.z - p.pos.z), 6 * dt);
    } else {
      seek(p, t.x, t.z, dt, { sprint: d > 12, slow: 1.6 });
    }
  }

  if (sp.taken) {
    /* Give the ball a moment to leave the taker before play resumes. */
    if (sp.t > sp.takenAt + 0.12) { m.state = 'play'; m.setpiece = null; return true; }
    return false;
  }

  const humanTakes = m.humanTeams.includes(sp.team) && sp.taker && sp.taker.human >= 0;
  if (humanTakes && sp.t > sp.prep && !sp.prompted) {
    sp.prompted = true;
    HUD.ticker(`${sp.label} — aim with the stick, press Pass, Cross or Shoot to take it.`);
  }
  /* Auto-take is the AI's normal path; for a human it's only a deadlock guard
     so the match can never sit still because nobody pressed anything. */
  if (sp.t > sp.prep && sp.t > (humanTakes ? RESTART.HUMAN_AUTO : sp.auto)) {
    takeSetPiece(m, null);
  }
  return false;
}

/** Execute the set piece. `aim` is optional {dx, dz, power, lift}. */
function takeSetPiece(m, aim) {
  const sp = m.setpiece;
  if (!sp || sp.taken) return;
  const p = sp.taker;
  const b = m.ball;
  sp.taken = true; sp.takenAt = sp.t;
  m.ball.state = 'free';
  if (!p) { m.state = 'play'; m.setpiece = null; return; }

  const ax = m.dir[sp.team];
  const opp = m.teams[1 - sp.team].players;
  const mine = m.teams[sp.team].players;

  /* The taker waits a stride or two off the ball, which is further than the
     strike code will reach — step them in before the kick goes out. */
  const stepIn = () => {
    const d = p.distTo(sp.x, sp.z);
    if (d <= CTRL.REACH * 0.8 || d < 1e-4) return;
    const ux = (p.pos.x - sp.x) / d, uz = (p.pos.z - sp.z) / d;
    p.pos.x = sp.x + ux * 0.5;
    p.pos.z = sp.z + uz * 0.5;
    p.yaw = Math.atan2(-ux, -uz);
  };

  if (aim) {
    const al = Math.hypot(aim.dx, aim.dz) || 1;
    p.pos.x = sp.x - (aim.dx / al) * 0.42;
    p.pos.z = sp.z - (aim.dz / al) * 0.42;
    p.queueKick(aim.kind || 'pass', aim);
    if (sp.type !== 'throw' && sp.type !== 'goalkick') markOffsideLater(m, p);
    return;
  }
  stepIn();

  const brain = m.teams[sp.team].brain;
  if (sp.type === 'penalty') {
    const side = Math.random() < 0.5 ? -1 : 1;
    const aimZ = side * P.GOAL_HW * (0.5 + Math.random() * 0.4);
    const gx = ax * P.HALF_L;
    p.queueKick('shoot', {
      dx: gx - p.pos.x, dz: aimZ - p.pos.z,
      power: 24 + p.d.shotPow * 0.35, lift: 0.06 + Math.random() * 0.06,
      spinY: -6, spinSide: -side * 0.5, pressure: 0.2, spreadMul: 0.5,
    });
    return;
  }
  if (sp.type === 'corner') {
    const targetX = ax * (P.SIX_X - 1.5);
    const targetZ = -Math.sign(sp.z) * 1.6;
    p.queueKick('lob', {
      dx: targetX - sp.x, dz: targetZ - sp.z,
      power: 19 + Math.random() * 3, lift: 0.46, spinY: -5,
      spinSide: Math.sign(sp.z) * 0.9, pressure: 0,
    });
    return;
  }
  if (sp.type === 'freekick') {
    const gx = ax * P.HALF_L;
    const distGoal = dist2D(sp.x, sp.z, gx, 0);
    if (distGoal < 24 && Math.abs(sp.z) < 18) {
      const aimZ = (Math.random() < 0.5 ? -1 : 1) * P.GOAL_HW * 0.7;
      p.queueKick('shoot', {
        dx: gx - sp.x, dz: aimZ - sp.z,
        power: 25 + p.d.shotPow * 0.3, lift: 0.16 + Math.random() * 0.05,
        spinY: -9, spinSide: -Math.sign(aimZ) * 1.3, pressure: 0, spreadMul: 0.7,
      });
      return;
    }
  }
  /* everything else: find a pass */
  const opt = brain._bestPass(p, mine, opp, b);
  if (opt) {
    const dx = opt.lx - sp.x, dz = opt.lz - sp.z;
    const d = Math.hypot(dx, dz);
    const lofted = sp.type === 'goalkick' ? d > 18 : opt.lane < 2.2 && d > 10;
    p.queueKick(lofted ? 'lob' : 'pass', {
      dx, dz, power: clamp(Math.sqrt(d) * (lofted ? 5.0 : 4.4), 8, 33),
      lift: lofted ? 0.5 : 0.03, spinY: -5, pressure: 0, intended: opt.t,
    });
  } else {
    p.queueKick('lob', { dx: ax, dz: (Math.random() - 0.5), power: 26, lift: 0.55, spinY: -5, pressure: 0 });
  }
  if (sp.type !== 'throw' && sp.type !== 'goalkick') markOffsideLater(m, p);
}

/* Offside can only be judged once the ball is actually struck, which happens
   a frame or two after the kick is queued. */
function markOffsideLater(m, p) { m.pendingOffsideCheck = p; }

/* ------------------------------------------------------------- shootout -- */
function makeShootout(m) {
  return {
    round: 0, idx: [0, 0], score: [0, 0], taken: [0, 0],
    order: [shootoutOrder(m, 0), shootoutOrder(m, 1)],
    first: Math.random() < 0.5 ? 0 : 1,
    log: [], done: false, winner: -1, suddenDeath: false, nextIn: 0, live: false,
  };
}
function shootoutOrder(m, team) {
  return m.teams[team].players
    .filter((p) => p.active && p.role !== 'GK')
    .sort((a, b) => (b.data.att.sho + (b.data.traits.includes('setpiece') ? 25 : 0))
      - (a.data.att.sho + (a.data.traits.includes('setpiece') ? 25 : 0)));
}
/** Standard 5-and-out with sudden death; returns the winner or −1. */
function shootoutWinner(s) {
  const [a, b] = s.score;
  const [ta, tb] = s.taken;
  const remA = Math.max(0, 5 - ta), remB = Math.max(0, 5 - tb);
  if (ta <= 5 || tb <= 5) {
    if (a > b + remB) return 0;
    if (b > a + remA) return 1;
  }
  if (ta >= 5 && tb >= 5 && ta === tb && a !== b) return a > b ? 0 : 1;
  return -1;
}

//==========================================================================
// 55_camera.js
//==========================================================================
/* Broadcast camera work and the instant-replay director.

   The match camera tracks a smoothed "focus" point rather than the ball
   itself, which is what stops the picture snapping about on a deflection.
   The replay system records a rolling window of the whole scene so any goal,
   save or big miss can be played back from a chosen cinematic angle. */

const CAM_MODES = ['broadcast', 'tele', 'dynamic', 'player', 'top'];
const CAM_LABEL = { broadcast: 'Broadcast', tele: 'Tele', dynamic: 'Dynamic', player: 'Player', top: 'Overhead' };

class CameraRig {
  constructor(aspect) {
    this.cam = new THREE.PerspectiveCamera(46, aspect, 0.4, 900);
    this.focus = V3(0, 0, 0);
    this.vel = V3();
    this.pos = V3(0, 26, 40);
    this.look = V3();
    this.shakeAmt = 0;
    this.mode = SETTINGS.camera;
    this.side = 1;
    this.fov = 46;
    this.override = null;
  }

  setMode(mode) { this.mode = mode; }

  cycle() {
    const i = CAM_MODES.indexOf(this.mode);
    this.mode = CAM_MODES[(i + 1) % CAM_MODES.length];
    SETTINGS.camera = this.mode; saveSettings();
    return CAM_LABEL[this.mode];
  }

  shake(a) { this.shakeAmt = Math.min(1.2, this.shakeAmt + a); }

  /** target: {x,z} to look at; subject: optional player for the player cam. */
  update(dt, target, subject, ballSpeed) {
    const f = this.focus;
    /* Lead the camera slightly toward where play is heading. */
    const lead = clamp(ballSpeed * 0.16, 0, 5);
    const tx = clamp(target.x + (target.vx || 0) * 0.22, -P.HALF_L - 4, P.HALF_L + 4);
    const tz = clamp(target.z + (target.vz || 0) * 0.18, -P.HALF_W - 4, P.HALF_W + 4);
    f.x = damp(f.x, tx, 3.2, dt);
    f.z = damp(f.z, tz, 2.6, dt);

    let px, py, pz, lx, ly, lz, fov = 46;

    if (this.override) {
      const o = this.override;
      px = o.px; py = o.py; pz = o.pz; lx = o.lx; ly = o.ly; lz = o.lz; fov = o.fov || 40;
    } else if (this.mode === 'top') {
      /* Not quite vertical: a straight-down lookAt has a degenerate up vector
         and the resulting roll is arbitrary. */
      px = f.x; py = 66; pz = f.z + 15;
      lx = f.x; ly = 0; lz = f.z; fov = 40;
    } else if (this.mode === 'player' && subject) {
      const back = 7.4, up = 3.3;
      px = subject.pos.x - Math.sin(subject.yaw) * back;
      pz = subject.pos.z - Math.cos(subject.yaw) * back;
      py = up;
      lx = subject.pos.x + Math.sin(subject.yaw) * 6;
      lz = subject.pos.z + Math.cos(subject.yaw) * 6;
      ly = 1.2; fov = 55;
    } else {
      /* Gantry position: up in the near stand, above the seating deck but
         under the roof — the same place a real main camera lives. The narrow
         field of view is what gives it the broadcast crop. */
      const tele = this.mode === 'tele';
      const dyn = this.mode === 'dynamic';
      const height = tele ? 19 : dyn ? 21 : 23;
      const dist = tele ? 26 : dyn ? 30 : 33;
      const zoom = dyn ? clamp(1 - ballSpeed * 0.006, 0.88, 1.04) : 1;
      px = f.x * (tele ? 0.92 : 0.84);
      py = height * zoom;
      /* +Z touchline, so screen-right is +X and the stick maps straight onto
         world axes with no mirroring. */
      pz = this.side * (P.HALF_W + dist * zoom);
      lx = f.x; ly = 1.2; lz = f.z * 0.72;
      fov = (tele ? 31 : dyn ? 34 : 36) + (dyn ? clamp(ballSpeed * 0.11, 0, 5) : 0);
    }

    const k = this.override ? 9 : 4.6;
    this.pos.x = damp(this.pos.x, px, k, dt);
    this.pos.y = damp(this.pos.y, py, k, dt);
    this.pos.z = damp(this.pos.z, pz, k, dt);
    this.look.x = damp(this.look.x, lx, k * 1.2, dt);
    this.look.y = damp(this.look.y, ly, k * 1.2, dt);
    this.look.z = damp(this.look.z, lz, k * 1.2, dt);
    this.fov = damp(this.fov, fov, 4, dt);

    if (this.shakeAmt > 0.001) {
      this.shakeAmt = Math.max(0, this.shakeAmt - dt * 1.9);
      const s = this.shakeAmt * this.shakeAmt * 0.9;
      this.cam.position.set(
        this.pos.x + (Math.random() - 0.5) * s,
        this.pos.y + (Math.random() - 0.5) * s,
        this.pos.z + (Math.random() - 0.5) * s);
    } else {
      this.cam.position.copy(this.pos);
    }
    this.cam.fov = this.fov;
    this.cam.updateProjectionMatrix();
    this.cam.lookAt(this.look);
  }

  resize(aspect) { this.cam.aspect = aspect; this.cam.updateProjectionMatrix(); }
}

/* --------------------------------------------------------------- replay -- */
const ACT_CODE = { idle: 0, shoot: 1, pass: 2, lob: 3, slide: 4, tackle: 5, dive: 6, celebrate: 7, down: 8 };
const CODE_ACT = Object.keys(ACT_CODE);
const REPLAY_HZ = 30;
const REPLAY_SEC = 9;

class ReplaySystem {
  constructor(nPlayers) {
    this.stride = 6 + nPlayers * 6;
    this.frames = new Ring(REPLAY_HZ * REPLAY_SEC);
    for (let i = 0; i < this.frames.n; i++) this.frames.buf[i] = new Float32Array(this.stride);
    this.acc = 0;
    this.playing = false;
    this.t = 0; this.rate = 0.42;
    this.from = 0; this.count = 0;
    this.n = nPlayers;
    this.shot = null;
  }

  reset() { this.frames.clear(); this.playing = false; }

  record(dt, m) {
    if (this.playing) return;
    this.acc += dt;
    const step = 1 / REPLAY_HZ;
    if (this.acc < step) return;
    this.acc = 0;
    const i = this.frames.i;
    const f = this.frames.buf[i] || (this.frames.buf[i] = new Float32Array(this.stride));
    const b = m.ball;
    f[0] = b.pos.x; f[1] = b.pos.y; f[2] = b.pos.z;
    f[3] = b.spin.x; f[4] = b.spin.y; f[5] = b.spin.z;
    const ps = m.allPlayers;
    for (let k = 0; k < this.n; k++) {
      const p = ps[k]; const o = 6 + k * 6;
      if (!p) continue;
      f[o] = p.pos.x; f[o + 1] = p.pos.z; f[o + 2] = p.yaw; f[o + 3] = p.speed;
      f[o + 4] = p.action ? (ACT_CODE[p.action.kind] || 0) : 0;
      f[o + 5] = p.action ? p.action.t / Math.max(0.01, p.action.dur) : 0;
    }
    this.frames.i = (this.frames.i + 1) % this.frames.n;
    if (this.frames.len < this.frames.n) this.frames.len++;
  }

  /** Play back the last `seconds` of action with a chosen camera treatment. */
  start(seconds, shot) {
    if (!SETTINGS.replays || this.frames.len < 12) return false;
    this.count = Math.min(this.frames.len, Math.round(seconds * REPLAY_HZ));
    this.from = this.frames.len - this.count;
    this.t = 0;
    this.playing = true;
    this.shot = shot || { kind: 'orbit' };
    this.rate = shot && shot.rate ? shot.rate : 0.42;
    return true;
  }

  stop() { this.playing = false; this.shot = null; }

  /** Drives the meshes and the camera; returns false when the replay ends. */
  update(dt, m, rig) {
    if (!this.playing) return false;
    this.t += dt * this.rate;
    const idx = this.t * REPLAY_HZ;
    if (idx >= this.count - 1) { this.stop(); rig.override = null; return false; }

    const i0 = Math.floor(idx), i1 = Math.min(this.count - 1, i0 + 1);
    const u = idx - i0;
    const a = this.frames.at(this.from + i0), b = this.frames.at(this.from + i1);
    if (!a || !b) { this.stop(); rig.override = null; return false; }

    const ball = m.ball;
    ball.pos.set(lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u));
    ball.mesh.position.copy(ball.pos);
    const h = clamp(ball.pos.y - BALL.R, 0, 12);
    ball.shadow.position.set(ball.pos.x, 0.02, ball.pos.z);
    const ss = clamp(0.42 + h * 0.14, 0.42, 1.5);
    ball.shadow.scale.set(ss, ss, 1);

    const ps = m.allPlayers;
    for (let k = 0; k < this.n; k++) {
      const p = ps[k]; if (!p) continue;
      const o = 6 + k * 6;
      const yaw = a[o + 2] + angDelta(a[o + 2], b[o + 2]) * u;
      const code = a[o + 4] | 0;
      const kind = CODE_ACT[code] || 'idle';
      const act = code ? { kind, t: lerp(a[o + 5], b[o + 5], u) * 0.5, dur: 0.5, side: 1 } : null;
      p.mesh.update(dt * this.rate, {
        pos: { x: lerp(a[o], b[o], u), y: 0, z: lerp(a[o + 1], b[o + 1], u) },
        yaw, speed: lerp(a[o + 3], b[o + 3], u), action: act, accelF: 0, ready: false, lookDown: 0,
      });
      p.mesh.setIndicator(false);
    }

    /* camera treatment */
    const s = this.shot;
    const bx = ball.pos.x, bz = ball.pos.z;
    if (s.kind === 'orbit') {
      const ang = (s.a0 || 0) + this.t * 0.42;
      const r = 17;
      rig.override = {
        px: bx + Math.cos(ang) * r, py: 5.5 + Math.sin(this.t * 0.7) * 1.6, pz: bz + Math.sin(ang) * r,
        lx: bx, ly: 1.0, lz: bz, fov: 38,
      };
    } else if (s.kind === 'behind') {
      rig.override = {
        px: s.px, py: s.py, pz: s.pz, lx: bx, ly: ball.pos.y * 0.6 + 0.6, lz: bz, fov: 34,
      };
    } else if (s.kind === 'goalcam') {
      rig.override = {
        px: s.side * (P.HALF_L + 5.5), py: 3.2, pz: 0,
        lx: bx, ly: Math.max(0.6, ball.pos.y), lz: bz, fov: 46,
      };
    } else {
      rig.override = { px: bx - 12, py: 4.2, pz: bz - 12, lx: bx, ly: 1, lz: bz, fov: 40 };
    }
    return true;
  }
}

class Commentary {
  constructor(m) {
    this.m = m;
    this.recent = [];
    this.lastAt = 0;
    this.idleAt = 0;
  }

  _fill(tpl, ctx) {
    const m = this.m;
    const map = {
      player: ctx.player ? ctx.player.data.last : 'the striker',
      victim: ctx.victim ? ctx.victim.data.last : 'his man',
      team: ctx.team !== undefined ? m.teams[ctx.team].club.name : '',
      opp: ctx.team !== undefined ? m.teams[1 - ctx.team].club.name : '',
      home: m.teams[0].club.name, away: m.teams[1].club.name,
      hs: m.score[0], as: m.score[1],
      stadium: m.venue, minute: Math.floor(m.clock / 60) + 1,
    };
    return tpl.replace(/\{(\w+)\}/g, (_, k) => (map[k] !== undefined ? map[k] : ''));
  }

  pick(kind) {
    const bank = LINES[kind];
    if (!bank || !bank.length) return null;
    for (let i = 0; i < 8; i++) {
      const t = bank[(Math.random() * bank.length) | 0];
      if (!this.recent.includes(t)) {
        this.recent.push(t);
        if (this.recent.length > 12) this.recent.shift();
        return t;
      }
    }
    return bank[0];
  }

  say(kind, ctx, urgency) {
    const tpl = this.pick(kind);
    if (!tpl) return;
    const line = this._fill(tpl, ctx || {});
    const now = performance.now() / 1000;
    this.lastAt = now;
    if (SETTINGS.commentaryText) HUD.ticker(line);
    Audio2.say(line, urgency || 0);
  }

  /** Called by the match loop — fills quiet spells with colour. */
  idle(dt) {
    const m = this.m;
    const now = performance.now() / 1000;
    if (now - this.lastAt < 8.5 || m.state !== 'play') return;
    if (now - this.idleAt < 11) return;
    this.idleAt = now;
    const owner = m.ball.owner;
    if (!owner) return;
    this.say('buildup', { team: owner.team, player: owner });
  }

  goal(scorer, info) {
    const m = this.m;
    let kind = 'goal_normal';
    if (info.own) kind = 'goal_own';
    else if (info.penalty) kind = 'goal_penalty';
    else if (info.rebound) kind = 'goal_rebound';
    else if (info.dist > 20) kind = 'goal_long';
    else if (info.dist < 7) kind = 'goal_close';
    this.say(kind, { player: scorer, team: info.team }, 2);
    const diff = m.score[info.team] - m.score[1 - info.team];
    setTimeout(() => {
      if (diff === 0) this.say('goal_equal', { team: info.team }, 1);
      else if (diff === 1) this.say('goal_lead', { team: info.team }, 1);
      else if (diff > 1) this.say('goal_extend', { team: info.team }, 1);
      else this.say('goal_consol', { team: info.team }, 1);
    }, 2600);
  }
}

/* In-match HUD: score bug, clock, radar, shot/pass power meters, commentary
   ticker, event feed and the big centre-screen callouts. */

const HUD = {
  root: null, tickT: 0, bigT: 0, events: [],

  attach() {
    this.root = $('#hud');
    this.elScH = $('#sbScH'); this.elScA = $('#sbScA');
    this.elAbH = $('#sbAbH'); this.elAbA = $('#sbAbA');
    this.elCrH = $('#sbCrestH'); this.elCrA = $('#sbCrestA');

    this.elBig = $('#bigmsg');
    this.elEvents = $('#events');
    this.elNames = $('#pnames');
    this.elReplay = $('#replayBadge');
    this.elHelp = $('#helpCard');
    this.radar = $('#radar');
    this.rctx = this.radar.getContext('2d');
    this.meters = [$('#pm1'), $('#pm2')];
  },

  show(on) { this.root.classList.toggle('off', !on); },

  setTeams(m) {
    this.elAbH.textContent = m.teams[0].club.abbr;
    this.elAbA.textContent = m.teams[1].club.abbr;
    this.elCrH.src = badgeURL(m.teams[0].club.badge, 64);
    this.elCrA.src = badgeURL(m.teams[1].club.badge, 64);
    $('#sbPos').style.background = m.teams[0].club.kit.p;
    clear(this.elEvents); this.events.length = 0;
    this.helpShown = 0;
    clear(this.elNames);
  },

  helpCard(lines) {
    clear(this.elHelp);
    for (const [a, b] of lines) {
      this.elHelp.appendChild(el('b', {}, a));
      this.elHelp.appendChild(el('span', {}, b));
    }
    this.elHelp.classList.remove('fade');
    clearTimeout(this._helpT);
    this._helpT = setTimeout(() => this.elHelp.classList.add('fade'), 9000);
  },

  ticker(text) {
    this.elTicker.textContent = text;
    this.elTicker.classList.add('on');
    clearTimeout(this._tickT);
    this._tickT = setTimeout(() => this.elTicker.classList.remove('on'), 5200);
  },

  big(title, sub, ms, variant) {
    const b = this.elBig;
    b.querySelector('.h').textContent = title;
    b.querySelector('.s').textContent = sub || '';
    b.className = 'on' + (variant ? ' ' + variant : '');
    clearTimeout(this._bigT);
    this._bigT = setTimeout(() => { b.className = variant ? variant : ''; }, ms || 2200);
  },

  event(text, kind) {
    const e = el('div.ev' + (kind ? '.' + kind : ''), {}, text);
    this.elEvents.appendChild(e);
    this.events.push(e);
    while (this.events.length > 6) { const old = this.events.shift(); if (old.parentNode) old.remove(); }
    setTimeout(() => { e.style.transition = 'opacity .6s'; e.style.opacity = '0'; }, 8000);
    setTimeout(() => { if (e.parentNode) e.remove(); }, 8700);
  },

  replay(on) { this.elReplay.classList.toggle('hidden', !on); },

  setNames(m) {
    clear(this.elNames);
    for (let i = 0; i < m.humanCount; i++) {
      const p = m.controlled[i];
      const t = m.humanTeams[i];
      const node = el('div.pn.p' + (i + 1), {},
        el('i', {}, 'P' + (i + 1)),
        el('span', {}, p ? `${p.data.num} ${p.data.last}` : '—'));
      node.style.borderColor = m.teams[t].club.kit.p;
      this.elNames.appendChild(node);
    }
  },

  power(i, v, on) {
    const m = this.meters[i];
    if (!m) return;
    m.classList.toggle('on', !!on);
    m.querySelector('.fill').style.width = (clamp01(v) * 100) + '%';
  },

  update(dt, m) {
    this.elScH.textContent = m.score[0];
    this.elScA.textContent = m.score[1];
    this.elClock.textContent = clockStr(m.clock);
    this.elPhase.textContent = m.phaseLabel;
    if (SETTINGS.radar) { this.radar.parentNode.classList.remove('hidden'); this.drawRadar(m); }
    else this.radar.parentNode.classList.add('hidden');
  },

  drawRadar(m) {
    const c = this.rctx, W = this.radar.width, H = this.radar.height;
    c.clearRect(0, 0, W, H);
    const pad = 8;
    const sx = (W - pad * 2) / (P.HALF_L * 2), sz = (H - pad * 2) / (P.HALF_W * 2);
    const X = (x) => pad + (x + P.HALF_L) * sx;
    const Z = (z) => pad + (z + P.HALF_W) * sz;

    c.fillStyle = 'rgba(24,24,37,.75)';
    c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(166,173,200,.30)'; c.lineWidth = 1;
    c.strokeRect(X(-P.HALF_L), Z(-P.HALF_W), P.HALF_L * 2 * sx, P.HALF_W * 2 * sz);
    c.beginPath(); c.moveTo(X(0), Z(-P.HALF_W)); c.lineTo(X(0), Z(P.HALF_W)); c.stroke();
    c.beginPath(); c.arc(X(0), Z(0), P.CIRCLE_R * sx, 0, TAU); c.stroke();
    for (const s of [-1, 1]) {
      c.strokeRect(X(Math.min(s * P.HALF_L, s * P.BOX_X)), Z(-P.BOX_HW),
        P.BOX_D * sx, P.BOX_HW * 2 * sz);
    }

    for (const p of m.allPlayers) {
      if (!p.active) continue;
      const club = m.teams[p.team].club;
      c.fillStyle = p.role === 'GK' ? CSS.yellow : (p.team === 0 ? club.kit.p : club.kit.p);
      c.beginPath(); c.arc(X(p.pos.x), Z(p.pos.z), p.role === 'GK' ? 2.6 : 3.1, 0, TAU); c.fill();
      if (m.controlled.includes(p)) {
        c.strokeStyle = CSS.text; c.lineWidth = 1.6;
        c.beginPath(); c.arc(X(p.pos.x), Z(p.pos.z), 5.4, 0, TAU); c.stroke();
      }
    }
    const b = m.ball;
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(X(b.pos.x), Z(b.pos.z), 2.4, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(17,17,27,.9)'; c.lineWidth = 1;
    c.beginPath(); c.arc(X(b.pos.x), Z(b.pos.z), 2.4, 0, TAU); c.stroke();
  },
};
