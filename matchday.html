<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MATCHDAY: Rival Leagues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   MATCHDAY: Rival Leagues — Catppuccin Mocha / JetBrains Mono
   ========================================================================== */
:root{
  --crust:#11111b; --mantle:#181825; --base:#1e1e2e;
  --s0:#313244; --s1:#45475a; --s2:#585b70;
  --ov0:#6c7086; --ov1:#7f849c; --ov2:#9399b2;
  --sub0:#a6adc8; --sub1:#bac2de; --text:#cdd6f4;
  --rosewater:#f5e0dc; --flamingo:#f2cdcd; --pink:#f5c2e7; --mauve:#cba6f7;
  --red:#f38ba8; --maroon:#eba0ac; --peach:#fab387; --yellow:#f9e2af;
  --green:#a6e3a1; --teal:#94e2d5; --sky:#89dceb; --sapphire:#74c7ec; --blue:#89b4fa; --lav:#b4befe;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--crust);}
body{font-family:var(--mono);color:var(--text);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;}
canvas#view{display:block;position:fixed;inset:0;z-index:0;}
.hidden{display:none !important;}
button,input,select,textarea{font-family:var(--mono);font-size:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s1);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--s2)}
::selection{background:var(--mauve);color:var(--crust)}

/* ---------------------------------------------------------------- boot ---- */
#boot{position:fixed;inset:0;z-index:100;background:var(--crust);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .6s ease;}
#boot.done{opacity:0;pointer-events:none}
#bootMark{font-size:40px;font-weight:800;letter-spacing:.14em;
  background:linear-gradient(96deg,var(--green),var(--teal) 40%,var(--blue) 72%,var(--mauve));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
#bootSub{color:var(--ov1);letter-spacing:.34em;font-size:11px;text-transform:uppercase}
#bootBar{width:min(420px,60vw);height:3px;background:var(--s0);border-radius:2px;overflow:hidden}
#bootFill{height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--green),var(--teal),var(--blue));transition:width .3s ease}
#bootMsg{color:var(--ov0);font-size:11px;letter-spacing:.12em;height:14px}

/* ------------------------------------------------------------ menu shell -- */
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  background:
    radial-gradient(1200px 700px at 78% -10%, rgba(137,180,250,.12), transparent 60%),
    radial-gradient(900px 600px at 8% 110%, rgba(166,227,161,.10), transparent 60%),
    linear-gradient(170deg,var(--crust),#0d0d15 60%,var(--crust));
}
#menu.overlay{background:rgba(17,17,27,.90);backdrop-filter:blur(7px)}
#menu::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.045;
  background:repeating-linear-gradient(0deg,rgba(205,214,244,.5) 0 1px,transparent 1px 3px)}

#mHead{position:relative;z-index:2;display:flex;align-items:center;gap:18px;
  padding:18px 30px 14px;border-bottom:1px solid var(--s0);flex:none}
#mMark{font-weight:800;letter-spacing:.1em;font-size:16px;
  background:linear-gradient(96deg,var(--green),var(--teal) 45%,var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#mMark small{display:block;font-size:9px;letter-spacing:.3em;color:var(--ov0);
  -webkit-text-fill-color:var(--ov0);font-weight:400}
#mCrumb{color:var(--ov1);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
#mCrumb b{color:var(--text);font-weight:600}
#mSpacer{flex:1}
#mInfo{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--sub0)}
#mInfo .kv{display:flex;gap:6px;align-items:baseline}
#mInfo .kv i{font-style:normal;color:var(--ov0);letter-spacing:.16em;font-size:9px;text-transform:uppercase}
#mInfo .kv b{color:var(--yellow);font-weight:600}

#mBody{position:relative;z-index:2;flex:1;overflow:auto;padding:24px 30px 20px;}
#mFoot{position:relative;z-index:2;flex:none;display:flex;gap:10px;align-items:center;
  padding:12px 30px;border-top:1px solid var(--s0);color:var(--ov0);font-size:11px;letter-spacing:.1em}
#mFoot .spacer{flex:1}
kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--s0);
  border:1px solid var(--s1);border-bottom-width:2px;color:var(--sub1);font-size:10px;font-weight:600}

/* ------------------------------------------------------------- widgets ---- */
.wrap{max-width:1180px;margin:0 auto}
.wrap.wide{max-width:1500px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.row.wrapp{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--ov1)}
.dim{color:var(--ov0)}
.tiny{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ov0)}
.big{font-size:26px;font-weight:700;letter-spacing:.02em}
.center{text-align:center}
.mono-num{font-variant-numeric:tabular-nums}

h2.sec{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ov1);
  font-weight:600;margin:2px 0 8px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:'';flex:1;height:1px;background:var(--s0)}

.panel{background:linear-gradient(180deg,rgba(30,30,46,.92),rgba(24,24,37,.92));
  border:1px solid var(--s0);border-radius:var(--r);padding:16px 18px;}
.panel.tight{padding:12px 14px}
.panel.flush{padding:0;overflow:hidden}
.panel h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub0);
  font-weight:600;margin-bottom:10px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.gside{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1000px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gside,.g3{grid-template-columns:minmax(0,1fr)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:8px;border:1px solid var(--s1);background:var(--s0);
  color:var(--sub1);font-size:12px;font-weight:500;letter-spacing:.08em;
  transition:background .13s,border-color .13s,color .13s,transform .09s;white-space:nowrap}
.btn:hover{background:var(--s1);border-color:var(--s2);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,rgba(166,227,161,.22),rgba(148,226,213,.14));
  border-color:rgba(166,227,161,.5);color:var(--green)}
.btn.primary:hover{background:linear-gradient(180deg,rgba(166,227,161,.34),rgba(148,226,213,.22));color:#d6f5d2}
.btn.warn{border-color:rgba(243,139,168,.45);color:var(--red);background:rgba(243,139,168,.10)}
.btn.warn:hover{background:rgba(243,139,168,.2)}
.btn.ghost{background:transparent;border-color:var(--s0);color:var(--ov1)}
.btn.ghost:hover{border-color:var(--s1);color:var(--sub0)}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn .k{font-size:9px;color:var(--ov0);border:1px solid var(--s1);border-radius:4px;padding:0 4px}

/* big mode tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.tile{position:relative;text-align:left;padding:18px;border-radius:var(--r);
  border:1px solid var(--s0);overflow:hidden;min-height:132px;
  background:linear-gradient(150deg,rgba(49,50,68,.55),rgba(24,24,37,.85));
  transition:border-color .16s,transform .16s,box-shadow .16s;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--c,var(--blue));transform:translateY(-2px);
  box-shadow:0 10px 30px -14px var(--c,var(--blue))}
.tile .ico{font-size:20px;line-height:1}
.tile .t{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.tile .d{font-size:11px;color:var(--ov1);line-height:1.5}
.tile .glow{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
  background:var(--c,var(--blue));filter:blur(46px);opacity:.20;pointer-events:none}
.tile[disabled]{opacity:.45;pointer-events:none}

/* form controls */
label.field{display:flex;flex-direction:column;gap:5px}
label.field>span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ov0)}
input[type=text],input[type=number],select,textarea{
  background:var(--mantle);border:1px solid var(--s0);border-radius:7px;padding:8px 10px;
  color:var(--text);outline:none;transition:border-color .13s;width:100%}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--s0);
  border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--blue);cursor:pointer;border:2px solid var(--crust)}
input[type=color]{width:44px;height:30px;padding:2px;background:var(--mantle);
  border:1px solid var(--s0);border-radius:7px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--s0);border-radius:8px;overflow:hidden;background:var(--mantle)}
.seg button{padding:6px 12px;font-size:11px;color:var(--ov1);letter-spacing:.08em;
  border-right:1px solid var(--s0);transition:background .12s,color .12s}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--s0);color:var(--sub1)}
.seg button.on{background:var(--s1);color:var(--text);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--s0);margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ov0);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--sub0)}
.tabs button.on{color:var(--text);border-bottom-color:var(--green)}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ov0);
  font-weight:500;text-align:right;padding:8px 8px;border-bottom:1px solid var(--s0);white-space:nowrap}
table.tbl th:nth-child(2),table.tbl td:nth-child(2){text-align:left}
table.tbl th.l,table.tbl td.l{text-align:left}
table.tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(49,50,68,.45);
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr:hover td{background:rgba(69,71,90,.22)}
table.tbl tr.me td{background:rgba(137,180,250,.10)}
table.tbl tr.me td:first-child{box-shadow:inset 2px 0 0 var(--blue)}
table.tbl td b{font-weight:600;color:var(--text)}
.zone-c{box-shadow:inset 2px 0 0 var(--green)!important}
.zone-e{box-shadow:inset 2px 0 0 var(--sapphire)!important}
.zone-r{box-shadow:inset 2px 0 0 var(--red)!important}

/* crest */
.crest{width:26px;height:26px;flex:none;border-radius:4px;image-rendering:auto}
.crest.lg{width:64px;height:64px;border-radius:8px}
.crest.xl{width:104px;height:104px;border-radius:10px}
.club{display:flex;align-items:center;gap:9px;min-width:0}
.club .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* player cards */
.pcard{position:relative;border-radius:11px;padding:11px;overflow:hidden;
  border:1px solid var(--s1);background:linear-gradient(160deg,var(--c1,#45475a),var(--c2,#1e1e2e) 78%);
  display:flex;flex-direction:column;gap:4px;min-height:150px;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(0,0,0,.9)}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.pcard .ovr{font-size:26px;font-weight:800;line-height:.95;letter-spacing:-.02em}
.pcard .pos{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.72)}
.pcard .nm{font-size:12px;font-weight:600;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta{font-size:9.5px;color:rgba(255,255,255,.6);letter-spacing:.08em}
.pcard .atts{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;margin-top:auto;
  font-size:9.5px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
.pcard .atts b{font-weight:700}
.pcard .shine{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 42%)}
.pcard .rar{position:absolute;right:9px;bottom:9px;font-size:8px;letter-spacing:.24em;
  color:rgba(255,255,255,.55)}
.pcard.sel{outline:2px solid var(--green);outline-offset:1px}
.pcard.empty{background:rgba(24,24,37,.6);border-style:dashed;align-items:center;justify-content:center;
  color:var(--ov0);font-size:11px;letter-spacing:.2em}

/* chips + bars */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:10px;letter-spacing:.1em;background:var(--s0);color:var(--sub0);border:1px solid var(--s1)}
.chip.g{background:rgba(166,227,161,.14);color:var(--green);border-color:rgba(166,227,161,.35)}
.chip.y{background:rgba(249,226,175,.14);color:var(--yellow);border-color:rgba(249,226,175,.35)}
.chip.r{background:rgba(243,139,168,.14);color:var(--red);border-color:rgba(243,139,168,.35)}
.chip.b{background:rgba(137,180,250,.14);color:var(--blue);border-color:rgba(137,180,250,.35)}
.chip.m{background:rgba(203,166,247,.14);color:var(--mauve);border-color:rgba(203,166,247,.35)}
.bar{height:4px;border-radius:3px;background:var(--s0);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.attrow{display:grid;grid-template-columns:56px 1fr 28px;gap:8px;align-items:center;font-size:10.5px}
.attrow span{color:var(--ov1);letter-spacing:.1em}
.attrow b{text-align:right;font-variant-numeric:tabular-nums}

/* list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  border:1px solid transparent;transition:background .12s,border-color .12s}
.lrow:hover{background:rgba(69,71,90,.24);border-color:var(--s0)}
.lrow.on{background:rgba(137,180,250,.12);border-color:rgba(137,180,250,.4)}
.divider{height:1px;background:var(--s0);margin:4px 0}

/* toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);z-index:90;
  padding:10px 18px;border-radius:9px;background:rgba(24,24,37,.96);border:1px solid var(--s1);
  color:var(--text);font-size:12px;letter-spacing:.06em;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;box-shadow:0 14px 40px -18px #000}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.good{border-color:rgba(166,227,161,.5);color:var(--green)}
#toast.bad{border-color:rgba(243,139,168,.5);color:var(--red)}

/* ================================================================= HUD ==== */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;font-variant-numeric:tabular-nums}
#hud.off{display:none}

#scorebug{position:absolute;left:26px;top:20px;display:flex;align-items:stretch;
  border-radius:9px;overflow:hidden;box-shadow:0 12px 34px -18px #000;
  background:rgba(17,17,27,.86);border:1px solid rgba(88,91,112,.55);backdrop-filter:blur(5px)}
#scorebug .sd{display:flex;align-items:center;gap:8px;padding:7px 12px}
#scorebug .sd.h{border-right:1px solid rgba(88,91,112,.4)}
#scorebug .ab{font-size:13px;font-weight:700;letter-spacing:.12em}
#scorebug .cr{width:20px;height:20px;border-radius:3px}
#scorebug .sc{padding:7px 13px;font-size:17px;font-weight:800;letter-spacing:.06em;
  background:rgba(49,50,68,.75);display:flex;align-items:center;gap:9px}
#scorebug .clk{padding:7px 12px;font-size:13px;font-weight:600;color:var(--yellow);
  background:rgba(24,24,37,.9);border-left:1px solid rgba(88,91,112,.4);display:flex;align-items:center;gap:8px}
#scorebug .clk small{font-size:8.5px;letter-spacing:.2em;color:var(--ov0)}
#scorebug .pos{width:3px;align-self:stretch}

#ticker{position:absolute;left:26px;top:66px;max-width:min(560px,52vw);
  padding:7px 13px;border-radius:8px;background:rgba(17,17,27,.8);
  border-left:2px solid var(--green);color:var(--sub1);font-size:12px;letter-spacing:.02em;
  opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s}
#ticker.on{opacity:1;transform:translateX(0)}

#radarWrap{position:absolute;right:24px;top:20px;padding:7px;border-radius:9px;
  background:rgba(17,17,27,.72);border:1px solid rgba(88,91,112,.4)}
#radar{display:block;width:186px;height:120px;border-radius:5px}

#powerWrap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;gap:16px;align-items:flex-end}
.pmeter{width:190px;opacity:0;transition:opacity .18s}
.pmeter.on{opacity:1}
.pmeter .lbl{font-size:9px;letter-spacing:.24em;color:var(--ov1);text-align:center;margin-bottom:4px}
.pmeter .track{height:8px;border-radius:5px;background:rgba(17,17,27,.8);
  border:1px solid var(--s1);overflow:hidden;position:relative}
.pmeter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow) 62%,var(--red));
  transition:width .04s linear}
.pmeter .mark{position:absolute;top:0;bottom:0;width:1px;background:rgba(205,214,244,.35)}

#pnames{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;gap:26px;
  font-size:11px;letter-spacing:.14em;color:var(--sub0)}
#pnames .pn{padding:3px 11px;border-radius:14px;background:rgba(17,17,27,.7);
  border:1px solid var(--s0);display:flex;gap:8px;align-items:center}
#pnames .pn i{font-style:normal;font-size:9px;color:var(--ov0)}
#pnames .pn.p1{border-color:rgba(137,180,250,.5)}
#pnames .pn.p2{border-color:rgba(250,179,135,.5)}

#bigmsg{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;
  opacity:0;transform:scale(.9);transition:opacity .28s,transform .28s}
#bigmsg.on{opacity:1;transform:scale(1)}
#bigmsg .h{font-size:64px;font-weight:800;letter-spacing:.12em;
  background:linear-gradient(96deg,var(--green),var(--teal) 45%,var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 26px rgba(0,0,0,.75))}
#bigmsg .s{font-size:14px;letter-spacing:.34em;color:var(--sub0);margin-top:4px;text-transform:uppercase}
#bigmsg.warnv .h{background:linear-gradient(96deg,var(--red),var(--peach))}
#bigmsg.warnv .h{-webkit-background-clip:text;background-clip:text}

#replayBadge{position:absolute;left:50%;top:22px;transform:translateX(-50%);
  padding:5px 15px;border-radius:6px;background:rgba(243,139,168,.16);
  border:1px solid rgba(243,139,168,.5);color:var(--red);font-size:11px;
  letter-spacing:.32em;font-weight:600;display:flex;gap:9px;align-items:center}
#replayBadge .dot{width:7px;height:7px;border-radius:50%;background:var(--red);
  animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}

#events{position:absolute;right:24px;top:158px;width:214px;display:flex;flex-direction:column;gap:5px}
.ev{padding:5px 9px;border-radius:6px;background:rgba(17,17,27,.78);border-left:2px solid var(--s2);
  font-size:10.5px;color:var(--sub0);letter-spacing:.04em;
  animation:evin .35s cubic-bezier(.2,.9,.3,1)}
.ev.goal{border-left-color:var(--green);color:var(--green)}
.ev.card{border-left-color:var(--yellow);color:var(--yellow)}
.ev.red{border-left-color:var(--red);color:var(--red)}
.ev.sub{border-left-color:var(--blue)}
@keyframes evin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

#flash{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;background:#fff;

/** Frame-rate independent exponential approach. `rate` = 1/e-folds per second. */

/** Move `a` toward `b` by at most `max`. */

/** Shortest signed difference between two angles, in (−π, π]. */
function angDelta(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

function distToSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const len = dx * dx + dz * dz;
  const t = len ? clamp01(((px - ax) * dx + (pz - az) * dz) / len) : 0;
  return Math.hypot(px - (ax + dx * t), pz - (az + dz * t));

/** Deterministic 32-bit PRNG. Same seed → same league, squad and draft. */
function makeRng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  const r = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  r.range = (a, b) => a + r() * (b - a);
  r.pick = (arr) => arr[Math.floor(r() * arr.length) % arr.length];
  r.chance = (p) => r() < p;
  r.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  /* Approximately normal, clamped to ±3σ by construction. */
  r.gauss = (mu, sd) => {
    const u = (r() + r() + r() + r() + r() + r() - 3) / 1.732;
    return mu + u * sd;
  };
  r.seed = (n) => { s = n >>> 0; };
  return r;
}

/** el('div.panel.tight', {id:'x'}, child, 'text') */
function el(spec, attrs, ...kids) {
  const [tagAndId, ...classes] = String(spec).split('.');
  const [tag, id] = tagAndId.split('#');
  const node = document.createElement(tag || 'div');
  if (id) node.id = id;
  if (classes.length) node.className = classes.join(' ');
  if (attrs && typeof attrs === 'object' && !(attrs instanceof Node)) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'html') node.innerHTML = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
  } else if (attrs !== undefined && attrs !== null) {
    kids.unshift(attrs);
  }
  for (const k of kids.flat(4)) {
    if (k === null || k === undefined || k === false) continue;
    node.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));

}

  const free = [];

    get() { return free.length ? free.pop() : make(); },

  constructor(n) { this.n = n; this.buf = new Array(n); this.i = 0; this.len = 0; }

/* Stadium name grammar. */
const STADIUM_A = ['Ironworks', 'Northgate', 'Silverbank', 'Old Quarry', 'Kingsmere', 'The Hollow', 'Sunspire', 'Grand Meridian', 'Copperfield', 'Riverlight', 'Stormhaven', 'The Foundry', 'Lantern Park', 'Windmarch', 'Bellhouse'];
const STADIUM_B = ['Arena', 'Park', 'Stadium', 'Ground', 'Field', 'Bowl', 'Dome', 'Coliseum'];

/* Commentary vocabulary lives with the commentary module, but nicknames and
   crowd chant seeds are shared, so they sit here. */
const NICKNAMES = ['the Ironsides', 'the Kestrels', 'the Quarrymen', 'the Lanterns', 'the Foxes of the Vale', 'the Blue Wave', 'the Anvils', 'the Sunhawks', 'the Mariners', 'the Wolves of the North', 'the Colliers', 'the Stormcrows', 'the Vinelanders', 'the Steelmen', 'the Riverkings'];

/* --------------------------------------------------------------- helpers -- */
function personName(rng, regionId) {
  const s = SYL[regionId] || SYL.alb;
  const first = rng.pick(s.a) + rng.pick(s.b);
  const last = rng.pick(s.c) + rng.pick(s.d);
  return { first, last, full: first + ' ' + last, short: first[0] + '. ' + last };
}

function clubName(rng, regionId, usedNames) {
  const places = PLACES[regionId] || PLACES.alb;
  const sfx = CLUB_SUFFIX[regionId] || CLUB_SUFFIX.alb;
  for (let attempt = 0; attempt < 60; attempt++) {
    const place = rng.pick(places);
    const suffix = rng.pick(sfx);
    const prefix = rng.chance(0.22) ? rng.pick(CLUB_PREFIX) : '';
    const name = (prefix + place + ' ' + suffix).trim();
    if (!usedNames || !usedNames.has(name)) { if (usedNames) usedNames.add(name); return { name, place }; }
  }
  return { name: rng.pick(places) + ' ' + rng.int(1, 99), place: rng.pick(places) };
}

/** Three-letter tag used on the scoreboard: "Ravenscarr Rovers" → "RAV". */
function abbrev(name, used) {
  const words = name.replace(/[^A-Za-z ]/g, '').split(/\s+/).filter(Boolean);
  const cands = [];
  if (words.length >= 2) cands.push((words[0][0] + words[1][0] + (words[1][1] || words[0][1] || 'X')).toUpperCase());
  const w = words[words.length > 1 && words[0].length <= 4 ? 1 : 0] || 'CLB';
  cands.push(w.slice(0, 3).toUpperCase());
  if (words.length >= 2) cands.push((words[0].slice(0, 2) + words[1][0]).toUpperCase());
  for (const c of cands) if (c.length === 3 && (!used || !used.has(c))) { if (used) used.add(c); return c; }
  let base = (words[0] || 'CLB').slice(0, 2).toUpperCase();
  for (let i = 0; i < 26; i++) {
    const c = base + String.fromCharCode(65 + i);
    if (!used || !used.has(c)) { if (used) used.add(c); return c; }
  }
  return 'CLB';
}

function stadiumName(rng) {
  return rng.pick(STADIUM_A) + ' ' + rng.pick(STADIUM_B);
}

/* Procedural generation of the football world: players, squads, clubs, kits,
   badges, divisions, fixtures and cups. Everything is driven by a single seed
   so a career can be regenerated exactly. */

const ROLES = {
  GK: { pos: 'GK', label: 'Goalkeeper' },
  CB: { pos: 'DEF', label: 'Centre Back' },
  FB: { pos: 'DEF', label: 'Full Back' },
  DM: { pos: 'MID', label: 'Holding Mid' },
  CM: { pos: 'MID', label: 'Central Mid' },
  WM: { pos: 'MID', label: 'Wide Mid' },
  AM: { pos: 'MID', label: 'Attacking Mid' },
  WG: { pos: 'ATT', label: 'Winger' },
  ST: { pos: 'ATT', label: 'Striker' },
};
const ROLE_KEYS = Object.keys(ROLES);

const OVR_W = {
  GK: { div: 0.21, han: 0.21, kic: 0.05, ref: 0.21, spd: 0.11, pos: 0.21 },
  CB: { def: 0.40, phy: 0.26, pas: 0.12, pac: 0.12, dri: 0.05, sho: 0.05 },
  FB: { def: 0.28, pac: 0.24, phy: 0.16, pas: 0.16, dri: 0.12, sho: 0.04 },
  DM: { def: 0.28, pas: 0.26, phy: 0.20, dri: 0.12, pac: 0.08, sho: 0.06 },
  CM: { pas: 0.30, dri: 0.22, def: 0.16, sho: 0.14, phy: 0.10, pac: 0.08 },
  WM: { pac: 0.26, dri: 0.28, pas: 0.18, sho: 0.16, phy: 0.06, def: 0.06 },
  AM: { pas: 0.28, dri: 0.28, sho: 0.22, pac: 0.12, phy: 0.05, def: 0.05 },
  WG: { pac: 0.28, dri: 0.30, sho: 0.18, pas: 0.14, phy: 0.05, def: 0.05 },
  ST: { sho: 0.34, pac: 0.22, dri: 0.18, phy: 0.14, pas: 0.08, def: 0.04 },
};

/* Attribute means for each role, before quality and region are applied.
   Outfield: pac sho pas dri def phy — goalkeepers use their own six. */
const ROLE_BASE = {
  GK: { div: 70, han: 70, kic: 58, ref: 72, spd: 46, pos: 68, pac: 45, sho: 22, pas: 46, dri: 30, def: 24, phy: 62 },
  CB: { pac: 58, sho: 38, pas: 55, dri: 46, def: 76, phy: 76 },
  FB: { pac: 76, sho: 44, pas: 64, dri: 63, def: 68, phy: 64 },
  DM: { pac: 60, sho: 50, pas: 71, dri: 62, def: 72, phy: 72 },
  CM: { pac: 65, sho: 62, pas: 74, dri: 71, def: 60, phy: 66 },
  WM: { pac: 78, sho: 62, pas: 70, dri: 75, def: 52, phy: 58 },
  AM: { pac: 70, sho: 71, pas: 76, dri: 79, def: 40, phy: 56 },
  WG: { pac: 84, sho: 68, pas: 66, dri: 82, def: 36, phy: 54 },
  ST: { pac: 76, sho: 80, pas: 58, dri: 71, def: 30, phy: 70 },
};

const TRAITS = [
  { id: 'finesse', n: 'Finesse Shot', d: 'Curls shots harder toward the far post.' },
  { id: 'cannon', n: 'Long Shot Cannon', d: 'Extra power from outside the area.' },
  { id: 'engine', n: 'Engine', d: 'Barely loses pace as the match wears on.' },
  { id: 'poacher', n: 'Poacher', d: 'Times runs into the box exceptionally well.' },
  { id: 'playmaker', n: 'Playmaker', d: 'Finds the harder pass and finds it early.' },
  { id: 'wall', n: 'Brick Wall', d: 'Wins far more than a fair share of shoulder duels.' },
  { id: 'flair', n: 'Flair', d: 'Skill moves come off more often.' },
  { id: 'sweeper', n: 'Sweeper Keeper', d: 'Aggressive off the line.' },
  { id: 'setpiece', n: 'Dead Ball Specialist', d: 'Free kicks and penalties are lethal.' },
  { id: 'leader', n: 'Leader', d: 'Lifts the players around them.' },
];

const RARITY = [
  { id: 'common', n: 'COMMON', c1: '#585b70', c2: '#1e1e2e', min: 0, w: 54 },
  { id: 'rare', n: 'RARE', c1: '#74c7ec', c2: '#181d33', min: 68, w: 28 },
  { id: 'elite', n: 'ELITE', c1: '#cba6f7', c2: '#251c3d', min: 76, w: 13 },
  { id: 'icon', n: 'LEGEND', c1: '#f9e2af', c2: '#3a2c14', min: 84, w: 5 },
];
function rarityFor(ovr) {
  let r = RARITY[0];
  for (const x of RARITY) if (ovr >= x.min) r = x;
  return r;
}

let _uid = 1;
const nextId = () => _uid++;

/* ---------------------------------------------------------------- player -- */
function computeOvr(p) {
  const w = OVR_W[p.role];
  let s = 0;
  for (const k in w) s += (p.att[k] || 0) * w[k];
  return Math.round(clamp(s, 24, 99));
}

function playerValue(p) {
  const o = p.ovr;
  /* Value rises steeply with rating and is discounted for age past the peak. */
  const base = Math.pow(Math.max(1, o - 42), 3.05) * 32;
  const ageF = p.age <= 21 ? 1.5 : p.age <= 25 ? 1.28 : p.age <= 28 ? 1.0
    : p.age <= 31 ? 0.66 : p.age <= 34 ? 0.35 : 0.14;
  const potF = 1 + Math.max(0, p.pot - o) * 0.035;
  return Math.round((base * ageF * potF) / 5000) * 5000;
}
function playerWage(p) {
  return Math.round((Math.pow(Math.max(1, p.ovr - 40), 2.4) * 6 + 400) / 100) * 100;
}

function genPlayer(rng, opt) {
  opt = opt || {};
  const role = opt.role || rng.pick(ROLE_KEYS);
  const natIdx = opt.nat !== undefined ? opt.nat : rng.int(0, NATIONS.length - 1);
  const nat = NATIONS[natIdx];
  const nm = personName(rng, nat.r);
  const quality = opt.quality !== undefined ? opt.quality : 0.5;   // 0 … 1
  const age = opt.age !== undefined ? opt.age : Math.round(clamp(rng.gauss(25.5, 4.4), 16, 38));

  /* Quality shifts every attribute; region bias tilts the profile. */
  const shift = (quality - 0.5) * 34;
  const bias = (REGIONS.find((r) => r.id === nat.r) || REGIONS[0]).bias;
  const base = ROLE_BASE[role];
  const att = {};
  const keys = role === 'GK'
    ? ['div', 'han', 'kic', 'ref', 'spd', 'pos', 'pac', 'sho', 'pas', 'dri', 'def', 'phy']
    : ['pac', 'sho', 'pas', 'dri', 'def', 'phy'];
  for (const k of keys) {
    const b = base[k] !== undefined ? base[k] : 45;
    att[k] = Math.round(clamp(b + shift + (bias[k] || 0) + rng.gauss(0, 6.5), 18, 99));
  }
  /* Young players are physically unfinished; veterans lose their legs first. */
  if (age < 21) { att.phy = Math.round(att.phy * 0.9); if (att.def) att.def = Math.round(att.def * 0.94); }
  if (age > 31) { att.pac = Math.round(att.pac * (1 - (age - 31) * 0.035)); }

  const p = {
    id: nextId(), role, pos: ROLES[role].pos,
    first: nm.first, last: nm.last, name: nm.full, short: nm.short,
    nat: natIdx, natCode: nat.c, natName: nat.n, region: nat.r,
    age, height: Math.round(clamp(rng.gauss(role === 'GK' ? 190 : 180, 6.5), 165, 202)),
    build: clamp(rng.gauss(0.5, 0.2), 0.05, 0.95),
    skin: rng.int(0, 5), hair: rng.int(0, 6), hairCol: rng.int(0, 5),
    foot: rng.chance(0.24) ? 'L' : 'R',
    att, num: 0, traits: [],
  };
  p.ovr = computeOvr(p);
  const room = age <= 19 ? rng.int(6, 18) : age <= 23 ? rng.int(3, 12) : age <= 27 ? rng.int(0, 5) : 0;
  p.pot = clamp(p.ovr + room, p.ovr, 96);
  p.value = playerValue(p);
  p.wage = playerWage(p);
  p.form = 0; p.morale = rng.int(55, 85); p.fitness = 100;
  p.apps = 0; p.goals = 0; p.assists = 0; p.yellows = 0; p.reds = 0; p.ratingSum = 0;
  p.rarity = rarityFor(p.ovr).id;

  const nTraits = p.ovr > 82 ? 2 : p.ovr > 72 ? 1 : rng.chance(0.3) ? 1 : 0;
  const bag = TRAITS.filter((t) => (t.id !== 'sweeper') === (role !== 'GK'));
  for (let i = 0; i < nTraits && bag.length; i++) {
    const t = rng.pick(bag);
    if (!p.traits.includes(t.id)) p.traits.push(t.id);
  }
  return p;
}

/** Match-relevant numbers derived once from the attribute block. */
function derive(p) {
  const a = p.att;
  const gk = p.role === 'GK';
  const pac = gk ? a.spd : a.pac;
  return {
    topSpeed: 5.6 + (pac / 99) * 3.4,                 // 5.6 … 9.0 m/s
    sprintSpeed: 6.9 + (pac / 99) * 3.6,
    accel: 15 + (pac / 99) * 13 + (a.phy / 99) * 4,
    agility: 5.2 + ((gk ? 50 : a.dri) / 99) * 5.6,     // rad/s turn rate
    control: 0.66 + ((gk ? 40 : a.dri) / 99) * 0.42,   // dribble touch distance
    firstTouch: 0.35 + ((gk ? a.han : a.dri) / 99) * 0.55,
    passPow: 13 + (a.pas / 99) * 13,
    passAcc: 0.42 + (a.pas / 99) * 0.56,
    shotPow: 19 + ((gk ? a.kic : a.sho) / 99) * 15,
    shotAcc: 0.30 + ((gk ? 20 : a.sho) / 99) * 0.62,
    curve: 0.3 + ((gk ? 20 : (a.dri + a.pas) / 2) / 99) * 0.8,
    tackle: 0.22 + (a.def / 99) * 0.68,
    strength: 0.25 + (a.phy / 99) * 0.72,
    aware: 0.3 + (((gk ? a.pos : a.def) + a.pas) / 198) * 0.7,
    stamina: 0.55 + (a.phy / 99) * 0.45,
    reach: gk ? 1.5 + (a.div / 99) * 1.5 : 0,
    reflex: gk ? 0.10 + (1 - a.ref / 99) * 0.20 : 0,   // reaction delay, seconds
    handling: gk ? 0.35 + (a.han / 99) * 0.6 : 0,
    flair: (p.traits || []).includes('flair') ? 1.25 : 1,
  };
}

/* ------------------------------------------------------------------ club -- */
const KIT_PATTERNS = ['plain', 'stripes', 'hoops', 'sash', 'halves', 'chevron'];
const BADGE_SHAPES = ['shield', 'circle', 'crest', 'diamond', 'banner', 'hex'];
const BADGE_EMBLEMS = ['star', 'bird', 'anchor', 'hammer', 'lion', 'tower', 'wave', 'flame', 'wheel', 'leaf'];

function hsl(h, s, l) {
  return '#' + new THREE.Color().setHSL(((h % 360) + 360) % 360 / 360, s, l).getHexString();
}
function genKit(rng) {
  const h = rng.int(0, 359);
  const scheme = rng.int(0, 3);
  const p = hsl(h, rng.range(0.45, 0.8), rng.range(0.38, 0.6));
  let s;
  if (scheme === 0) s = hsl(h + 180, 0.55, 0.5);
  else if (scheme === 1) s = rng.chance(0.5) ? '#f2f2f7' : '#15151f';
  else if (scheme === 2) s = hsl(h + rng.int(24, 46), 0.6, 0.55);
  else s = hsl(h + 120, 0.5, 0.48);
  const a = hsl(h + rng.int(150, 210), 0.7, 0.66);
  return {
    p, s, a,
    shorts: rng.chance(0.5) ? s : p,
    socks: rng.chance(0.6) ? p : s,
    pattern: rng.pick(KIT_PATTERNS),
    away: { p: s, s: p, a, shorts: p, socks: s, pattern: rng.pick(KIT_PATTERNS) },
    gk: { p: hsl(h + rng.int(80, 280), 0.62, 0.55), s: '#15151f', a: '#f2f2f7', shorts: '#15151f', socks: '#15151f', pattern: 'plain' },
  };
}
function genBadge(rng, kit, abbr) {
  return {
    shape: rng.int(0, BADGE_SHAPES.length - 1),
    emblem: rng.int(0, BADGE_EMBLEMS.length - 1),
    ring: rng.int(0, 2),
    c1: kit.p, c2: kit.s, c3: kit.a,
    abbr,
    star: rng.chance(0.35),
  };
}

function genSquad(rng, quality, natBias) {
  /* A 7-a-side matchday squad plus cover: 3 keepers' worth of depth is
     wasteful, so the shape is 2 GK, 5 DEF, 6 MID, 4 ATT. */
  const plan = ['GK', 'GK', 'CB', 'CB', 'FB', 'FB', 'CB', 'DM', 'CM', 'CM', 'WM', 'WM', 'AM', 'ST', 'ST', 'WG', 'WG'];
  const squad = [];
  for (let i = 0; i < plan.length; i++) {
    const isCore = i < 8;
    const q = clamp(quality + rng.gauss(isCore ? 0.03 : -0.07, 0.075), 0.02, 0.99);
    const nat = rng.chance(0.55) && natBias !== undefined ? natBias : rng.int(0, NATIONS.length - 1);
    squad.push(genPlayer(rng, { role: plan[i], quality: q, nat }));
  }
  squad.sort((a, b) => b.ovr - a.ovr);
  assignNumbers(rng, squad);
  return squad;
}

function assignNumbers(rng, squad) {
  const taken = new Set();
  const gks = squad.filter((p) => p.role === 'GK');
  if (gks[0]) { gks[0].num = 1; taken.add(1); }
  const pref = { CB: [4, 5, 6, 3], FB: [2, 3, 12, 15], DM: [6, 8, 14], CM: [8, 10, 16, 18], WM: [7, 11, 17], AM: [10, 20, 21], WG: [7, 11, 19], ST: [9, 19, 22], GK: [13, 25, 30] };
  for (const p of squad) {
    if (p.num) continue;
    for (const n of pref[p.role] || []) if (!taken.has(n)) { p.num = n; taken.add(n); break; }
    if (!p.num) { let n = 2; while (taken.has(n)) n++; p.num = n; taken.add(n); }
  }
}

function genClub(rng, opt) {
  const region = opt.region || rng.pick(REGIONS).id;
  const cn = clubName(rng, region, opt.usedNames);
  const abbr = abbrev(cn.name, opt.usedAbbr);
  const kit = genKit(rng);
  const quality = opt.quality !== undefined ? opt.quality : 0.5;
  const natBias = NATIONS.findIndex((n) => n.r === region);
  const club = {
    id: nextId(), name: cn.name, abbr, place: cn.place, region,
    nickname: rng.pick(NICKNAMES),
    stadium: stadiumName(rng), capacity: Math.round((12 + quality * 46) * 1000 / 500) * 500,
    kit, badge: genBadge(rng, kit, abbr),
    rep: Math.round(clamp(quality * 100 + rng.gauss(0, 5), 5, 99)),
    budget: Math.round((2e6 + Math.pow(quality, 2.6) * 190e6) / 1e5) * 1e5,
    squad: genSquad(rng, quality, natBias >= 0 ? natBias : undefined),
    formation: '2-3-1', tactics: null, division: opt.division || 0,
    manager: personName(rng, region).full,
    founded: rng.int(1874, 1996),
  };
  club.rating = clubRating(club);
  return club;
}

function clubRating(club) {
  const best = club.squad.slice().sort((a, b) => b.ovr - a.ovr).slice(0, MATCH.TEAM);
  if (!best.length) return 50;
  return best.reduce((s, p) => s + p.ovr, 0) / best.length;
}

/* --------------------------------------------------------------- fixtures - */
/** Circle method double round-robin. Returns rounds of {h, a} club indices. */
function roundRobin(rng, n) {
  const ids = [];
  for (let i = 0; i < n; i++) ids.push(i);
  if (n % 2) ids.push(-1);
  const m = ids.length, rounds = [];
  for (let r = 0; r < m - 1; r++) {
    const games = [];
    for (let i = 0; i < m / 2; i++) {
      const h = ids[i], a = ids[m - 1 - i];
      if (h < 0 || a < 0) continue;
      games.push(r % 2 ? { h: a, a: h } : { h, a });
    }
    rounds.push(games);
    ids.splice(1, 0, ids.pop());
  }
  const second = rounds.map((rd) => rd.map((g) => ({ h: g.a, a: g.h })));
  rng.shuffle(rounds); rng.shuffle(second);
  return rounds.concat(second);
}

/* ----------------------------------------------------------------- world -- */
function genWorld(seed, opts) {
  opts = opts || {};
  const rng = makeRng(seed);
  _uid = 1;
  const usedNames = new Set(), usedAbbr = new Set();
  const divisions = [];
  const clubs = [];
  const perDiv = 12;

  for (let d = 0; d < 2; d++) {
    const list = [];
    for (let i = 0; i < perDiv; i++) {
      /* Top flight is stronger and more top-heavy than the second tier. */
      const t = i / (perDiv - 1);
      const q = d === 0 ? clamp(0.86 - t * 0.30 + rng.gauss(0, 0.035), 0.3, 0.99)
        : clamp(0.60 - t * 0.28 + rng.gauss(0, 0.035), 0.12, 0.8);
      const c = genClub(rng, { quality: q, usedNames, usedAbbr, division: d });
      clubs.push(c); list.push(c.id);
    }
    divisions.push({
      name: LEAGUE_NAMES[d].n, short: LEAGUE_NAMES[d].s, tier: d + 1,
      clubs: list, promote: d === 1 ? 2 : 0, relegate: d === 0 ? 2 : 0,
    });
  }
  return { seed, rng, clubs, divisions, cupName: CUP_NAME };
}

const clubById = (world, id) => world.clubs.find((c) => c.id === id);

/* Free agents / transfer pool for career mode. */
function genTransferPool(rng, n, qualityRange) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(genPlayer(rng, {
      role: rng.pick(ROLE_KEYS),
      quality: rng.range(qualityRange[0], qualityRange[1]),
    }));
  }
  return out.sort((a, b) => b.ovr - a.ovr);
}

//==========================================================================
// 10_audio.js
//==========================================================================
/* Every sound in the game is synthesised at runtime with the Web Audio API —
   crowd beds, whistles, ball strikes, net ripple, rain. Commentary uses the
   browser's own speech synthesis, so no recorded voice is shipped. */

const Audio2 = {
  ctx: null, ready: false, started: false,
  bus: {}, vol: { master: 0.8, crowd: 0.65, sfx: 0.85, voice: 0.75 },
  crowdTarget: 0.32, crowdNow: 0.32,
  _noise: null, _voice: null, _speakAt: 0, muted: false,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();

    const master = ctx.createGain(); master.gain.value = this.vol.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 4;
    comp.attack.value = 0.005; comp.release.value = 0.22;
    comp.connect(master); master.connect(ctx.destination);

    const mk = (v) => { const g = ctx.createGain(); g.gain.value = v; g.connect(comp); return g; };
    this.bus.master = master;
    this.bus.sfx = mk(this.vol.sfx);
    this.bus.crowd = mk(this.vol.crowd);
    this.bus.voice = mk(this.vol.voice);

    /* Two seconds of pink-ish noise, reused by every noise-based voice. */
    const n = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.22;
    }
    this._noise = buf;
    this.ready = true;
    this._buildCrowd();
    this._pickVoice();
  },

  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    if (this.ctx && !this.started) { this.started = true; this._crowd.start(); }
  },

  setVol(k, v) {
    this.vol[k] = v;
    if (!this.ready) return;
    if (k === 'master') this.bus.master.gain.value = v;
    else if (this.bus[k]) this.bus[k].gain.value = v;
  },

  noise(dur, gain, out) {
    const s = this.ctx.createBufferSource();
    s.buffer = this._noise; s.loop = true;
    s.playbackRate.value = 0.7 + Math.random() * 0.6;
    const g = this.ctx.createGain(); g.gain.value = gain === undefined ? 1 : gain;
    s.connect(g); g.connect(out || this.bus.sfx);
    s.start(); if (dur) s.stop(this.ctx.currentTime + dur);
    return { src: s, gain: g };
  },

  /* ------------------------------------------------------------- crowd --- */
  _buildCrowd() {
    const ctx = this.ctx;
    const out = this.bus.crowd;
    const bed = ctx.createGain(); bed.gain.value = 0.0001; bed.connect(out);

    const src = ctx.createBufferSource();
    src.buffer = this._noise; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 620; bp.Q.value = 0.55;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    src.connect(bp); bp.connect(lp); lp.connect(bed);

    /* A second, breathier layer gives the bed some body and movement. */
    const src2 = ctx.createBufferSource();
    src2.buffer = this._noise; src2.loop = true; src2.playbackRate.value = 0.55;
    const bp2 = ctx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = 200; bp2.Q.value = 0.7;
    const g2 = ctx.createGain(); g2.gain.value = 0.7;
    src2.connect(bp2); bp2.connect(g2); g2.connect(bed);

    /* Slow wander so the ambience never sits perfectly still. */
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 130;
    lfo.connect(lfoG); lfoG.connect(bp.frequency);

    this._crowd = {
      bed, bp, lp,
      start: () => { try { src.start(); src2.start(); lfo.start(); } catch (e) { /* already running */ } },
    };
  },

  setCrowd(intensity) { this.crowdTarget = clamp01(intensity); },

  update(dt) {
    if (!this.ready || !this.started) return;
    this.crowdNow = damp(this.crowdNow, this.crowdTarget, 1.6, dt);
    const g = this.muted ? 0 : Math.pow(this.crowdNow, 1.4) * 0.9 + 0.012;
    this._crowd.bed.gain.setTargetAtTime(g, this.ctx.currentTime, 0.25);
    this._crowd.lp.frequency.setTargetAtTime(1400 + this.crowdNow * 4200, this.ctx.currentTime, 0.3);
  },

  /** One-shot crowd reaction. kind: cheer | roar | ooh | groan | boo | applause */
  react(kind, amt) {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const A = amt === undefined ? 1 : amt;
    const g = ctx.createGain(); g.connect(this.bus.crowd);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.6;
    f.connect(g);
    const src = ctx.createBufferSource(); src.buffer = this._noise; src.loop = true;
    src.connect(f);

    const shapes = {
      cheer: { f0: 700, f1: 1500, a: 0.12, d: 1.6, v: 0.55 },
      roar: { f0: 500, f1: 1900, a: 0.06, d: 4.2, v: 1.0 },
      ooh: { f0: 950, f1: 420, a: 0.09, d: 1.1, v: 0.42 },
      groan: { f0: 420, f1: 190, a: 0.16, d: 1.6, v: 0.4 },
      boo: { f0: 260, f1: 160, a: 0.2, d: 2.4, v: 0.5 },
      applause: { f0: 1500, f1: 2400, a: 0.2, d: 2.2, v: 0.3 },
    };
    const s = shapes[kind] || shapes.cheer;
    f.frequency.setValueAtTime(s.f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, s.f1), t + s.d * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, s.v * A), t + s.a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + s.d);
    src.start(t); src.stop(t + s.d + 0.1);
    if (kind === 'roar' || kind === 'cheer') this.setCrowd(Math.min(1, this.crowdTarget + 0.4 * A));
  },

  /* --------------------------------------------------------------- sfx --- */
  whistle(kind) {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const pattern = kind === 'end' ? [0, 0.28, 0.56] : kind === 'foul' ? [0, 0.19] : [0];
    const len = kind === 'end' ? 0.34 : kind === 'foul' ? 0.24 : 0.4;
    for (const off of pattern) {
      const g = ctx.createGain(); g.connect(this.bus.sfx);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.34, t + off + 0.02);
      g.gain.setValueAtTime(0.30, t + off + len * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + len);
      for (const [f, d] of [[2380, 0], [2520, 5], [3700, -9]]) {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.setValueAtTime(f + d, t + off);
        const trill = ctx.createOscillator(); trill.frequency.value = 34;
        const tg = ctx.createGain(); tg.gain.value = 95;
        trill.connect(tg); tg.connect(o.frequency);
        const og = ctx.createGain(); og.gain.value = f > 3000 ? 0.18 : 0.5;
        o.connect(og); og.connect(g);
        o.start(t + off); o.stop(t + off + len + 0.02);
        trill.start(t + off); trill.stop(t + off + len + 0.02);
      }
      const nz = this.noise(len, 0.05, g);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2000;
      nz.gain.disconnect(); nz.gain.connect(hp); hp.connect(g);
    }
  },

  kick(power, kind) {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const p = clamp01(power);
    const g = ctx.createGain(); g.connect(this.bus.sfx);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16 + p * 0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09 + p * 0.1);
    /* Body: a fast downward sine thump. */
    const o = ctx.createOscillator(); o.type = 'sine';
    const f0 = kind === 'header' ? 150 : 210 + p * 130;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.36, t + 0.1);
    const og = ctx.createGain(); og.gain.value = 0.9; o.connect(og); og.connect(g);
    o.start(t); o.stop(t + 0.22);
    /* Snap: a short band of noise on top. */
    const nz = this.noise(0.09, 0.5 + p * 0.5);
    nz.gain.disconnect();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = kind === 'header' ? 900 : 1500 + p * 1600; bp.Q.value = 0.9;
    nz.gain.connect(bp); bp.connect(g);
  },

  post() {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const g = ctx.createGain(); g.connect(this.bus.sfx);
    g.gain.setValueAtTime(0.34, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    /* Inharmonic partials read as "metal". */
    for (const [m, v] of [[1, 0.6], [2.76, 0.4], [5.4, 0.22], [8.9, 0.12]]) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 430 * m * (0.98 + Math.random() * 0.05);
      const og = ctx.createGain(); og.gain.value = v;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.2);
    }
  },

  net() {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const g = ctx.createGain(); g.connect(this.bus.sfx);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    const nz = this.noise(0.5, 1); nz.gain.disconnect();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 1.6;
    nz.gain.connect(bp); bp.connect(g);
  },

  slide() {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const g = ctx.createGain(); g.connect(this.bus.sfx);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    const nz = this.noise(0.6, 1); nz.gain.disconnect();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.5;
    nz.gain.connect(bp); bp.connect(g);
  },

  ui(kind) {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const f = kind === 'back' ? 420 : kind === 'bad' ? 200 : kind === 'big' ? 700 : 620;
    const g = ctx.createGain(); g.connect(this.bus.sfx);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(kind === 'big' ? 0.16 : 0.07, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === 'big' ? 0.4 : 0.13));
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'bad' ? f * 0.6 : f * 1.5, t + 0.1);
    o.connect(g); o.start(t); o.stop(t + 0.45);
  },

  /* Rain / wind bed, toggled by the stadium weather option. */
  weather(kind) {
    if (!this.ready) return;
    if (this._wx) { try { this._wx.src.stop(); } catch (e) { /* stopped */ } this._wx = null; }
    if (kind === 'clear' || !kind) return;
    const ctx = this.ctx;
    const g = ctx.createGain(); g.gain.value = kind === 'rain' ? 0.10 : 0.06; g.connect(this.bus.crowd);
    const f = ctx.createBiquadFilter();
    f.type = kind === 'rain' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'rain' ? 1800 : 450;
    const src = ctx.createBufferSource(); src.buffer = this._noise; src.loop = true;
    src.connect(f); f.connect(g); src.start();
    this._wx = { src, gain: g };
  },

  /* --------------------------------------------------------- commentary -- */
  _pickVoice() {
    if (!window.speechSynthesis) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      this._voice = vs.find((v) => /en-GB/i.test(v.lang) && /male|daniel|george|arthur/i.test(v.name))
        || vs.find((v) => /en-GB/i.test(v.lang))
        || vs.find((v) => /^en/i.test(v.lang)) || vs[0];
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  },

  say(text, urgency) {
    if (!window.speechSynthesis || this.muted || !SETTINGS.commentaryVoice) return;
    const now = performance.now();
    /* Never talk over the previous line unless the moment is urgent. */
    if (now < this._speakAt && !(urgency > 1)) return;
    if (urgency > 1) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (this._voice) u.voice = this._voice;
    u.rate = 1.02 + (urgency || 0) * 0.14;
    u.pitch = 0.86 + (urgency || 0) * 0.16;
    u.volume = clamp01(this.vol.voice);
    try { speechSynthesis.speak(u); } catch (e) { return; }
    this._speakAt = now + Math.min(4200, 320 + text.length * 62);
  },

  stopVoice() { if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* noop */ } },
};

/* Settings + input. Two local players, each of which can be driven by the
   keyboard or by a gamepad, which is what makes split-screen possible. */

const SETTINGS_KEY = 'matchday.settings.v1';
const SETTINGS = Object.assign({
  difficulty: 1,            // 0 amateur · 1 semi-pro · 2 professional · 3 world class
  halfMinutes: 3,           // real minutes per half
  camera: 'broadcast',      // broadcast | tele | dynamic | player | top
  commentaryVoice: true,
  commentaryText: true,
  replays: true,
  radar: true,
  autoSwitch: true,
  passAssist: 0.72,         // 0 = manual, 1 = fully assisted
  shootAssist: 0.55,
  shadows: true,
  quality: 'high',          // low | med | high
  crowd: true,
  weather: 'clear',         // clear | rain | snow
  timeOfDay: 'day',         // day | dusk | night
  pitchPattern: 'stripes',  // stripes | rings | checks | plain
  standStyle: 'modern',     // modern | classic | compact
  volMaster: 0.8, volCrowd: 0.6, volSfx: 0.85, volVoice: 0.75,
  p1Device: 'kb', p2Device: 'pad0',
  invertSwitch: false,
}, (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch (e) { return {}; } })());

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); } catch (e) { /* private mode */ }
  Audio2.setVol('master', SETTINGS.volMaster);
  Audio2.setVol('crowd', SETTINGS.volCrowd);
  Audio2.setVol('sfx', SETTINGS.volSfx);
  Audio2.setVol('voice', SETTINGS.volVoice);
}

/* Action names shared by both control devices. */
const ACTIONS = ['pass', 'through', 'lob', 'shoot', 'sprint', 'skill', 'switch', 'slide'];

const KEYMAP = [
  { /* player 1 */
    up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'],
    sprint: ['ShiftLeft'], pass: ['KeyJ'], through: ['KeyK'], lob: ['KeyL'],
    shoot: ['Space'], skill: ['KeyE'], switch: ['KeyQ'], slide: ['KeyK'],
  },
  { /* player 2 */
    up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
    sprint: ['ShiftRight'], pass: ['Numpad1', 'Comma'], through: ['Numpad2', 'Period'],
    lob: ['Numpad3', 'Slash'], shoot: ['Numpad0', 'ControlRight'], skill: ['Numpad5'],
    switch: ['NumpadDecimal', 'Semicolon'], slide: ['Numpad2', 'Period'],
  },
];

/* Standard-gamepad layout. Triggers are read as buttons 6/7 as well as axes. */
const PADMAP = {
  pass: [0], through: [3], lob: [2], shoot: [1], slide: [3],
  sprint: [7, 5], skill: [6, 4], switch: [4], pause: [9],
};

function mkState() {
  const s = { mx: 0, mz: 0, mag: 0, aimX: 0, aimZ: 0, any: false };
  for (const a of ACTIONS) s[a] = { down: false, up: false, held: false, t: 0, hold: 0 };
  return s;
}

const Input = {
  keys: new Set(),
  pressed: new Set(),
  released: new Set(),
  states: [mkState(), mkState()],
  pads: [null, null],
  lastKind: 'kb',

  attach() {
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      this.keys.add(e.code); this.pressed.add(e.code); this.lastKind = 'kb';
      Audio2.resume();
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
      if (this.onKey) this.onKey(e);
    });
    window.addEventListener('keyup', (e) => { this.keys.delete(e.code); this.released.add(e.code); });
    window.addEventListener('blur', () => { this.keys.clear(); });
    window.addEventListener('pointerdown', () => Audio2.resume());
    window.addEventListener('gamepadconnected', (e) => toast(`Controller ${e.gamepad.index + 1} connected`, 'good'));
  },

  down(code) { return this.keys.has(code); },
  hit(code) { return this.pressed.has(code); },

  padFor(idx) {
    const list = navigator.getGamepads ? navigator.getGamepads() : [];
    return list && list[idx] ? list[idx] : null;
  },

  /** Which device drives local player `i` — honours the settings, falls back
      to the keyboard when the requested pad is not plugged in. */
  deviceFor(i) {
    const want = i === 0 ? SETTINGS.p1Device : SETTINGS.p2Device;
    if (want && want.startsWith('pad')) {
      const idx = parseInt(want.slice(3), 10) || 0;
      if (this.padFor(idx)) return { kind: 'pad', idx };
    }
    return { kind: 'kb', idx: i };
  },

  poll(dt, numLocal) {
    for (let i = 0; i < 2; i++) {
      const s = this.states[i];
      if (i >= (numLocal || 1)) { this._zero(s, dt); continue; }
      const dev = this.deviceFor(i);
      let mx = 0, mz = 0;
      const raw = {};
      if (dev.kind === 'pad') {
        const p = this.padFor(dev.idx);
        if (p) {
          const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
          const dz = 0.22;
          const mag = Math.hypot(ax, ay);
          if (mag > dz) { const k = (mag - dz) / (1 - dz) / mag; mx = ax * k; mz = ay * k; }
          if (p.buttons[12] && p.buttons[12].pressed) mz = -1;
          if (p.buttons[13] && p.buttons[13].pressed) mz = 1;
          if (p.buttons[14] && p.buttons[14].pressed) mx = -1;
          if (p.buttons[15] && p.buttons[15].pressed) mx = 1;
          for (const a of ACTIONS) {
            raw[a] = (PADMAP[a] || []).some((b) => {
              const btn = p.buttons[b];
              return btn && (btn.pressed || btn.value > 0.42);
            });
          }
        } else { for (const a of ACTIONS) raw[a] = false; }
      } else {
        const km = KEYMAP[dev.idx] || KEYMAP[0];
        if (km.up.some((k) => this.keys.has(k))) mz -= 1;
        if (km.down.some((k) => this.keys.has(k))) mz += 1;
        if (km.left.some((k) => this.keys.has(k))) mx -= 1;
        if (km.right.some((k) => this.keys.has(k))) mx += 1;
        const m = Math.hypot(mx, mz); if (m > 1) { mx /= m; mz /= m; }
        for (const a of ACTIONS) raw[a] = (km[a] || []).some((k) => this.keys.has(k));
      }

      s.mx = mx; s.mz = mz; s.mag = clamp01(Math.hypot(mx, mz));
      if (s.mag > 0.15) { s.aimX = mx / s.mag; s.aimZ = mz / s.mag; }
      s.any = s.mag > 0.15;
      for (const a of ACTIONS) {
        const b = s[a], now = !!raw[a];
        b.down = now && !b.held;
        b.up = !now && b.held;
        b.hold = b.held ? b.t : b.hold;
        b.t = now ? b.t + dt : 0;
        b.held = now;
      }
    }
    this.pressed.clear(); this.released.clear();
  },

  _zero(s, dt) {
    s.mx = s.mz = s.mag = 0; s.any = false;
    for (const a of ACTIONS) {
      const b = s[a];
      b.down = false; b.up = b.held; b.hold = b.held ? b.t : b.hold; b.held = false; b.t = 0;
    }
  },

  padPause() {
    for (let i = 0; i < 2; i++) {
      const p = this.padFor(i);
      if (!p) continue;
      const b = p.buttons[9];
      const was = this._pauseWas || (this._pauseWas = [false, false]);
      const now = !!(b && b.pressed);
      if (now && !was[i]) { was[i] = now; return true; }
      was[i] = now;
    }
    return false;
  },
};

/* Human-readable control reference, used by the HUD and the settings screen. */
const CONTROL_HELP = [
  ['Move', 'W A S D', '← ↑ → ↓'],
  ['Sprint', 'Shift', 'R-Shift'],
  ['Pass / Press', 'J', 'Num 1'],
  ['Through ball', 'K', 'Num 2'],
  ['Lob / Cross', 'L', 'Num 3'],
  ['Shoot (hold)', 'Space', 'Num 0'],
  ['Skill move', 'E + dir', 'Num 5'],
  ['Switch player', 'Q', 'Num .'],
  ['Slide tackle', 'K', 'Num 2'],
  ['Camera', 'C', ''],
  ['Pause', 'Esc', ''],
];

/* Canvas-drawn textures. Nothing is loaded from disk: kits, badges, crowds,
   advertising boards and the mown grass are all painted at runtime. */

let MAX_ANISO = 8;

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function mkTex(canvas, repeatX, repeatY) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  if (repeatX || repeatY) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX || 1, repeatY || 1);
  }
  return t;
}

/* -------------------------------------------------------------- badges --- */
function drawBadge(ctx, b, S) {
  const c1 = b.c1, c2 = b.c2, c3 = b.c3;
  ctx.clearRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2, r = S * 0.44;

  /* outline shape */
  ctx.save();
  ctx.beginPath();
  const shape = BADGE_SHAPES[b.shape % BADGE_SHAPES.length];
  if (shape === 'shield') {
    ctx.moveTo(cx - r, cy - r * 1.02);
    ctx.lineTo(cx + r, cy - r * 1.02);
    ctx.lineTo(cx + r, cy + r * 0.18);
    ctx.quadraticCurveTo(cx + r * 0.92, cy + r * 0.92, cx, cy + r * 1.12);
    ctx.quadraticCurveTo(cx - r * 0.92, cy + r * 0.92, cx - r, cy + r * 0.18);
    ctx.closePath();
  } else if (shape === 'circle') {
    ctx.arc(cx, cy, r, 0, TAU);
  } else if (shape === 'crest') {
    ctx.moveTo(cx, cy - r * 1.1);
    ctx.quadraticCurveTo(cx + r * 1.05, cy - r * 0.85, cx + r * 0.86, cy + r * 0.2);
    ctx.quadraticCurveTo(cx + r * 0.6, cy + r * 1.06, cx, cy + r * 1.14);
    ctx.quadraticCurveTo(cx - r * 0.6, cy + r * 1.06, cx - r * 0.86, cy + r * 0.2);
    ctx.quadraticCurveTo(cx - r * 1.05, cy - r * 0.85, cx, cy - r * 1.1);
    ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(cx, cy - r * 1.12); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r * 1.12); ctx.lineTo(cx - r, cy);
    ctx.closePath();
  } else if (shape === 'banner') {
    ctx.moveTo(cx - r, cy - r * 0.9); ctx.lineTo(cx + r, cy - r * 0.9);
    ctx.lineTo(cx + r, cy + r * 0.55); ctx.lineTo(cx, cy + r * 1.05); ctx.lineTo(cx - r, cy + r * 0.55);
    ctx.closePath();
  } else {
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i / 6) * TAU;
      const x = cx + Math.cos(a) * r * 1.04, y = cy + Math.sin(a) * r * 1.04;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }
  ctx.fillStyle = c1; ctx.fill();
  ctx.clip();

  /* interior treatment */
  if (b.ring === 0) {
    ctx.fillStyle = c2;
    for (let i = -6; i < 8; i++) { ctx.fillRect(cx - r + i * (r / 3.2), 0, r / 6.4, S); }
  } else if (b.ring === 1) {
    ctx.fillStyle = c2; ctx.fillRect(0, cy, S, S);
  } else {
    ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(cx, cy, r * 0.72, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* border */
  ctx.save();
  ctx.lineWidth = S * 0.045; ctx.strokeStyle = c3; ctx.stroke();
  ctx.restore();

  /* emblem */
  ctx.save();
  ctx.translate(cx, cy - S * 0.03);
  ctx.fillStyle = c3;
  ctx.strokeStyle = c3;
  ctx.lineWidth = S * 0.035;
  const e = BADGE_EMBLEMS[b.emblem % BADGE_EMBLEMS.length];
  const u = S * 0.19;
  if (e === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? u * 0.46 : u;
      const a = -Math.PI / 2 + (i / 10) * TAU;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  } else if (e === 'bird') {
    ctx.beginPath();
    ctx.moveTo(-u, -u * 0.2); ctx.quadraticCurveTo(-u * 0.3, -u * 0.95, 0, -u * 0.1);
    ctx.quadraticCurveTo(u * 0.3, -u * 0.95, u, -u * 0.2);
    ctx.quadraticCurveTo(u * 0.35, u * 0.15, 0, u * 0.85);
    ctx.quadraticCurveTo(-u * 0.35, u * 0.15, -u, -u * 0.2);
    ctx.fill();
  } else if (e === 'anchor') {
    ctx.beginPath(); ctx.moveTo(0, -u); ctx.lineTo(0, u * 0.75); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-u * 0.5, -u * 0.5); ctx.lineTo(u * 0.5, -u * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, u * 0.15, u * 0.72, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  } else if (e === 'hammer') {
    ctx.fillRect(-u * 0.12, -u * 0.2, u * 0.24, u * 1.1);
    ctx.fillRect(-u * 0.75, -u * 0.75, u * 1.5, u * 0.5);
  } else if (e === 'lion') {
    ctx.beginPath(); ctx.arc(0, 0, u * 0.62, 0, TAU); ctx.fill();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * u * 0.55, Math.sin(a) * u * 0.55);
      ctx.lineTo(Math.cos(a) * u, Math.sin(a) * u);
      ctx.stroke();
    }
  } else if (e === 'tower') {
    ctx.fillRect(-u * 0.42, -u * 0.5, u * 0.84, u * 1.35);
    for (let i = 0; i < 3; i++) ctx.fillRect(-u * 0.42 + i * u * 0.34, -u * 0.86, u * 0.22, u * 0.4);
  } else if (e === 'wave') {
    ctx.lineWidth = S * 0.045;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(-u, k * u * 0.44);
      ctx.quadraticCurveTo(-u * 0.5, k * u * 0.44 - u * 0.42, 0, k * u * 0.44);
      ctx.quadraticCurveTo(u * 0.5, k * u * 0.44 + u * 0.42, u, k * u * 0.44);
      ctx.stroke();
    }
  } else if (e === 'flame') {
    ctx.beginPath();
    ctx.moveTo(0, -u);
    ctx.quadraticCurveTo(u * 0.78, -u * 0.1, u * 0.34, u * 0.72);
    ctx.quadraticCurveTo(0, u * 1.0, -u * 0.34, u * 0.72);
    ctx.quadraticCurveTo(-u * 0.78, -u * 0.1, 0, -u);
    ctx.fill();
  } else if (e === 'wheel') {
    ctx.beginPath(); ctx.arc(0, 0, u * 0.9, 0, TAU); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * u * 0.9, Math.sin(a) * u * 0.9); ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(0, u); ctx.quadraticCurveTo(-u, u * 0.2, 0, -u);
    ctx.quadraticCurveTo(u, u * 0.2, 0, u); ctx.fill();
  }
  ctx.restore();

  /* initials ribbon */
  ctx.save();
  ctx.font = `800 ${Math.round(S * 0.15)}px JetBrains Mono, monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(17,17,27,.72)';
  ctx.fillRect(cx - S * 0.26, cy + S * 0.19, S * 0.52, S * 0.19);
  ctx.fillStyle = c3;
  ctx.fillText(b.abbr || 'FC', cx, cy + S * 0.29);
  ctx.restore();

  if (b.star) {
    ctx.save();
    ctx.fillStyle = '#f9e2af';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? S * 0.022 : S * 0.05;
      const a = -Math.PI / 2 + (i / 10) * TAU;
      const x = cx + Math.cos(a) * rr, y = cy - S * 0.35 + Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

const _badgeCache = new Map();
function badgeURL(badge, size) {
  const S = size || 96;
  const key = S + '|' + badge.shape + badge.emblem + badge.ring + badge.c1 + badge.c2 + badge.c3 + badge.abbr + badge.star;
  if (_badgeCache.has(key)) return _badgeCache.get(key);
  const c = mkCanvas(S, S);
  drawBadge(c.getContext('2d'), badge, S);
  const url = c.toDataURL('image/png');
  _badgeCache.set(key, url);
  return url;
}
function badgeImg(badge, cls) {
  return el('img.crest' + (cls ? '.' + cls : ''), { src: badgeURL(badge, cls === 'xl' ? 208 : cls === 'lg' ? 128 : 64), alt: '' });
}

/* ---------------------------------------------------------------- kits --- */
/* The torso is a cylinder, so u wraps around the body: u=0 is the chest seam,
   u=0.5 is the middle of the back — which is where the squad number goes. */
function kitTexture(kit, number, badge) {
  const W = 512, H = 256;
  const c = mkCanvas(W, H);
  const g = c.getContext('2d');
  g.fillStyle = kit.p; g.fillRect(0, 0, W, H);

  const pat = kit.pattern || 'plain';
  g.fillStyle = kit.s;
  if (pat === 'stripes') {
    for (let i = 0; i < 12; i++) g.fillRect((i * 2 + 1) * (W / 24), 0, W / 24, H);
  } else if (pat === 'hoops') {
    for (let i = 0; i < 5; i++) g.fillRect(0, (i * 2 + 1) * (H / 10), W, H / 10);
  } else if (pat === 'sash') {
    g.save(); g.beginPath();
    g.moveTo(0, H * 0.15); g.lineTo(W, H * 0.72); g.lineTo(W, H * 0.95); g.lineTo(0, H * 0.38);
    g.closePath(); g.fill(); g.restore();
  } else if (pat === 'halves') {
    g.fillRect(W * 0.25, 0, W * 0.5, H);
  } else if (pat === 'chevron') {
    g.save(); g.beginPath();
    g.moveTo(W * 0.5, H * 0.05); g.lineTo(W, H * 0.45); g.lineTo(W, H * 0.68);
    g.lineTo(W * 0.5, H * 0.28); g.lineTo(0, H * 0.68); g.lineTo(0, H * 0.45);
    g.closePath(); g.fill(); g.restore();
  }

  /* collar */
  g.fillStyle = kit.a; g.fillRect(0, 0, W, H * 0.055);

  /* squad number on the back */
  if (number) {
    g.save();
    g.font = `800 ${Math.round(H * 0.44)}px JetBrains Mono, monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = H * 0.03;
    g.strokeStyle = 'rgba(0,0,0,.35)';
    g.fillStyle = kit.a;
    g.strokeText(String(number), W * 0.5, H * 0.46);
    g.fillText(String(number), W * 0.5, H * 0.46);
    g.restore();
  }

  /* chest badge, just off the front seam so it lands on the wearer's chest */
  if (badge) {
    const S = Math.round(H * 0.3);
    const bc = mkCanvas(S, S);
    drawBadge(bc.getContext('2d'), badge, S);
    g.drawImage(bc, Math.round(W * 0.085), Math.round(H * 0.16), S, S);
    g.drawImage(bc, Math.round(W * 0.085) - W, Math.round(H * 0.16), S, S);
  }
  return mkTex(c);
}

/* --------------------------------------------------------------- grass --- */
function grassTexture(pattern, tint) {
  const W = 1024, H = 704;
  const c = mkCanvas(W, H);
  const g = c.getContext('2d');
  const base = tint || '#2f6b34';
  g.fillStyle = base; g.fillRect(0, 0, W, H);

  const light = 'rgba(255,255,255,.075)';
  const dark = 'rgba(0,0,0,.07)';
  if (pattern === 'stripes') {
    for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? light : dark; g.fillRect(i * (W / 16), 0, W / 16, H); }
  } else if (pattern === 'rings') {
    for (let i = 10; i >= 0; i--) {
      g.fillStyle = i % 2 ? light : dark;
      g.beginPath();
      g.ellipse(W / 2, H / 2, (W / 2) * (i / 10) * 1.25, (H / 2) * (i / 10) * 1.25, 0, 0, TAU);
      g.fill();
    }
  } else if (pattern === 'checks') {
    const n = 12;
    for (let x = 0; x < n; x++) for (let y = 0; y < 8; y++) {
      g.fillStyle = (x + y) % 2 ? light : dark;
      g.fillRect(x * (W / n), y * (H / 8), W / n, H / 8);
    }
  }

  /* fine blade noise + a little wear in the goalmouths */
  const img = g.getImageData(0, 0, W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 20;
    d[i] += n; d[i + 1] += n * 1.15; d[i + 2] += n * 0.7;
  }
  g.putImageData(img, 0, 0);
  g.globalAlpha = 0.10; g.fillStyle = '#7a6a44';
  for (const cx of [W * 0.055, W * 0.945]) {
    g.beginPath(); g.ellipse(cx, H / 2, W * 0.045, H * 0.14, 0, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  return mkTex(c);
}

/* --------------------------------------------------------------- crowd --- */
function crowdTexture(c1, c2) {
  const W = 512, H = 256;
  const c = mkCanvas(W, H);
  const g = c.getContext('2d');
  g.fillStyle = '#14141f'; g.fillRect(0, 0, W, H);
  const cols = [c1, c2, '#cdd6f4', '#45475a', '#1e1e2e', '#a6adc8', c1, c2, '#11111b'];
  const cell = 8;
  for (let y = 0; y < H; y += cell) {
    for (let x = 0; x < W; x += cell) {
      if (Math.random() < 0.10) continue;   // empty seat
      g.fillStyle = cols[(Math.random() * cols.length) | 0];
      g.globalAlpha = 0.55 + Math.random() * 0.45;
      g.fillRect(x + 1, y + 1, cell - 2, cell - 2);
      /* head */
      g.fillStyle = ['#3b2a21', '#5b4034', '#8d6a4f', '#c9a483', '#e8c9a8'][(Math.random() * 5) | 0];
      g.fillRect(x + cell * 0.3, y + 0.5, cell * 0.4, cell * 0.34);
    }
  }
  g.globalAlpha = 1;
  return mkTex(c);
}

const SPONSORS = ['NOVACORE', 'KESTREL AIR', 'IRONBREW', 'VOLTA', 'MERIDIAN BANK', 'ZEPHYR', 'ORBIS', 'HALCYON', 'TITANFIBRE', 'AURORA TEL', 'STONEBRIDGE', 'PULSE ENERGY', 'CINDERWORKS', 'ARCLIGHT'];
function adTexture(rng) {
  const W = 2048, H = 128;
  const c = mkCanvas(W, H);
  const g = c.getContext('2d');
  const cols = ['#1e1e2e', '#313244', '#11111b', '#181825'];
  const fg = ['#89b4fa', '#a6e3a1', '#f9e2af', '#f38ba8', '#cba6f7', '#94e2d5', '#fab387'];
  const n = 8;
  for (let i = 0; i < n; i++) {
    const x = i * (W / n);
    g.fillStyle = cols[i % cols.length];
    g.fillRect(x, 0, W / n, H);
    g.fillStyle = fg[(rng ? rng.int(0, fg.length - 1) : i) % fg.length];
    g.font = `700 ${Math.round(H * 0.42)}px JetBrains Mono, monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(SPONSORS[(i * 3 + (rng ? rng.int(0, 13) : 0)) % SPONSORS.length], x + W / n / 2, H * 0.54);
    g.strokeStyle = 'rgba(205,214,244,.12)'; g.lineWidth = 3;
    g.strokeRect(x + 2, 2, W / n - 4, H - 4);
  }
  return mkTex(c);
}

/* Soft radial blob used for the player selector ring and the ball shadow. */
function blobTexture(color, hard) {
  const S = 128;
  const c = mkCanvas(S, S);
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0, color);
  grd.addColorStop(hard ? 0.72 : 0.2, color);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  return mkTex(c);
}

/* Net: a transparent canvas with a fine mesh, used with alphaTest. */
function netTexture(sx, sy) {
  const S = 128;
  const c = mkCanvas(S, S);
  const g = c.getContext('2d');
  g.clearRect(0, 0, S, S);
  g.strokeStyle = 'rgba(230,235,245,.92)';
  g.lineWidth = 2.2;
  const n = 10;
  for (let i = 0; i <= n; i++) {
    const p = (i / n) * S;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, S); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(S, p); g.stroke();
  }
  const t = mkTex(c, sx || 1, sy || 1);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// 20_world.js
//==========================================================================
/* The stadium: pitch surface, painted markings, goals and nets, ad boards,
   raked stands with a living crowd, floodlights, sky and weather. */

/** Accumulates flat quads on the XZ plane into one buffer geometry. */
class LineBuilder {
  constructor(y) { this.y = y; this.pos = []; this.idx = []; this.n = 0; }
  quad(ax, az, bx, bz, cx, cz, dx, dz) {
    const y = this.y, p = this.pos, i = this.n;
    p.push(ax, y, az, bx, y, bz, cx, y, cz, dx, y, dz);
    this.idx.push(i, i + 1, i + 2, i, i + 2, i + 3);
    this.n += 4;
  }
  seg(x1, z1, x2, z2, w) {
    const dx = x2 - x1, dz = z2 - z1;
    const l = Math.hypot(dx, dz) || 1;
    const nx = (-dz / l) * w * 0.5, nz = (dx / l) * w * 0.5;
    this.quad(x1 + nx, z1 + nz, x2 + nx, z2 + nz, x2 - nx, z2 - nz, x1 - nx, z1 - nz);
  }
  rect(x1, z1, x2, z2, w) {
    this.seg(x1, z1, x2, z1, w); this.seg(x2, z1, x2, z2, w);
    this.seg(x2, z2, x1, z2, w); this.seg(x1, z2, x1, z1, w);
  }
  arc(cx, cz, r, a0, a1, w, steps) {
    const n = steps || Math.max(6, Math.ceil(Math.abs(a1 - a0) * 14));
    let px = cx + Math.cos(a0) * r, pz = cz + Math.sin(a0) * r;
    for (let i = 1; i <= n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      this.seg(px, pz, x, z, w); px = x; pz = z;
    }
  }
  disc(cx, cz, r) {
    const n = 18;
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * TAU, a1 = ((i + 1) / n) * TAU;
      this.quad(cx, cz, cx + Math.cos(a0) * r, cz + Math.sin(a0) * r,
        cx + Math.cos(a1) * r, cz + Math.sin(a1) * r, cx, cz);
    }
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setIndex(this.idx);
    g.computeVertexNormals();
    return g;
  }
}

const SKY_VS = `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const SKY_FS = `
uniform vec3 top; uniform vec3 bot; uniform vec3 hz; varying vec3 vDir;
void main(){
  float h = clamp(vDir.y*0.5+0.5, 0.0, 1.0);
  vec3 c = mix(hz, top, smoothstep(0.5, 1.0, h));
  c = mix(bot, c, smoothstep(0.30, 0.52, h));
  gl_FragColor = vec4(c, 1.0);
}`;

const TIME_PRESETS = {
  day: { top: 0x2f6ec4, hz: 0x9ec6e8, bot: 0x2a3244, sun: 0xfff4e0, sunI: 2.6, hemiI: 1.05, amb: 0x33405c, fog: 0x9ec6e8, fogD: 0.0018, flood: 0.0 },
  dusk: { top: 0x2a2a55, hz: 0xe8a06a, bot: 0x201c2c, sun: 0xffc08a, sunI: 1.5, hemiI: 0.62, amb: 0x3a3050, fog: 0xb8845f, fogD: 0.0026, flood: 0.55 },
  night: { top: 0x080b1a, hz: 0x141a34, bot: 0x0a0a12, sun: 0xaebbe0, sunI: 0.28, hemiI: 0.30, amb: 0x1d2138, fog: 0x0f1224, fogD: 0.0032, flood: 1.0 },
};

class Stadium {
  constructor(scene, renderer) {
    this.scene = scene;
    this.renderer = renderer;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.crowdMeshes = [];
    this.floods = [];
    this.rng = makeRng(20240816);
    this.t = 0;
  }

  build(opts) {
    opts = opts || {};
    const homeKit = opts.homeKit || { p: '#89b4fa', s: '#cdd6f4' };
    const awayKit = opts.awayKit || { p: '#f38ba8', s: '#11111b' };
    clear3(this.group);
    this.crowdMeshes.length = 0; this.floods.length = 0;

    this._sky();
    this._lights();
    this._pitch(opts.pattern || SETTINGS.pitchPattern);
    this._markings();
    this._goals();
    this._surrounds(homeKit, awayKit);
    this._stands(homeKit, awayKit);
    this._floodlights();
    this.setTime(opts.time || SETTINGS.timeOfDay);
    this.setWeather(opts.weather || SETTINGS.weather);
    return this;
  }

  /* ------------------------------------------------------------- sky ----- */
  _sky() {
    const geo = new THREE.SphereGeometry(600, 24, 16);
    this.skyMat = new THREE.ShaderMaterial({
      uniforms: {
        top: { value: new THREE.Color(0x2f6ec4) },
        hz: { value: new THREE.Color(0x9ec6e8) },
        bot: { value: new THREE.Color(0x2a3244) },
      },
      vertexShader: SKY_VS, fragmentShader: SKY_FS, side: THREE.BackSide, depthWrite: false, fog: false,
    });
    this.sky = new THREE.Mesh(geo, this.skyMat);
    this.sky.renderOrder = -1000;
    this.group.add(this.sky);
  }

  _lights() {
    this.hemi = new THREE.HemisphereLight(0xbcd8ff, 0x2c4a2c, 1.0);
    this.group.add(this.hemi);
    this.amb = new THREE.AmbientLight(0x33405c, 0.6);
    this.group.add(this.amb);

    this.sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
    this.sun.position.set(-52, 78, 40);
    this.sun.castShadow = true;
    const d = 52;
    this.sun.shadow.camera.left = -d; this.sun.shadow.camera.right = d;
    this.sun.shadow.camera.top = d; this.sun.shadow.camera.bottom = -d;
    this.sun.shadow.camera.near = 20; this.sun.shadow.camera.far = 220;
    const smap = SETTINGS.quality === 'low' ? 1024 : SETTINGS.quality === 'med' ? 2048 : 3072;
    this.sun.shadow.mapSize.set(smap, smap);
    this.sun.shadow.bias = -0.0007;
    this.sun.shadow.normalBias = 0.035;
    this.group.add(this.sun);
    this.group.add(this.sun.target);
  }

  /* ----------------------------------------------------------- surface --- */
  _pitch(pattern) {
    const W = (P.HALF_L + P.RUNOFF) * 2, H = (P.HALF_W + P.RUNOFF) * 2;
    const tex = grassTexture(pattern, '#2f6b34');
    const geo = new THREE.PlaneGeometry(W, H, 1, 1);
    const mat = new THREE.MeshLambertMaterial({ map: tex });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.receiveShadow = true;
    this.group.add(m);
    this.pitchMesh = m;

    /* a darker apron so the pitch doesn't float in the void */
    const apron = new THREE.Mesh(
      new THREE.PlaneGeometry(W + 90, H + 90),
      new THREE.MeshLambertMaterial({ color: 0x1a2b1c })
    );
    apron.rotation.x = -Math.PI / 2; apron.position.y = -0.05;
    this.group.add(apron);
  }

  _markings() {
    const L = new LineBuilder(0.015);
    const w = P.LINE_W;
    const HL = P.HALF_L, HW = P.HALF_W;
    L.rect(-HL, -HW, HL, HW, w);                               // touch + goal lines
    L.seg(0, -HW, 0, HW, w);                                   // halfway
    L.arc(0, 0, P.CIRCLE_R, 0, TAU, w, 64);                    // centre circle
    L.disc(0, 0, 0.2);                                         // centre spot
    for (const s of [-1, 1]) {
