<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planezzz — sleepy skies, speedy cargo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Planezzz: a chill low-poly cargo pilot game. Fly jobs between airports, grease your landings, upgrade your hangar.">
<meta name="theme-color" content="#1d1b3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1b3a'/%3E%3Cpath d='M10 36l34-14c6-2 11 1 10 5-1 3-5 5-9 6L14 41z' fill='%23fff6e3'/%3E%3Cpath d='M26 32l-6 13 7 1 11-16z' fill='%23ffd66b'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   STYLES — palette: bedtime-indigo glass, cream type, moon-yellow accent
   ========================================================================== */
:root{
  --ink:#1d1b3a; --ink2:#2b2856; --glass:rgba(29,27,58,.74); --glass2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.14); --cream:#fff6e3; --dim:#b9b5d8; --moon:#ffd66b; --mint:#6fe3c1;
  --rose:#ff7b93; --sky:#7cc7ff; --lav:#b79cff;
  --font:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--font);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0}
#gl canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* --- Buttons -------------------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;
  background:var(--glass2);border:1px solid var(--line);font-weight:650;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.btn.primary{background:var(--moon);color:var(--ink);border-color:transparent}
.btn.primary:hover{background:#ffe08a}
.btn.danger{color:var(--rose);border-color:rgba(255,123,147,.45)}
.btn.small{padding:7px 12px;border-radius:10px;font-size:13px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.wide{width:100%}

/* --- Full-screen overlays ------------------------------------------------- */
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(16,14,40,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);touch-action:pan-y}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;max-height:100%;width:100%;
  display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.4);animation:pop .22s cubic-bezier(.2,1.3,.5,1)}
.panel h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.panel .sub{color:var(--dim);font-size:14px;margin-top:2px}
@keyframes pop{from{transform:scale(.95) translateY(8px);opacity:0}}
.scroll{overflow-y:auto;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* Title */
#title{background:linear-gradient(180deg,rgba(29,27,58,.55),rgba(29,27,58,.05) 45%,rgba(29,27,58,.65));backdrop-filter:none;-webkit-backdrop-filter:none;
  flex-direction:column;justify-content:space-between;padding:6vh 20px}
.logo{text-align:center;position:relative}
.logo h1{font-size:clamp(58px,12vw,120px);font-weight:900;letter-spacing:-.04em;line-height:1;text-shadow:0 6px 0 rgba(29,27,58,.55)}
.logo h1 span{color:var(--moon)}
.logo p{font-size:clamp(15px,2.2vw,20px);color:var(--cream);opacity:.9;margin-top:10px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu .btn{padding:14px 18px;font-size:17px;background:rgba(29,27,58,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.menu .btn.primary{background:var(--moon)}
#loadnote{color:var(--cream);text-align:center;font-size:13px;min-height:18px;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* Tabs and cards */
.tabs{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
.tab{padding:9px 15px;border-radius:12px;font-weight:700;color:var(--dim);background:transparent;border:1px solid transparent}
.tab.on{background:var(--moon);color:var(--ink)}
.tab:not(.on):hover{border-color:var(--line);color:var(--cream)}
.rowhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:15px;padding:13px 15px}
.job{display:grid;grid-template-columns:42px 1fr auto;gap:13px;align-items:center;margin-bottom:9px}
.job .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:rgba(255,255,255,.1)}
.job b{font-size:16px}
.job .meta{color:var(--dim);font-size:13px;margin-top:2px;line-height:1.45}
.job .pay{text-align:right;font-weight:800;font-size:18px;color:var(--mint);white-space:nowrap}
.job .pay .btn{margin-top:6px;display:flex;margin-left:auto;color:var(--cream)}
.job .pay .btn.primary{color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;margin-right:4px;letter-spacing:.02em;background:rgba(255,255,255,.14)}
.tag.fragile{background:#ffb3c4;color:#5a1b2d}.tag.perish{background:#a9f0d8;color:#123f33}
.tag.heavy{background:#c8c4e8;color:#28244f}.tag.urgent{background:#ff8a7a;color:#4d120a}
.tag.vip{background:var(--moon);color:#4a3600}.tag.warn{background:rgba(255,123,147,.25);color:var(--rose)}
.tag.weather{background:#a7d8ff;color:#123a5a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.stat span:first-child{color:var(--dim)}
.bar{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--mint);transition:width .15s}
.planecard{margin-bottom:10px}
.planecard .pic{height:112px;border-radius:10px;overflow:hidden;background:#2b2856;margin-bottom:9px}.planecard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.upg{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-top:8px;font-size:14px}
.pips{letter-spacing:2px;color:var(--moon);font-size:12px;margin-left:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow label{font-weight:600}
input[type=range]{accent-color:var(--moon);width:170px}
select{font:inherit;background:var(--ink2);color:var(--cream);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.switch{width:46px;height:26px;border-radius:14px;background:rgba(255,255,255,.15);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;left:3px;top:3px;background:var(--cream);transition:left .15s}
.switch.on{background:var(--mint)}.switch.on::after{left:23px}
kbd{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.14);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
table.keys{width:100%;border-collapse:collapse;font-size:14px}
table.keys td{padding:5px 4px}table.keys td:first-child{color:var(--dim);width:42%}

/* Map */
#mapWrap{position:relative;flex:1;min-height:0;display:flex;gap:14px;justify-content:center}
#mapCv{height:100%;aspect-ratio:1;max-width:100%;border-radius:14px;background:#17305a;cursor:pointer;touch-action:none}
#mapSide{width:270px;flex:none;font-size:14px}

/* Landing + result popups */
.score{text-align:center}
.score .big{font-size:58px;font-weight:900;line-height:1;color:var(--moon);margin-top:6px}
.score .stars{font-size:24px;letter-spacing:4px;color:var(--moon);margin-top:4px}
.score .quip{font-size:17px;font-weight:700;margin:6px 0 10px}
.sbar{display:grid;grid-template-columns:96px 1fr 34px;gap:9px;align-items:center;font-size:13px;margin:6px 0;text-align:left}
.ledger{font-size:15px;margin:12px 0}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.ledger .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:800;font-size:19px;color:var(--mint)}
.neg{color:var(--rose)}.pos{color:var(--mint)}
#landToast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:20;width:min(320px,calc(100% - 24px));pointer-events:none}
#landToast .panel{padding:14px 18px}

/* ---- HUD --------------------------------------------------------------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-variant-numeric:tabular-nums}
.gl{background:var(--glass);border:1px solid var(--line);border-radius:15px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#compass{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(400px,40vw);height:34px;border-radius:12px}
#jobCard{position:absolute;top:10px;left:10px;width:244px;padding:10px 12px;font-size:13px}
#jobCard .t{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:8px}
#jobCard .m{color:var(--dim);margin-top:2px}
#jobCard .bar{margin-top:6px;height:6px}
#stat{position:absolute;top:10px;right:10px;width:168px;padding:8px 10px;font-size:13px}
#stat .money{font-weight:800;font-size:18px;color:var(--mint);display:flex;justify-content:space-between;align-items:baseline}
#stat .money small{color:var(--dim);font-weight:600;font-size:12px}
#stat .l{display:flex;justify-content:space-between;color:var(--dim);margin-top:1px}
#stat .l b{color:var(--cream);font-weight:650}
#mini{display:block;width:146px;height:146px;border-radius:50%;margin:7px auto 3px;background:#17305a}
#dash{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:9px 13px;align-items:center;transform-origin:bottom center}
.ins{min-width:80px;text-align:center}
.ins small{display:block;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.06em}
.ins b{display:block;font-size:30px;line-height:1.08;font-weight:800}
.ins i{font-style:normal;font-size:12px;color:var(--dim);white-space:nowrap}
#horizon{width:78px;height:78px;border-radius:50%;display:block}
.bars{width:132px;font-size:11px;font-weight:700;color:var(--dim)}
.bars div.r{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;margin:4px 0}
.bars .bar{height:8px}.bars .bar i{transition:none}
.chips{display:grid;grid-template-columns:1fr;gap:5px;width:78px}
.chip{font-size:12px;font-weight:800;text-align:center;padding:4px 5px;border-radius:9px;background:rgba(255,255,255,.1);color:var(--dim)}
.chip.ok{background:var(--mint);color:#123f33}.chip.amb{background:var(--moon);color:#4a3600}.chip.bad{background:var(--rose);color:#4d120a}
#warn{position:absolute;top:52px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.wchip{font-weight:900;font-size:15px;letter-spacing:.04em;padding:5px 13px;border-radius:11px;background:var(--rose);color:#4d120a;animation:bl .55s steps(2) infinite;white-space:nowrap}
.wchip.soft{background:var(--moon);color:#4a3600;animation:none}
@keyframes bl{50%{opacity:.5}}
#appr{position:absolute;bottom:126px;left:50%;transform:translateX(-50%);padding:6px 13px;font-size:14px;font-weight:700;white-space:nowrap;display:flex;gap:13px}
#appr span.good{color:var(--mint)}#appr span.bad{color:var(--rose)}#appr span.meh{color:var(--moon)}
#prompt{position:absolute;bottom:126px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;gap:8px;flex-wrap:nowrap}
#prompt .btn{background:var(--moon);color:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.35);white-space:nowrap}
#prompt .btn.alt{background:var(--glass);color:var(--cream)}
#nav{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;margin:-22px 0 0 -22px}
#nav .ar{width:44px;height:44px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
#nav .lb{position:absolute;left:50%;top:46px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:800;padding:3px 8px;border-radius:9px;background:var(--glass);border:1px solid var(--line)}
#hudBtns{position:absolute;right:186px;top:10px;display:flex;gap:6px;pointer-events:auto}
#hudBtns .btn{width:38px;height:38px;padding:0;background:var(--glass)}
#toasts{position:absolute;top:92px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,90%)}
.toast{padding:7px 14px;border-radius:12px;font-size:14px;font-weight:650;background:var(--glass);border:1px solid var(--line);animation:pop .2s;transition:opacity .4s;text-align:center}
#tut{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:266px;padding:13px 14px;pointer-events:auto;font-size:14px;line-height:1.42}
#tut h3{font-size:15px;font-weight:800;color:var(--moon);margin-bottom:4px}
#tut .prog{color:var(--dim);font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#fade{position:fixed;inset:0;background:#100e28;z-index:25;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
#loadbar{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--ink);text-align:center;padding:24px}
#loadbar b{font-size:34px;font-weight:900}#loadbar b span{color:var(--moon)}

/* ---- Touch controls ---------------------------------------------------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#stick{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:14px;width:146px;height:146px;border-radius:50%;background:rgba(29,27,58,.45);border:2px solid var(--line);pointer-events:auto;touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(255,246,227,.8)}
#thrWrap{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:14px;width:60px;height:176px;border-radius:18px;background:rgba(29,27,58,.45);border:2px solid var(--line);pointer-events:auto;touch-action:none;overflow:hidden}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,214,107,.65)}
#thrWrap span{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:11px;font-weight:800}
.tbtns{position:absolute;right:calc(80px + env(safe-area-inset-right));bottom:14px;display:grid;grid-template-columns:repeat(2,54px);gap:6px;pointer-events:auto}
.tb{height:46px;border-radius:13px;background:rgba(29,27,58,.55);border:1px solid var(--line);font-size:11px;font-weight:800;touch-action:none}
.tb.on{background:var(--moon);color:var(--ink)}
.trud{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:170px;display:flex;gap:6px;pointer-events:auto}
.trud .tb{width:70px;height:38px}

/* ---- Responsive -------------------------------------------------------- */
@media (max-width:900px),(max-height:560px){
  #dash{transform:translateX(-50%) scale(.68)}
  #jobCard{width:190px;font-size:12px;padding:7px 9px}
  #stat{width:130px;padding:6px 8px}#mini{display:none}
  #hudBtns{right:146px}
  #mapSide{display:none}
  #tut{width:210px;font-size:13px;padding:9px 11px;top:46%}
  #appr{bottom:86px}#prompt{bottom:90px}
}
@media (max-height:440px){.panel{padding:13px}.logo h1{font-size:52px}#title{padding:12px}.menu{flex-direction:row;flex-wrap:wrap;justify-content:center;width:auto}.menu .btn{padding:9px 14px;font-size:14px}}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .job{grid-template-columns:34px 1fr}.job .pay{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.job .pay .btn{margin:0}
  #compass{top:58px;width:56vw}#warn{top:98px}#toasts{top:128px}
}
body.touch #prompt kbd{display:none}
@media (max-width:640px){
  #hudBtns{right:10px;top:104px}
  body.touch #dash{bottom:226px}
  body.touch #prompt{bottom:296px}body.touch #appr{bottom:288px}
  body.touch #tut{top:158px;transform:none}
}
</style>
</head>
<body>
<div id="gl"></div>

<div id="loadbar"><b>Plane<span>zzz</span></b><div id="loadmsg" style="color:var(--dim)">Fluffing the pillows…</div></div>

<!-- ======================== HUD ======================== -->
<div id="hud" class="hidden">
  <canvas id="compass" class="gl" width="800" height="68"></canvas>
  <div id="jobCard" class="gl"></div>
  <div id="stat" class="gl">
    <div class="money"><span id="sMoney">$0</span><small id="sLvl">Lv 1</small></div>
    <canvas id="mini" width="292" height="292"></canvas>
    <div class="l"><span id="sTime">09:00</span><b id="sWx">Clear</b></div>
    <div class="l"><span>Wind</span><b id="sWind">0 kt</b></div>
  </div>
  <div id="hudBtns">
    <button class="btn" id="bMap" title="Map (M)" aria-label="Open map">🗺️</button>
    <button class="btn" id="bPause" title="Pause (Esc)" aria-label="Pause">⏸</button>
  </div>
  <div id="warn"></div>
  <div id="toasts"></div>
  <div id="nav" class="hidden"><svg class="ar" viewBox="0 0 44 44"><path d="M22 3 L38 36 L22 28 L6 36 Z" fill="#ffd66b" stroke="#1d1b3a" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="lb" id="navLb"></div></div>
  <div id="appr" class="gl hidden"></div>
  <div id="prompt"></div>
  <div id="tut" class="gl hidden"></div>
  <div id="dash" class="gl">
    <div class="ins"><small>SPEED</small><b id="dSpd">0</b><i>kt</i></div>
    <canvas id="horizon" width="156" height="156"></canvas>
    <div class="ins"><small>ALTITUDE</small><b id="dAlt">0</b><i id="dVs">ft</i></div>
    <div class="bars">
      <div class="r"><span>THR</span><div class="bar"><i id="dThr" style="background:var(--moon)"></i></div></div>
      <div class="r"><span>FUEL</span><div class="bar"><i id="dFuel"></i></div></div>
      <div class="r"><span>COND</span><div class="bar"><i id="dCond" style="background:var(--sky)"></i></div></div>
      <div class="r"><span>LOAD</span><div class="bar"><i id="dCargo" style="background:var(--lav)"></i></div></div>
    </div>
    <div class="chips"><div class="chip" id="cGear">GEAR</div><div class="chip" id="cFlaps">FLAPS 0</div><div class="chip" id="cBrake">BRAKE</div></div>
  </div>
</div>

<div id="landToast" class="hidden"></div>

<!-- ======================== Touch ======================== -->
<div id="touch" class="hidden">
  <div id="stick"><div id="nub"></div></div>
  <div class="trud"><button class="tb" data-hold="yawL">◀ RUD</button><button class="tb" data-hold="yawR">RUD ▶</button></div>
  <div class="tbtns">
    <button class="tb" data-act="gear">GEAR</button><button class="tb" data-act="flaps">FLAPS</button>
    <button class="tb" data-hold="brake">BRAKE</button><button class="tb" data-act="cam">CAM</button>
  </div>
  <div id="thrWrap"><div id="thrFill"></div><span>THR</span></div>
</div>

<!-- ======================== Screens ======================== -->
<div id="title" class="screen hidden">
  <div class="logo">
    <h1>Plane<span>zzz</span></h1>
    <p>Sleepy skies. Speedy cargo. Try not to wake the eggs.</p>
  </div>
  <div>
    <div class="menu" id="titleMenu" style="margin:0 auto"></div>
    <div id="loadnote" style="margin-top:10px"></div>
  </div>
</div>
<div id="airport" class="screen hidden"><div class="panel" style="max-width:760px;height:min(88vh,690px)" id="apPanel"></div></div>
<div id="map" class="screen hidden"><div class="panel" style="max-width:1120px;height:min(92vh,780px)">
  <div class="rowhead"><div><h2>Island map</h2><div class="sub" id="mapSub"></div></div><button class="btn small" id="mapClose">Close (M)</button></div>
  <div id="mapWrap" style="margin-top:12px"><canvas id="mapCv" width="1000" height="1000"></canvas><div id="mapSide" class="scroll"></div></div>
</div></div>

}

    const d = G.mode === 'title' ? D * 1.05 : Cam.orbitD * (D / 15), pt = G.mode === 'title' ? .16 : Cam.orbitPitch;
    camera.position.set(P.pos.x + Math.sin(Cam.orbitYaw) * Math.cos(pt) * d, P.pos.y + Math.sin(pt) * d, P.pos.z + Math.cos(Cam.orbitYaw) * Math.cos(pt) * d);
    camera.up.set(0, 1, 0); camera.lookAt(P.pos.x, P.pos.y + P.def.model.r * (G.mode === 'title' ? 2.2 : .5), P.pos.z);
    camera.near = 1; camera.fov = 58;

    const [ex, ey, ez] = P.def.eye;
    camera.position.set(ex, ey, ez).applyQuaternion(P.quat).add(P.pos);

  } else {

  Cam.shake = Math.max(0, Cam.shake - dt * 2);

  camera.updateProjectionMatrix();
}

/* Drag to look / orbit; wheel to zoom the orbit */
(function bindPointer() {

/* ==========================================================================
   SECTION 12 — ECONOMY AND JOBS

const G = { mode: 'boot', overlay: null, navAirport: null, tugging: false, lastLanding: null, deliverLatch: false, crashT: 0, crashWhy: null, time: 0, promptKey: '', warnKey: '' };
const apById = id => AIRPORTS.find(a => a.id === id);
const distKm = (a, b) => Math.hypot(a.x - b.x, a.z - b.z) / 1000;

function genBoard(ap) {
  const def = Plane.def, sp = Plane.spec, rng = Math.random, list = [];
  let dests = AIRPORTS.filter(a => a !== ap && unlocked(a) && a.rwyLen >= def.minRwy);
  if (!dests.length) dests = AIRPORTS.filter(a => a !== ap && unlocked(a));
  const types = Object.keys(CARGO).filter(k => CARGO[k].lvl <= S.level);
  const n = 5 + Math.min(3, Math.floor(S.level / 2));
  const wxBonus = Wx.def.bonus;
  for (let i = 0; i < n; i++) {
    const type = i === 0 ? 'general' : (i === 1 ? 'fragile' : pick(types, rng)), c = CARGO[type];
    const [name, icon] = pick(c.items, rng);
    const to = pick(dests, rng), km = distKm(ap, to);
    let w = sp.cap * rrange(rng, c.wt[0], c.wt[1]);
    if (i >= 3 && rng() < .2) w = sp.cap * rrange(rng, 1.1, 1.35);         // a tempting job that needs a bigger bay
    w = Math.max(20, Math.round(w / 5) * 5);
    const cruise = sp.vmax * .78, flightT = km * 1000 / cruise;
    const deadline = Math.round(flightT * c.tMul + 80);
    const pay = Math.round((36 + w * .22) * km * c.pay * (1 + S.level * .03) * (1 + wxBonus) / 5) * 5;
    list.push({ id: S.nextJobId++, type, name, icon, weight: w, from: ap.id, to: to.id, km: +km.toFixed(1), pay, deadline, wxBonus });
  }
  S.board[ap.id] = list;
  return list;
}
const cargoWeight = () => S.jobs.reduce((s, j) => s + j.weight, 0);
function refreshCargo() { Plane.cargoW = cargoWeight(); }
function acceptJob(job) {

  list.splice(list.indexOf(job), 1);
  S.jobs.push(Object.assign({}, job, { timeLeft: job.deadline, cond: 100, late: false }));

}

/* A crate slides from the stand into the plane */
const LoadAnim = { mesh: null, t: 0 };
function playLoadAnim() {

function updateLoadAnim(dt) {

const landBonusPct = sc => sc >= 92 ? .25 : sc >= 80 ? .12 : sc >= 55 ? 0 : sc >= 30 ? -.1 : -.25;

function deliverJobs(ap) {
  const done = S.jobs.filter(j => j.to === ap.id);
  if (!done.length) return;
  const lines = [];
  let total = 0, xp = 0;
  const ll = G.lastLanding && G.lastLanding.ap === ap ? G.lastLanding : null;
  for (const j of done) {
    const late = j.timeLeft < 0, cf = .35 + .65 * j.cond / 100, c = CARGO[j.type];
    let v = j.pay * cf;
    lines.push([`${j.icon} ${j.name}`, j.pay]);
    if (j.cond < 99.5) lines.push([`Cargo condition ${Math.round(j.cond)}%`, -(j.pay - v)]);
    if (late) { lines.push(['Late delivery', -v * .4]); v *= .6; }
    else if (j.type === 'urgent' || j.type === 'perish') {
      const early = Math.round(j.pay * .25 * clamp(j.timeLeft / j.deadline * 2)); if (early > 0) { lines.push(['Rush bonus', early]); v += early; }
    }
    if (ll) {
      const b = v * landBonusPct(ll.score) * (j.type === 'fragile' || j.type === 'vip' ? 1.5 : 1);
      if (Math.abs(b) > .5) { lines.push([b > 0 ? 'Smooth landing bonus' : 'Rough landing penalty', b]); v += b; }
    }
    total += v; xp += Math.round(10 + j.km * 2 + (c.pay - 1) * 10 + (ll ? ll.score / 8 : 0) + (late ? -6 : 0));
    S.stats.km += j.km;
  }
  total = Math.round(total);
  S.money += total; S.stats.earned += total; S.stats.deliveries += done.length;
  S.jobs = S.jobs.filter(j => j.to !== ap.id);
  refreshCargo();
  const oldL = S.level, unlockedNames = [];
  S.xp += xp;
  while (S.level < MAX_LEVEL && S.xp >= xpForLevel(S.level + 1)) {
    S.level++;
    AIRPORTS.filter(a => a.lvl === S.level).forEach(a => unlockedNames.push(a.name));
  }
  genBoard(ap); G.lastLanding = null; storePlane(); saveGame();
  Audio2.sfx.cash();
  UI.showDelivery(ap, lines, total, xp, S.level > oldL ? { level: S.level, airports: unlockedNames } : null);
  if (S.level > oldL) { setTimeout(() => Audio2.sfx.level(), 500); }
  Tutorial.event('deliver');
}
function hurtCargo(general, fragile) {
  for (const j of S.jobs) {
    const k = j.type === 'fragile' ? fragile : j.type === 'vip' ? fragile * .9 : general;
    j.cond = Math.max(0, j.cond - k);

/* Job clocks, spoilage and passenger comfort */
function updateJobs(dt) {
  const P = Plane;
  for (const j of S.jobs) {
    const wasLate = j.timeLeft < 0;
    j.timeLeft -= dt;
    if (!wasLate && j.timeLeft < 0) { toast(`⏰ ${j.name} is running late!`); Audio2.sfx.warn(); }
    if (j.type === 'perish') j.cond = Math.max(0, j.cond - dt * 35 / j.deadline);

      const e = Math.hypot(ends[0].x - P.pos.x, ends[0].z - P.pos.z) < Math.hypot(ends[1].x - P.pos.x, ends[1].z - P.pos.z) ? ends[0] : ends[1];

/* Refuel / repair prices */
const fuelCost = l => Math.ceil(l * CFG.FUEL_PRICE);

  const P = Plane, want = Math.min(P.spec.tank - P.fuel, P.spec.tank * frac);
  const can = Math.min(want, S.money / CFG.FUEL_PRICE);

}

  if (can <= 0) return;
  S.money = Math.max(0, S.money - Math.ceil(can * P.def.repair)); P.cond = Math.min(100, P.cond + can);
  storePlane(); saveGame(); Audio2.sfx.cash();

const canCharityFix = () => S.money < repairCost() && Plane.cond < 40;

function charityFix() { Plane.cond = 45; storePlane(); saveGame(); Audio2.sfx.accept(); }

const Land = {
  armed: false, data: null,
  onTouch(sink, g) {
    const P = Plane;
    Audio2.sfx.chirp(clamp(sink / 2, .35, 1.2));
    for (let i = 0; i < 4; i++) puff(P.pos.x + (Math.random() - .5) * 2, P.pos.y - P.def.gearH + .2, P.pos.z + (Math.random() - .5) * 2, 1.2 + P.def.model.r * .6, .9, 0xdedee6, P.vel.x * .05, .6, P.vel.z * .05);
    if (sink > 2.6) {
      const k = sink - 2.6;
      P.cond = Math.max(5, P.cond - k * 9); hurtCargo(k * 9, k * 26); Cam.shake = Math.min(1.4, k * .6);
    }
    if (this.data) { this.data.bounces++; this.data.sink = Math.max(this.data.sink, sink); return; }
    if (!this.armed) return;
    this.armed = false;
    let lat = 99, onRwy = false;
    if (g.ap && g.surf === 'runway' && g.rwy) { lat = Math.abs(g.lx - g.rwy.x); onRwy = true; }
    this.data = { sink, lat, onRwy, W: g.rwy ? g.rwy.W : 16, ratio: P.V / stallSpeedNow(), bank: Math.abs(P.bank) * R2D, ap: g.ap, t: 0, bounces: 0, gearUp: P.gearT <= .85 };
    Tutorial.event('touchdown');
  },
  update(dt) {
    const P = Plane;
    if (!P.onGround && P.airT > 2.5 && P.agl > 7) this.armed = true;
    const d = this.data; if (!d) return;
    d.t += dt;
    if (!P.onGround && P.agl > 14) { this.data = null; toast('Touch and go! Bold.'); return; }
    if ((P.onGround && P.gs < P.spec.vs * .85) || d.t > 11) this.finish(d);
  },
  finish(d) {
    this.data = null;
    const smooth100 = clamp(100 * (1 - (d.sink - .45) / 2.4), 0, 100);
    const centre = d.onRwy ? clamp(100 * (1 - Math.pow(d.lat / (d.W * .92), 1.5)), 0, 100) : 0;
    const r = d.ratio, sp = r < 1.02 ? clamp(100 - (1.02 - r) * 500, 0, 100) : r <= 1.32 ? 100 : clamp(100 - (r - 1.32) * 260, 0, 100);
    let score = Math.round(smooth100 * .5 + centre * .25 + sp * .25 - d.bounces * 9 - (d.bank > 8 ? (d.bank - 8) : 0));
    if (d.gearUp) score = Math.min(score, 8);
    score = clamp(score, 0, 100);
    const group = !d.onRwy ? 'field' : score >= 88 ? 'butter' : score >= 68 ? 'good' : score >= 42 ? 'ok' : 'bad';
    const quip = pick(QUIPS[group]);
    S.stats.bestLanding = Math.max(S.stats.bestLanding, score);
    if (score >= 88) S.stats.butter++;
    if (d.ap) { G.lastLanding = { score, ap: d.ap }; S.airport = d.ap.id; }
    saveGame();
    UI.showLanding(score, Math.round(smooth100), Math.round(centre), Math.round(sp), quip, d);
  },
};
function crash(why) {
  const P = Plane;

  const water = why === 'ditch';

    puff(P.pos.x, P.pos.y, P.pos.z, 3 + P.def.model.r * 1.2, 1.5 + Math.random(), water ? 0xdff2ff : (i % 2 ? 0x44444e : 0xff9a3d), Math.cos(a) * s, 2 + Math.random() * 6, Math.sin(a) * s);
  }

function finishCrash() {
  const why = G.crashWhy, a = nearestAirport(), fee = towFee();

/* ==========================================================================
   Graphics quality presets (auto mode steps these up or down from real fps)
   ========================================================================== */
const Q = {
  presets: {
    low:  { name: 'low',  pixel: 1,   shadows: false, trees: .3,  clouds: .4,  nearWater: false, fog: .75 },
    med:  { name: 'med',  pixel: 1.5, shadows: false, trees: .65, clouds: .7,  nearWater: true,  fog: 1 },
    high: { name: 'high', pixel: 2,   shadows: true,  trees: 1,   clouds: 1,   nearWater: true,  fog: 1 },
  },
  current: null, fpsT: 0, frames: 0, slow: 0, fast: 0, triedHigh: false,
  apply(name) {
    const p = this.presets[name]; this.current = p;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, p.pixel));
    resize();
    if (renderer.shadowMap.enabled !== p.shadows) {
      renderer.shadowMap.enabled = p.shadows; Sky.sun.castShadow = p.shadows;
      scene.traverse(o => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); } });
    }
    Flora.meshes.forEach(m => { m.count = Math.floor(m.userData.full * p.trees); });
    Water.near.visible = p.nearWater;
  },
  fromSettings() { this.apply(Settings.quality === 'auto' ? (this.current ? this.current.name : 'med') : Settings.quality); },
  /* Called every frame: watches fps while in auto mode */
  watch(dt) {
    this.fpsT += dt; this.frames++;

    const fps = this.frames / this.fpsT; this.fpsT = 0; this.frames = 0; G.fps = fps;
    if (Settings.quality !== 'auto' || document.hidden || fps < 12) return;   // under 12 means throttled, not slow

    this.fast = fps > 57 ? this.fast + 1 : 0;

      this.fast = 0; this.triedHigh = true; this.apply('high');
    }
  },
};

  /* --- Map --------------------------------------------------------------- */
  bakeMap() {
    const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N), col = new T.Color();
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const wx = i / N * CFG.WORLD - HALF, wz = j / N * CFG.WORLD - HALF, h = terrainAt(wx, wz), o = (j * N + i) * 4;
      if (h < 0) { const d = clamp(-h / 90); img.data[o] = 74 - d * 40; img.data[o + 1] = 160 - d * 76; img.data[o + 2] = 205 - d * 62; }
      else {
        const hE = terrainAt(wx + 60, wz - 60), shade = clamp(1 + (h - hE) * .012, .68, 1.25);
        faceColor(h, 0, wx, wz, col);
        if (h > 300 && h < snowLine(wx, wz)) col.lerp(PAL.rock, .55);
        col.convertLinearToSRGB();
        img.data[o] = clamp(col.r * shade) * 255; img.data[o + 1] = clamp(col.g * shade) * 255; img.data[o + 2] = clamp(col.b * shade) * 255;
      }
      img.data[o + 3] = 255;
    }
    x.putImageData(img, 0, 0); this.mapBake = c;
  },

    x.setLineDash([12, 9]); x.lineWidth = 3; x.strokeStyle = '#ffd66b';
    for (const j of S.jobs) { const a = apById(j.to); x.beginPath(); x.moveTo(mx(Plane.pos.x), mx(Plane.pos.z)); x.lineTo(mx(a.x), mx(a.z)); x.stroke(); }

    x.fillStyle = '#fff6e3'; x.font = '700 18px system-ui,sans-serif'; x.textAlign = 'center'; x.fillText(`${kt(Wx.windSpd)} kt`, N - 66, N - 8);

  },

function updateBlob() {
  const P = Plane, g = groundAt(P.pos.x, P.pos.z), h = Math.max(0, g.h), a = P.pos.y - h - P.def.gearH;
  const on = (!Q.current.shadows || a > 60) && a < 260 && !P.dead;
  Blob.mesh.visible = on;
  if (on) {
    const sx = P.def.model.span * 1.1 * (1 + a * .004), sz = P.def.model.len * 1.2 * (1 + a * .004);
    Blob.mesh.position.set(P.pos.x, h + .45, P.pos.z); Blob.mesh.rotation.y = -P.hdg * D2R; Blob.mesh.scale.set(sx, 1, sz);
    Blob.mesh.material.opacity = clamp(1 - a / 260);
  }
}

/* Keyboard actions */
function toggleGear() {
  const P = Plane;
  if (P.onGround && P.gear) { toast('Gear stays down on the ground. Trust me.'); return; }
  P.gear = !P.gear; Audio2.sfx.gear(); Tutorial.event('gear');
}
function cycleFlaps() { Plane.flaps = (Plane.flaps + 1) % 3; Audio2.sfx.flaps(); }
function onKeyPress(code) {
  if (G.mode === 'title') { if (code === 'Enter' && !$('settings').offsetParent && !$('help').offsetParent) { const b = $('titleMenu').querySelector('button'); if (b) b.click(); } return; }
  if (G.mode !== 'play') return;
  if (!$('settings').classList.contains('hidden')) { if (code === 'Escape') show($('settings'), false); return; }
  if (!$('help').classList.contains('hidden')) { if (code === 'Escape') show($('help'), false); return; }
  if (G.overlay) {
    if (G.overlay === 'map' && (code === 'KeyM' || code === 'Escape')) UI.closeMap();
    else if (G.overlay === 'pause' && (code === 'Escape' || code === 'KeyP')) UI.close();
    else if (G.overlay === 'airport' && code === 'Escape') { UI.close(); Tutorial.event('closeboard'); }
    else if (G.overlay === 'result' && (code === 'Enter' || code === 'Space')) { const b = $('resPanel').querySelector('button'); if (b) b.click(); }
    return;
  }
  if (Plane.dead || G.tugging) return;
  switch (code) {
    case 'KeyG': toggleGear(); break;
    case 'KeyF': cycleFlaps(); break;
    case 'KeyC': cycleCamera(); break;
    case 'KeyM': UI.openMap(); break;
    case 'Escape': case 'KeyP': UI.openPause(); break;
    case 'Enter': { const p = (G.prompts || [])[0]; if (p) UI.doPrompt(p[0]); break; }
    case 'KeyT': if ((G.prompts || []).some(p => p[0] === 'tug')) UI.doPrompt('tug'); break;
  }
}

/* Static UI event wiring */
function bindUI() {
  $('titleMenu').addEventListener('click', e => { const b = e.target.closest('button'); if (b) UI.onTitleClick(b.dataset.a, b); });
  $('apPanel').addEventListener('click', e => UI.onAirportClick(e));
  $('pausePanel').addEventListener('click', e => { const b = e.target.closest('button'); if (b) UI.onPauseClick(b.dataset.a); });
  $('resPanel').addEventListener('click', e => { const b = e.target.closest('button'); if (b) UI.onResult(b.dataset.a); });
  $('setPanel').addEventListener('click', e => UI.onSettings(e));
  $('setPanel').addEventListener('input', e => UI.onSettings(e));
  $('helpPanel').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show($('help'), false); });
  $('prompt').addEventListener('click', e => { const b = e.target.closest('button'); if (b) UI.doPrompt(b.dataset.p); });
  $('bMap').onclick = () => { if (!G.overlay && !Plane.dead) UI.openMap(); };
  $('bPause').onclick = () => { if (!G.overlay) UI.openPause(); };
  $('mapClose').onclick = () => UI.closeMap();
  $('mapCv').addEventListener('click', e => UI.onMapClick(e));
  bindTouch();
}

/* Touch controls */
function touchWanted() {
  if (Settings.touch === 'on') return true;
  if (Settings.touch === 'off') return false;
  return G.sawTouch || (navigator.maxTouchPoints > 0 && window.matchMedia('(pointer: coarse)').matches);
}
window.addEventListener('touchstart', () => { G.sawTouch = true; if (G.mode === 'play') applyTouchMode(); }, { once: true, passive: true });
function applyTouchMode() {
  const on = touchWanted() && G.mode === 'play';
  document.body.classList.toggle('touch', touchWanted());
  show($('touch'), on);
}
function bindTouch() {
  const stick = $('stick'), nub = $('nub'), t = Input.touch; let sid = null;
  const moveStick = e => {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R; const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    t.x = x; t.y = y; nub.style.transform = `translate(${x * R * .62}px,${y * R * .62}px)`;
  };
  stick.addEventListener('pointerdown', e => { Audio2.init(); sid = e.pointerId; stick.setPointerCapture(sid); moveStick(e); e.preventDefault(); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) moveStick(e); });
  const endS = e => { if (e.pointerId === sid) { sid = null; t.x = t.y = 0; nub.style.transform = ''; } };
  stick.addEventListener('pointerup', endS); stick.addEventListener('pointercancel', endS);
  const th = $('thrWrap'); let tid = null;
  const moveT = e => { const r = th.getBoundingClientRect(); Plane.thr = clamp(1 - (e.clientY - r.top) / r.height); };
  th.addEventListener('pointerdown', e => { Audio2.init(); tid = e.pointerId; th.setPointerCapture(tid); moveT(e); e.preventDefault(); });
  th.addEventListener('pointermove', e => { if (e.pointerId === tid) moveT(e); });
  th.addEventListener('pointerup', e => { if (e.pointerId === tid) tid = null; });
  document.querySelectorAll('#touch [data-hold]').forEach(b => {
    const k = b.dataset.hold, set = v => { t[k] = v; b.classList.toggle('on', v); };
    b.addEventListener('pointerdown', e => { Audio2.init(); set(true); e.preventDefault(); });
    for (const n of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(n, () => set(false));
  });
  document.querySelectorAll('#touch [data-act]').forEach(b => {
    b.addEventListener('pointerdown', e => {
      Audio2.init(); e.preventDefault();
      if (G.overlay || Plane.dead) return;
      ({ gear: toggleGear, flaps: cycleFlaps, cam: cycleCamera })[b.dataset.act]();
    });
  });
}

/* ==========================================================================
   SECTION 15 — TUTORIAL
   Each step has a check run every frame, or waits for a named event.
   ========================================================================== */
const Tutorial = {
  active: false, i: 0, dest: null,
  steps: [
    { t: 'Hello, sleepy pilot!', x: () => `Time for your first job. Press <kbd>Enter</kbd> or tap <b>Airport services</b>, then accept the job on the Cargo Board.`, ev: 'accept' },
    { t: 'Head for the runway', x: () => `Close the board. Hold <kbd>Shift</kbd> for some throttle, steer with <kbd>A</kbd> <kbd>D</kbd> and follow the arrow, then <kbd>Ctrl</kbd> or <kbd>Z</kbd> to idle. Or press <kbd>T</kbd> at the stand for a free tug.`, ok: P => P.surf === 'runway' },
    { t: 'Takeoff flaps', x: () => `Point down the runway and press <kbd>F</kbd> once for a little extra lift.`, ok: P => P.flaps >= 1 },
    { t: 'Full power', x: () => `Hold <kbd>Shift</kbd> until the THR bar is full. Tap <kbd>A</kbd> <kbd>D</kbd> to stay on the centreline.`, ok: P => P.thr > .95 },
    { t: 'Rotate!', x: P => `At about ${kt(stallSpeedNow() * 1.15)} kt, hold <kbd>S</kbd> gently to lift the nose. She will float off by herself.`, ok: P => !P.onGround && P.agl > 4 },
    { t: 'Gear up', x: () => `Airborne! Press <kbd>G</kbd> to tuck the gear away.`, ok: P => !P.gear },
    { t: 'Climb and clean up', x: () => `Climb until you are 800 ft above the ground. Press <kbd>F</kbd> until flaps read 0.`, ok: P => P.agl > 240 && P.flaps === 0 },
    { t: 'Cruise', x: () => `Follow the yellow arrow. Bank with <kbd>A</kbd> <kbd>D</kbd>, then let go and the wings level out. About 70% throttle is plenty.`, ok: () => Tutorial.distDest() < 4300 },
    { t: 'Set up to land', x: () => `Green gates mark the way in. Fly through them. Pull throttle to about 35%, gear down with <kbd>G</kbd>, flaps to 2 with <kbd>F</kbd>.`, ok: P => P.gear && P.flaps === 2 },
    { t: 'Touch down', x: () => `Follow the coach above the dash. Near the runway, cut throttle with <kbd>Ctrl</kbd> or <kbd>Z</kbd>, then ease back on <kbd>S</kbd> just above the ground.`, ev: 'touchdown' },
    { t: 'Brakes', x: () => `Lovely! Hold <kbd>Space</kbd> until you stop.`, ok: P => P.onGround && P.gs < 2.5 },
    { t: 'Deliver', x: () => `Taxi to the green ring at the stand, or press <kbd>Enter</kbd> for a tug. Cargo unloads automatically.`, ev: 'deliver' },
    { t: 'You did it!', x: () => `That is the whole loop: jobs, flights, smooth landings, money. Spend it in the Hangar. Sweet dreams, captain.`, last: true },
  ],
  distDest() { const P = Plane; return this.dest ? Math.hypot(this.dest.x - P.pos.x, this.dest.z - P.pos.z) : 1e9; },
  start() {
    const ap = Plane.ap || nearestAirport();
    this.active = true; this.i = 0;
    this.dest = AIRPORTS.filter(a => a !== ap && unlocked(a) && a.rwyLen >= Plane.def.minRwy).sort((a, b) => distKm(a, ap) - distKm(b, ap))[0];
    setWeather('clear', true); Wx.next = 600; if (Sky.tod < 8 || Sky.tod > 15) Sky.tod = 9.5;
    const w = Math.round(Plane.spec.cap * .4 / 5) * 5, km = +distKm(ap, this.dest).toFixed(1);
    const job = { id: S.nextJobId++, type: 'general', name: 'Pillows', icon: '🛏️', weight: w, from: ap.id, to: this.dest.id, km, pay: 600, deadline: 900, wxBonus: 0 };
    S.board[ap.id] = S.board[ap.id] || [];
    S.board[ap.id].unshift(job);
    if (S.jobs.length) { S.jobs.length = 0; refreshCargo(); }
    this.render();
    show($('tut'));
  },
  stop() { this.active = false; show($('tut'), false); },
  finish() { this.stop(); S.tutorialDone = true; saveGame(); },
  render() {
    const s = this.steps[this.i];
    let body = s.x(Plane);
    if (document.body.classList.contains('touch')) {   // swap key names for the on-screen controls
      const names = { Enter: 'the button', Shift: 'THR slider', Ctrl: 'THR slider', Z: 'THR slider', A: 'stick', D: 'stick', S: 'stick back', F: 'FLAPS', G: 'GEAR', T: 'the tug button', Space: 'BRAKE' };
      body = body.replace(/<kbd>(\w+)<\/kbd>/g, (m, k) => `<b>${names[k] || k}</b>`);
    }
    $('tut').innerHTML = `<h3>${s.t}</h3><div>${body}</div>
      <div class="prog"><span>Step ${this.i + 1} of ${this.steps.length}</span>
      <button class="btn small" id="tutBtn">${s.last ? 'Finish' : 'Skip tutorial'}</button></div>`;
    $('tutBtn').onclick = () => { Audio2.sfx.click(); this.finish(); };
  },
  next() { this.i++; Audio2.sfx.tick(); this.render(); },
  event(name) {
    if (!this.active) return;
    if (name === 'crash') { return; }
    if (name === 'towed') { this.i = 1; this.render(); return; }
    const s = this.steps[this.i];
    if (s.ev === name) this.next();
  },
  update() {
    if (!this.active) return;
    const s = this.steps[this.i];
    if (s.ok && s.ok(Plane)) this.next();
  },
};

/* ==========================================================================
   SECTION 16 — MAIN LOOP AND BOOT
   ========================================================================== */
function startGame(fresh) {
  if (fresh) { S = newSave(); saveGame(); }
  show($('title'), false); show($('hud'));
  G.mode = 'play'; G.overlay = null;
  Sky.tod = S.tod || 9.5;
  setPlane(S.current);
  refreshCargo();
  const ap = apById(S.airport);
  placeAtStand(ap);
  Cam.mode = 'chase'; setCamVisuals();
  genBoard(ap);
  setWeather(fresh || !S.tutorialDone ? 'clear' : pickWeather(), true);
  applyTouchMode();
  G.promptKey = ''; G.warnKey = '';
  if (!S.tutorialDone) Tutorial.start();
  saveGame();
}

let lastT = 0, autosaveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - lastT) / 1000; lastT = now;
  const dt = Math.min(raw, .067);
  if (!(dt > 0)) return;
  G.time += dt;
  const P = Plane, playing = G.mode === 'play' && !G.overlay && !G.tugging;
  const inSim = playing && !$('settings').offsetParent && !$('help').offsetParent;

  if (inSim) {
    updateInput(dt);
    if (P.dead) {
      G.crashT -= dt;
      if (G.crashT <= 0) { G.crashT = 1e9; finishCrash(); }
    } else {
      const n = clamp(Math.ceil(dt / .0084), 1, 8), h = dt / n;
      for (let i = 0; i < n && !P.dead; i++) flightStep(h);
      Land.update(dt);
      updateJobs(dt);
      Tutorial.update();
      /* Fell off the edge of the map? */
      if (Math.max(Math.abs(P.pos.x), Math.abs(P.pos.z)) > HALF + 9000) crash('bounds');
      else if (Math.max(Math.abs(P.pos.x), Math.abs(P.pos.z)) > HALF + 3000 && !G.edgeWarned) { G.edgeWarned = true; toast('Air traffic says: that way is only ocean. Turn back!'); }
      else if (Math.max(Math.abs(P.pos.x), Math.abs(P.pos.z)) < HALF) G.edgeWarned = false;
    }
    Sky.tod = (Sky.tod + dt * 24 / CFG.DAY_SECONDS) % 24;
    updateWeather(dt);
    autosaveT += dt;
    if (autosaveT > 20) { autosaveT = 0; S.tod = Sky.tod; if (P.onGround) storePlane(); saveGame(); }
  } else if (G.mode === 'title') {
    Sky.tod = (Sky.tod + dt * .02) % 24;
    updateWeather(dt);
  }
  updatePlaneVisual(dt);
  updateCamera(dt);
  updateLoadAnim(dt);
  updateSky(dt, P.pos);
  updateWater(dt);
  updateClouds(dt);
  updateAirports(dt);
  updateBlob();
  updateFx(dt, P.onGround && P.gs < .5 && P.thr < .02 && (G.mode === 'title' || !P.dead));
  if (G.mode === 'play') UI.updateHUD(dt);
  renderer.render(scene, camera);
  Q.watch(raw);
  Audio2.update({
    rpm: P.rpm, jet: P.def.jet, on: G.mode === 'play' && !G.overlay ? 1 : .0, air: P.V, rain: Wx.rain,
    stall: !!(P.stalled && inSim), rumble: P.onGround ? clamp(P.gs / 30) * (P.surf === 'runway' || P.surf === 'paved' ? .25 : .7) : 0,
  });
}

function step(msg) { $('loadmsg').textContent = msg; return new Promise(r => setTimeout(r, 16)); }
/* Renders each plane once for the hangar pictures */
function bakePlanePics() {
  const s = new T.Scene(); s.add(new T.HemisphereLight(0xffffff, 0x8888aa, 2)); const l = new T.DirectionalLight(0xffffff, 2.2); l.position.set(-3, 5, 2); s.add(l);
  const cam = new T.PerspectiveCamera(26, 2, .1, 1000), prevClear = new T.Color(); renderer.getClearColor(prevClear);
  renderer.setPixelRatio(1); renderer.setSize(360, 180, false); renderer.setClearColor(0x2b2856);
  for (const d of PLANES) {
    const m = buildPlaneModel(d, true); s.add(m.root);
    const L = Math.max(d.model.len, d.model.span);
    cam.position.set(L * 1.45, L * .5, -L * 1.2); cam.lookAt(0, -d.model.r * .2, 0);
    renderer.render(s, cam);
    UI.planePics[d.id] = renderer.domElement.toDataURL('image/jpeg', .85);
    s.remove(m.root); disposeModel(m);
  }
  renderer.setClearColor(prevClear);
}

async function boot() {
  try { await bootInner(); }
  catch (err) {
    console.error(err);
    $('loadmsg').textContent = 'Oh no, the game could not start: ' + err.message + '. A browser with WebGL is needed.';
  }
}
async function bootInner() {
  if (hasSave()) loadGame();
  VEH_GEO = { fuel: vehicleGeometry('fuel'), tug: vehicleGeometry('tug'), cargo: vehicleGeometry('cargo') };
  await step('Raising mountains…');
  buildHeights();
  await step('Painting the islands…');
  buildSky(); buildTerrainMesh(); buildWater();
  await step('Planting trees…');
  buildTrees(); buildTowns();
  await step('Pouring runways…');
  AIRPORTS.forEach(buildAirport);
  buildGuides(); buildFx(); buildClouds(); buildRain(); buildBlob();
  await step('Waking the mascots (gently)…');
  bakePlanePics();
  UI.bakeMap();
  /* Landing light */
  Plane.light = new T.SpotLight(0xfff2d0, 0, 420, .3, .6, 0);
  setPlane(S.current);
  refreshCargo();
  Q.apply(Settings.quality === 'auto' ? 'med' : Settings.quality);
  Sky.tod = S.tod || 9.5;
  setWeather('clear', true);
  placeAtStand(apById(S.airport));
  bindUI();
  applyTouchMode();
  UI.showTitle();
  $('loadbar').remove();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (G.mode === 'play') { if (!G.overlay) UI.openPause(); S.tod = Sky.tod; if (Plane.onGround) storePlane(); saveGame(); }
      Audio2.suspend();
    } else Audio2.resume();
  });
  window.addEventListener('beforeunload', e => {
    if (G.mode !== 'play') return;
    S.tod = Sky.tod; saveGame();
    if (!Plane.onGround) { e.preventDefault(); e.returnValue = ''; }
  });
  /* First interaction anywhere unlocks audio */
  window.addEventListener('pointerdown', () => Audio2.init(), { once: true });
  lastT = performance.now();
  requestAnimationFrame(frame);
}

/* Small hook for console tinkering and automated playtests */
window.Planezzz = { G, Plane, Input, Wx, Sky, Land, Tutorial, UI, AIRPORTS, PLANES, WEATHER, Q, Cam, get S() { return S; }, groundAt, terrainAt, placePlane, placeAtStand, placeOnRunway, acceptJob, genBoard, setWeather, setPlane, snapCamera, setCamMode, currentNav, stallSpeedNow, flightStep, deliverJobs, fuelCost, chooseApproach, renderer, Audio2, hurtCargo };

boot();
})();
