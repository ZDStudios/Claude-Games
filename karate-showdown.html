<script>
'use strict';
/* =====================================================================
   KARATE SHOWDOWN
   Single-file Canvas2D + Web Audio fighting game.
   Sections:
     1. Config, palette, helpers
     2. Save data (localStorage)
     3. Audio (SFX + looped beat)
     4. Input (keyboard, pointer, touch controls)
     5. Sensei definitions + move data
     6. Fighter drawing (pose skeleton)
     7. Stage / backdrop
     8. Fighter simulation
     9. AI
    10. Match (rounds, hits, effects, HUD)
    11. UI framework + screens (menu, select, results, dojo, tournament)
    12. Dojo mini-games
    13. Online versus
    14. Boot + main loop
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONFIG, PALETTE, HELPERS
   --------------------------------------------------------------------- */
// Online multiplayer config. GAME_KEY comes from the server dashboard
// (Games -> Karate Showdown -> Game key). It is a public client key.
const MP_CONFIG = { url: 'https://mp.zdstudios.network', key: 'pk_1aVoTCYueA_gPu9PoIwNRgdQ' };

const W = 960, H = 540;               // logical canvas size (scaled to fit window)
const FLOOR_Y = 478;                  // screen-space y of the fighting floor
const STAGE_W = 1500;                 // world width (camera pans across it)
const STAGE_MIN = 60, STAGE_MAX = STAGE_W - 60;
const MAX_SEP = 780;                  // fighters can't get further apart than this
const STEP = 1 / 60;                  // fixed simulation step

// Catppuccin Mocha
const C = {
  rosewater: '#f5e0dc', flamingo: '#f2cdcd', pink: '#f5c2e7', mauve: '#cba6f7', red: '#f38ba8',
  maroon: '#eba0ac', peach: '#fab387', yellow: '#f9e2af', green: '#a6e3a1', teal: '#94e2d5',
  sky: '#89dceb', sapphire: '#74c7ec', blue: '#89b4fa', lavender: '#b4befe', text: '#cdd6f4',
  sub1: '#bac2de', sub0: '#a6adc8', ov2: '#9399b2', ov1: '#7f849c', ov0: '#6c7086',
  s2: '#585b70', s1: '#45475a', s0: '#313244', base: '#1e1e2e', mantle: '#181825', crust: '#11111b',
};
const FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const font = (px, w = 700) => `${w} ${px}px ${FONT}`;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const sign = v => v < 0 ? -1 : 1;
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/** Mix a hex colour toward another (t = 0..1). */
function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
/** Canvas text with drop shadow, used for most UI labels. */
function text(g, str, x, y, { size = 20, color = C.text, align = 'center', weight = 700, shadow = true, base = 'middle', alpha = 1 } = {}) {
  g.save(); g.globalAlpha *= alpha; g.font = font(size, weight); g.textAlign = align; g.textBaseline = base;
  if (shadow) { g.fillStyle = 'rgba(17,17,27,.75)'; g.fillText(str, x + Math.max(1, size / 14), y + Math.max(1, size / 12)); }
  g.fillStyle = color; g.fillText(str, x, y); g.restore();
}

/* ---------------------------------------------------------------------
   2. SAVE DATA
   --------------------------------------------------------------------- */
const SAVE_KEY = 'karate-showdown-save-v1';
const SENSEI_IDS = ['kenji', 'aiko', 'ryu', 'mei', 'goro'];
const STAT_KEYS = ['power', 'speed', 'defense', 'special'];
const STAT_MAX = 5;          // max upgrades per stat
const LEVEL_MAX = 10;        // level = 1 + total upgrades (so 9 upgrades to max)

function defaultSave() {
  const s = { v: 1, lp: 0, muted: false, trophies: 0, wins: 0, losses: 0, name: '', lastSensei: 'ryu',
    champs: {}, best: { bag: 0, board: 0, reflex: 0, balance: 0 }, senseis: {} };
  for (const id of SENSEI_IDS) s.senseis[id] = { power: 0, speed: 0, defense: 0, special: 0, alt: false };

const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
  musicMode: null, nextTime: 0, stepIdx: 0, timer: null, bar: 0,
  /** Create/resume the AudioContext. Must be called from a user gesture. */
  init() {
    try {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = save.muted ? 0 : 0.8;
      const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.32; this.musicBus.connect(this.master);
      const len = this.ctx.sampleRate; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.timer = setInterval(() => this.schedule(), 40);
    } catch (e) { this.ctx = null; }
  },
  get ok() { return !!(this.ctx && this.ctx.state !== 'closed'); },
  setMuted(m) {
    save.muted = m; persist();
    if (this.ok) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ctx.currentTime, 0.03);
  },
  /** Simple oscillator voice with pitch slide + exponential decay. */
  tone(freq, dur, { type = 'sine', vol = 0.3, slide = 0, delay = 0, attack = 0.004, bus } = {}) {
    if (!this.ok) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(t); o.stop(t + dur + 0.05);
  },
  /** Filtered noise burst (impacts, whooshes, shakers). */
  noise(dur, { vol = 0.3, type = 'bandpass', freq = 1200, q = 1, slide = 0, delay = 0, attack = 0.002, bus, when } = {}) {
    if (!this.ok) return;
    const t = (when !== undefined ? when : this.ctx.currentTime) + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // ---- SFX ----
  hit(power = 1) {
    this.noise(0.12 + power * 0.06, { vol: 0.5 + power * 0.2, type: 'lowpass', freq: 2600, slide: 0.15 });
    this.tone(140 + Math.random() * 30, 0.16 + power * 0.08, { type: 'sine', vol: 0.55, slide: 0.4 });
    if (power > 1.2) this.tone(70, 0.3, { type: 'triangle', vol: 0.45, slide: 0.5 });
  },
  block() { this.noise(0.08, { vol: 0.35, type: 'highpass', freq: 2500 }); this.tone(520, 0.08, { type: 'square', vol: 0.08, slide: 0.7 }); },
  whoosh() { this.noise(0.14, { vol: 0.12, type: 'bandpass', freq: 900, q: 2, slide: 2.5 }); },
  jump() { this.tone(260, 0.12, { type: 'triangle', vol: 0.12, slide: 1.6 }); },
  land() { this.noise(0.06, { vol: 0.15, type: 'lowpass', freq: 500 }); },
  roar() { this.tone(90, 0.7, { type: 'sawtooth', vol: 0.35, slide: 0.5 }); this.noise(0.7, { vol: 0.4, type: 'lowpass', freq: 900, slide: 0.3 }); this.tone(180, 0.5, { type: 'square', vol: 0.1, slide: 0.45 }); },
  fire() { this.noise(0.4, { vol: 0.35, type: 'bandpass', freq: 600, q: 0.7, slide: 3 }); this.tone(330, 0.25, { type: 'sawtooth', vol: 0.12, slide: 2 }); },
  dive() { this.tone(1200, 0.35, { type: 'triangle', vol: 0.18, slide: 0.3 }); this.noise(0.35, { vol: 0.2, freq: 3000, slide: 0.3 }); },
  venom() { this.tone(700, 0.2, { type: 'sawtooth', vol: 0.12, slide: 0.4 }); this.noise(0.25, { vol: 0.25, type: 'highpass', freq: 4000 }); },
  poison() { this.tone(300 + Math.random() * 80, 0.08, { type: 'sine', vol: 0.06, slide: 1.4 }); },
  iron() { this.tone(110, 0.6, { type: 'triangle', vol: 0.3 }); this.tone(220, 0.6, { type: 'sine', vol: 0.15, delay: 0.02 }); this.tone(660, 0.9, { type: 'sine', vol: 0.06 }); },
  counter() { this.hit(1.6); this.tone(880, 0.4, { type: 'square', vol: 0.08, slide: 0.5 }); },
  parry() { this.tone(1500, 0.18, { type: 'sine', vol: 0.2 }); this.tone(2250, 0.25, { type: 'sine', vol: 0.12, delay: 0.03 }); },
  bell() { [1, 2.76, 5.4].forEach((m, i) => this.tone(330 * m, 1.8 - i * 0.4, { type: 'sine', vol: 0.25 / (i + 1) })); },
  ko() { this.tone(80, 1.2, { type: 'sawtooth', vol: 0.3, slide: 0.4 }); this.noise(1, { vol: 0.4, type: 'lowpass', freq: 1500, slide: 0.1 }); },
  select() { this.tone(660, 0.06, { type: 'square', vol: 0.05 }); },
  confirm() { this.tone(523, 0.08, { type: 'square', vol: 0.07 }); this.tone(784, 0.14, { type: 'square', vol: 0.07, delay: 0.07 }); },
  back() { this.tone(392, 0.1, { type: 'square', vol: 0.06, slide: 0.7 }); },
  coin() { this.tone(988, 0.07, { type: 'square', vol: 0.06 }); this.tone(1319, 0.2, { type: 'square', vol: 0.06, delay: 0.07 }); },
  crack() { this.noise(0.25, { vol: 0.6, type: 'highpass', freq: 1500 }); this.tone(180, 0.2, { type: 'triangle', vol: 0.3, slide: 0.5 }); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.35, { type: 'square', vol: 0.07, delay: i * 0.12 })); },
  fail() { this.tone(300, 0.3, { type: 'square', vol: 0.06, slide: 0.6 }); },

  // ---- Music: 16-step taiko + shaker + pentatonic koto, two intensities ----
  setMusic(mode) { this.musicMode = mode; },
  schedule() {
    if (!this.ok || !this.musicMode) return;
    const ctx = this.ctx, spb = 60 / (this.musicMode === 'fight' ? 112 : 92) / 4;
    if (this.nextTime < ctx.currentTime) this.nextTime = ctx.currentTime + 0.05;
    while (this.nextTime < ctx.currentTime + 0.25) {
      this.playStep(this.stepIdx, this.nextTime, this.musicMode === 'fight');
      this.nextTime += spb; this.stepIdx = (this.stepIdx + 1) % 16; if (this.stepIdx === 0) this.bar++;
    }
  },
  playStep(i, t, fight) {
    const b = this.musicBus, ctx = this.ctx;
    const drum = (f, v, d) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.45, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(b); o.start(t); o.stop(t + d + 0.02); };
    const kicks = fight ? [0, 3, 6, 8, 10, 11, 14] : [0, 6, 8, 14];
    if (kicks.includes(i)) drum(i % 8 === 0 ? 110 : 150, i % 8 === 0 ? 0.9 : 0.5, 0.32);
    if (fight && (i === 4 || i === 12)) this.noise(0.12, { vol: 0.35, type: 'bandpass', freq: 1800, q: 0.8, bus: b, when: t });
    if (i % 2 === 0 || fight) this.noise(0.04, { vol: i % 4 === 2 ? 0.12 : 0.05, type: 'highpass', freq: 7000, bus: b, when: t });
    // koto melody: D minor pentatonic, deterministic per bar
    const scale = [293.66, 349.23, 392, 440, 523.25, 587.33, 698.46];
    const pat = [[0, 2, 4], [1, 3, 4, 6], [0, 4, 3], [2, 1, 0, 4]][this.bar % 4];
    const slots = fight ? [0, 3, 6, 10, 12] : [0, 6, 10];
    const si = slots.indexOf(i);
    if (si >= 0) {
      const f = scale[pat[si % pat.length]] * (fight ? 1 : 0.5) * (this.bar % 8 >= 4 && si === 0 ? 2 : 1);
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(b); o.start(t); o.stop(t + 0.65);
    }
    if (i === 0) { // bass drone
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = [73.4, 87.3, 98, 65.4][this.bar % 4];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
      o.connect(g); g.connect(b); o.start(t); o.stop(t + 2.3);
    }
  },
};

const Input = {
  down: new Set(),      // keys currently held
  pressed: new Set(),   // keys pressed this frame (menus)
  latched: new Set(),   // keys pressed since the last sim step (so quick taps are never lost)
  pointers: new Map(),  // active pointers id -> {x,y}
  isTouch: false,
  touch: { l: false, r: false, u: false, d: false, p: false, k: false, s: false, b: false },
  touchPause: false,
  endFrame() { this.pressed.clear(); },
  consumeLatched() { this.latched.clear(); },
};
const KEYMAP = {
  p1: { l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'], p: ['KeyF'], k: ['KeyG'], s: ['KeyH'] },
  p2: { l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'], p: ['KeyJ'], k: ['KeyK'], s: ['KeyL'] },
};
KEYMAP.both = {}; for (const k in KEYMAP.p1) KEYMAP.both[k] = KEYMAP.p1[k].concat(KEYMAP.p2[k]);
const isTyping = () => document.activeElement && document.activeElement.tagName === 'INPUT';

addEventListener('keydown', e => {
  Sound.init();
  if (isTyping() && !['Enter', 'Escape', 'Tab'].includes(e.key)) return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { Input.pressed.add(e.code); Input.latched.add(e.code); }
  Input.down.add(e.code);
});
addEventListener('keyup', e => Input.down.delete(e.code));
addEventListener('blur', () => { Input.down.clear(); for (const k in Input.touch) Input.touch[k] = false; Input.pointers.clear(); });

/** Menu-style navigation from either keyboard side. */
const Nav = {
  up: () => ['KeyW', 'ArrowUp'].some(k => Input.pressed.has(k)),
  down: () => ['KeyS', 'ArrowDown'].some(k => Input.pressed.has(k)),
  left: () => ['KeyA', 'ArrowLeft'].some(k => Input.pressed.has(k)),
  right: () => ['KeyD', 'ArrowRight'].some(k => Input.pressed.has(k)),
  ok: () => ['Enter', 'Space', 'KeyF', 'KeyJ', 'NumpadEnter'].some(k => Input.pressed.has(k)),
  back: () => ['Escape', 'Backspace'].some(k => Input.pressed.has(k)),
};

/** Held-state input for a fighter from one or more key maps (+ optional touch). */
function readKeys(map, useTouch) {
  const o = {};
  for (const a in map) o[a] = map[a].some(c => Input.down.has(c) || Input.latched.has(c)) || (useTouch && Input.touch[a]);
  o.b = useTouch && Input.touch.b;
  return o;
}

      if (ok) { this.plan = 'special'; this.planT = 0.15; return; }
    }
    if (opp.state === 'down' || opp.state === 'rise') { this.plan = Math.random() < 0.5 ? 'wait' : 'approach'; this.planT = 0.2; return; }
    if (dist > reachK + 30) {

    } else if (Math.random() < P.aggro) {

      else { this.btn = 'k'; this.low = r < 0.3; }
    } else {
      this.plan = choice(['retreat', 'wait', 'crouch', 'approach']); this.planT = rand(0.15, 0.4);

}

/* ---------------------------------------------------------------------
   10. MATCH: rounds, collisions, hits, effects, HUD
   --------------------------------------------------------------------- */
class Match {
  /**
   * cfg = { p: [{sensei, lv, name, ctrl}, {...}], puppet?: bool (online guest renders host snapshots),
   *         host?: bool (record fx for network) }
   */
  constructor(cfg) {
    this.cfg = cfg;
    const mirror = cfg.p[0].sensei === cfg.p[1].sensei;
    this.f = [new Fighter(cfg.p[0].sensei, cfg.p[0].lv, 0, cfg.p[0].name, false), new Fighter(cfg.p[1].sensei, cfg.p[1].lv, 1, cfg.p[1].name, mirror)];
    this.ctrl = [cfg.p[0].ctrl, cfg.p[1].ctrl];
    this.round = 1; this.wins = [0, 0]; this.time = 0; this.acc = 0;
    this.projectiles = []; this.parts = []; this.rings = []; this.floaters = []; this.banners = [];
    this.shakeT = 0; this.shakeA = 0; this.hitstop = 0; this.slow = 0; this.netFx = [];
    this.trail = [this.f[0].maxHp, this.f[1].maxHp];

  }
  startRound() {

    for (const f of this.f) f.state = 'bow';
    this.trail = [this.f[0].maxHp, this.f[1].maxHp];
    this.projectiles = []; this.phase = 'intro'; this.phaseT = 0; this.timer = 99; this.fightSaid = false; this.koWinner = null;
    this.emit('banner', `ROUND ${this.round}`, C.text, 64);

  /** Gameplay effect: performed locally and (if host) queued for the network. */
  emit(type, ...a) { if (this.cfg.puppet) return; if (this.cfg.host) this.netFx.push([type, ...a]); this.fx(type, ...a); }
  fx(type, x, y, a, b) {
    const P = (n, o) => { for (let i = 0; i < n; i++) this.parts.push(Object.assign({ x, y, vx: rand(-1, 1) * (o.sp || 300), vy: rand(-0.3, 1) * (o.sp || 300), life: 0, max: rand(0.25, 0.5) * (o.lm || 1), size: rand(2, 5) * (o.sz || 1), grav: o.grav ?? 900, color: choice(o.cols) }, o.extra || {})); };
    switch (type) {
      case 'hit': P(10 + a * 8, { cols: [C.yellow, C.peach, '#ffffff', C.rosewater], sp: 380 + a * 120 }); this.rings.push({ x, y, r: 8, max: 40 + a * 25, life: 0, dur: 0.18, color: C.yellow, w: 5 }); Sound.hit(a); this.shake(3 + a * 5); break;
      case 'block': P(8, { cols: [C.blue, C.sky, '#ffffff'], sp: 260 }); this.rings.push({ x, y, r: 6, max: 30, life: 0, dur: 0.14, color: C.sky, w: 4 }); Sound.block(); this.shake(2); break;
      case 'whoosh': Sound.whoosh(); break;
      case 'jump': P(6, { cols: [C.s2, C.ov0], sp: 120, grav: 200, extra: { vy: rand(10, 60) } }); Sound.jump(); break;
      case 'land': P(8, { cols: [C.s2, C.ov0, '#4a3634'], sp: 160, grav: 300 }); Sound.land(); break;
      case 'roarCharge': P(18, { cols: [C.peach, C.yellow], sp: 200, grav: -200, lm: 1.2 }); Sound.tone(80, 0.35, { type: 'sawtooth', vol: 0.15, slide: 1.5 }); break;
      case 'roar': for (let i = 0; i < 3; i++) this.rings.push({ x, y, r: 20, max: 250 + i * 40, life: -i * 0.06, dur: 0.45, color: i ? C.yellow : C.peach, w: 10 - i * 3 }); P(30, { cols: [C.peach, C.yellow, C.maroon], sp: 520, grav: 300 }); Sound.roar(); break;
      case 'fire': Sound.fire(); break;
      case 'fireHit': P(26, { cols: [C.red, C.peach, C.yellow], sp: 380, grav: -100, sz: 1.6 }); this.rings.push({ x, y, r: 10, max: 70, life: 0, dur: 0.25, color: C.peach, w: 6 }); break;
      case 'dive': P(14, { cols: [C.sky, '#ffffff', C.sapphire], sp: 200, grav: 0, lm: 1.4 }); Sound.dive(); break;
      case 'venom': P(18, { cols: [C.green, C.teal], sp: 200, grav: -50, sz: 1.4 }); Sound.venom(); break;
      case 'poison': P(3, { cols: [C.green, C.teal], sp: 40, grav: -120, lm: 2, extra: { bubble: true } }); Sound.poison(); break;
      case 'iron': this.rings.push({ x, y, r: 30, max: 120, life: 0, dur: 0.4, color: C.lavender, w: 6 }); P(16, { cols: [C.lavender, C.blue, '#ffffff'], sp: 180, grav: 0 }); Sound.iron(); break;
      case 'counter': P(30, { cols: [C.lavender, '#ffffff', C.yellow], sp: 520 }); this.rings.push({ x, y, r: 10, max: 120, life: 0, dur: 0.3, color: '#ffffff', w: 8 }); Sound.counter(); this.shake(12); break;
      case 'parry': this.rings.push({ x, y, r: 10, max: 90, life: 0, dur: 0.25, color: '#ffffff', w: 5 }); P(14, { cols: ['#ffffff', C.green], sp: 300 }); Sound.parry(); break;
      case 'ko': Sound.ko(); this.shake(16); break;
      case 'bell': Sound.bell(); break;
      case 'shake': this.shake(x); break;
      case 'text': this.floaters.push({ x, y, str: a, color: b || C.yellow, life: 0 }); break;
      case 'banner': this.banners = [{ str: x, color: y || C.text, size: a || 72, life: 0 }]; break;
    }
  }
  shake(a) { this.shakeA = Math.max(this.shakeA, a); this.shakeT = 0.25; }
  projectileNear(f) { return this.projectiles.some(p => p.owner !== f.side && Math.abs(p.x - f.x) < 300); }
  spawnProjectile(f) {
    if (this.projectiles.some(p => p.owner === f.side)) return;
    this.projectiles.push({ id: ++this.pid, x: f.x + f.facing * 55, y: 96 * f.def.scale, vx: f.facing * 640, owner: f.side, t: 0 });
    this.emit('fire', f.x, 96);
  }

  /** Apply a hit from attacker a to defender d with move m. */
  resolveHit(a, d, m, o = {}) {
    const dir = o.dir || (d.x >= a.x ? 1 : -1);

    const hx = d.x - dir * 18, hy = d.y + (m.box ? m.box[1] + m.box[3] / 2 : 90);

      this.emit('iron', d.x, 90); this.emit('text', d.x, 175, 'IRON!', C.lavender); this.hitstop = 0.12;

      this.emit('parry', hx, hy); this.emit('text', d.x, 175, 'PARRY!', C.green); this.hitstop = 0.14;
      d.energy = Math.min(100, d.energy + 10);

    }
    if (canBlock) {

      d.setState('blockstun'); d.hs = m.hs * 0.7; d.vx = dir * (m.kb * 0.7 + 60) * (d.def.rooted ? 0.45 : 1); d.crouching = crouch;
      if (d.x <= STAGE_MIN + 2 || d.x >= STAGE_MAX - 2) a.vx = -dir * 220;
      d.energy = Math.min(100, d.energy + 4); a.energy = Math.min(100, a.energy + 2);
      this.emit('block', hx, hy); this.hitstop = 0.05;

    if (d.hasArmor()) {   // super-armour: take the damage, ignore the hitstun once

    else if (d.isThreat()) { dmg *= 1.15; if (a.combo === 1) this.emit('text', d.x, 175, 'COUNTER', C.peach); }
    d.hp -= dmg; d.flash = 0.1; d.move = null; d.ironT = 0; d.sp = 0; d.combo = 0;
    a.energy = Math.min(100, a.energy + dmg * 0.12); d.energy = Math.min(100, d.energy + dmg * 0.08);

    else if (m.launch || d.y > 0) { d.setState('hit'); d.hs = m.hs; d.vy = m.launch || 330; d.y = Math.max(d.y, 1); d.vx = dir * m.kb * kbm * 0.7; d.launched = true; }
    else { d.setState('hit'); d.hs = m.hs; d.vx = dir * m.kb * kbm; }

  knockOut(d, dir) { d.hp = 0; d.setState('ko'); d.vy = 520; d.y = Math.max(d.y, 1); d.vx = dir * 380; d.poisonT = 0; }

  /** Real-time update: fixed sim steps, slow-mo, hit-pause. */
  update(dt) {
    let scale = 1;
    if (this.slow > 0) { this.slow -= dt; scale = 0.25; }
    if (!this.cfg.puppet) {
      this.acc = Math.min(this.acc + dt * scale, STEP * 6);
      while (this.acc >= STEP) { this.acc -= STEP; this.step(STEP); }
    } else this.puppetUpdate(dt * scale);
    this.updateFx(dt * scale);
    // camera follows the midpoint
    const mid = (this.f[0].x + this.f[1].x) / 2;
    this.camX = lerp(this.camX, clamp(mid - W / 2, 0, STAGE_W - W), 1 - Math.exp(-dt * 6));
    for (let i = 0; i < 2; i++) { const hp = this.f[i].hp; this.trail[i] = this.trail[i] > hp ? Math.max(hp, this.trail[i] - this.f[i].maxHp * 0.35 * dt) : hp; }
  }
  step(dt) {
    this.time += dt; this.phaseT += dt;
    if (this.hitstop > 0) { this.hitstop -= dt; Input.consumeLatched(); return; }
    const live = this.phase === 'fight';
    const inp = [0, 1].map(i => live ? this.ctrl[i].get(this.f[i], this.f[1 - i], this, dt) : NONE);
    Input.consumeLatched();
    if (this.phase === 'intro') {
      if (this.phaseT >= 1.0 && !this.fightSaid) { this.fightSaid = true; for (const f of this.f) f.toIdle(); this.emit('banner', 'FIGHT!', C.peach, 96); }
      if (this.phaseT >= 1.6) { this.phase = 'fight'; this.phaseT = 0; }
    } else if (live) {
      this.timer -= dt;
      if (this.timer <= 0) { this.timer = 0; this.endRound('time'); }
    } else if (this.phase === 'ko' || this.phase === 'time') {
      if (this.phaseT >= 1.4 && !this.winPosed) {
        this.winPosed = true;
        const w = this.koWinner;
        if (w !== null && w !== undefined && w >= 0) { const wf = this.f[w]; if (wf.hp > 0) { wf.toIdle(); wf.state = 'win'; } }
        if (w >= 0 && this.f[w].hp >= this.f[w].maxHp) this.emit('banner', 'PERFECT!', C.yellow, 72);
        else if (w >= 0) this.emit('banner', `${this.f[w].name} WINS`, C.text, 52);
        else this.emit('banner', 'DRAW', C.text, 64);
      }
      if (this.phaseT >= 3.0) this.nextRound();

  }
  endRound(reason) {
    const r0 = this.f[0].hp / this.f[0].maxHp, r1 = this.f[1].hp / this.f[1].maxHp;
    this.koWinner = Math.abs(r0 - r1) < 0.001 ? -1 : r0 > r1 ? 0 : 1;
    this.phase = 'time'; this.phaseT = 0; this.winPosed = false;
    this.emit('banner', 'TIME!', C.yellow, 96); this.emit('bell');
  }
  nextRound() {
    let w = this.koWinner;
    if (w < 0 && this.round >= 5) w = Math.random() < 0.5 ? 0 : 1;   // endless draws: coin flip

      return;
    }
    this.round++; this.startRound();
  }
  separate() {
    const [a, b] = this.f;
    const pass = f => (f.state === 'special' && f.def.special.id === 'venom' && f.sp === 1) || f.state === 'ko' || f.state === 'down';
    const minD = 42 * (a.def.scale + b.def.scale) / 2;
    if (!pass(a) && !pass(b) && Math.abs(a.y - b.y) < 100) {
      const dx = b.x - a.x, ad = Math.abs(dx);
      if (ad < minD) {
        const push = (minD - ad) / 2, s = dx === 0 ? (a.facing > 0 ? 1 : -1) : sign(dx);
        a.x -= s * push; b.x += s * push;

        if (a.x > STAGE_MAX) { b.x -= a.x - STAGE_MAX; a.x = STAGE_MAX; } if (b.x > STAGE_MAX) { a.x -= b.x - STAGE_MAX; b.x = STAGE_MAX; }
      }
    }
    // keep both on camera
    if (b.x - a.x > MAX_SEP) { const ex = (b.x - a.x - MAX_SEP) / 2; a.x += ex; b.x -= ex; }
    if (a.x - b.x > MAX_SEP) { const ex = (a.x - b.x - MAX_SEP) / 2; a.x -= ex; b.x += ex; }
  }
  stepProjectiles(dt) {
    for (const p of this.projectiles) {

      if (Math.random() < 0.8) this.parts.push({ x: p.x - sign(p.vx) * 14, y: p.y + rand(-10, 10), vx: -p.vx * 0.2 + rand(-40, 40), vy: rand(-40, 60), life: 0, max: rand(0.15, 0.35), size: rand(3, 7), grav: -150, color: choice([C.red, C.peach, C.yellow]) });

      const tgt = this.f[1 - p.owner];
      if (!p.dead && rectsOverlap({ x: p.x - 20, y: p.y - 17, w: 40, h: 34 }, tgt.hurt()) && tgt.invuln <= 0 && tgt.state !== 'down' && tgt.state !== 'ko' && tgt.state !== 'rise') {

    for (const t of this.floaters) t.life += dt; this.floaters = this.floaters.filter(t => t.life < 1.1);
    for (const b of this.banners) b.life += dt; this.banners = this.banners.filter(b => b.life < 1.3);
    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shakeA = 0; }
    for (const f of this.f) if (this.cfg.puppet) { f.anim += dt; if (f.flash > 0) f.flash -= dt; }
  }

  // ---------- networking (host -> guest) ----------
  snapshot() {
    return { ph: this.phase, r: this.round, w: this.wins, tm: Math.ceil(this.timer), sl: this.slow > 0 ? 1 : 0,
      f: this.f.map(f => [Math.round(f.x), Math.round(f.y), f.facing, f.state, +f.t.toFixed(3), f.move ? f.move.name : 0, +f.mt.toFixed(3), f.sp | 0,
        Math.round(f.hp), Math.round(f.energy), f.combo | 0, f.poisonT > 0 ? 1 : 0, f.flash > 0 ? 1 : 0, f.blockPose ? 1 : 0, f.crouching ? 1 : 0, f.ironT > 0 ? 1 : 0, f.flip ? 1 : 0]),
      pj: this.projectiles.map(p => [Math.round(p.x), Math.round(p.y), sign(p.vx), p.owner, p.id]) };
  }
  applySnapshot(s) {
    this.phase = s.ph; this.round = s.r; this.wins = s.w; this.timer = s.tm; if (s.sl && this.slow <= 0) this.slow = 0.3;
    s.f.forEach((a, i) => {
      const f = this.f[i];
      f.tx = a[0]; f.ty = a[1]; f.facing = a[2];
      if (f.state !== a[3] || Math.abs(f.t - a[4]) > 0.12) f.t = a[4];
      f.state = a[3]; f.move = a[5] ? f.mv[a[5]] : null;
      if (Math.abs(f.mt - a[6]) > 0.08) f.mt = a[6];
      f.sp = a[7]; f.hp = a[8]; f.energy = a[9]; f.combo = a[10]; f.poisonT = a[11]; if (a[12]) f.flash = 0.06;
      f.blockPose = !!a[13]; f.crouching = !!a[14]; f.ironT = a[15]; f.flip = !!a[16];
      if (f.x === undefined || Math.abs(f.x - a[0]) > 200) { f.x = a[0]; f.y = a[1]; }
    });
    const old = new Map(this.projectiles.map(p => [p.id, p]));
    this.projectiles = s.pj.map(a => { const o = old.get(a[4]); return { x: o ? o.x : a[0], tx: a[0], y: a[1], vx: a[2] * 640, owner: a[3], id: a[4], t: 0 }; });
    this.gotSnap = true;
  }
  puppetUpdate(dt) {
    this.time += dt;
    for (const f of this.f) {
      f.t += dt; if (f.state === 'attack') f.mt += dt;
      if (f.tx !== undefined) { const k = 1 - Math.exp(-dt * 18); f.x = lerp(f.x, f.tx, k); f.y = lerp(f.y, f.ty, k); }
    }

    for (const i of order) this.drawFighterFx(g, this.f[i], cx, t);
    // projectiles
    for (const p of this.projectiles) {

      const gl = g.createRadialGradient(x, y, 2, x, y, 46); gl.addColorStop(0, rgba(C.yellow, 0.9)); gl.addColorStop(0.4, rgba(C.peach, 0.6)); gl.addColorStop(1, rgba(C.red, 0));
      g.fillStyle = gl; g.beginPath(); g.arc(x, y, 46, 0, 7); g.fill();
      g.fillStyle = C.red; g.beginPath(); g.moveTo(x + d * 22, y); g.quadraticCurveTo(x - d * 10, y - 22, x - d * 40, y - 8 + Math.sin(t * 30) * 4); g.quadraticCurveTo(x - d * 18, y, x - d * 40, y + 8); g.quadraticCurveTo(x - d * 10, y + 22, x + d * 22, y); g.fill();
      g.fillStyle = C.yellow; g.beginPath(); g.arc(x + d * 6, y, 11, 0, 7); g.fill(); g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x + d * 8, y, 5, 0, 7); g.fill();

      else g.fillRect(p.x - cx - p.size / 2, SY(p.y) - p.size / 2, p.size, p.size);
    }
    g.globalAlpha = 1;
    for (const ft of this.floaters) {
      const k = ft.life / 1.1;
      if (ft.y < 0) text(g, ft.str, ft.x, 120 - k * 10, { size: 26, color: ft.color, alpha: 1 - k * k });
      else text(g, ft.str, ft.x - cx, SY(ft.y) - k * 40, { size: 20, color: ft.color, alpha: 1 - k * k });
    }
    g.restore();
    Petals.draw(g, this.camX);
    this.drawHUD(g);

      const k = b.life / 1.3, s = b.life < 0.2 ? easeOutBack(b.life / 0.2) : 1, a = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      g.save(); g.translate(W / 2, H / 2 - 40); g.scale(s, s);

      g.restore();
    }
  }
  drawFighterFx(g, f, cx, t) {
    const x = f.x - cx, y = FLOOR_Y - f.y;

      const gl = g.createRadialGradient(x, y - 70, 10, x, y - 70, 110); gl.addColorStop(0, rgba(C.mauve, 0.18 + Math.sin(t * 6) * 0.06)); gl.addColorStop(1, rgba(C.mauve, 0));
      g.fillStyle = gl; g.fillRect(x - 110, y - 180, 220, 220);

    }

    if (f.state === 'special' && f.def.special.id === 'dive' && f.sp === 1) { g.globalAlpha = 0.3; drawFighter(g, f, x - f.facing * 30, y - 30); g.globalAlpha = 1; }
    if (f.invuln > 0 && f.state === 'rise' && Math.floor(t * 20) % 2) g.globalAlpha = 0.5;
    drawFighter(g, f, x, y);
    g.globalAlpha = 1;
    if (f.poisonT > 0) { g.fillStyle = rgba(C.green, 0.15 + Math.sin(t * 8) * 0.05); g.beginPath(); g.ellipse(x, y - 75 * f.def.scale, 34, 80, 0, 0, 7); g.fill(); }
    if (f.state === 'stun') for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.1; text(g, '★', x + Math.cos(a) * 26, y - 165 * f.def.scale + Math.sin(a) * 7, { size: 16, color: C.yellow, shadow: false }); }
    if (f.counterBuff > 0) text(g, '⚡', x, y - 180 * f.def.scale, { size: 18, color: C.green, shadow: false });
  }
  drawHUD(g) {
    const t = globalTime;
    for (let i = 0; i < 2; i++) {
      const f = this.f[i], left = i === 0, bw = 360, x0 = left ? 24 : W - 24 - bw, y0 = 22;
      // name + sensei

      text(g, f.def.way.toUpperCase(), left ? x0 + bw : x0, y0 - 2, { size: 10, align: left ? 'right' : 'left', base: 'bottom', color: C.sub0 });
      roundRect(g, x0 - 3, y0 - 1, bw + 6, 26, 6); g.fillStyle = C.crust; g.fill();
      const r = clamp(f.hp / f.maxHp, 0, 1), tr = clamp(this.trail[i] / f.maxHp, 0, 1);

      g.fillStyle = hcol; g.fillRect(left ? x0 + bw * (1 - r) : x0, y0 + 2, bw * r, 20);

      if (f.poisonT > 0) { g.fillStyle = rgba(C.green, 0.35 + Math.sin(t * 10) * 0.15); g.fillRect(x0, y0 + 2, bw, 20); }
      // energy bar
      const ew = 220, ex = left ? x0 : x0 + bw - ew, ey = y0 + 30, er = clamp(f.energy / f.specialCost, 0, 1);
      roundRect(g, ex - 2, ey - 2, ew + 4, 12, 4); g.fillStyle = C.crust; g.fill();
      g.fillStyle = er >= 1 ? (Math.floor(t * 6) % 2 ? C.mauve : C.pink) : C.mauve; g.fillRect(left ? ex : ex + ew * (1 - er), ey, ew * er, 8);
      text(g, er >= 1 ? `${f.def.special.name} READY!` : f.def.special.name, left ? ex : ex + ew, ey + 20, { size: 10, align: left ? 'left' : 'right', color: er >= 1 ? C.pink : C.ov1 });
      // round pips
      for (let k = 0; k < 2; k++) {
        const px = left ? x0 + bw - 10 - k * 20 : x0 + 10 + k * 20, py = y0 + 36;
        g.fillStyle = C.crust; g.beginPath(); g.arc(px, py, 7, 0, 7); g.fill();
        g.fillStyle = this.wins[i] > k ? C.yellow : C.s1; g.beginPath(); g.arc(px, py, 5, 0, 7); g.fill();
      }
    }
    // timer
    roundRect(g, W / 2 - 34, 12, 68, 48, 8); g.fillStyle = C.crust; g.fill(); g.strokeStyle = C.s1; g.lineWidth = 2; g.stroke();
    const tm = Math.ceil(this.timer);
    text(g, String(tm), W / 2, 37, { size: 30, color: tm <= 10 && this.phase === 'fight' ? C.red : C.text, weight: 800 });
    text(g, `ROUND ${this.round}`, W / 2, 72, { size: 11, color: C.sub0 });
  }
}

/* ---------------------------------------------------------------------
   11. UI FRAMEWORK + SCREENS
   --------------------------------------------------------------------- */
let screen = null, globalTime = 0;
function setScreen(s) {
  if (screen && screen.exit) screen.exit();
  screen = s; Input.pressed.clear(); Input.latched.clear(); Input.touchPause = false;
  hideFields();
  if (s.enter) s.enter();
}
function hideFields() { for (const id of ['nameField', 'codeField']) document.getElementById(id).style.display = 'none'; if (isTyping()) document.activeElement.blur(); }

class Screen {
  constructor() { this.buttons = []; this.focus = 0; this.t = 0; }
  btn(o) { const b = Object.assign({ x: 0, y: 0, w: 220, h: 50, label: '', sub: '', color: C.mauve, size: 18, enabled: true, pop: 0 }, o); this.buttons.push(b); return b; }
  visible() { return this.buttons.filter(b => !b.hidden); }
  update(dt) { this.t += dt; this.nav(); }
  nav() {
    const bs = this.visible().filter(b => b.enabled);
    if (Nav.back() && this.onBack) { Sound.back(); this.onBack(); return; }
    if (!bs.length) return;
    let cur = bs.indexOf(this.buttons[this.focus]); if (cur < 0) cur = 0;
    const dirs = [[Nav.up(), 0, -1], [Nav.down(), 0, 1], [Nav.left(), -1, 0], [Nav.right(), 1, 0]];
    for (const [on, dx, dy] of dirs) {
      if (!on) continue;
      const a = bs[cur], ax = a.x + a.w / 2, ay = a.y + a.h / 2; let best = null, bd = 1e9;
      for (const b of bs) {
        if (b === a) continue; const vx = b.x + b.w / 2 - ax, vy = b.y + b.h / 2 - ay;
        const along = vx * dx + vy * dy; if (along <= 4) continue;
        const d = along + Math.abs(vx * dy + vy * dx) * 2.5; if (d < bd) { bd = d; best = b; }
      }
      if (best) { this.focus = this.buttons.indexOf(best); Sound.select(); }
    }
    if (this.buttons[this.focus] && !this.buttons[this.focus].enabled) this.focus = this.buttons.indexOf(bs[0]);
    if (Nav.ok()) { const b = this.buttons[this.focus]; if (b && b.enabled && !b.hidden) this.press(b); }
  }
  press(b) { b.pop = 1; Sound.confirm(); if (b.fn) b.fn(b); }
  pointerDown(x, y) {
    for (const b of this.visible()) if (b.enabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { this.focus = this.buttons.indexOf(b); this.press(b); return true; }
    return false;
  }
  pointerMove(x, y) { this.visible().forEach(b => { if (b.enabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h && this.buttons[this.focus] !== b) { this.focus = this.buttons.indexOf(b); } }); }
  drawButtons(g) {
    for (const b of this.visible()) {
      const f = this.buttons[this.focus] === b && b.enabled;
      b.pop = Math.max(0, b.pop - 0.08); const s = 1 + (f ? 0.04 + Math.sin(globalTime * 6) * 0.01 : 0) + b.pop * 0.06;
      g.save(); g.translate(b.x + b.w / 2, b.y + b.h / 2); g.scale(s, s);
      roundRect(g, -b.w / 2, -b.h / 2, b.w, b.h, 10);
      g.fillStyle = f ? mix(C.s0, b.color, 0.22) : rgba(C.s0, 0.92); g.fill();
      g.lineWidth = f ? 3 : 2; g.strokeStyle = b.enabled ? (f ? b.color : C.s2) : C.s1; g.stroke();
      if (f) { g.fillStyle = b.color; g.fillRect(-b.w / 2 + 8, -b.h / 2 + 10, 4, b.h - 20); }
      const col = b.enabled ? (f ? C.text : C.sub1) : C.ov0;
      if (b.sub) { text(g, b.label, 0, -8, { size: b.size, color: col }); text(g, b.sub, 0, 13, { size: 11, color: b.enabled ? C.sub0 : C.ov0, weight: 400 }); }
      else text(g, b.label, 0, 1, { size: b.size, color: col });
      g.restore();
    }
  }
}

/** Shared menu backdrop: slowly panning dojo + dark veil + petals. */
function drawMenuBG(g, veil = 0.55) {
  const cam = (Math.sin(globalTime * 0.05) * 0.5 + 0.5) * (STAGE_W - W);
  Stage.draw(g, cam, globalTime);
  const v = g.createLinearGradient(0, 0, 0, H); v.addColorStop(0, rgba(C.crust, veil * 0.8)); v.addColorStop(1, rgba(C.crust, veil));
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  Petals.draw(g, cam);
}

function previewView(id, state, t, lvOverride) {

}

const TouchPad = {
  dpad: { x: 120, y: 410, r: 78 },
  btns: [
    { k: 'p', label: 'P', x: 760, y: 440, r: 38, c: C.peach }, { k: 'k', label: 'K', x: 856, y: 395, r: 38, c: C.red },
    { k: 's', label: 'SP', x: 856, y: 488, r: 34, c: C.mauve }, { k: 'b', label: 'BLK', x: 668, y: 478, r: 32, c: C.blue },
  ],
  pause: { x: W / 2, y: 100, r: 20 },
  update() {
    const T = Input.touch; for (const k in T) T[k] = false;
    let pause = false;
    for (const p of Input.pointers.values()) {
      if (p.type !== 'touch') continue;
      const dx = p.x - this.dpad.x, dy = p.y - this.dpad.y;
      if (Math.hypot(dx, dy) < this.dpad.r * 1.5 && p.x < W / 2) {
        if (Math.hypot(dx, dy) > 14) { const a = Math.atan2(dy, dx); T.r = Math.cos(a) > 0.38; T.l = Math.cos(a) < -0.38; T.d = Math.sin(a) > 0.45; T.u = Math.sin(a) < -0.45; }
        continue;
      }
      for (const b of this.btns) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.25) T[b.k] = true;
      if (Math.hypot(p.x - this.pause.x, p.y - this.pause.y) < 26) pause = true;
    }
    Input.touchPause = pause && !this.pauseHeld; this.pauseHeld = pause;
  },

    const T = Input.touch, d = this.dpad;

    const arr = [['u', 0, -1, '▲'], ['d', 0, 1, '▼'], ['l', -1, 0, '◀'], ['r', 1, 0, '▶']];
    for (const [k, x, y, s] of arr) text(g, s, d.x + x * d.r * 0.62, d.y + y * d.r * 0.62, { size: 20, color: T[k] ? C.yellow : C.sub0, shadow: false });
    for (const b of this.btns) {
      g.fillStyle = T[b.k] ? b.c : C.crust; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.strokeStyle = b.c; g.lineWidth = 3; g.stroke();
      text(g, b.label, b.x, b.y, { size: b.label.length > 1 ? 13 : 20, color: T[b.k] ? C.crust : b.c, shadow: false });
    }
    g.fillStyle = C.crust; g.beginPath(); g.arc(this.pause.x, this.pause.y, 18, 0, 7); g.fill(); text(g, 'II', this.pause.x, this.pause.y + 1, { size: 13, shadow: false });
    g.globalAlpha = 1;
  },

// ---------- Game-mode launchers ----------
function cpuLevel(n) { const lv = { power: 0, speed: 0, defense: 0, special: 0, alt: false }; for (let i = 0; i < n; i++) { const k = choice(STAT_KEYS); if (lv[k] < STAT_MAX) lv[k]++; } return lv; }

function startQuickFight(diff, sensei, botSensei = null, backTo = null) {
  const cpuS = botSensei || choice(SENSEI_IDS), lvN = { easy: 0, medium: 3, hard: 6 }[diff];
  const name = save.name || 'YOU';
  const cfg = { p: [
    { sensei, lv: levelObj(sensei), name, ctrl: new KeyCtrl(KEYMAP.both, true) },
    { sensei: cpuS, lv: cpuLevel(lvN), name: 'CPU ' + choice(CPU_NAMES), ctrl: new AICtrl(diff) }] };
  setScreen(new FightScreen(cfg, {
    onQuit: () => backTo ? backTo() : setScreen(new MainMenu()),

      let lp = won ? { easy: 20, medium: 35, hard: 55 }[diff] : 5; if (won && res.perfect) lp += 10;
      if (won) save.wins++; else save.losses++; awardLP(lp, won ? 'victory' : 'for training');
      setScreen(new ResultScreen({ title: won ? 'VICTORY!' : 'DEFEAT', color: won ? C.yellow : C.red,
        view: { def: f.def, facing: 1, state: 'win', gi: f.gi, belt: f.belt },
        lines: [[`${f.name} wins ${res.wins[res.winner]}-${res.wins[1 - res.winner]}`, C.text], [`${f.def.full} · ${f.def.way}`, C.sub0], [`+${lp} LP`, C.yellow], [`Total: ${save.lp} LP`, C.sub0]],
        buttons: [{ label: 'REMATCH', color: C.green, fn: () => startQuickFight(diff, sensei, botSensei, backTo) }, { label: backTo ? 'CHANGE SETUP' : 'NEW SENSEI', color: C.blue, fn: () => backTo ? backTo() : setScreen(new QuickMenu()) }, { label: 'MAIN MENU', color: C.ov2, fn: () => setScreen(new MainMenu()) }],

    },

}

/* ---------- Tournament ---------- */
const ROUND_NAMES = ['QUARTER-FINALS', 'SEMI-FINALS', 'GRAND FINAL'];
const ROUND_LP = [30, 50, 200];
class Tournament {
  constructor(humans) {   // humans: [{sensei, name}]
    const names = shuffle(CPU_NAMES.slice());
    this.entrants = [];
    for (let i = 0; i < 8; i++) {
      const hi = humans.length === 2 ? (i === 0 ? 0 : i === 4 ? 1 : -1) : (i === 0 ? 0 : -1);
      if (hi >= 0) this.entrants.push({ name: humans[hi].name, sensei: humans[hi].sensei, lv: levelObj(humans[hi].sensei), human: hi });
      else this.entrants.push({ name: names.pop(), sensei: choice(SENSEI_IDS), lv: cpuLevel(randi(0, 6)), human: -1 });
    }
    this.slots = [[0, 1, 2, 3, 4, 5, 6, 7], [null, null, null, null], [null, null], [null]];
    this.r = 0; this.reveal = [];
  }
  get champion() { return this.slots[3][0]; }
  matchesOf(r) { const out = []; for (let m = 0; m < this.slots[r].length / 2; m++) out.push({ r, m, a: this.slots[r][2 * m], b: this.slots[r][2 * m + 1], w: this.slots[r + 1][m] }); return out; }
  isHuman(e) { return e !== null && this.entrants[e].human >= 0; }
  humansAlive() { const r = this.r; if (r > 2) return this.isHuman(this.champion); return this.slots[r].some((e, i) => this.isHuman(e) && (this.slots[r + 1][i >> 1] === null || this.slots[r + 1][i >> 1] === e)); }
  nextHumanMatch() { if (this.r > 2) return null; return this.matchesOf(this.r).find(x => x.w === null && (this.isHuman(x.a) || this.isHuman(x.b))) || null; }
  setWinner(r, m, e) { this.slots[r + 1][m] = e; this.reveal.push({ r: r + 1, m, t: 0 }); if (this.matchesOf(r).every(x => x.w !== null || this.slots[r + 1][x.m] !== null)) this.r = r + 1; }
  simMatch(x) {
    const A = this.entrants[x.a], B = this.entrants[x.b];
    const p = clamp(0.5 + (lvTotal(A.lv) - lvTotal(B.lv)) * 0.05, 0.15, 0.85);
    this.setWinner(x.r, x.m, Math.random() < p ? x.a : x.b);
  }
  /** Resolve all CPU-only matches in the current round. Returns how many were simulated. */
  simCpuRound() { if (this.r > 2) return 0; let n = 0; const r = this.r; for (const x of this.matchesOf(r)) if (x.w === null && !this.isHuman(x.a) && !this.isHuman(x.b)) { this.simMatch(x); n++; } return n; }
  simAll() { let guard = 0; while (this.r <= 2 && guard++ < 20) { for (const x of this.matchesOf(this.r)) if (this.slots[x.r + 1][x.m] === null) this.simMatch(x); } }
}

    this.onBack = () => setScreen(new DojoScreen());

  actionHeld() { return ACTION_KEYS.some(k => Input.down.has(k)) || Input.pointers.size > 0; }
  update(dt) {
    this.t += dt;

// --- 1. Punch the bag: stop the sliding marker in the sweet spot ---
class BagGame extends MiniGame {

  start() { this.reset(); this.zone = rand(0.25, 0.75); }

    this.ang += this.av * dt; this.av += (-this.ang * 30 - this.av * 2.2) * dt; this.punch = Math.max(0, this.punch - dt * 3);
    if (this.msg) this.msg.t += dt;
    if (this.wait > 0) { this.wait -= dt; if (this.wait <= 0 && this.n >= 6) this.finish(this.total / 120 * 100); return; }
    this.pos += this.dir * this.speed * dt; if (this.pos > 1) { this.pos = 1; this.dir = -1; } if (this.pos < 0) { this.pos = 0; this.dir = 1; }
    if (this.actionPressed()) {
      const d = Math.abs(this.pos - this.zone); let pts, label, col;
      if (d < 0.035) { pts = 20; label = 'PERFECT!'; col = C.yellow; }
      else if (d < 0.09) { pts = 12; label = 'GOOD'; col = C.green; }
      else if (d < 0.16) { pts = 5; label = 'OK'; col = C.peach; }
      else { pts = 0; label = 'MISS'; col = C.red; }
      this.total += pts; this.n++; this.punch = 1; this.av += pts ? 2 + pts * 0.25 : 0.5; this.msg = { label, col, t: 0 };
      if (pts) Sound.hit(0.5 + pts / 20); else Sound.whoosh();
      this.speed *= 1.18; this.zone = rand(0.2, 0.8); this.wait = 0.45;
    }
  }
  drawGame(g) {
    const bx = 560, by = 70;
    g.strokeStyle = C.ov0; g.lineWidth = 3; g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx, by); g.stroke();
    g.save(); g.translate(bx, by); g.rotate(this.ang);
    g.strokeStyle = C.ov1; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(-25, 30); g.moveTo(0, 0); g.lineTo(25, 30); g.stroke();
    roundRect(g, -38, 30, 76, 220, 24); g.fillStyle = mix(C.red, C.crust, 0.35); g.fill(); g.strokeStyle = C.crust; g.lineWidth = 3; g.stroke();
    g.fillStyle = rgba(C.crust, 0.35); g.fillRect(-38, 80, 76, 10); g.fillRect(-38, 190, 76, 10);
    g.restore();
    drawFighter(g, { ...previewView(this.sensei, 'punch', this.t), k: this.punch > 0 ? Math.min(1, this.punch * 2) : 0 }, 430, 440, 1.25);
    // meter

    roundRect(g, mx - 4, my - 4, mw + 8, 28, 8); g.fillStyle = C.crust; g.fill();
    g.fillStyle = C.s0; g.fillRect(mx, my, mw, 20);
    g.fillStyle = rgba(C.peach, 0.5); g.fillRect(mx + (this.zone - 0.16) * mw, my, 0.32 * mw, 20);
    g.fillStyle = rgba(C.green, 0.8); g.fillRect(mx + (this.zone - 0.09) * mw, my, 0.18 * mw, 20);
    g.fillStyle = C.yellow; g.fillRect(mx + (this.zone - 0.035) * mw, my, 0.07 * mw, 20);

// --- 2. Board breaking: hold to charge, release inside the band ---

// --- 3. Reflex drill: hit the lantern that lights up ---

    });

    text(g, `Round ${Math.min(this.n + 1, 10)}/10   ·   ${Math.round(this.pts * 10) / 10} pts`, W / 2, 80, { size: 15, color: C.sub1 });
    if (this.times.length) text(g, `avg ${Math.round(this.times.reduce((a, b) => a + b, 0) / this.times.length)} ms`, W / 2, 104, { size: 12, color: C.sub0 });

// --- 4. Stance hold: keep your balance on a post while the wind gusts ---
class BalanceGame extends MiniGame {

  play(dt) {

    if (['KeyA', 'ArrowLeft'].some(k => Input.down.has(k))) push -= 1;
    if (['KeyD', 'ArrowRight'].some(k => Input.down.has(k))) push += 1;

    g.lineWidth = 12; g.strokeStyle = C.s0; g.beginPath(); g.arc(gx, gy + 60, r, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    g.strokeStyle = C.green; g.beginPath(); g.arc(gx, gy + 60, r, Math.PI * 1.5 - 0.22 * 0.5, Math.PI * 1.5 + 0.22 * 0.5); g.stroke();

      text(g, `steady ${this.inZone.toFixed(1)}s`, W / 2, 196, { size: 12, color: C.green });
      const wd = this.wind; text(g, wd > 0 ? '≫ wind' : '≪ wind', W / 2 + (wd > 0 ? 200 : -200), 300, { size: 14, color: C.sky, alpha: clamp(Math.abs(wd) / 2, 0.2, 1) });
    }

/* ---------------------------------------------------------------------
   13. ONLINE VERSUS
   Sync architecture: HOST-AUTHORITATIVE (messages, not room state).
   - The host (room creator / earliest joiner) is always P1 and runs the
     real fight simulation at 60 Hz.
   - The guest sends its button state to the host whenever it changes
     (plus a 5 Hz heartbeat). The host latches presses so taps are never lost.
   - The host sends a compact snapshot + the gameplay effects since the last
     one at 25 Hz. The guest renders a "puppet" match from these, smoothing
     positions and playing the sounds/particles itself.
   A server script would cost 1 RTT instead of 2, but it would mean running
   the whole fighting engine on the server. With 2 players per room the host
   pattern keeps the full game in this one file.
   --------------------------------------------------------------------- */
const ROOM_OPTS = { maxPlayers: 2, tag: 'karate' };

const Online = {
  mp: null, connecting: null, status: 'Not connected', busy: false, match: null, role: null, started: false,
  sendT: 0, inT: 0, lastBits: -1, endSent: false, oppLeft: false,
  available() { return typeof Multiplayer !== 'undefined'; },
  async ensure() {
    if (this.mp && this.mp.connected) return this.mp;

    if (!this.mp) { this.mp = new Multiplayer({ url: MP_CONFIG.url, key: MP_CONFIG.key, name: playerName(), identity: 'tab' }); this.wire(); }
    this.status = 'Connecting…';
    if (!this.connecting) this.connecting = this.mp.connect().finally(() => { this.connecting = null; });
    await this.connecting;
    this.status = `Connected as ${this.mp.name}`;
    return this.mp;
  },
  get inRoom() { return !!(this.mp && this.mp.room); },
  opponent() { return this.mp ? this.mp.playerList.find(p => p.id !== this.mp.playerId) : null; },
  wire() {
    const mp = this.mp;
    mp.on('playerJoined', p => toast(`${String(p.name).slice(0, 12)} joined the room`, C.green));
    mp.on('playerLeft', p => { toast(`${String(p.name).slice(0, 12)} left`, C.red); this.onOpponentLeft(); });
    mp.on('playerConnection', (p, c) => toast(c ? `${String(p.name).slice(0, 12)} is back` : `${String(p.name).slice(0, 12)} lost connection…`, c ? C.green : C.peach));
    mp.on('host', (id, me) => { if (me && this.match && this.role === 'guest') this.onOpponentLeft(); });
    mp.on('reconnecting', () => { this.status = 'Reconnecting…'; });
    mp.on('reconnected', () => { this.status = `Connected as ${mp.name}`; toast('Reconnected', C.green); });
    mp.on('disconnected', () => { this.status = 'Disconnected'; });
    mp.on('left', (room, reason) => { if (reason && reason !== 'left') { toast(`Removed from room (${reason})`, C.red); this.backToLobby(); } });
    mp.on('error', e => toast(`Network: ${(e && (e.code || e.message)) || 'error'}`, C.red));
    mp.onMessage('start', d => this.onStart(d));
    mp.onMessage('in', (bits, from) => { if (this.role === 'host' && this.match && this.remote) this.remote.set(bits); });
    mp.onMessage('ss', d => this.onSnap(d));

  },
  backToLobby() { this.match = null; this.role = null; setScreen(new OnlineLobby()); },
  onOpponentLeft() {

  },
  async leave() { this.match = null; this.role = null; try { if (this.inRoom) await this.mp.leave(); } catch (e) { /* ignore */ } },
  /** Host only: both players have locked a sensei -> start. */
  checkStart() {

    mp.send('start', { p: [info(me), info(op)], n: Date.now() }, 'all', { self: true });
  },
  onStart(d) {

    const cfg = host
      ? { host: true, p: [P(d.p[0], new KeyCtrl(KEYMAP.both, true)), P(d.p[1], this.remote)] }
      : { puppet: true, p: [P(d.p[0], { get: () => NONE }), P(d.p[1], { get: () => NONE })] };
    const fs = new FightScreen(cfg, {

      overlay: g => { if (this.role === 'guest' && !m0.gotSnap) text(g, 'Waiting for host…', W / 2, 140, { size: 16, color: C.sub0 }); text(g, this.role === 'host' ? 'ONLINE · HOST' : 'ONLINE · GUEST', W / 2, 88, { size: 9, color: C.ov1 }); },

    } else {

  onEnd(d) { if (this.role === 'guest' && this.match && d && (d.winner === 0 || d.winner === 1)) this.match.result = { winner: d.winner, wins: d.wins || [0, 0], perfect: !!d.perfect }; },
  showResult(res, m) {

    const rs = new ResultScreen({ title: won ? 'YOU WIN!' : 'YOU LOSE', color: won ? C.yellow : C.red,
      view: { def: f.def, facing: 1, state: 'win', gi: f.gi, belt: f.belt },
      lines: [[`${f.name} wins ${res.wins[res.winner]}-${res.wins[1 - res.winner]}`, C.text], [f.def.full, C.sub0], [`+${won ? 40 : 10} LP`, C.yellow]],
      buttons: [{ label: 'REMATCH', color: C.green, fn: () => setScreen(new OnlineSelect()) }, { label: 'LEAVE ROOM', color: C.ov2, fn: async () => { await this.leave(); setScreen(new OnlineLobby()); } }] });

};

    this.bQuick.hidden = this.bCreate.hidden = this.bJoin.hidden = inRoom; this.bLeave.hidden = !inRoom;
    const ok = !!(Online.mp && Online.mp.connected) && !this.busy;
    for (const b of [this.bQuick, this.bCreate, this.bJoin, this.bLeave]) b.enabled = ok;
    if (!this.visible().includes(this.buttons[this.focus]) || !this.buttons[this.focus].enabled) { const f = this.visible().find(b => b.enabled); if (f) this.focus = this.buttons.indexOf(f); }
    if (!isTyping()) super.update(dt); else this.t += dt;
    if (inRoom && Online.mp.playerList.length === 2 && !this.busy) setScreen(new OnlineSelect());
  }
  draw(g) {
    drawMenuBG(g, 0.72);
    drawTitle(g, 'ONLINE VERSUS', 52, 32, C.mauve);
    const connected = Online.mp && Online.mp.connected;
    text(g, this.busy && !connected ? 'Connecting…' : Online.status, W / 2, 88, { size: 13, color: connected ? C.green : C.peach });
    if (this.err) text(g, this.err, W / 2, 110, { size: 13, color: C.red });
    text(g, 'NAME', 300, 150, { size: 12, align: 'left', color: C.sub0 });
    if (!Online.inRoom) {
      placeField('nameField', 300, 162, 360, 42); document.getElementById('codeField').style.display = 'none';
      placeField('codeField', 300, 384, 210, 46);
      text(g, 'or join a friend:', 300, 372, { size: 11, align: 'left', color: C.sub0, weight: 400 }); this.bJoin.y = 384;
      this.bCreate.y = 312; this.bQuick.y = 250;
    } else {
      document.getElementById('nameField').style.display = 'none'; document.getElementById('codeField').style.display = 'none';
      const mp = Online.mp;
      text(g, 'ROOM CODE', W / 2, 160, { size: 13, color: C.sub0 });
      text(g, mp.room.id, W / 2, 205, { size: 54, weight: 800, color: C.yellow });
      text(g, 'Share it with a friend: they pick ONLINE → JOIN', W / 2, 245, { size: 12, color: C.sub0, weight: 400 });
      mp.playerList.forEach((p, i) => text(g, `${p.id === mp.playerId ? '► ' : ''}${String(p.name).slice(0, 12)}${p.connected === false ? ' (reconnecting)' : ''}${p.id === mp.room.host ? '  [host]' : ''}`, W / 2, 290 + i * 26, { size: 15, color: p.connected === false ? C.peach : C.text }));
      text(g, 'Waiting for an opponent' + '.'.repeat(1 + Math.floor(this.t * 2) % 3), W / 2, 365, { size: 14, color: C.mauve });
    }
    this.drawButtons(g);
  }
}
function friendlyErr(e) {
  const c = e && e.code;
  return ({ room_not_found: 'No room with that code', room_full: 'That room is full', room_locked: 'That room is locked', timeout: 'Server timed out', not_connected: 'Not connected', bad_key: 'Bad game key' })[c] || (e && e.message) || 'Something went wrong';
}

class OnlineSelect extends SelectScreen {
  constructor() {
    super({ pickers: 1, title: 'ONLINE · PICK YOUR SENSEI', manualDone: true,
      onBack: async () => { await Online.leave(); setScreen(new OnlineLobby()); },
      onLock: id => { save.lastSensei = id; persist(); Online.mp.setPlayer({ pick: id, lv: levelObj(id), ready: true }); },
      onUnlock: () => Online.mp.setPlayer({ ready: false }),
      onDone: () => {},
      extraDraw: g => {
        const op = Online.opponent();
        const s = op ? (op.data && op.data.ready && SENSEIS[op.data.pick] ? `${String(op.name).slice(0, 12)}: READY (${SENSEIS[op.data.pick].name})` : `${String(op.name).slice(0, 12)}: choosing…`) : 'Opponent disconnected';
        text(g, s, W / 2, 70, { size: 13, color: op && op.data && op.data.ready ? C.green : C.peach });
        if (this.locked[0]) text(g, 'Locked in. Waiting for opponent…', W / 2, 330, { size: 12, color: C.sub0 });
      },
    });
    this.onlineScreen = true;
  }
  enter() { Online.started = false; if (Online.mp) Online.mp.setPlayer({ ready: false, pick: null }); Sound.setMusic('menu'); }
  update(dt) {
    super.update(dt);
    if (!Online.inRoom) { setScreen(new OnlineLobby()); return; }
    Online.checkStart();
  }
}

/* ---------------------------------------------------------------------
   14. BOOT + MAIN LOOP
   --------------------------------------------------------------------- */
const cv = document.getElementById('game'), ctx = cv.getContext('2d'), domLayer = document.getElementById('dom');
let view = { scale: 1, css: 1, left: 0, top: 0 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), ww = innerWidth, wh = innerHeight;
  const s = Math.min(ww / W, wh / H), left = (ww - W * s) / 2, top = (wh - H * s) / 2;
  for (const el of [cv, domLayer]) Object.assign(el.style, { width: W * s + 'px', height: H * s + 'px', left: left + 'px', top: top + 'px' });
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  view = { scale: s * dpr, css: s, left, top };
}
addEventListener('resize', resize); resize();

const toLogical = e => ({ x: (e.clientX - view.left) / view.css, y: (e.clientY - view.top) / view.css });
function muteRect() { return screen instanceof FightScreen ? { x: W / 2 + 46, y: 14, w: 30, h: 30 } : { x: W - 50, y: 18, w: 32, h: 32 }; }
cv.addEventListener('pointerdown', e => {
  Sound.init(); e.preventDefault();
  if (isTyping()) document.activeElement.blur();
  if (e.pointerType === 'touch') Input.isTouch = true;
  const p = toLogical(e); Input.pointers.set(e.pointerId, { x: p.x, y: p.y, type: e.pointerType });
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const m = muteRect();
  if (p.x >= m.x && p.x <= m.x + m.w && p.y >= m.y && p.y <= m.y + m.h) { Sound.setMuted(!save.muted); return; }
  if (screen && screen.pointerDown) screen.pointerDown(p.x, p.y);
});
cv.addEventListener('pointermove', e => {
  const p = toLogical(e); if (Input.pointers.has(e.pointerId)) Input.pointers.set(e.pointerId, { x: p.x, y: p.y, type: e.pointerType });
  if (e.pointerType === 'mouse' && screen && screen.pointerMove) screen.pointerMove(p.x, p.y);
});
const ptrUp = e => { Input.pointers.delete(e.pointerId); };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp); cv.addEventListener('lostpointercapture', ptrUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.code === 'KeyM' && !isTyping()) Sound.setMuted(!save.muted); });

function drawOverlays(g) {
  const m = muteRect();
  roundRect(g, m.x, m.y, m.w, m.h, 8); g.fillStyle = rgba(C.crust, 0.7); g.fill(); g.strokeStyle = C.s1; g.lineWidth = 1.5; g.stroke();
  // speaker icon
  const cx = m.x + m.w / 2 - 3, cy = m.y + m.h / 2;
  g.fillStyle = save.muted ? C.ov0 : C.text; g.beginPath(); g.moveTo(cx - 7, cy - 4); g.lineTo(cx - 3, cy - 4); g.lineTo(cx + 3, cy - 9); g.lineTo(cx + 3, cy + 9); g.lineTo(cx - 3, cy + 4); g.lineTo(cx - 7, cy + 4); g.fill();
  g.strokeStyle = save.muted ? C.red : C.text; g.lineWidth = 2; g.beginPath();
  if (save.muted) { g.moveTo(cx + 6, cy - 5); g.lineTo(cx + 13, cy + 5); g.moveTo(cx + 13, cy - 5); g.lineTo(cx + 6, cy + 5); } else { g.arc(cx + 4, cy, 6, -0.9, 0.9); }
  g.stroke();
  if (Input.isTouch && innerHeight > innerWidth * 1.1) text(g, '↻ Rotate your phone to landscape', W / 2, H - 14, { size: 16, color: C.yellow });
  // toasts
  toasts.forEach((t, i) => {
    const a = t.t < 0.2 ? t.t / 0.2 : t.t > 2.4 ? Math.max(0, 1 - (t.t - 2.4) / 0.4) : 1, y = (screen instanceof FightScreen ? 110 : 96) + i * 34;
    g.globalAlpha = a; g.font = font(14); const w = g.measureText(t.msg).width + 32;
    roundRect(g, W / 2 - w / 2, y - 14, w, 28, 8); g.fillStyle = rgba(C.crust, 0.88); g.fill(); g.strokeStyle = t.color; g.lineWidth = 1.5; g.stroke();
    text(g, t.msg, W / 2, y + 1, { size: 14, color: t.color, shadow: false }); g.globalAlpha = 1;
  });
}

function tick(dt, draw = true) {
  globalTime += dt;
  Petals.update(dt);
  try { screen.update(dt); } catch (e) { console.error(e); setScreen(new MainMenu()); }
  for (const t of toasts) t.t += dt; while (toasts.length && toasts[0].t > 2.8) toasts.shift();
  if (draw) {
    ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    ctx.fillStyle = C.base; ctx.fillRect(0, 0, W, H);
    screen.draw(ctx);
    drawOverlays(ctx);
  }
  Input.endFrame();
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (!KS.manual) tick(dt);
  requestAnimationFrame(frame);
}
// Background-tab fallback: rAF stops when a tab is hidden, which would freeze an
// online host's simulation. A timer keeps the game ticking (without drawing).
setInterval(() => {
  const now = performance.now();
  if (now - lastT > 120 && !KS.manual) { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; tick(dt, false); }
}, 33);

/** Test/debug hooks (used by the headless test suite). */
const KS = {
  autoplay: false, manual: false, tour: null,
  get screen() { return screen; }, setScreen, tick, Match, Fighter, AICtrl, KeyCtrl, Tournament, SENSEIS, save, Online,
  MainMenu, startQuickFight, BotSetup, botPrefs, startLocalVersus, startTourMatch, BracketScreen, DojoScreen, makeMiniGame, SelectScreen,
  /** Run the game loop for `sec` simulated seconds at 60 fps (no rendering unless drawEvery > 0). */
  run(sec, drawEvery = 0) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) tick(1 / 60, drawEvery > 0 && i % drawEvery === 0); },
};
window.KS = KS;

Petals.init();
Stage.build();
setScreen(new MainMenu());
requestAnimationFrame(frame);
</script>
